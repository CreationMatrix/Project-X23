<style>

:root{
  --ink:#000;--ink2:#333;--ink3:#6b6b6b;--ink4:#929292;

}
*{box-sizing:border-box}

.app{min-height:100vh;display:grid;grid-template-columns:214px minmax(0,1fr)}
.side{border-right:1px solid var(--line);background:#fafafa;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}
.brand{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px}
.mark{width:16px;height:16px;border:1.5px solid #000;border-radius:2px;position:relative}.mark:after{content:"";position:absolute;inset:3px;background:#000}
.brand b{font-size:16px}.nav{padding:12px 8px;display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{border:1px solid transparent;background:none;text-align:left;padding:8px 12px;border-radius:3px;font-size:14px}.nav button:hover{background:#f1f1f1}.nav button.active{background:#000;color:#fff}
.nav-count{float:right;border:1px solid currentColor;border-radius:12px;padding:0 8px;font:12px var(--data);opacity:.85}
.sep{border-top:1px solid var(--line2);margin:12px 12px 8px}.label{padding:0 12px 8px;color:var(--ink4);font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.foot{border-top:1px solid var(--line);padding:12px 16px;color:var(--ink4);font-size:12px}
.main{min-width:0}.top{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;background:#fff;z-index:10}
.crumb{font-size:12px;color:var(--ink3)}.crumb b{color:#000}.crumb span{color:var(--ink4);padding:0 8px}
.crumb-link{background:none;border:0;padding:0;font:inherit;color:var(--ink3);cursor:pointer;text-decoration:none}
.crumb-link:hover{color:#000;text-decoration:underline}
.crumb-link:focus-visible{outline:2px solid #000;outline-offset:2px}
.wrap{padding:28px 32px 72px;max-width:1420px}
.page-head{display:flex;align-items:flex-start;gap:20px;margin-bottom:20px}.page-head .right{margin-left:auto;display:flex;gap:8px}
h1{font-size:26px;letter-spacing:-.035em;line-height:1.2;margin:0;font-weight:700}.sub{font-size:12px;color:var(--ink3)}
.btn{height:32px;border:1px solid var(--line);background:#fff;border-radius:3px;padding:0 12px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{background:#f7f7f7;border-color:#999}.btn.primary{background:#000;color:#fff;border-color:#000}.btn.small{height:28px;padding:0 12px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:0}.tabs button{border:0;background:none;padding:12px 16px 8px;font-size:12px;border-bottom:2px solid transparent}.tabs button.active{border-bottom-color:#000;font-weight:700}
.attention{border:2px solid #000;padding:12px 12px;margin:0 0 12px;font-size:12px}.attention b{font-weight:700}
.list-shell{border:1px solid var(--line);background:#fff}
.table-head,.plan-row,.item-row{display:grid;grid-template-columns:minmax(360px,2.2fr) 130px 135px 160px 155px 120px;align-items:center}
.table-head{min-height:38px;background:#fafafa;border-bottom:1px solid var(--line);padding:0 16px;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:650}
.plan-row{min-height:66px;padding:0 16px;border-bottom:1px solid var(--line2);gap:12px}
.plan-row:last-child{border-bottom:0}
.plan-main{display:flex;align-items:flex-start;gap:8px;min-width:0}.expand{width:19px;height:19px;min-width:19px;padding:0;border:1px solid var(--line);background:#fff;border-radius:2px;line-height:15px;font-family:var(--data);font-size:12px}.expand:hover{border-color:#000}
.plan-name{font-weight:700;font-size:13px}.plan-id{font:12px var(--data);color:var(--ink3);margin-top:4px}.desc{font-size:12px;color:var(--ink3);font-weight:400}
.cell{min-width:0;font-size:12px}.mono{font-family:var(--data)}.state{display:inline-flex;align-items:center;gap:8px;font-size:12px}.dot{width:8px;height:8px;border:1px solid #000;border-radius:50%;display:inline-block}.dot.fill{background:#000}.dot.half{background:linear-gradient(90deg,#000 50%,#fff 50%)}.dot.fail{border-radius:2px;transform:rotate(45deg)}
.open-link{font-size:12px;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
.plan-expanded{display:none;border-bottom:1px solid var(--line);background:#fcfcfc;padding:0 16px 8px 44px}.plan-expanded.open{display:block}
.item-row{grid-template-columns:minmax(300px,2.2fr) 130px 175px 150px 120px;padding:0 0;min-height:58px;border-top:1px solid var(--line2)}
.item-target{font-size:12px}.item-kind{font-size:12px;color:var(--ink3);margin-top:4px}.item-stage{font-size:12px;color:var(--ink2)}.item-state{font-size:12px}
.plan-summary{display:flex;gap:20px;align-items:center;padding:8px 0 4px;color:var(--ink3);font-size:12px}.plan-summary strong{color:#000}
.progress{height:4px;background:#e9e9e9;margin-top:4px;max-width:210px}.progress span{display:block;height:100%;background:#000}
.detail-header{border:1px solid #000;padding:16px 16px;margin-bottom:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px}
.detail-title-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.detail-title-row h1{font-size:23px}.chip{border:1px solid var(--line);padding:4px 8px;border-radius:12px;font-size:12px}
.version{font:12px var(--data);margin-top:4px}.detail-status{padding-top:0px}.pill{border:1px solid var(--line);border-radius:18px;padding:4px 8px;font:12px var(--data)}.pill.dark{background:#000;color:#fff;border-color:#000}
.context{grid-column:1/-1;border-top:1px solid var(--line2);padding-top:12px;display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap}.meta{display:flex;gap:28px;flex-wrap:wrap}.meta label,.window-head label{display:block;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}.meta b{font:12px var(--data);font-weight:500}.window{margin-left:auto;min-width:330px}.window-head{display:flex;justify-content:space-between;gap:12px}.window-head b{font:12px var(--data);font-weight:500}.track{height:5px;border:1px solid #000;background:#fff;margin-top:8px}.track span{display:block;height:100%;background:#000}
.item-workspace{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}.item-nav{border:1px solid var(--line);background:#fff;position:sticky;top:66px;max-height:calc(100vh - 90px);overflow:auto}.item-nav-head{padding:12px 12px;border-bottom:1px solid var(--line2);display:flex;align-items:center}.item-nav-head b{font-size:12px}.item-nav-head span{margin-left:auto;font:12px var(--data);color:var(--ink3)}.item-nav-section{padding:8px 8px 4px;color:var(--ink4);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.item-nav-btn{display:block;width:100%;border:0;border-left:3px solid transparent;background:#fff;text-align:left;padding:8px 12px 8px 8px}.item-nav-btn:hover{background:#fafafa}.item-nav-btn.selected{background:#f3f3f3;border-left-color:#000}.item-nav-name{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650}.item-nav-meta{padding-left:16px;margin-top:4px;color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-nav-state{padding-left:16px;margin-top:4px;font:12px var(--data);color:var(--ink3)}.item-nav-state.attn{color:#000;font-weight:700}.item-main{min-width:0}.item-switch{display:flex;align-items:center;gap:8px;margin-bottom:8px}.item-switch .position{font:12px var(--data);color:var(--ink3);margin-left:auto}.item-switch .btn[disabled]{opacity:.35;cursor:default}.item-plan-context{border:1px solid var(--line);background:#fafafa;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:16px;font-size:12px}.item-plan-context b{font-weight:650}.item-plan-context .mono{font-size:12px}.item-plan-context .context-spacer{margin-left:auto;color:var(--ink3)}
.plan-detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}.panel{border:1px solid var(--line);background:#fff}.panel-head{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:12px}.section-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:700}.muted{margin-left:auto;color:var(--ink3);font-size:12px}
.plan-stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line2)}.stat{padding:12px 12px;border-right:1px solid var(--line2)}.stat:last-child{border-right:0}.stat label{display:block;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.stat b{display:block;font:16px var(--data);margin-top:4px;font-weight:500}
.exec-table{width:100%;border-collapse:collapse}.exec-table th{text-align:left;padding:8px 12px;border-bottom:1px solid #000;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.exec-table td{padding:12px 12px;border-bottom:1px solid var(--line2);font-size:12px;vertical-align:middle}.exec-table tr:last-child td{border-bottom:0}.exec-table tr:hover td{background:#fafafa}
.stagebar{display:flex;gap:4px;min-width:150px}.stage-seg{height:5px;flex:1;background:#e8e8e8}.stage-seg.done{background:#000}.stage-seg.active{border:1px solid #000;background:#fff}.stage-seg.fail{background:#fff;border:1px solid #000;position:relative}.stage-seg.fail:after{content:"";position:absolute;left:1px;right:1px;top:1px;bottom:1px;background:#000;clip-path:polygon(0 0,100% 100%,0 100%,100% 0)}
.attention-tag{border:1px solid #000;padding:4px 8px;font:12px var(--data);display:inline-block}.item-link{background:none;border:0;padding:0;text-align:left;text-decoration:underline;font-weight:650;font-size:12px}
.side-summary{padding:16px}.side-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12px}.side-row:last-child{border-bottom:0}.side-row span:first-child{color:var(--ink3)}
.side-note{margin:12px 0 0;padding:12px;border-left:2px solid #000;background:#fafafa;font-size:12px}
.flow-card{border:1px solid var(--line);background:#fff}.flow-head{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center}.flow-summary{padding:12px 16px;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--line2)}
.flow{padding:12px 16px 16px}.stage{border:1px solid var(--line);margin-bottom:8px}.stage:last-child{margin-bottom:0}.stage.current,.stage.failed{border-color:#000}.stage-head{min-height:62px;padding:12px 12px;display:grid;grid-template-columns:34px minmax(0,1fr) auto 20px;gap:12px;align-items:center;background:#fff;border:0;width:100%;text-align:left}.stage.current .stage-head,.stage.failed .stage-head{background:#fafafa}.stage-icon{width:27px;height:27px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font:12px var(--data)}.stage.done .stage-icon{background:#000;color:#fff;border-color:#000}.stage.current .stage-icon,.stage.failed .stage-icon{border:2px solid #000}.stage-title{font-size:13px;font-weight:700}.stage-meta{font-size:12px;color:var(--ink3);margin-top:4px}.stage-state{font:12px var(--data);border:1px solid var(--line);padding:4px 8px;border-radius:12px}.stage-state.dark{background:#000;color:#fff;border-color:#000}.chev{font-size:13px;color:var(--ink3);transition:.15s transform}.stage.open .chev{transform:rotate(180deg)}.stage-body{display:none;border-top:1px solid var(--line2);padding:8px 12px 12px}.stage.open .stage-body{display:block}
.milestone{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:44px;padding:8px 4px;border-bottom:1px solid var(--line2);font-size:12px;cursor:pointer}.milestone:last-child{border-bottom:0}.milestone:hover{background:#fafafa}.mini{width:9px;height:9px;border:1px solid #000;border-radius:50%}.mini.done{background:#000}.mini.fail{border-radius:2px;transform:rotate(45deg)}.mini.active{border:2px solid #000}.milestone-name{font-weight:550}.milestone-desc{font-size:12px;color:var(--ink3);margin-top:0px}.milestone-time{font:12px var(--data);color:var(--ink3)}
/* the recovery bar inside a stopped stage — not the same thing as a button
   group in a panel header, which is what .actions means everywhere else */
.stage-actions{margin:8px 0 4px 28px;padding:12px 0 4px;border-top:1px solid #000;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.action-copy{margin-right:auto}.action-title{font-size:12px;font-weight:700}.action-copy .sub{font-size:12px}
.activity{width:100%;border-collapse:collapse;font-size:12px}.activity th{text-align:left;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:1px solid #000}.activity td{padding:8px 12px;border-bottom:1px solid var(--line2)}.activity tr:last-child td{border-bottom:0}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:40;display:none}.drawer{position:absolute;right:0;top:0;height:100%;width:min(500px,100%);background:#fff;border-left:1px solid #000;display:flex;flex-direction:column}.drawer-head{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px}.drawer-head b{margin-right:auto}.drawer-body{padding:16px;overflow:auto}.drawer-foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:flex-end}.drawer-kv{display:grid;grid-template-columns:110px 1fr;border-top:1px solid var(--line2)}.drawer-kv div{padding:8px 0;border-bottom:1px solid var(--line2);font-size:12px}.drawer-kv div:nth-child(odd){color:var(--ink3)}
.toast{position:fixed;right:22px;bottom:22px;background:#000;color:#fff;padding:12px 16px;font-size:12px;display:none;z-index:60}
@media(max-width:1050px){.table-head,.plan-row{grid-template-columns:minmax(300px,2fr) 100px 110px 130px 120px 95px}.plan-detail-grid{grid-template-columns:1fr}.side-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:0 20px}.window{margin-left:0;width:100%}}
@media(max-width:780px){.app{grid-template-columns:64px 1fr}.brand b,.nav button:not(.active) span,.label,.foot{display:none}.nav button{padding:8px 8px}.wrap{padding:20px 16px}.top{padding:0 16px}.page-head{display:block}.page-head .right{margin-top:12px}.table-head{display:none}.plan-row{grid-template-columns:1fr auto;gap:8px;padding:12px}.plan-row>.cell:not(:first-of-type){display:none}.plan-expanded{padding:0 12px 8px}.item-row{grid-template-columns:1fr auto;gap:4px;padding:8px 0}.item-row>.cell:nth-child(n+3){display:none}.detail-header{grid-template-columns:1fr}.detail-status{grid-column:1}.context{display:block}.window{margin-top:12px;min-width:0}.plan-stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line2)}}

.lifecycle-note{border-top:1px solid var(--line2);padding:12px 16px;font-size:12px;color:var(--ink3)}
.lifecycle-note b{color:#000}
.attention-inline{display:inline-flex;align-items:center;gap:8px;font:12px var(--data);border:1px solid #000;padding:4px 8px}
@media(max-width:1050px){.item-workspace{grid-template-columns:220px minmax(0,1fr)}.item-plan-context .context-spacer{display:none}}
@media(max-width:780px){.app{grid-template-columns:1fr}.side{display:none}.wrap{padding:20px 16px 52px}.item-workspace{grid-template-columns:1fr}.item-nav{max-height:none}.item-nav-section{display:none}.item-nav-btn{display:none}.item-nav-btn.selected{display:block}.item-nav-head{border-bottom:0}.item-nav:has(.selected){min-height:44px}.item-nav:has(.selected) .item-nav-head{display:flex}.item-main{min-width:0}.item-plan-context{flex-wrap:wrap}.detail-header{grid-template-columns:1fr}.window{margin-left:0;min-width:0;width:100%}}

.impact-tbl{table-layout:fixed}
.impact-tbl th,.impact-tbl td{text-align:left;padding:10px 14px}
.impact-tbl th:first-child,.impact-tbl td:first-child{width:26%}
.impact-tbl th:nth-child(2),.impact-tbl td:nth-child(2){width:24%}
.tbl.vcheck th,.tbl.vcheck td{text-align:left;vertical-align:top}
.tbl.vcheck td:first-child{font-family:var(--data);white-space:nowrap;padding-right:18px}
.tbl.vcheck td:nth-child(2){width:150px}

.v2controls{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin:0 0 10px}
.v2facets{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0;flex:0 0 auto}
.v2facet{display:flex;align-items:center;gap:6px;font:11px var(--data);
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink4)}
.v2facet select{font:12px var(--data);padding:5px 8px;border:1px solid var(--line);
  background:#fff;color:var(--ink);text-transform:none;letter-spacing:0}
.v2facet select:focus-visible{outline:2px solid #000;outline-offset:1px}

.exec-table tr.row-fail td{background:#fcfafa}
.fail-state{display:block;font-size:13px}
.checks-row td{padding:0 14px 12px 14px;background:#fcfafa;border-top:0}
ul.checks{margin:0;padding:0;list-style:none}
ul.checks li{font-size:12px;line-height:1.6;color:var(--ink3);padding-left:18px;position:relative}
ul.checks li.bad{color:var(--ink)}
ul.checks li.bad b{font-weight:600}
ul.checks li.bad:before{content:"\2715";position:absolute;left:0}
ul.checks li.good:before{content:"\2713";position:absolute;left:0;color:var(--ink4)}

.dev-row[role="button"]{cursor:pointer}
.dev-row:focus-visible{outline:2px solid #000;outline-offset:-2px}
.tbl.devprops td{vertical-align:top;padding:10px 14px}
.tenants-tbl{table-layout:fixed}
.tenants-tbl th,.tenants-tbl td{text-align:left;padding:10px 14px}
.tenants-tbl th:first-child,.tenants-tbl td:first-child{width:34%}
.tenants-tbl th:nth-child(2),.tenants-tbl td:nth-child(2){width:26%}
.tbl.devprops td.pk{width:220px;font:12px var(--data);color:var(--ink3);white-space:nowrap}
.tbl.devprops td.pv b{font-size:13px}
.unheld{font-size:13px;color:var(--ink4)}
.pd{display:block;font-size:11px;color:var(--ink4);margin-top:2px}
.home-needs{margin-bottom:16px}
.home-list{display:flex;flex-direction:column}
.home-row{display:grid;grid-template-columns:26px minmax(160px,1fr) minmax(180px,1fr);
  gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line2);padding:12px 16px;cursor:pointer;font:inherit}
.home-row:last-child{border-bottom:0}
.home-row:hover{background:#fafafa}
.home-row:focus-visible{outline:2px solid #000;outline-offset:-2px}
.home-row b{display:block;font-size:13px;font-weight:600}
.home-main,.home-state{min-width:0;display:flex;flex-direction:column}
.home-act{grid-template-columns:110px minmax(200px,1fr) 90px}
.home-clear{padding:16px;font-size:13px;color:var(--ink3)}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.home-facts{display:flex;gap:32px;padding:16px;flex-wrap:wrap}
.home-facts label{display:block;font:11px var(--data);letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink4);margin-bottom:4px}
.home-facts b{font-size:20px;font-weight:600}
.home-next{padding:0 16px 16px;border-top:1px solid var(--line2);padding-top:14px;margin-top:2px}
.home-next label{display:block;font:11px var(--data);letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink4);margin-bottom:4px}
@media(max-width:900px){.home-grid{grid-template-columns:1fr}
  .home-row{grid-template-columns:22px 1fr}
  .home-row>span:nth-child(3){display:none}}

.act-head,.act-row{display:grid;
  grid-template-columns:110px minmax(140px,1fr) 130px minmax(200px,1.6fr) 150px 70px;
  gap:14px;align-items:center;padding:10px 14px}
.act-head{font:11px var(--data);letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);
  border-bottom:1px solid var(--line);background:#fafafa}
.act-row{border-bottom:1px solid var(--line2);font-size:13px}
.act-row:last-child{border-bottom:0}
.act-row:hover{background:#fafafa}
.act-row>span{display:flex;flex-direction:column;justify-content:center;min-width:0}
.act-when{color:var(--ink3);font-size:12px}
.act-row b{font-size:13px;font-weight:600}
@media(max-width:900px){.act-head{display:none}
  .act-row{grid-template-columns:1fr auto;gap:6px}
  .act-row>span:nth-child(n+3):nth-child(-n+5){display:none}}

.dev-head,.dev-row{display:grid;

/* ============================================================================
   MERGED BUILD — authoring and execution in one file.

   Two prototypes were merged here. The authoring flow (list → new plan →
   workspace → add item → submit, plus quick submit) came from one; the
   execution surface (plan execution with per-item stage bars, and the item
   view with its persistent navigator) came from the other. They had separate
   plans lists, separate data and separate CSS tokens; there is now one of
   each.

   The join is the plans list. A Plan opens to whichever view its state calls
   for — the workspace while it is a Draft, the execution view once it is not.
   ============================================================================ */

/* every plan carries a window as a pair, so the execution view can show a
   range and the authoring form can edit both ends */
function normalisePlan(p){
  if(!p.windowStart){ p.windowStart = p.window || ""; }
  /* the execution views read p.window; the authoring form writes the pair.
     Keep the single field in step with the pair rather than having two. */
  Object.defineProperty(p, "window", {
    get(){ return this.windowStart || ""; },
    set(v){ this.windowStart = v; },
    configurable:true
  });
  if(!p.windowEnd){
    const m = /^(\d+)\s+(\w+),\s*(\d+):(\d+)$/.exec(p.windowStart||"");
    p.windowEnd = m ? (Number(m[1])+1)+" "+m[2]+", 02:00" : "";
  }
  if(!p.mode) p.mode = p.change && p.change!=="—" ? "byoc" : "create";
  p.items.forEach(i=>{
    if(!i.journey) i.journey = i.kind==="Virtual tenant" ? "virtual" : "rseries";
  });
}
plans.forEach(normalisePlan);

/* The sidebar carries an .active style that nothing ever set. Every view here
   lives under Plans and items, so it is the current section throughout. */
function setNav(){
  const section = view==="home" ? "home" : view==="devices" ? "devices"
                : view==="activity" ? "activity" : "plans";
  document.querySelectorAll("[data-nav]").forEach(b=>{
    const on = b.dataset.nav===section;
    b.classList.toggle("active",on);
    if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  const c=document.querySelector('[data-nav="plans"] .nav-count');
  if(c) c.textContent=DB().length;
  const d=document.querySelector('[data-nav="devices"] .nav-count');
  if(d) d.textContent=inventory().length;
  const a=document.querySelector('[data-nav="activity"] .nav-count');
  if(a && typeof activityLog==="function") a.textContent=activityLog().length;
}

  if(editing===selectedPlan && p && canEdit(p)) return renderWorkspace();
  return (p && p.state===PLAN_STATE.DRAFT) ? renderWorkspace() : renderPlanV2();
}

 if(s==="Running"||s==="Running")return "half";
 if(s==="Completed"||s==="Succeeded")return "fill";
 if(s==="Waiting for action"||s==="Failed")return "fail";
 return "";
}

/* ============================================================================
   ITEM CREATION ENGINE

   The form is defined by data, not by hard-coded OS layouts. Adding an
   operation type means adding an entry to OPERATIONS, not editing a renderer.

   Fields declare what they depend on. Changing an upstream answer clears
   everything downstream rather than leaving a stale value silently selected.

   One engine serves Quick Submit and Add Item. The only difference is plan
   context: an item added to a plan inherits the operation type and the change
   window and is never asked for them again.

   The impact check is mandatory and is invalidated by any change to the
   selections it was calculated from.
   ============================================================================ */

/* ---- the schema ---- */
const OPERATIONS={
  TMOS:{
    label:"TMOS", rollback:true,
    fields:[
      {key:"deviceType", label:"Device type", placeholder:"Select one",
       options:()=>[{v:"rseries",t:"R-Series device"},{v:"virtual",t:"Virtual device"}]},
      /* the device step only exists where it applies */
      {key:"device", label:"Device", placeholder:"Select a device",
       when:d=>d.deviceType==="rseries",
       options:()=>RSERIES_DEVICES.map(x=>({v:x.id,t:x.label}))},
      /* tenants respect the device or the virtual environment */
      {key:"tenant", label:d=>d.deviceType==="rseries"?"Tenant on that device":"Tenant",
       placeholder:"Select a tenant",
       when:d=>d.deviceType==="virtual"||(d.deviceType==="rseries"&&!!d.device),
       options:d=>(d.deviceType==="rseries"?(TENANTS_BY_DEVICE[d.device]||[]):VIRTUAL_TENANTS)
                   .map(t=>({v:t.id,t:t.id+" — "+t.v}))},
      {key:"version", label:"Target version", placeholder:"Select a version",
       when:d=>!!d.tenant, kind:"version",
       options:()=>TMOS_VERSIONS.filter(isTarget).map(x=>({v:x.v,
         t:x.v+(x.approved&&x.latest?"  ·  recommended (approved, latest)":x.approved?"  ·  approved":"  ·  not approved")}))}
    ]
  },
  /* Rollback is a property of the operation type, not the device. Types that
     cannot be rolled back declare rollback:false and the action is never
     offered for them — adding such a type is a data entry, nothing more. */
  F5OS:{
    label:"F5OS", rollback:true,
    fields:[
      {key:"peer1", label:"Peer 1", placeholder:"Select a host",
       options:()=>RSERIES_DEVICES.map(x=>({v:x.id,t:x.label}))},
      {key:"peer2", label:"Peer 2", placeholder:"Select a host",
       when:d=>!!d.peer1,
       options:d=>RSERIES_DEVICES.filter(x=>x.id!==d.peer1).map(x=>({v:x.id,t:x.label}))},
      {key:"version", label:"Target version", placeholder:"Select a version",
       when:d=>!!d.peer2, kind:"version",
       options:()=>F5OS_VERSIONS.filter(isTarget).map(x=>({v:x.v,
         t:x.v+(x.approved?"":"  ·  not approved")+(x.latest?"  ·  latest":"")}))}
    ]
  }
};
const opFields=op=>(OPERATIONS[op]||{}).fields||[];
const recommendedVersion=(op)=>((op==="F5OS"?F5OS_VERSIONS:TMOS_VERSIONS).find(v=>v.approved&&v.latest)||{}).v||"";

/* which fields are visible for the answers so far */
function visibleFields(draft){
  return opFields(draft.op).filter(f=>!f.when||f.when(draft));
}
/* an upstream change clears everything downstream, and any impact result */
function setField(draft,key,value){
  const fs=opFields(draft.op), i=fs.findIndex(f=>f.key===key);
  draft[key]=value;
  fs.slice(i+1).forEach(f=>{ draft[f.key]=""; });
  draft.impact=null;
}
function setOperation(draft,op){
  draft.op=op;
  opFields(op).forEach(f=>{ draft[f.key]=""; });
  Object.keys(draft).forEach(k=>{ if(!["op","impact","change","crno","winStart","winEnd"].includes(k)
     && !opFields(op).some(f=>f.key===k)) delete draft[k]; });
  draft.impact=null;
}

/* impact includes the pair and the tenants it carries, with reasons */
function computeImpact(draft){
  if(draft.op==="F5OS"){
    const rows=[];
    [draft.peer1,draft.peer2].filter(Boolean).forEach((h,n)=>{
      rows.push({device:h, tenant:"—", why:"Host selected as Peer "+(n+1)+" — reboots"});
      (TENANTS_BY_DEVICE[h]||[]).forEach(t=>
        rows.push({device:h, tenant:t.id, why:"Runs on this host — downtime during reboot"}));
    });
    return rows;
  }
  const rows=[], t=tenantById(draft.tenant);
  if(!t) return rows;
  if(draft.deviceType==="rseries"){
    const dev=deviceById(draft.device), pairDev=dev?deviceById(dev.pair):null;
    rows.push({device:dev?dev.id:"—", tenant:t.id, why:"Selected"});
    const pt=tenantById(t.pair);
    if(pairDev&&pt) rows.push({device:pairDev.id, tenant:pt.id, why:"Impacted through the paired device"});
  }else{
    rows.push({device:"—", tenant:t.id, why:"Selected"});
    const pt=tenantById(t.pair);
    if(pt) rows.push({device:"—", tenant:pt.id, why:"Impacted through the HA partner"});
  }
  return rows;
}

/* submit only when everything required is satisfied */
function validateItem(draft,needsChange){
  const opDef=OPERATIONS[draft.op];
  if(!draft.op)            return "Select an operation type.";
  if(opDef&&opDef.unspecified) return draft.op+" is not specified yet.";
  const missing=visibleFields(draft).find(f=>!draft[f.key]);
  if(missing)              return "Select "+(typeof missing.label==="function"?missing.label(draft):missing.label).toLowerCase()+".";
  if(!draft.impact)        return "Check impacted CIs before submitting.";
  if(needsChange){
    if(draft.change==="byoc" && !(draft.crno||"").trim()) return "Enter the change number.";
    if(draft.change!=="byoc" && !(draft.winStart||"").trim()) return "Set the requested window.";
  }
  return null;
}

/* ---- rendering ---- */
function fieldHTML(f,draft,handler){
  const label=typeof f.label==="function"?f.label(draft):f.label;
  const opts=f.options(draft)||[];
  const val=draft[f.key]||"";
  const hint=(f.kind==="version"&&!val)
    ? `<span class="help" style="display:block">Recommended: <b>${esc(recommendedVersion(draft.op))}</b> — approved and latest.</span>`
    : (f.kind==="version"&&val&&val!==recommendedVersion(draft.op))
      ? `<span class="help" style="display:block">Not the recommended version (${esc(recommendedVersion(draft.op))}).</span>` : "";
  return `<div class="field"><label>${esc(label)}</label>
    <select onchange="${handler}('${f.key}',this.value)">
      <option value="">${esc(f.placeholder||"Select one")}</option>
      ${opts.map(o=>`<option value="${esc(o.v)}" ${val===o.v?"selected":""}>${esc(o.t)}</option>`).join("")}
    </select>${hint}</div>`;
}

/* the OS-specific configuration block, shared by both entry points  */
function opTypeHTML(draft,opHandler){
  return `<div class="field"><label>Operation type</label>
      <select onchange="${opHandler}(this.value)">
        <option value="">Select one</option>
        ${Object.keys(OPERATIONS).map(k=>`<option value="${k}" ${draft.op===k?"selected":""}>${esc(OPERATIONS[k].label)}</option>`).join("")}
      </select></div>`;
}

function targetFieldsHTML(draft,handler){
  if(!draft.op) return `<div class="notice">Select an operation type first.</div>`;
  if(OPERATIONS[draft.op].unspecified)
    return `<div class="notice">The ${esc(draft.op)} workflow has not been specified yet.</div>`;
  return visibleFields(draft).map(f=>fieldHTML(f,draft,handler)).join("");
}

function itemConfigHTML(draft,handler,opHandler,showOpType){
  return (showOpType?opTypeHTML(draft,opHandler):"")+targetFieldsHTML(draft,handler);
}

function impactReady(d){ return d.op==="F5OS" ? !!(d.peer1&&d.peer2) : !!d.tenant; }
function impactHTML(draft){
  const ready = draft.op==="F5OS" ? !!(draft.peer1&&draft.peer2) : !!draft.tenant;
  if(!ready) return `<div class="notice">Select a target first.</div>`;
  if(!draft.impact) return `<div class="notice">Not checked yet.</div>`;
  return `<table class="impact"><thead><tr><th>Device</th><th>Tenant</th><th>Why</th></tr></thead><tbody>

  </tbody></table>`;
}

/* Breadcrumbs navigate. Each entry is a label, or [label, destination, arg];
   the last entry is where you are, so it is never a link. */
/* ============================================================================
   NAVIGATION

   Two jobs, kept apart. The breadcrumb answers "where am I" and is the only
   way up. The URL is the only history, so the browser's own Back, swipe-back,
   refresh and a pasted link all work on the same mechanism.

   Everything routes through go(). Nothing else writes history, which is what
   keeps Back meaning "the previous screen" rather than "undo my last
   keystroke" — filtering, searching and sorting re-render freely.
   ============================================================================ */

const NAV_FRAME={home:{v:"home"},plans:{v:"list"},devices:{v:"devices"},activity:{v:"activity"}};

function frameToHash(f){
  switch(f.v){
    case "list":     return "#/plans";
    case "newplan":  return "#/plans/new";
    case "plan":     return "#/plans/"+encodeURIComponent(f.p);
    case "item":     return "#/plans/"+encodeURIComponent(f.p)+"/items/"+encodeURIComponent(f.i);
    case "devices":  return "#/devices";
    case "device":   return "#/devices/"+encodeURIComponent(f.d);
    case "activity": return "#/activity";
    default:         return "#/";
  }
}

function hashToFrame(h){
  const g=(h||"").replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);
  if(!g.length) return {v:"home"};
  if(g[0]==="plans"){
    if(!g[1])        return {v:"list"};
    if(g[1]==="new") return {v:"newplan"};
    if(g[2]==="items" && g[3]) return {v:"item",p:g[1],i:g[3]};
    return {v:"plan",p:g[1]};
  }
  if(g[0]==="devices")  return g[1] ? {v:"device",d:g[1]} : {v:"devices"};
  if(g[0]==="activity") return {v:"activity"};
  return {v:"home"};
}

/* A pasted or bookmarked link can name something that no longer exists.
   Fall back to its parent rather than rendering an empty page. */
function resolveFrame(f){
  if(f.v==="plan" && !getPlan(f.p))   return {v:"list"};
  if(f.v==="item"){
    if(!getPlan(f.p))                 return {v:"list"};
    if(!getItem(f.p,f.i))             return {v:"plan",p:f.p};
  }
  if(f.v==="device" && !deviceRecord(f.d)) return {v:"devices"};
  return f;
}

/* The only place view state is set. */
function applyFrame(f){
  stopEditing();
  devSelected=null; 
  if(f.v==="device" || f.v==="devices"){ view="devices"; devSelected=f.v==="device"?f.d:null; }
  else if(f.v==="item"){ selectedPlan=f.p; selectedItem=f.i; view="item"; }
  else if(f.v==="plan"){ selectedPlan=f.p; selectedItem=null; tab="execution"; view="plan"; }
  else { view=f.v==="list"?"list":f.v; }
  render();
}

/* pushState throws inside a sandboxed frame. The breadcrumb does not depend on
   it, so degrade to in-memory navigation rather than failing the click. */
function histWrite(f,h,replace){
  try{ replace ? history.replaceState({f},"",h) : history.pushState({f},"",h); }
  catch(e){}
}

function go(f,replace){
  f=resolveFrame(f);
  const h=frameToHash(f);
  if(!replace && location.hash===h){ applyFrame(f); return; }   /* already here */
  histWrite(f,h,replace);
  applyFrame(f);
}

window.addEventListener("popstate",e=>{
  const f=resolveFrame((e.state&&e.state.f) || hashToFrame(location.hash));
  /* A frame that resolved down to its parent must correct the URL too, or the
     address bar goes on naming something that is not on screen. */
  if(frameToHash(f)!==location.hash) histWrite(f,frameToHash(f),true);
  applyFrame(f);
});

const CRUMB_TO={
  home:   ()=>go({v:"home"}),
  plans:  ()=>go({v:"list"}),
  devices:()=>go({v:"devices"}),
  device: name=>go({v:"device",d:name}),
  plan:   id=>go({v:"plan",p:id})
};
function setCrumb(a){
  document.getElementById("crumb").innerHTML=a.map((x,i)=>{
    const [label,to,arg]=Array.isArray(x)?x:[x];
    if(i===a.length-1) return `<b>${esc(label)}</b>`;
    if(!to)            return esc(label);
    return `<button class="crumb-link" data-crumb="${esc(to)}" data-arg="${esc(arg||"")}">${esc(label)}</button>`;
  }).join(" <span>›</span> ");
  document.querySelectorAll("[data-crumb]").forEach(b=>b.addEventListener("click",()=>{
    const f=CRUMB_TO[b.dataset.crumb]; if(f) f(b.dataset.arg);
  }));
}

/* ===================================================================
   THE APPLICATION — dataset, lifecycle, listing and submit pipeline.
   =================================================================== */

/* ---- change-request lead time. Calendar days. ---- */
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
const POLICY={ minChangeLeadDays:5 };   /* number unconfirmed — 4 or 5 */

/* ---- the reconciled state model ---- */
const PLAN_STATE={
  DRAFT:"Draft", VALIDATING:"Validating", VFAILED:"Validation failed",
  AWAITING:"Awaiting approval", SCHEDULED:"Scheduled", EXECUTING:"Executing",
  ACTION:"Action required", COMPLETING:"Completing",
  COMPLETED:"Completed", PARTIAL:"Completed with failures", FAILED:"Failed",
  NOTAPPROVED:"Not approved", CANCELLING:"Cancelling", CANCELLED:"Cancelled",
  EXPIRED:"Expired"
};
const ITEM_STATE={
  DRAFT:"Draft", QUEUED:"Queued", INPROGRESS:"In progress", ACTION:"Action required",
  ROLLINGBACK:"Rolling back", SUCCEEDED:"Succeeded", FAILED:"Failed",
  ROLLEDBACK:"Rolled back", ROLLBACKFAILED:"Rollback failed",
  CANCELLED:"Cancelled", SKIPPED:"Skipped",
  /* Cancelled reads as "somebody cancelled this". When the change request was
     rejected nobody did — the item simply never became eligible to run. */
  NOTAPPROVED:"Not approved"
};

/* Disposition — who holds the baton. Closed set of four, exhaustive and
   disjoint, so the listing survives any future state being added. */
const DISPOSITION={
  [PLAN_STATE.DRAFT]:"needs", [PLAN_STATE.VFAILED]:"needs", [PLAN_STATE.ACTION]:"needs",
  [PLAN_STATE.VALIDATING]:"running", [PLAN_STATE.EXECUTING]:"running",
  [PLAN_STATE.COMPLETING]:"running", [PLAN_STATE.CANCELLING]:"running",
  [PLAN_STATE.AWAITING]:"waiting", [PLAN_STATE.SCHEDULED]:"waiting",
  [PLAN_STATE.COMPLETED]:"done", [PLAN_STATE.PARTIAL]:"done", [PLAN_STATE.FAILED]:"done",
  [PLAN_STATE.NOTAPPROVED]:"done", [PLAN_STATE.CANCELLED]:"done", [PLAN_STATE.EXPIRED]:"done"
};
const SEGMENTS=[["needs","Needs action"],["running","Running"],["waiting","Waiting"],["done","Closed"]];
const TERMINAL=new Set([PLAN_STATE.COMPLETED,PLAN_STATE.PARTIAL,PLAN_STATE.FAILED,
  PLAN_STATE.NOTAPPROVED,PLAN_STATE.CANCELLED,PLAN_STATE.EXPIRED]);

function disposition(p){
  if(!TERMINAL.has(p.state) && p.items.some(i=>i.state===ITEM_STATE.ACTION)) return "needs";
  return DISPOSITION[p.state] || "needs";
}
function attentionItem(p){ return p.items.find(i=>i.state===ITEM_STATE.ACTION) || null; }

/* An item can only hold an execution state if its plan actually reached
   execution. Everything before that — awaiting approval, scheduled, rejected,
   failed validation — means nothing was ever dispatched. */
const PLAN_RAN=new Set([PLAN_STATE.EXECUTING,PLAN_STATE.COMPLETING,PLAN_STATE.CANCELLING,
  PLAN_STATE.COMPLETED,PLAN_STATE.PARTIAL,PLAN_STATE.FAILED]);
const ITEM_RAN=new Set([ITEM_STATE.INPROGRESS,ITEM_STATE.ACTION,ITEM_STATE.ROLLINGBACK,
  ITEM_STATE.SUCCEEDED,ITEM_STATE.FAILED,ITEM_STATE.ROLLEDBACK,ITEM_STATE.ROLLBACKFAILED]);
function planHasRun(p){ return PLAN_RAN.has(p.state); }
function itemHasRun(i){ return ITEM_RAN.has(i.state); }

/* ---- counts, with explicit buckets. No catch-all. ---- */
function countsV2(p){
  const c={total:p.items.length,draft:0,queued:0,running:0,action:0,
           succeeded:0,failed:0,skipped:0,cancelled:0,rolledback:0};
  p.items.forEach(i=>{
    if(i.state===ITEM_STATE.DRAFT)            c.draft++;
    else if(i.state===ITEM_STATE.QUEUED)      c.queued++;
    else if(i.state===ITEM_STATE.INPROGRESS||i.state===ITEM_STATE.ROLLINGBACK) c.running++;
    else if(i.state===ITEM_STATE.ACTION)      c.action++;
    else if(i.state===ITEM_STATE.SUCCEEDED)   c.succeeded++;
    else if(i.state===ITEM_STATE.SKIPPED)     c.skipped++;
    else if(i.state===ITEM_STATE.CANCELLED)   c.cancelled++;
    else if(i.state===ITEM_STATE.NOTAPPROVED) {}
    else if(i.state===ITEM_STATE.ROLLEDBACK)  c.rolledback++;
    else                                      c.failed++;
  });
  /* Progress is work that actually ran. Items that never started — skipped on
     an expired window, cancelled, or never approved — are terminal but are not
     progress, and counting them would show a plan as complete that never ran. */
  c.notapproved=p.items.filter(i=>i.state===ITEM_STATE.NOTAPPROVED).length;
  c.done=c.succeeded+c.failed+c.rolledback;
  c.settled=c.done+c.skipped+c.cancelled+c.notapproved;
  return c;
}

/* a qualifier must carry a datum. No datum, no qualifier. */
function qualifier(p){
  const c=countsV2(p);
  switch(p.state){
    case PLAN_STATE.DRAFT:
      return c.total? c.total+(c.total===1?" item":" items")+(p.change?"":" · no change") : "no items";
    case PLAN_STATE.VALIDATING:
      return (p.checksDone||0)+" of "+(p.checksTotal||11)+" checks";
    case PLAN_STATE.VFAILED:
      return plural((p.errors||[]).length,"item")+" · "+plural((p.errors||[]).reduce((a,e)=>a+e.fails.length,0),"check");
    case PLAN_STATE.AWAITING:
      return p.change+" · raised "+(p.raisedOn||"—");
    case PLAN_STATE.SCHEDULED:
      return "opens "+p.window;
    case PLAN_STATE.EXECUTING: {
      const a=attentionItem(p);
      if(a) return plural(p.items.filter(x=>x.state===ITEM_STATE.ACTION).length,"item")+
                   " failed · "+(failedTaskName(a)||"awaiting your decision");
      return c.done+" of "+c.total+(p.startedAt?" · since "+p.startedAt:"");
    }
    case PLAN_STATE.ACTION:
      return p.planTaskFailed || "plan task failed";
    case PLAN_STATE.COMPLETING:
      return "closing "+p.change;
    case PLAN_STATE.PARTIAL:
      return c.succeeded+" of "+c.total+(p.endedAt?" · ended "+p.endedAt:"");
    case PLAN_STATE.COMPLETED:
      return c.total+(c.total===1?" item":" items")+(p.endedAt?" · ended "+p.endedAt:"");
    case PLAN_STATE.FAILED:
      return plural(c.failed,"item")+" failed";
    case PLAN_STATE.NOTAPPROVED:
      return p.change+" rejected";
    case PLAN_STATE.EXPIRED:
      return "window closed "+p.window;
    case PLAN_STATE.CANCELLED:
      return p.cancelledBy? "by "+p.cancelledBy : c.total+" items";
    case PLAN_STATE.CANCELLING:
      return c.running+" items settling";
    default: return "";
  }
}

/* ---- lead time ---- */
const MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Sept:8,Oct:9,Nov:10,Dec:11};
function parseWindow(s){
  const m=/(\d{1,2})\s+([A-Za-z]{3,4})\s*(\d{4})?/.exec(s||"");
  if(!m) return null;
  const mo=MONTHS[m[2]]; if(mo===undefined) return null;
  return new Date(m[3]?+m[3]:2026, mo, +m[1]);
}
const TODAY=new Date(2026,8,9);              /* the prototype's "now" */
function leadDays(win){
  const d=parseWindow(win); if(!d) return null;
  return Math.round((d-TODAY)/86400000);
}
/* Returns null when fine, else the refusal sentence. */
function leadTimeError(win){
  const n=leadDays(win);
  if(n===null) return null;
  if(n<POLICY.minChangeLeadDays)
    return "A new change approval needs "+POLICY.minChangeLeadDays+
           " calendar days. That window is "+(n<0?"in the past":n+(n===1?" day":" days")+" away")+".";
  return null;
}

/* ---- rollback is a property of the operation type ---- */
function canRollback(p){
  const op=OPERATIONS[p.operation];
  return !op || op.rollback!==false;
}

/* ---- validation. Extensible: one rule per check. ---- */
const CHECKS=[
  {k:"device",  label:"Device",         run:i=>i.journey==="virtual"?null:
      (i.device&&i.device!=="—"?null:"Device is unavailable.")},
  {k:"tenant",  label:"Tenant",         run:i=>i.tenant?null:"Tenant is not set."},
  {k:"version", label:"Target version", run:i=>i.to&&i.to!==i.from?null:
      "Selected version is already running on this tenant."},
  {k:"op",      label:"Operation type", run:(i,p)=>i.operation===p.operation?null:
      "Item operation type does not match the plan."}
];
function runValidation(p){
  const errors=[];
  p.items.forEach(i=>{
    const fails=CHECKS.map(c=>({label:c.label,msg:c.run(i,p)})).filter(x=>x.msg);
    if(fails.length) errors.push({item:i.id,name:i.name,fails,
      passes:CHECKS.filter(c=>!c.run(i,p)).map(c=>c.label)});
  });
  return errors;
}

/* ---- the single submit pipeline both entry points use ---- */
function submitV2(p){
  p.state=PLAN_STATE.VALIDATING; p.checksDone=0; p.checksTotal=CHECKS.length*p.items.length;
  render();   /* items stay Draft: nothing is queued until validation passes */
  clearTimeout(p._vtimer);
  p._vtimer=setTimeout(()=>{
    const errors=runValidation(p);
    if(errors.length){ p.errors=errors; p.state=PLAN_STATE.VFAILED; }
    else {
      p.errors=null;
      const lead=p.mode==="create" ? leadTimeError(p.window) : null;
      if(lead){ p.errors=[{item:"—",name:"Change window",fails:[{label:"Lead time",msg:lead}],passes:[]}];
                p.state=PLAN_STATE.VFAILED; }
      else if(p.mode==="create"){ p.state=PLAN_STATE.AWAITING; p.raisedOn="9 Sep";
              p.items.forEach(i=>i.state=ITEM_STATE.QUEUED); }
      else { p.state=PLAN_STATE.SCHEDULED;
             p.items.forEach(i=>i.state=ITEM_STATE.QUEUED); }
    }
    render();
  },2600);   /* long enough that Stop validating is actually reachable */
}

/* Lifecycle actions available from each state. Actions are explicit verbs —
   one "Cancel" whose blast radius ranges from a draft to a live estate is a
   safety problem, so each state names its own. */
function planActions(p){
  const acts=planActionsFor(p);
  return acts.filter(a=>a[0]!=="details" || planEditScope(p)!=="none");
}
function planActionsFor(p){
  switch(p.state){
    case PLAN_STATE.DRAFT:    return [["submit","Submit plan","primary"],["details","Edit plan",""],["delete","Delete plan",""]];
    case PLAN_STATE.VFAILED:  return [["resubmit","Resubmit","primary"],["details","Edit plan",""],["delete","Delete plan",""]];
    case PLAN_STATE.AWAITING: return [["details","Edit plan",""],["withdraw","Withdraw request",""]];
    case PLAN_STATE.SCHEDULED:return [["details","Edit plan",""],["terminate","Terminate plan",""]];
    case PLAN_STATE.VALIDATING:return [["details","Edit plan",""],["stopvalidating","Stop validating",""]];
    case PLAN_STATE.EXECUTING:return [["details","Edit plan",""],["cancel","Cancel plan",""]];
    case PLAN_STATE.ACTION:   return [["retry","Retry","primary"],["details","Edit plan",""],["cancel","Cancel plan",""]];
    default: return (canRename(p)&&planEditScope(p)!=="none") ? [["details","Edit plan",""]] : [];
  }
}
function runPlanAction(id,a){
  const p=getPlan(id); if(!p) return;
  if(a==="edit"){ editPlan(p.id); return; }
  if(a==="details"){ openPlanEdit(p.id); return; }
  if(a==="stopvalidating"){
    clearTimeout(p._vtimer); p._vtimer=null;
    p.state=PLAN_STATE.DRAFT; p.errors=null; p.checksDone=0;
    showToast("Validation stopped. The plan is back in draft.");
    render(); return;
  }
  if(a==="submit"||a==="resubmit"){ stopEditing(); submitV2(p); return; }
  if(a==="delete"){ plansV2=plansV2.filter(x=>x!==p); goList(); showToast("Plan deleted."); return; }
  if(a==="withdraw"){ p.state=PLAN_STATE.CANCELLED; p.cancelledBy="you · request withdrawn"; }
  if(a==="terminate"){ p.state=PLAN_STATE.CANCELLED; p.cancelledBy="you · terminated before window"; }
  if(a==="cancel"){ p.state=PLAN_STATE.CANCELLING;
    setTimeout(()=>{ p.items.forEach(i=>{ if(i.state===ITEM_STATE.INPROGRESS||i.state===ITEM_STATE.QUEUED)
      i.state=ITEM_STATE.CANCELLED; }); p.state=PLAN_STATE.CANCELLED; p.cancelledBy="you"; render(); },900); }
  if(a==="retry"){ p.state=PLAN_STATE.EXECUTING; p.planTaskFailed=null; }
  render();
}

/* ---- execution reference ---- */
function execRef(p){ return p.execRef || null; }

/* ---- the dataset. Every item's operation type matches its plan, and
   every device/tenant pair exists in the reference data. ---- */
let plansV2=[];
/* Every valid target the authoring form could produce, in one pool. */
function targetPool(){
  const out=[];
  Object.keys(TENANTS_BY_DEVICE).forEach(h=>TENANTS_BY_DEVICE[h].forEach(t=>
    out.push({name:t.id, kind:"R-series device", journey:"rseries",
              device:h, tenant:t.id, from:t.v, impact:2})));
  VIRTUAL_TENANTS.forEach(t=>out.push({name:t.id, kind:"Virtual tenant", journey:"virtual",
              device:"—", tenant:t.id, from:t.v, impact:2}));
  /* a tenant already on the newest approved version has nothing to upgrade to,
     and validation would reject it — so it is not a candidate for a plan */
  return out.filter(t=>TMOS_VERSIONS.some(v=>isTarget(v)&&v.approved&&newer(v.v,t.from)));
}
const verNum=v=>v.split(".").map(Number);
function newer(a,b){                      /* is a strictly newer than b? */
  const x=verNum(a), y=verNum(b);
  for(let i=0;i<Math.max(x.length,y.length);i++){
    if((x[i]||0)!==(y[i]||0)) return (x[i]||0)>(y[i]||0);
  }
  return false;
}
function pickTarget(pool){
  /* cycle rather than clamp: clamping made every item past the pool size
     collapse onto the same target, so a plan could upgrade one tenant twice */
  if(!pool.length) targetPool().forEach(x=>pool.push(x));
  const t=pool.shift();
  /* an upgrade goes forwards. Picking the first approved version that merely
     differed produced downgrades for tenants already on the latest. */
  const up=TMOS_VERSIONS.filter(v=>isTarget(v)&&v.approved&&newer(v.v,t.from));
  const to=(up[0]||TMOS_VERSIONS.find(v=>v.approved)||TMOS_VERSIONS[0]).v;
  return Object.assign({},t,{to});
}

function buildV2Data(){
  const pool=targetPool();
  const V2_STATE={ "PL-0033":PLAN_STATE.ACTION, "PL-0012":PLAN_STATE.EXECUTING,
    "PL-0040":PLAN_STATE.VALIDATING, "PL-0035":PLAN_STATE.SCHEDULED,
    "PL-0034":PLAN_STATE.AWAITING,  "PL-0031":PLAN_STATE.VFAILED,
    "PL-0024":PLAN_STATE.SCHEDULED, "PL-0018":PLAN_STATE.COMPLETED, "PL-0051":PLAN_STATE.DRAFT };
  const IMAP={ "Waiting for action":ITEM_STATE.ACTION, "Running":ITEM_STATE.INPROGRESS,
    "Completed":ITEM_STATE.SUCCEEDED, "Validating":ITEM_STATE.QUEUED,
    "Queued":ITEM_STATE.QUEUED, "Draft":ITEM_STATE.DRAFT };
  plansV2=plans.map(p=>{
    const q=Object.assign({},p);
    Object.defineProperty(q,"window",{get(){return this.windowStart||"";},
      set(v){this.windowStart=v;},configurable:true});
    q.windowStart=p.windowStart; q.windowEnd=p.windowEnd;
    q.state=V2_STATE[p.id]||PLAN_STATE.DRAFT;
    q.mode=p.mode;
    /* Items are generated from the same reference data the authoring form
       selects from, so the list can never assert a combination the form
       could not produce. */
    q.items=p.items.map((i,n)=>{
      const t=pickTarget(pool);
      return {id:i.id, name:t.name, kind:t.kind, journey:t.journey,
        device:t.device, tenant:t.tenant, operation:p.operation,
        impactCount:t.impact, from:t.from, to:t.to,
        stage:"Not started", state:IMAP[i.state]||ITEM_STATE.QUEUED};
    });
    if(q.state===PLAN_STATE.VFAILED){
      /* the failure has to be real, or the state is an assertion with no evidence */
      q.items.forEach(i=>{ i.to=i.from;              /* version already running */
        i.state=ITEM_STATE.DRAFT; });                  /* nothing is queued on a failed plan */
      q.errors=runValidation(q);
    }
    if(q.state===PLAN_STATE.ACTION) q.planTaskFailed="create change ticket timed out";
    if(q.state===PLAN_STATE.AWAITING) q.raisedOn="5 Sep";
    q.items.forEach(it=>{ const n=flatTasks(workflowFor(it).wf||[[]]).length||1;
      it.taskIdx = it.state===ITEM_STATE.SUCCEEDED ? n-1
                 : it.state===ITEM_STATE.INPROGRESS ? Math.floor(n*0.55)
                 : it.state===ITEM_STATE.ACTION ? Math.floor(n*0.7) : 0;
      /* where inside the current task the run has reached */
      const wf=workflowFor(it).wf;
      const cur=wf?flatTasks(wf)[it.taskIdx]:null;
      const msN=cur?cur.ms.length:0;
      it.msIdx = it.state===ITEM_STATE.INPROGRESS ? Math.floor(msN/2) : 0; });
    if(q.state===PLAN_STATE.EXECUTING){ q.startedAt="22:04"; q.execRef="EX-"+q.id.slice(3)+"-01"; }
    if(q.state===PLAN_STATE.COMPLETED){ q.endedAt="03:12"; q.execRef="EX-"+q.id.slice(3)+"-01";
      q.items.forEach(i=>i.state=ITEM_STATE.SUCCEEDED); }
    return q;
  });
  /* a device/tenant pair the authoring flow forbids must never be seeded */
  plansV2.forEach(p=>p.items.forEach(i=>{
    if(i.tenant==="tnt-payments-01") i.device="rseries-ard-01";
    if(i.device==="rseries-cin-03"){ i.device="rseries-cin-01"; i.tenant="tnt-clearing-01"; }
  }));
  /* one plan whose window has passed unused — the Expired case */
  const exp=plansV2.find(p=>p.id==="PL-0024");
  if(exp){ exp.state=PLAN_STATE.EXPIRED; exp.windowStart="2 Sep, 22:00";
    exp.items.forEach(i=>i.state=ITEM_STATE.SKIPPED); }
  /* F5OS host-pair upgrades — the peer journey, built exactly as the form
     produces it: two peers chosen by hand, no tenant, host OS versions. */
  const f5osItem=(id,a,b,from,to,state)=>({id, name:a+" / "+b, kind:"Host pair",
    journey:"hostpair", device:a+" / "+b, peer1:a, peer2:b, tenant:"—",
    operation:"F5OS", impactCount:2+(TENANTS_BY_DEVICE[a]||[]).length+(TENANTS_BY_DEVICE[b]||[]).length,
    from, to, stage:"Not started", state, taskIdx:0});
  const f5osPlan=(id,name,desc,change,ws,we,state,items)=>{
    const q={id,name,desc,operation:"F5OS",change,windowStart:ws,windowEnd:we,
             mode:"byoc",state,items};
    Object.defineProperty(q,"window",{get(){return this.windowStart||"";},
      set(v){this.windowStart=v;},configurable:true});
    return q;
  };
  plansV2.splice(2,0,
    f5osPlan("PL-0060","Ardent host platform, F5OS uplift","Both Ardent hosts, rolling",
      "CR-7990","14 Oct, 22:00","15 Oct, 02:00", PLAN_STATE.EXECUTING,
      [f5osItem("IT-6001","rseries-ard-01","rseries-ard-02","1.6.2","1.8.0",ITEM_STATE.INPROGRESS)]),
    f5osPlan("PL-0061","Bramble host platform, F5OS uplift","Both Bramble hosts",
      "requested","24 Oct, 22:00","25 Oct, 02:00", PLAN_STATE.AWAITING,
      [f5osItem("IT-6002","rseries-bra-01","rseries-bra-02","1.7.0","1.8.0",ITEM_STATE.QUEUED)]));
  plansV2.find(p=>p.id==="PL-0060").mode="byoc";
  plansV2.find(p=>p.id==="PL-0061").mode="create";
  plansV2.find(p=>p.id==="PL-0060").startedAt="22:06";
  plansV2.find(p=>p.id==="PL-0060").execRef="EX-0060-01";
  plansV2.find(p=>p.id==="PL-0061").raisedOn="8 Sep";

  /* one quick submit already in flight, so the two kinds sit side by side */
  const qs={id:"PL-7042", name:"vtn-settle-01 → 17.1.1", desc:"Quick submit",
    operation:"TMOS", change:"CR-7455", windowStart:"12 Oct, 22:00", windowEnd:"13 Oct, 02:00",
    mode:"byoc", virtual:true, state:PLAN_STATE.SCHEDULED,
    items:[{id:"IT-7043", name:"vtn-settle-01", kind:"Virtual tenant", journey:"virtual",
      device:"—", tenant:"vtn-settle-01", operation:"TMOS", impactCount:2,
      from:"16.1.4", to:"17.1.1", stage:"Not started", state:ITEM_STATE.QUEUED, taskIdx:0}]};
  Object.defineProperty(qs,"window",{get(){return this.windowStart||"";},
    set(v){this.windowStart=v;},configurable:true});
  plansV2.splice(3,0,qs);

  /* One partial and one outright failure, so the outcome markers the design
     distinguishes are actually reachable. */
  const part=plansV2.find(p=>p.id==="PL-0018");
  if(part){ part.state=PLAN_STATE.PARTIAL; part.endedAt="03:12";
    part.items.forEach((i,n)=>i.state = n===0 ? ITEM_STATE.FAILED : ITEM_STATE.SUCCEEDED); }
  const fail=plansV2.find(p=>p.id==="PL-0024");
  if(fail){ fail.state=PLAN_STATE.FAILED; fail.endedAt="01:48";
    fail.items.forEach(i=>i.state=ITEM_STATE.FAILED); }

  /* one rejected change — terminal: a new plan is required */
  const rej=plansV2.find(p=>p.id==="PL-0034");
  if(rej){ rej.state=PLAN_STATE.NOTAPPROVED; }

  /* One item stopped at a real task in the captured workflow, so the recovery
     actions have something concrete to act on. Task 13 is Standby Node Upgrade. */
  plansV2.filter(q=>q.state===PLAN_STATE.EXECUTING).forEach(q=>{
    const a=q.items.find(i=>i.state===ITEM_STATE.ACTION);
    if(a){ a.failedTask=13;                 /* step 13 · Standby Node Upgrade */
           a.failureReason="Upgrade image did not install on the standby node. The device is unchanged and the pair is still serving traffic from the active node.";
           a.taskIdx=13; }
  });

  /* Nothing may claim to have run on a plan that never reached execution. */
  plansV2.forEach(q=>{
    if(planHasRun(q) || q.state===PLAN_STATE.EXPIRED) return;
    const resting =
      q.state===PLAN_STATE.NOTAPPROVED ? ITEM_STATE.NOTAPPROVED    /* the change was rejected */
      : (q.state===PLAN_STATE.AWAITING||q.state===PLAN_STATE.SCHEDULED) ? ITEM_STATE.QUEUED
      : ITEM_STATE.DRAFT;                                          /* draft, validating, failed */
    q.items.forEach(i=>{ i.state=resting; i.taskIdx=0; i.stage="Not started"; });
    delete q.execRef;
  });

}

/* ---- the listing ---- */
let seg="needs", q2="", opFilter="", outFilter="", sortBy="window", sortTouched=false, editing=null;

/* A plan is editable only until execution begins.
   Executing, Completing, Cancelling and every terminal state are closed.
   Validating is excluded too: the system is mid-check, so there is nothing
   stable to edit. */
/* Full editing belongs to the two states where the plan is the user's to
   correct: never submitted, or handed back to be fixed. Once a change ticket
   has been raised or approved, editing what the run depends on would leave the
   approval describing something else — so those states get the name only. */
const EDITABLE=new Set([PLAN_STATE.DRAFT,PLAN_STATE.VFAILED]);
function canEdit(p){ return EDITABLE.has(p.state); }

/* Renaming stays open while the plan is live, because the name is a human
   label rather than an input to the run. Terminal plans are records and keep
   the name they completed under. */
function canRename(p){ return !TERMINAL.has(p.state) && !EDITABLE.has(p.state); }

/* A virtual plan's name is derived from its item, not chosen by anyone, so it
   is never editable — renaming it would let the label drift from the operation
   it describes. Derive it on read so it cannot go stale either. */
function planTitle(p){
  if(!p.virtual) return p.name;
  const i=p.items[0];
  return i ? i.name+" → "+i.to : p.name;
}

/* A plan export is already scoped to the plan you are on: one operation type,
   one lifecycle. A period and filters could only subtract evidence from the
   change record, so this is confirm-and-attach, like exporting a single event
   from Activity. The shared filter state is left alone — a plan export must
   not disturb what Activity is showing. */
function openPlanExport(id){
  openExport(activityLog().filter(r=>r.plan===id && r.evidence), true);
}

function planEditScope(p){
  /* A plan returned for correction can have its change record fixed too — the
     failure may be the ticket or the window, not an item. Once it is live the
     name is all that is left, because everything else is what the run depends on.
     A virtual plan has no editable name, so in a live state it has nothing to edit. */
  if(p.virtual) return canEdit(p) ? "change" : "none";
  return canEdit(p) ? "details" : "name";
}

function searchV2(query){
  const terms=query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  return plansV2.filter(p=>terms.every(t=>{
    const m=/^(\w+):(.*)$/.exec(t);
    if(m){
      const [,k,v]=m;
      if(k==="change") return (p.change||"").toLowerCase().includes(v);
      if(k==="op")     return (p.operation||"").toLowerCase().includes(v);
      if(k==="state")  return (p.state||"").toLowerCase().includes(v);
      if(k==="device") return p.items.some(i=>(i.device||"").toLowerCase().includes(v));
      if(k==="tenant") return p.items.some(i=>(i.tenant||"").toLowerCase().includes(v));
      if(k==="source") return v==="quick" ? !!p.virtual : !p.virtual;
      return false;
    }
    const hay=[p.name,p.id,p.change,p.operation,p.execRef||"",
      ...p.items.map(i=>i.device+" "+i.tenant+" "+i.name)].join(" ").toLowerCase();
    return hay.includes(t);
  }));
}

const DISPO_MARK={needs:"▲",running:"◐",waiting:"◷",done:"✓"};

/* How a closed plan ended. A single ✓ across every terminal state was putting a
   success marker beside failed, expired and rejected plans. */
const OUTCOME={
  [PLAN_STATE.COMPLETED]:   {rank:4, mark:"✓", tone:"good",    label:"Completed"},
  [PLAN_STATE.PARTIAL]:     {rank:2, mark:"◑", tone:"partial", label:"Completed with failures"},
  [PLAN_STATE.FAILED]:      {rank:1, mark:"✕", tone:"bad",     label:"Failed"},
  [PLAN_STATE.NOTAPPROVED]: {rank:3, mark:"○", tone:"none",    label:"Not approved"},
  [PLAN_STATE.CANCELLED]:   {rank:3, mark:"○", tone:"none",    label:"Cancelled"},
  [PLAN_STATE.EXPIRED]:     {rank:3, mark:"○", tone:"none",    label:"Expired"}
};
const outcomeOf=p=>OUTCOME[p.state]||null;
function dispoMark(p){
  const o=outcomeOf(p);
  return o?o.mark:DISPO_MARK[disposition(p)];
}

function planRowV2(p){

    <span class="v2name"><b>${title}</b><span class="v2sub mono">${virtual?`<span class="qs-tag">Quick submit</span>`:""}${esc(id)}${virtual?"":" · "+c.total+(c.total===1?" item":" items")}</span></span>

const SORTS=[["window","Window"],["outcome","Outcome"],["state","State"],["name","Plan name"],["items","Items"]];
function effectiveSort(){ return sortTouched ? sortBy : (seg==="done" ? "outcome" : "window"); }
function sortRows(rows){
  const key=effectiveSort();
  if(key==="outcome") return rows.slice().sort((a,b)=>
    ((outcomeOf(a)||{rank:9}).rank)-((outcomeOf(b)||{rank:9}).rank));
  return rows.slice().sort((a,b)=>{
    if(key==="name")  return a.name.localeCompare(b.name);
    if(key==="items") return b.items.length-a.items.length;
    if(key==="state") return a.state.localeCompare(b.state);
    const da=parseWindow(a.window), db=parseWindow(b.window);
    if(!da&&!db) return 0; if(!da) return 1; if(!db) return -1;
    return da-db;
  });
}
/* Operation type is an independent axis from disposition — an operator asks
   "TMOS plans that need me", which is a two-dimensional question. So it is a
   filter that composes with the segment, not a second row of tabs. */
function visibleRows(){
  let rows = q2.trim() ? searchV2(q2) : plansV2.filter(p=>disposition(p)===seg);
  if(opFilter) rows = rows.filter(p=>p.operation===opFilter);
  if(outFilter) rows = rows.filter(p=>p.state===outFilter);
  return sortRows(rows);
}
function opCount(op,k){
  let rows = q2.trim() ? searchV2(q2) : plansV2.filter(p=>disposition(p)===k);
  if(outFilter && k==="done") rows = rows.filter(p=>p.state===outFilter);
  return op ? rows.filter(p=>p.operation===op).length : rows.length;
}

/* The impacted-CI check is mandatory before an item can be submitted, so its
   result is part of the item's record, carried under the execution
   reference. Recomputed from the item's own target so it cannot
   drift from what the item actually is. */
function itemImpact(i){
  return computeImpact({
    op: i.operation,
    deviceType: i.journey==="rseries" ? "rseries" : "virtual",
    device: i.device, tenant: i.tenant,
    peer1: i.peer1, peer2: i.peer2
  });
}

function runItemAction(pid,iid,a){
  const p=getPlan(pid), i=getItem(pid,iid); if(!p||!i) return;
  if(a==="retry"){
    i.state=ITEM_STATE.INPROGRESS; i.taskIdx=i.failedTask;
    i.failedTask=undefined; i.failureReason=null;
    showToast("Retrying from the failed task.");
  }
  if(a==="rollback"){
    i.state=ITEM_STATE.ROLLINGBACK; showToast("Rollback started.");
    setTimeout(()=>{ i.state=ITEM_STATE.ROLLEDBACK; i.failedTask=undefined; render(); },1200);
  }
  if(a==="cancel"){
    i.state=ITEM_STATE.CANCELLED; i.failedTask=undefined;
    showToast("Item abandoned. The device is left as it is.");
  }
  render();
}

/* A milestone is a step with a state, not a bullet. Its state follows the task
   that contains it — task and milestone share one vocabulary: Succeeded / Running / Failed / Not started. */
/* Only an item that is actually running can have a running task. Every other
   item either never started, stopped at a failure, was halted, or finished —
   so the workflow can never claim work is in flight on a closed plan. */
const RUNNING_STATES=new Set([ITEM_STATE.INPROGRESS,ITEM_STATE.ROLLINGBACK]);
const FAILED_STATES =new Set([ITEM_STATE.ACTION,ITEM_STATE.FAILED,
                              ITEM_STATE.ROLLEDBACK,ITEM_STATE.ROLLBACKFAILED]);

/* Where the item stopped. failedTask is authoritative when the data carries
   it; otherwise the task index is the stopping point, because that is what it
   means for an item that is no longer moving. */
function itemStop(i,total){
  const cur=Math.max(0,Math.min(i.taskIdx===undefined?0:i.taskIdx,total-1));
  if(i.state===ITEM_STATE.SUCCEEDED)  return {at:total,kind:"done"};
  if(FAILED_STATES.has(i.state))      return {at:i.failedTask===undefined?cur:i.failedTask,kind:"failed"};
  if(RUNNING_STATES.has(i.state))     return {at:cur,kind:"current"};
  if(i.state===ITEM_STATE.CANCELLED)  return {at:cur,kind:"halted"};
  return {at:0,kind:"todo"};          /* Draft, Queued, Skipped, Not approved */
}

function milestoneState(i,taskState,msIdx){
  if(taskState==="done") return "Succeeded";
  if(taskState==="todo") return "Not started";
  const at=i.msIdx===undefined?0:i.msIdx;
  if(msIdx<at) return "Succeeded";
  if(msIdx>at) return "Not started";
  return taskState==="failed" ? "Failed"
       : taskState==="halted" ? "Cancelled" : "Running";
}
const MS_MARK={Succeeded:"✓", Running:"●", Failed:"✕", Cancelled:"○", "Not started":""};

function failedTaskName(i){
  const {wf}=workflowFor(i); if(!wf || i.failedTask===undefined) return null;
  const t=flatTasks(wf)[i.failedTask]; return t?t.name:null;
}

function workflowFor(item){
  if(item.kind==="HA pair") return {wf:WORKFLOW_TMOS_PAIR, src:"TMOS HA pair"};
  if(item.journey==="rseries") return {wf:WORKFLOW_RSERIES, src:"rSeries tenant estate"};
  return {wf:null, src:null};
}
const flatTasks=wf=>wf.reduce((a,p)=>a.concat(p.tasks),[]);

   DEVICES — read-only inventory. Built from the same reference data the

function inventory(){
  const rows=[];
  RSERIES_DEVICES.forEach(d=>{
    const ver=(d.label.split("— ")[1]||"—").trim();
    rows.push({name:d.id, type:"rSeries host", os:"F5OS", version:ver, region:d.region||"—",
               host:"—", partner:d.pair||"—", carries:(TENANTS_BY_DEVICE[d.id]||[]).length});
  });
  Object.keys(TENANTS_BY_DEVICE).forEach(h=>{
    TENANTS_BY_DEVICE[h].forEach(t=>{
      rows.push({name:t.id, type:"Tenant", os:"TMOS", version:t.v,
                 region:(deviceById(h)||{}).region||"—",      /* a tenant is where its host is */
                 host:h, partner:t.pair||"—", carries:null});

    rows.push({name:t.id, type:"Virtual tenant", os:"TMOS", version:t.v, region:t.region||"—",
               host:"—", partner:t.pair||"—", carries:null});

  return rows;

/* Compliance is derived from the approved-version baseline the product already
   holds, not stored separately — so it cannot disagree with what the version
   dropdown offers when you build a plan. */
function versionsFor(os){ return os==="F5OS"?F5OS_VERSIONS:TMOS_VERSIONS; }

function compliance(r){
  const list=versionsFor(r.os);
  const rec=list.find(v=>v.v===r.version);
  const latest=(list.find(v=>v.latest)||{}).v;
  if(!rec)          return {state:"Drifted", why:"unrecognised build", bad:true};
  if(!rec.approved) return {state:"Drifted", why:"unapproved build",  bad:true};
  if(r.version===latest) return {state:"Compliant", why:"latest approved build"};
  const behind=list.filter(v=>v.approved&&newer(v.v,r.version)).length;
  return {state:"Compliant", why:plural(behind,"build")+" behind"};
}

/* device type in the client's vocabulary, derived from the shape we hold */
function deviceClass(r){
  if(r.type==="rSeries host")  return r.partner&&r.partner!=="—" ? "Host · HA pair" : "Host · standalone";
  if(r.type==="Tenant")        return "Hosted tenant";
  if(r.type==="Virtual tenant")return "Virtual tenant";
  return r.type;
}
/* the operation type that acts on this device — hosts are upgraded by F5OS,
   tenants by TMOS. Kept separate from OS because the two need not stay 1:1. */
function opFor(r){ return r.os; }

let devQ="", devType="", devOp="", devRegion="", devComp="", devSort="name", devDir=1;
/* Columns are the sort control — clicking a header sorts by it. */
const DEV_COLS=[["name","Name"],["cls","Type"],["os","OS type"],["version","Version"],
  ["comp","Compliance"],["region","Region"],["host","Host"]];
function devValue(r,k){
  if(k==="cls")  return deviceClass(r);
  if(k==="comp") return compliance(r).state;
  return r[k]===undefined?"":String(r[k]);
}

function devRows(){
  const q=devQ.toLowerCase().trim();
  let rows=inventory();
  if(devType)   rows=rows.filter(r=>deviceClass(r)===devType);
  if(devOp)     rows=rows.filter(r=>opFor(r)===devOp);
  if(devRegion) rows=rows.filter(r=>r.region===devRegion);
  if(devComp)   rows=rows.filter(r=>compliance(r).state===devComp);
  if(q) rows=rows.filter(r=>[r.name,deviceClass(r),r.os,r.version,compliance(r).state,
    r.region,r.host,r.partner].join(" ").toLowerCase().includes(q));
  return rows.sort((a,b)=>devDir*devValue(a,devSort)
    .localeCompare(devValue(b,devSort),undefined,{numeric:true}));
}

/* ===================================================================
   ACTIVITY — the audit trail and completion status. Events are derived
   from the plans themselves, so the log can never disagree with the state
   it describes.

   Export carries the defined evidence payload: backup files, pre/post-check
   results, execution logs, validation reports.

/* Change-request closure names the payload exactly. One vocabulary. */
const EVIDENCE={backup:"Backup files", checks:"Pre/post-check results",
  logs:"Execution logs", reports:"Validation reports"};

const OPERATORS=["Priya Raghavan","Tom Whitfield","Ana Duarte","Samuel Okonjo",
  "Mei-Ling Chen","Daniel Brannigan","Freya Lindqvist"];
function planOwner(p){
  if(p.createdBy) return p.createdBy;
  let h=0; for(const ch of p.id) h=(h*31+ch.charCodeAt(0))>>>0;
  return OPERATORS[h%OPERATORS.length];
}

const ACTORS={
  op:"Operator", orch:"Model-X orchestrator",
  aap:"The client's platform, via AAP", partner:"The automation partner",
  change:"Change management"
};

const MONTH_N={Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",
  Jul:"07",Aug:"08",Sep:"09",Sept:"09",Oct:"10",Nov:"11",Dec:"12"};
function evDate(r){
  /* "8 Sep" -> 2026-09-08 so a range comparison is a string compare */
  const m=/^(\d{1,2})\s+([A-Za-z]{3,4})/.exec(r.d||"");
  if(!m) return "2026-09-09";                       /* undated events sit at "now" */
  return "2026-"+(MONTH_N[m[2]]||"09")+"-"+m[1].padStart(2,"0");
}

function activityLog(){
  const ev=[], push=(p,o)=>ev.push(Object.assign({plan:p.id,planName:planTitle(p),
    operation:p.operation, by:planOwner(p)},o));
  plansV2.forEach(p=>{
    const c=countsV2(p);
    push(p,{t:"04:12",d:"8 Sep",type:"Plan created",actor:"op",
      detail:plural(p.items.length,"item")+" · "+p.operation});
    if(p.state===PLAN_STATE.DRAFT) return;

    push(p,{t:"09:20",d:"8 Sep",type:"Submitted for validation",actor:"op",detail:p.change||"—"});
    if(p.state===PLAN_STATE.VALIDATING) return;

    if(p.state===PLAN_STATE.VFAILED){
      push(p,{t:"09:21",d:"8 Sep",type:"Validation failed",actor:"orch",
        detail:(p.errors||[]).map(e=>e.name+" · "+e.fails.map(f=>f.label).join(", ")).join(" · ")||"checks failed",
        evidence:[EVIDENCE.reports]});
      return;
    }
    push(p,{t:"09:21",d:"8 Sep",type:"Validation passed",actor:"orch",
      detail:plural(CHECKS.length*p.items.length,"check")+" · all clear",evidence:[EVIDENCE.reports]});

    if(p.mode==="create") push(p,{t:"09:25",d:p.raisedOn||"8 Sep",type:"Change requested",actor:"change",detail:"awaiting approval"});
    if(p.state===PLAN_STATE.AWAITING) return;
    if(p.state===PLAN_STATE.NOTAPPROVED){
      push(p,{t:"14:02",d:"9 Sep",type:"Change rejected",actor:"change",
        detail:p.change+" · plan cannot be re-requested"});
      return;
    }
    if(p.mode==="create") push(p,{t:"11:40",d:"9 Sep",type:"Change approved",actor:"change",detail:p.change});
    push(p,{t:"11:41",d:"9 Sep",type:"Scheduled",actor:"orch",detail:"window "+p.window});
    if(p.state===PLAN_STATE.SCHEDULED) return;

    if(p.state===PLAN_STATE.EXPIRED){
      push(p,{t:"02:00",d:p.window.split(",")[0],type:"Window expired",actor:"orch",
        detail:plural(c.skipped,"item")+" skipped · nothing was attempted"});
      return;
    }
    if(p.state===PLAN_STATE.ACTION){
      push(p,{t:"22:00",d:"—",type:"Execution started",actor:"orch",
        detail:"window opened · plan-level tasks running"});
      push(p,{t:"22:01",d:"—",type:"Plan task failed",actor:"orch",
        detail:p.planTaskFailed||"a plan-level task failed",evidence:[EVIDENCE.logs]});
      return;
    }

    push(p,{t:p.startedAt||"22:04",d:"—",type:"Execution started",actor:"partner",
      detail:p.execRef?"reference "+p.execRef:plural(p.items.length,"item")+" dispatched"});
    p.items.filter(i=>i.state===ITEM_STATE.SUCCEEDED).slice(0,3).forEach(i=>
      push(p,{t:"23:"+(10+p.items.indexOf(i)%40),d:"—",type:"Item succeeded",actor:"partner",
        item:i.name,detail:i.from+" → "+i.to,
        evidence:[EVIDENCE.backup,EVIDENCE.checks,EVIDENCE.logs]}));
    const a=attentionItem(p);
    if(a) push(p,{t:"23:47",d:"—",type:"Task failed",actor:"partner",item:a.name,
      detail:(failedTaskName(a)||"a task")+" · awaiting your decision",
      evidence:[EVIDENCE.backup,EVIDENCE.checks,EVIDENCE.logs]});
    if(p.state===PLAN_STATE.COMPLETED)
      push(p,{t:p.endedAt||"03:12",d:"—",type:"Change closed",actor:"orch",
        detail:p.change+" · artefacts attached",
        evidence:Object.values(EVIDENCE)});
  });
  /* newest first — an audit trail is read from the most recent event back */
  return ev.sort((a,b)=>(evDate(b)+" "+b.t).localeCompare(evDate(a)+" "+a.t));
}

let actQ="", actType="", actPlan="";
function actRows(){
  let rows=activityLog();
  if(actType) rows=rows.filter(r=>r.type===actType);
  if(actPlan) rows=rows.filter(r=>r.plan===actPlan);
  const q=actQ.toLowerCase().trim();
  if(q) rows=rows.filter(r=>[r.plan,r.planName,r.item||"",r.type,r.detail,ACTORS[r.actor]]
    .join(" ").toLowerCase().includes(q));
  return rows;
}

        <span class="home-state"><b>${esc(p.state)}</b><span class="v2sub demand">${esc(qualifier(p))}</span></span>
      </button>`).join("")}
    </div>`:`<div class="home-clear">Nothing is waiting on you.</div>`}
  </section>

  <div class="home-grid">
    <section class="panel">
      <div class="panel-head"><span class="section-label">In flight</span></div>
      <div class="home-facts">
        <div><label>Running</label><b>${running.length}</b></div>
        <div><label>Waiting</label><b>${waiting.length}</b></div>
        <div><label>Finished</label><b>${done.length}</b></div>
      </div>
      ${upcoming?`<div class="home-next">
        <label>Next window</label>
        <button class="item-link" data-homeplan="${esc(upcoming.p.id)}">${esc(planTitle(upcoming.p))}</button>
        <span class="v2sub mono">${esc(upcoming.p.window)}</span></div>`:""}
    </section>

    <section class="panel">
      <div class="panel-head"><span class="section-label">Estate</span>
        <button class="open-link" data-homenav="devices">All devices</button></div>
      <div class="home-facts">
        ${Object.keys(byType).map(t=>`<div><label>${esc(t)}</label><b>${byType[t]}</b></div>`).join("")}
      </div>
    </section>
  </div>

  <section class="panel" style="margin-top:16px">
    <div class="panel-head"><span class="section-label">Recent activity</span>
      <button class="open-link" data-homenav="activity">All activity</button></div>
    <div class="home-list">
      ${log.map(r=>`<button class="home-row home-act" data-homeplan="${esc(r.plan)}">
        <span class="mono act-when">${esc(r.d==="—"?"":r.d+" ")}${esc(r.t)}</span>
        <span class="home-main"><b>${esc(r.type)}</b><span class="v2sub">${esc(r.detail)}</span></span>
        <span class="v2sub mono">${esc(r.plan)}</span>
      </button>`).join("")}
    </div>
  </section>`;

  document.querySelectorAll("[data-homeplan]").forEach(b=>b.addEventListener("click",()=>{
    const p=getPlan(b.dataset.homeplan), at=p&&attentionItem(p);
    if(at) openItem(p.id,at.id); else openPlan(b.dataset.homeplan);
  }));
  document.querySelectorAll("[data-homenav]").forEach(b=>b.addEventListener("click",()=>{
    go(NAV_FRAME[b.dataset.homenav]||{v:"list"});
  }));
  document.getElementById("homeNew").addEventListener("click",openNewPlan);

/* defines exactly what an export contains, so the drawer names the payload
   rather than pretending a file has been produced. */
let expFrom="", expTo="", expOp="", expType="";
function openExport(items,scoped){
  resetDrawerChrome();
  if(scoped){ /* the scope is already fixed: no range to choose */ }
  else { const ds=activityLog().map(evDate).sort();
         if(!expFrom) expFrom=ds[0]; if(!expTo) expTo=ds[ds.length-1]; }
  document.getElementById("drawerTitle").textContent="Export report";
  drawExport(items,scoped);
  showDrawer();
}

function exportSelection(base){
  let rows=base.filter(r=>r.evidence);
  if(expFrom) rows=rows.filter(r=>evDate(r)>=expFrom);
  if(expTo)   rows=rows.filter(r=>evDate(r)<=expTo);
  if(expOp)   rows=rows.filter(r=>r.operation===expOp);
  if(expType) rows=rows.filter(r=>r.type===expType);
  return rows;
}

function drawExport(base,scoped){
  const items=scoped?base:exportSelection(base);
  const files=[...new Set(items.flatMap(i=>i.evidence||[]))];
  const plans=[...new Set(items.map(i=>i.plan))];
  const OPS=[...new Set(activityLog().map(r=>r.operation))].sort();
  const TYPES=[...new Set(activityLog().filter(r=>r.evidence).map(r=>r.type))];
  const onePlan=plans.length===1;
  document.getElementById("drawerSub").textContent=
    plural(items.length,"event")+" · "+(onePlan?plans[0]:plural(plans.length,"plan"));
  document.getElementById("drawerBody").innerHTML=
    `${scoped?"":`
    <div class="dw-g"><span class="lab">Period</span>
      <div class="two">
        <div class="field"><label>From</label><input type="date" id="expFrom" value="${esc(expFrom)}"></div>
        <div class="field"><label>To</label><input type="date" id="expTo" value="${esc(expTo)}"></div>
      </div></div>
    <div class="dw-g"><span class="lab">Filters</span>
      <div class="two">
        <div class="field"><label>Operation type</label>
          <select id="expOp"><option value="">All</option>
            ${OPS.map(o=>`<option value="${esc(o)}" ${expOp===o?"selected":""}>${esc(o)}</option>`).join("")}
          </select></div>
        <div class="field"><label>Event</label>
          <select id="expType"><option value="">All</option>
            ${TYPES.map(t=>`<option value="${esc(t)}" ${expType===t?"selected":""}>${esc(t)}</option>`).join("")}
          </select></div>
      </div></div>`}
     <div class="dw-g"><span class="lab">Contents</span>
       ${files.length?`<ul class="checks">${files.map(f=>`<li class="good">${esc(f)}</li>`).join("")}</ul>`
         :`<div class="wf-none">${scoped?"No evidence has been produced yet.":"Nothing in this range carries evidence."}</div>`}</div>
     <div class="dw-g"><span class="lab">Events</span>
       ${items.length?`<table class="tbl"><tbody>
         ${items.slice(0,12).map(i=>`<tr><td class="mono">${esc(i.d==="—"?"":i.d+" ")}${esc(i.t)}</td>
           ${onePlan?"":`<td class="mono">${esc(i.plan)}</td>`}<td>${esc(i.type)}</td></tr>`).join("")}
         ${items.length>12?`<tr><td colspan="${onePlan?2:3}" class="muted">and ${items.length-12} more</td></tr>`:""}
       </tbody></table>`:`<div class="wf-none">No events selected.</div>`}</div>`;
  document.getElementById("drawerFoot").innerHTML=
    `<span class="msg">${items.length?"Attaches to "+(plans.length===1?"the change record":plural(plans.length,"change record")):""}</span>
     <button class="btn" onclick="closeDrawer()">Cancel</button>
     <button class="btn primary" id="expGo" ${items.length?"":"disabled"}>Export</button>`;
  if(!scoped){
    const bind=(id,set)=>{const el=document.getElementById(id);
      if(el) el.addEventListener("change",()=>{set(el.value);drawExport(base,scoped);});};
    bind("expFrom",v=>expFrom=v); bind("expTo",v=>expTo=v);
    bind("expOp",v=>expOp=v);     bind("expType",v=>expType=v);
  }
  const go=document.getElementById("expGo");
  if(go&&!go.disabled) go.addEventListener("click",()=>{
    closeDrawer(); showToast(plural(files.length,"artefact")+" exported from "+plural(items.length,"event")+".");
  });
}

      <span><span class="dev-v comp ${c.bad?"bad":"ok"}">${esc(c.state)}</span><span class="v2sub">${esc(c.why)}</span></span>
      <span class="mono"><span class="dev-v">${esc(r.region)}</span></span>
      <span class="mono"><span class="dev-v">${esc(r.host)}</span>${r.partner!=="—"?`<span class="v2sub mono">↔ ${esc(r.partner)}</span>`:""}</span>

    const el=document.getElementById(id);
    if(el) el.addEventListener("change",()=>{ set(el.value); renderDevices();
      const f=document.getElementById(id); if(f) f.focus(); });
  });
  const fc=document.getElementById("devFClear");
  if(fc) fc.addEventListener("click",()=>{devType=devOp=devRegion=devComp="";renderDevices();});
  document.querySelectorAll("[data-devrow]").forEach(el=>{
    const open=()=>openDevice(el.dataset.devrow);
    el.addEventListener("click",open);
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } });

  const q=document.getElementById("devQ");

  const cl=document.getElementById("devClear");
  if(cl) cl.addEventListener("click",()=>{ devQ=""; renderDevices(); });

  const f=resolveFrame(hashToFrame(location.hash));
  histWrite(f,frameToHash(f),true);
