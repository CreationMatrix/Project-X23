<style>

:root{

  --ui:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

}
*{box-sizing:border-box}

button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #000;outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:214px minmax(0,1fr)}
.side{border-right:1px solid var(--line);background:#fafafa;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}
.brand{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px}
.mark{width:16px;height:16px;border:1.5px solid #000;border-radius:2px;position:relative}.mark:after{content:"";position:absolute;inset:3px;background:#000}
.brand b{font-size:16px}.nav{padding:12px 8px;display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{border:1px solid transparent;background:none;text-align:left;padding:8px 12px;border-radius:3px;font-size:14px}.nav button:hover{background:#f1f1f1}.nav button.active{background:#000;color:#fff}
.nav-count{float:right;border:1px solid currentColor;border-radius:12px;padding:0 8px;font:12px var(--data);opacity:.85}
.sep{border-top:1px solid var(--line2);margin:12px 12px 8px}.label{padding:0 12px 8px;color:var(--ink4);font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.foot{border-top:1px solid var(--line);padding:12px 16px;color:var(--ink4);font-size:12px}
.main{min-width:0}.top{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;background:#fff;z-index:10}
.crumb{font-size:12px;color:var(--ink3)}.crumb b{color:#000}.crumb span{color:var(--ink4);padding:0 8px}
.crumb-link{background:none;border:0;padding:0;font:inherit;color:var(--ink3);cursor:pointer;text-decoration:none}
.crumb-link:hover{color:#000;text-decoration:underline}
.crumb-link:focus-visible{outline:2px solid #000;outline-offset:2px}
.wrap{padding:28px 32px 72px;max-width:1420px}
.page-head{display:flex;align-items:flex-start;gap:20px;margin-bottom:20px}.page-head .right{margin-left:auto;display:flex;gap:8px}
h1{font-size:26px;letter-spacing:-.035em;line-height:1.2;margin:0;font-weight:700}.sub{font-size:12px;color:var(--ink3)}
.btn{height:32px;border:1px solid var(--control-line);background:#fff;border-radius:3px;padding:0 12px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{background:#f7f7f7;border-color:#999}.btn.primary{background:#000;color:#fff;border-color:#000}.btn.small{height:28px;padding:0 12px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:0}.tabs button{border:0;background:none;padding:12px 16px 8px;font-size:12px;border-bottom:2px solid transparent}.tabs button.active{border-bottom-color:#000;font-weight:700}
.attention{border:2px solid #000;padding:12px 12px;margin:0 0 12px;font-size:12px}.attention b{font-weight:700}
.list-shell{border:1px solid var(--line);background:#fff}
.table-head,.plan-row,.item-row{display:grid;grid-template-columns:minmax(360px,2.2fr) 130px 135px 160px 155px 120px;align-items:center}
.table-head{min-height:38px;background:#fafafa;border-bottom:1px solid var(--line);padding:0 16px;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:650}
.plan-row{min-height:66px;padding:0 16px;border-bottom:1px solid var(--line2);gap:12px}
.plan-row:last-child{border-bottom:0}
.plan-main{display:flex;align-items:flex-start;gap:8px;min-width:0}.expand{width:19px;height:19px;min-width:19px;padding:0;border:1px solid var(--control-line);background:#fff;border-radius:2px;line-height:15px;font-family:var(--data);font-size:12px}.expand:hover{border-color:#000}
.plan-name{font-weight:700;font-size:13px}.plan-id{font:12px var(--data);color:var(--ink3);margin-top:4px}.desc{font-size:12px;color:var(--ink3);font-weight:400}
.cell{min-width:0;font-size:12px}.mono{font-family:var(--data)}.state{display:inline-flex;align-items:center;gap:8px;font-size:12px}.dot{width:8px;height:8px;border:1px solid #000;border-radius:50%;display:inline-block}.dot.fill{background:#000}.dot.half{background:linear-gradient(90deg,#000 50%,#fff 50%)}.dot.fail{border-radius:2px;transform:rotate(45deg)}
.open-link{font-size:12px;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
.plan-expanded{display:none;border-bottom:1px solid var(--line);background:#fcfcfc;padding:0 16px 8px 44px}.plan-expanded.open{display:block}
.item-row{grid-template-columns:minmax(300px,2.2fr) 130px 175px 150px 120px;padding:0 0;min-height:58px;border-top:1px solid var(--line2)}
.item-target{font-size:12px}.item-kind{font-size:12px;color:var(--ink3);margin-top:4px}.item-stage{font-size:12px;color:var(--ink2)}.item-state{font-size:12px}
.plan-summary{display:flex;gap:20px;align-items:center;padding:8px 0 4px;color:var(--ink3);font-size:12px}.plan-summary strong{color:#000}
.progress{height:4px;background:#e9e9e9;margin-top:4px;max-width:210px}.progress span{display:block;height:100%;background:#000}
.detail-header{border:1px solid #000;padding:16px 16px;margin-bottom:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px}
.detail-title-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.detail-title-row h1{font-size:23px}.chip{border:1px solid var(--line);padding:4px 8px;border-radius:12px;font-size:12px}
.version{font:12px var(--data);margin-top:4px}.detail-status{padding-top:0px}.pill{border:1px solid var(--line);border-radius:18px;padding:4px 8px;font:12px var(--data)}.pill.dark{background:#000;color:#fff;border-color:#000}
.context{grid-column:1/-1;border-top:1px solid var(--line2);padding-top:12px;display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap}.meta{display:flex;gap:28px;flex-wrap:wrap}.meta label,.window-head label{display:block;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}.meta b{font:12px var(--data);font-weight:500}.window{margin-left:auto;min-width:330px}.window-head{display:flex;justify-content:space-between;gap:12px}.window-head b{font:12px var(--data);font-weight:500}.track{height:5px;border:1px solid #000;background:#fff;margin-top:8px}.track span{display:block;height:100%;background:#000}
.item-nav{border:1px solid var(--line);background:#fff;position:sticky;top:66px;max-height:calc(100vh - 90px);overflow:auto}.item-nav-head{padding:12px 12px;border-bottom:1px solid var(--line2);display:flex;align-items:center}.item-nav-head b{font-size:12px}.item-nav-head span{margin-left:auto;font:12px var(--data);color:var(--ink3)}.item-nav-section{padding:8px 8px 4px;color:var(--ink4);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.item-nav-btn{display:block;width:100%;border:0;border-left:3px solid transparent;background:#fff;text-align:left;padding:8px 12px 8px 8px}.item-nav-btn:hover{background:#fafafa}.item-nav-btn.selected{background:#f3f3f3;border-left-color:#000}.item-nav-name{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650}.item-nav-meta{padding-left:16px;margin-top:4px;color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-nav-state{padding-left:16px;margin-top:4px;font:12px var(--data);color:var(--ink3)}.item-nav-state.attn{color:#000;font-weight:700}.item-main{min-width:0}.item-switch{display:flex;align-items:center;gap:8px;margin-bottom:8px}.item-switch .position{font:12px var(--data);color:var(--ink3);margin-left:auto}.item-switch .btn[disabled]{opacity:.35;cursor:default}.item-plan-context{border:1px solid var(--line);background:#fafafa;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:16px;font-size:12px}.item-plan-context b{font-weight:650}.item-plan-context .mono{font-size:12px}.item-plan-context .context-spacer{margin-left:auto;color:var(--ink3)}
.plan-detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}.panel{border:1px solid var(--line);background:#fff}.panel-head{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:12px}.section-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:700}.muted{margin-left:auto;color:var(--ink3);font-size:12px}
.plan-stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line2)}.stat{padding:12px 12px;border-right:1px solid var(--line2)}.stat:last-child{border-right:0}.stat label{display:block;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.stat b{display:block;font:16px var(--data);margin-top:4px;font-weight:500}
.exec-table{width:100%;border-collapse:collapse}.exec-table th{text-align:left;padding:8px 12px;border-bottom:1px solid #000;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.exec-table td{padding:12px 12px;border-bottom:1px solid var(--line2);font-size:12px;vertical-align:middle}.exec-table tr:last-child td{border-bottom:0}.exec-table tr:hover td{background:#fafafa}
.stagebar{display:flex;gap:4px;min-width:150px}.stage-seg{height:5px;flex:1;background:#e8e8e8}.stage-seg.done{background:#000}.stage-seg.active{border:1px solid #000;background:#fff}.stage-seg.fail{background:#fff;border:1px solid #000;position:relative}.stage-seg.fail:after{content:"";position:absolute;left:1px;right:1px;top:1px;bottom:1px;background:#000;clip-path:polygon(0 0,100% 100%,0 100%,100% 0)}
.attention-tag{border:1px solid #000;padding:4px 8px;font:12px var(--data);display:inline-block}.item-link{background:none;border:0;padding:0;text-align:left;text-decoration:underline;font-weight:650;font-size:12px}
.side-summary{padding:16px}.side-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12px}.side-row:last-child{border-bottom:0}.side-row span:first-child{color:var(--ink3)}
.side-note{margin:12px 0 0;padding:12px;border-left:2px solid #000;background:#fafafa;font-size:12px}
.flow-card{border:1px solid var(--line);background:#fff}.flow-head{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center}.flow-summary{padding:12px 16px;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--line2)}
.flow{padding:12px 16px 16px}.stage{border:1px solid var(--line);margin-bottom:8px}.stage:last-child{margin-bottom:0}.stage.current,.stage.failed{border-color:#000}.stage-head{min-height:62px;padding:12px 12px;display:grid;grid-template-columns:34px minmax(0,1fr) auto 20px;gap:12px;align-items:center;background:#fff;border:0;width:100%;text-align:left}.stage.current .stage-head,.stage.failed .stage-head{background:#fafafa}.stage-icon{width:27px;height:27px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font:12px var(--data)}.stage.done .stage-icon{background:#000;color:#fff;border-color:#000}.stage.current .stage-icon,.stage.failed .stage-icon{border:2px solid #000}.stage-title{font-size:13px;font-weight:700}.stage-meta{font-size:12px;color:var(--ink3);margin-top:4px}.stage-state{font:12px var(--data);border:1px solid var(--line);padding:4px 8px;border-radius:12px}.stage-state.dark{background:#000;color:#fff;border-color:#000}.chev{font-size:13px;color:var(--ink3);transition:.15s transform}.stage.open .chev{transform:rotate(180deg)}.stage-body{display:none;border-top:1px solid var(--line2);padding:8px 12px 12px}.stage.open .stage-body{display:block}
.milestone{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:44px;padding:8px 4px;border-bottom:1px solid var(--line2);font-size:12px;cursor:pointer}.milestone:last-child{border-bottom:0}.milestone:hover{background:#fafafa}.mini{width:9px;height:9px;border:1px solid #000;border-radius:50%}.mini.done{background:#000}.mini.fail{border-radius:2px;transform:rotate(45deg)}.mini.active{border:2px solid #000}.milestone-name{font-weight:550}.milestone-desc{font-size:12px;color:var(--ink3);margin-top:0px}.milestone-time{font:12px var(--data);color:var(--ink3)}
/* the recovery bar inside a stopped stage — not the same thing as a button
   group in a panel header, which is what .actions means everywhere else */
.stage-actions{margin:8px 0 4px 28px;padding:12px 0 4px;border-top:1px solid #000;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.action-copy{margin-right:auto}.action-title{font-size:12px;font-weight:700}.action-copy .sub{font-size:12px}
.activity{width:100%;border-collapse:collapse;font-size:12px}.activity th{text-align:left;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:1px solid #000}.activity td{padding:8px 12px;border-bottom:1px solid var(--line2)}.activity tr:last-child td{border-bottom:0}
.drawer-kv{display:grid;grid-template-columns:110px 1fr;border-top:1px solid var(--line2)}.drawer-kv div{padding:8px 0;border-bottom:1px solid var(--line2);font-size:12px}.drawer-kv div:nth-child(odd){color:var(--ink3)}

@media(max-width:1050px){.table-head,.plan-row{grid-template-columns:minmax(300px,2fr) 100px 110px 130px 120px 95px}.plan-detail-grid{grid-template-columns:1fr}.side-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:0 20px}.window{margin-left:0;width:100%}}
@media(max-width:780px){.app{grid-template-columns:64px 1fr}.brand b,.nav button:not(.active) span,.label,.foot{display:none}.nav button{padding:8px 8px}.wrap{padding:20px 16px}.top{padding:0 16px}.page-head{display:block}.page-head .right{margin-top:12px}.table-head{display:none}.plan-row{grid-template-columns:1fr auto;gap:8px;padding:12px}.plan-row>.cell:not(:first-of-type){display:none}.plan-expanded{padding:0 12px 8px}.item-row{grid-template-columns:1fr auto;gap:4px;padding:8px 0}.item-row>.cell:nth-child(n+3){display:none}.detail-header{grid-template-columns:1fr}.detail-status{grid-column:1}.context{display:block}.window{margin-top:12px;min-width:0}.plan-stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line2)}}

.lifecycle-note{border-top:1px solid var(--line2);padding:12px 16px;font-size:12px;color:var(--ink3)}
.lifecycle-note b{color:#000}
.attention-inline{display:inline-flex;align-items:center;gap:8px;font:12px var(--data);border:1px solid #000;padding:4px 8px}
@media(max-width:1050px){.item-workspace{grid-template-columns:220px minmax(0,1fr)}.item-plan-context .context-spacer{display:none}}
@media(max-width:780px){.app{grid-template-columns:1fr}.side{display:none}.wrap{padding:20px 16px 52px}.item-workspace{grid-template-columns:1fr}.item-nav{max-height:none}.item-nav-section{display:none}.item-nav-btn{display:none}.item-nav-btn.selected{display:block}.item-nav-head{border-bottom:0}.item-nav:has(.selected){min-height:44px}.item-nav:has(.selected) .item-nav-head{display:flex}.item-main{min-width:0}.item-plan-context{flex-wrap:wrap}.detail-header{grid-template-columns:1fr}.window{margin-left:0;min-width:0;width:100%}}

.impact-tbl{table-layout:fixed}
.impact-tbl th,.impact-tbl td{text-align:left;padding:10px 14px}
.impact-tbl th:first-child,.impact-tbl td:first-child{width:26%}
.impact-tbl th:nth-child(2),.impact-tbl td:nth-child(2){width:24%}
.tbl.vcheck th,.tbl.vcheck td{text-align:left;vertical-align:top}
.tbl.vcheck td:first-child{font-family:var(--data);white-space:nowrap;padding-right:18px}
.tbl.vcheck td:nth-child(2){width:150px}

.v2controls{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin:0 0 10px}
/* flex:0 0 auto made this a 706px block that would neither shrink nor wrap,
   so the four filters — not the table — pushed Devices past the viewport
   below 1000px. It already wraps; it just was not allowed to. */
.v2facets{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0;flex:1 1 auto;min-width:0}
.v2facet{display:flex;align-items:center;gap:6px;font:11px var(--data);
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink4)}
.v2facet select{font:12px var(--data);padding:5px 8px;border:1px solid var(--control-line);
  background:#fff;color:var(--ink);text-transform:none;letter-spacing:0}
.v2facet select:focus-visible{outline:2px solid #000;outline-offset:1px}

.exec-table tr.row-fail td{background:#fcfafa}
.fail-state{display:block;font-size:13px}
.checks-row td{padding:0 14px 12px 14px;background:#fcfafa;border-top:0}
ul.checks{margin:0;padding:0;list-style:none}
ul.checks li{font-size:12px;line-height:1.6;color:var(--ink3);padding-left:18px;position:relative}
ul.checks li.bad{color:var(--ink)}
ul.checks li.bad b{font-weight:600}
ul.checks li.bad:before{content:"\2715";position:absolute;left:0}
ul.checks li.good:before{content:"\2713";position:absolute;left:0;color:var(--ink4)}

.dev-row[role="button"]{cursor:pointer}
.dev-row:focus-visible{outline:2px solid #000;outline-offset:-2px}
.tbl.devprops td{vertical-align:top;padding:10px 14px}
.tenants-tbl{table-layout:fixed}
.tenants-tbl th,.tenants-tbl td{text-align:left;padding:10px 14px}
.tenants-tbl th:first-child,.tenants-tbl td:first-child{width:34%}
.tenants-tbl th:nth-child(2),.tenants-tbl td:nth-child(2){width:26%}
.tbl.devprops td.pk{width:220px;font:12px var(--data);color:var(--ink3);white-space:nowrap}
.tbl.devprops td.pv b{font-size:13px}
.unheld{font-size:13px;color:var(--ink4)}
.pd{display:block;font-size:11px;color:var(--ink4);margin-top:2px}
.home-needs{margin-bottom:16px}
.home-list{display:flex;flex-direction:column}
.home-row{display:grid;grid-template-columns:26px minmax(160px,1fr) minmax(180px,1fr);
  gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line2);padding:12px 16px;cursor:pointer;font:inherit}
.home-row:last-child{border-bottom:0}
.home-row:hover{background:#fafafa}
.home-row:focus-visible{outline:2px solid #000;outline-offset:-2px}
.home-row b{display:block;font-size:13px;font-weight:600}
.home-main,.home-state{min-width:0;display:flex;flex-direction:column}
.home-act{grid-template-columns:110px minmax(200px,1fr) 90px}
.home-clear{padding:16px;font-size:13px;color:var(--ink3)}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.home-facts{display:flex;gap:32px;padding:16px;flex-wrap:wrap}
.home-facts label{display:block;font:11px var(--data);letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink4);margin-bottom:4px}
.home-facts b{font-size:20px;font-weight:600}
.home-next{padding:0 16px 16px;border-top:1px solid var(--line2);padding-top:14px;margin-top:2px}
.home-next label{display:block;font:11px var(--data);letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink4);margin-bottom:4px}
@media(max-width:900px){.home-grid{grid-template-columns:1fr}
  .home-row{grid-template-columns:22px 1fr}
  .home-row>span:nth-child(3){display:none}}

.act-head,.act-row{display:grid;
  grid-template-columns:110px minmax(140px,1fr) 130px minmax(200px,1.6fr) 150px 70px;
  gap:14px;align-items:center;padding:10px 14px}
.act-head{font:11px var(--data);letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);
  border-bottom:1px solid var(--line);background:#fafafa}
.act-row{border-bottom:1px solid var(--line2);font-size:13px}
.act-row:last-child{border-bottom:0}
.act-row:hover{background:#fafafa}
.act-row>span{display:flex;flex-direction:column;justify-content:center;min-width:0}
.act-when{color:var(--ink3);font-size:12px}
.act-row b{font-size:13px;font-weight:600}
@media(max-width:900px){.act-head{display:none}
  .act-row{grid-template-columns:1fr auto;gap:6px}
  .act-row>span:nth-child(n+3):nth-child(-n+5){display:none}}

/* Sized so the full seven columns fit a 1130px viewport beside the 214px nav
   without the HA-partner column being clipped. Below that the container's own
   horizontal scroll takes over rather than the page's. */
.dev-head,.dev-row{display:grid;
  grid-template-columns:minmax(142px,1.1fr) 108px 64px 70px minmax(136px,1fr) 58px minmax(140px,1fr);
  gap:12px;align-items:start;padding:13px 14px}
/* every cell starts at the top, so the first line of each column sits on one
   line whether or not the cell has a second line beneath it */
.dev-row>span{display:flex;flex-direction:column;justify-content:flex-start;min-width:0}
.dev-row{min-height:58px;line-height:1.35}
.dev-v{display:block;line-height:18px;font-size:13px}
.dev-row .mono .dev-v{font-size:12.5px}
.dev-name{font-weight:600}
.dev-head span,.dev-sort{white-space:nowrap}
.dev-head{padding:0}
.dev-sort{display:flex;align-items:center;gap:4px;width:100%;background:none;border:0;
  padding:11px 0;font:11px var(--data);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink4);cursor:pointer;text-align:left}
.dev-sort:hover{color:var(--ink)}
.dev-sort.on{color:#000;font-weight:600}
.dev-sort:focus-visible{outline:2px solid #000;outline-offset:-2px}
.dev-arrow{font-size:10px}
.comp{display:block;font-size:12.5px;font-weight:600}
.comp.bad{color:#000}
.comp.ok{color:var(--ink2);font-weight:500}
.dev-head{font:11px var(--data);letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);
  border-bottom:1px solid var(--line);background:#fafafa}
.dev-row{border-bottom:1px solid var(--line2);font-size:13px}
.dev-row:last-child{border-bottom:0}
.dev-row:hover{background:#fafafa}
.dev-name{font-weight:600}
.dev-row .v2sub{margin-top:2px;line-height:15px}
@media(max-width:900px){.dev-head{display:none}
  .dev-row{grid-template-columns:1fr auto;gap:6px}
  .dev-row>span:nth-child(n+3){display:none}}

/* ---- item workspace: every item in the plan stays visible ---- */
.item-workspace{display:grid;grid-template-columns:264px minmax(0,1fr);gap:16px;align-items:start}
.rail-main{min-width:0}
.rail{border:1px solid var(--line);background:#fff;position:sticky;top:66px;
  max-height:calc(100vh - 90px);overflow:auto}
.rail-head{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line2);padding:12px;cursor:pointer;font:inherit}
.rail-head b{display:block;font-size:12.5px}
.rail-head span{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.rail-head:hover{background:#fafafa}
.rail-group{padding:10px 12px 4px;color:var(--ink4);font:11px var(--data);
  letter-spacing:.08em;text-transform:uppercase}
.rail-item{display:flex;gap:8px;width:100%;text-align:left;background:none;
  border:0;border-left:3px solid transparent;padding:8px 12px 8px 9px;cursor:pointer;font:inherit}
.rail-item:hover{background:#fafafa}
.rail-item.on{background:#f3f3f3;border-left-color:#000}
.rail-item:focus-visible{outline:2px solid #000;outline-offset:-2px}
.rail-dot{width:7px;height:7px;border:1px solid var(--ink3);border-radius:50%;margin-top:5px;flex:0 0 auto}
.rail-dot.ran{background:var(--ink3)}
.rail-body{min-width:0}
.rail-body b{display:block;font-size:12.5px}
.rail-meta,.rail-state{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.rail-item.on .rail-state{color:var(--ink2)}
@media(max-width:900px){
  .item-workspace{grid-template-columns:1fr}
  .rail{position:static;max-height:220px}
}

/* ---- workflow execution ---- */
.wf{padding:14px 16px 16px}
.wf-phase{margin-bottom:18px}
.wf-phase:last-child{margin-bottom:0}
.wf-phase-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:0 0 8px;border-bottom:1px solid var(--line2);margin-bottom:8px}
.wf-phase-head b{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.wf-phase-head span{font-size:11px;color:var(--ink4)}
.wf-task{border:1px solid var(--line);margin-bottom:6px}
.wf-task:last-child{margin-bottom:0}
.wf-task.current{border-color:#000}
.wf-task.failed{border-color:#000;border-width:2px}
.wf-task.halted .wf-state{color:var(--ink2)}.wf-task.halted .wf-name{color:var(--ink2)}
.wf-task.failed .wf-state{color:#000;font-weight:600}
.wf-fail{margin-top:10px;font-size:12.5px;color:var(--ink)}
.wf-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.wf-head{display:grid;grid-template-columns:44px 1fr auto 18px;gap:12px;align-items:center;
  width:100%;padding:10px 12px;background:none;border:0;text-align:left;cursor:pointer;font:inherit}
.wf-head:focus-visible{outline:2px solid #000;outline-offset:-2px}
.wf-n{font-size:11px;color:var(--ink4)}
.wf-name{font-size:13px;font-weight:600}
.wf-task.todo .wf-name{font-weight:400;color:var(--ink3)}
.wf-state{font-size:10px;letter-spacing:.08em;color:var(--ink4)}
.wf-task.done .wf-state{color:var(--ink2)}
.wf-task.current .wf-state{color:#000}
.wf-task .chev{font-size:12px;color:var(--ink4);transition:transform .12s}
.wf-task.open .chev{transform:rotate(180deg)}
.wf-body{display:none;padding:0 12px 12px 68px;border-top:1px solid var(--line2)}
.wf-task.open .wf-body{display:block}
.ms-list{margin:10px 0 0;padding:0;list-style:none;position:relative}
.ms-list:before{content:"";position:absolute;left:7px;top:12px;bottom:12px;
  width:1px;background:var(--line)}
.ms{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:baseline;
  padding:5px 0;position:relative}
.ms-mark{width:15px;height:15px;border:1px solid var(--line2);border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:9px;line-height:1;color:var(--ink3);position:relative;z-index:1;align-self:center}
.ms.succeeded .ms-mark{border-color:var(--ink3);color:var(--ink2)}
.ms.running .ms-mark{border-color:#000;color:#000;border-width:2px}
.ms.failed .ms-mark{border-color:#000;background:#000;color:#fff;border-width:1px}
.ms-name{font-size:12.5px;line-height:1.5;color:var(--ink2)}
.ms.running .ms-name,.ms.failed .ms-name{color:var(--ink);font-weight:600}
.ms.not-started .ms-name{color:var(--ink4)}
.ms.cancelled .ms-mark{border-color:var(--ink3);color:var(--ink3)}
.ms-state{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink4);white-space:nowrap}
.ms.running .ms-state,.ms.failed .ms-state{color:#000;font-weight:600}
.wf-none{margin-top:10px;font-size:12px;color:var(--ink4)}
.wf-pb{margin-top:10px;font-size:11px;color:var(--ink4)}
@media(prefers-reduced-motion:reduce){.wf-task .chev{transition:none}}

/* ---- listing ---- */
.v2search{display:flex;gap:8px;margin:0;flex:1 1 300px;min-width:220px}
.v2search input{flex:1;font:12px var(--data);padding:9px 12px;border:1px solid var(--control-line);background:#fff;color:var(--ink)}
.v2search input:focus{outline:2px solid #000;outline-offset:-1px}
.v2segs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.v2seg-btn{font:12px var(--data);padding:7px 12px;border:1px solid var(--line);background:#fff;color:var(--ink3);cursor:pointer}
.v2seg-btn .mono{color:var(--ink4);margin-left:4px}
.v2seg-btn.on{background:#000;color:#fff;border-color:#000}
.v2seg-btn.on .mono{color:#fff}
.v2seg-btn:focus-visible{outline:2px solid #000;outline-offset:2px}
.v2live{font:11px var(--data);color:var(--ink3);min-height:16px;margin-bottom:6px}
/* A wide operations table scrolls inside its own box. The page body never
   scrolls sideways — at 880-1130px the device table used to push the whole
   document 33-72px wide and clip the HA-partner column against the viewport. */
.v2table{border:1px solid var(--line);overflow-x:auto;
  /* a shadow on the right edge only while there is more table to reach */
  background:linear-gradient(90deg,#fff 30%,rgba(255,255,255,0)) left/40px 100% no-repeat,
             linear-gradient(90deg,rgba(255,255,255,0),#fff 70%) right/40px 100% no-repeat,
             radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.14),transparent) left/12px 100% no-repeat,
             radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.14),transparent) right/12px 100% no-repeat;
  background-attachment:local,local,scroll,scroll}
/* Only while the full column set is being drawn. Below 900px the rows collapse
   to two columns by design, and a floor there would reintroduce the very
   overflow this removes. */
@media(min-width:901px){
  .v2table > .v2head,.v2table > .v2row{min-width:760px}
  .v2table > .dev-head,.v2table > .dev-row{min-width:790px}
  .v2table > .act-head,.v2table > .act-row{min-width:860px}
}
.v2head,.v2row{display:grid;grid-template-columns:26px minmax(180px,2fr) 76px 92px 150px 104px minmax(150px,1.3fr);
  gap:14px;align-items:center;padding:11px 14px}
.v2head{font:11px var(--data);letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);
  border-bottom:1px solid var(--line);background:#fafafa}
.v2row{border-bottom:1px solid var(--line2);text-decoration:none;color:var(--ink)}
.v2row:last-child{border-bottom:0}
.v2row:hover{background:#fafafa}
.v2row:focus-visible{outline:2px solid #000;outline-offset:-2px}
.v2dispo{font-size:13px;line-height:1;text-align:center}
.v2dispo.needs{color:#000}.v2dispo.running{color:#5d5d5d}.v2dispo.waiting{color:#737373}.v2dispo.done{color:#737373}
.v2dispo.good{color:var(--ink3)}
.v2dispo.partial{color:#000}
.v2dispo.bad{color:#000;font-weight:700}
.v2dispo.none{color:var(--ink4)}
.v2name b,.v2state b{display:block;font-size:13px;font-weight:600}
.v2row.is-qs .v2name b{font-family:var(--data);font-weight:500;font-size:12.5px}
.qs-tag{display:inline-block;font:9px var(--data);letter-spacing:.09em;line-height:14px;
  text-transform:uppercase;border:1px solid var(--line2);color:var(--ink3);
  padding:0 4px;margin-right:6px;vertical-align:1px}
.v2sub{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.v2sub.demand{color:var(--ink);font-weight:600}
.v2op,.v2chg,.v2win{font-size:12px;color:var(--ink2)}
.v2bar{display:flex;gap:2px}
.v2seg{height:4px;width:14px;background:var(--line);display:block}
.v2seg.on{background:#000}
@media(max-width:900px){.v2head{display:none}
  .v2row{grid-template-columns:22px 1fr auto;gap:8px}
  .v2row>.v2op,.v2row>.v2chg,.v2row>.v2win,.v2row>.v2prog{display:none}}

/* ---- authoring, on this file's tokens ---- */
.notice{border-left:3px solid #111;background:#fafafa;padding:12px 16px;font-size:12px;line-height:18px;margin-bottom:16px}
.item-table{width:100%;border-collapse:collapse}

.item-table th{color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.item-table tr:last-child td{border-bottom:0}
.choice{display:flex;gap:12px;border:1px solid var(--line);padding:16px;margin-bottom:8px;border-radius:3px}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:60;padding:40px 20px;overflow:auto}

.items-panel .panel-head{display:flex;align-items:center}

.page{max-width:1420px}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}

.pt.failed .pt-state{color:#111;font-weight:700}
.pt.not-started{opacity:.55}
.pt-gap{display:flex;align-items:center;gap:12px;padding:4px 16px 4px 44px}

.notice.bad{border-left-color:#111;background:#f4f4f4}
.optional{font-weight:400;color:var(--ink3);text-transform:none;letter-spacing:0}
/* The impact acknowledgement. It is a gate, so it reads as a statement the
   operator is making, not as a preference. */
.ack{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;
  border:1px solid var(--ink);background:var(--surface2);font-size:12px;line-height:18px;cursor:pointer}
.ack input{margin:1px 0 0;width:15px;height:15px;flex:0 0 auto;accent-color:#000}
.ack:focus-within{outline:2px solid #000;outline-offset:2px}

/* ---- maintenance window ---- */
/* The countdown is the only number on the screen that moves on its own, so it
   is the only one drawn in the data face at full weight. */
.win-box{min-width:330px}
.win-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.win-row label{display:block;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.win-left{font:12px var(--data);font-weight:600}
.win-left.low{font-weight:700}
.win-left.gone{font-weight:700}
.win-note{display:block;color:var(--ink3);font-size:12px;line-height:18px;margin-top:6px}
.win-note.low,.win-note.gone{color:#111}
.track{height:5px;border:1px solid #000;background:#fff;margin-top:8px}
.track span{display:block;height:100%;background:#000}
.track.gone span{background:repeating-linear-gradient(90deg,#000 0 3px,#fff 3px 6px)}

/* ---- action required: the consequence of waiting ---- */
.wf-wait{border:1px solid var(--line);background:#fafafa;padding:10px 12px;margin-top:10px;font-size:12px;line-height:18px}
.wf-wait b{font-weight:650}

.esc{border-left:3px solid #111;background:#f4f4f4;padding:12px 16px;font-size:12px;line-height:18px;margin-top:10px}

/* ============================================================================
   MERGED BUILD — authoring and execution in one file.

   Two prototypes were merged here. The authoring flow (list → new plan →
   workspace → add item → submit, plus quick submit) came from one; the
   execution surface (plan execution with per-item stage bars, and the item
   view with its persistent navigator) came from the other. They had separate
   plans lists, separate data and separate CSS tokens; there is now one of
   each.

   The join is the plans list. A Plan opens to whichever view its state calls
   for — the workspace while it is a Draft, the execution view once it is not.
   ============================================================================ */

/* every plan carries a window as a pair, so the execution view can show a
   range and the authoring form can edit both ends */
function normalisePlan(p){
  if(!p.windowStart){ p.windowStart = p.window || ""; }
  /* the execution views read p.window; the authoring form writes the pair.
     Keep the single field in step with the pair rather than having two. */
  Object.defineProperty(p, "window", {
    get(){ return this.windowStart || ""; },
    set(v){ this.windowStart = v; },
    configurable:true
  });
  if(!p.windowEnd){
    const m = /^(\d+)\s+(\w+),\s*(\d+):(\d+)$/.exec(p.windowStart||"");
    p.windowEnd = m ? (Number(m[1])+1)+" "+m[2]+", 02:00" : "";
  }
  if(!p.mode) p.mode = p.change && p.change!=="—" ? "byoc" : "create";
  p.items.forEach(i=>{
    if(!i.journey) i.journey = i.kind==="Virtual tenant" ? "virtual" : "rseries";
  });
}

function setNav(){

                : view==="activity" ? "activity" : "plans";
  document.querySelectorAll("[data-nav]").forEach(b=>{
    const on = b.dataset.nav===section;
    b.classList.toggle("active",on);
    if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });

  const a=document.querySelector('[data-nav="activity"] .nav-count');

}

  if(editing===selectedPlan && p && canEdit(p)) return renderWorkspace();
  return (p && p.state===PLAN_STATE.DRAFT) ? renderWorkspace() : renderPlanV2();

/* ---------- execution surface ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

/* The marks read against ITEM_STATE, which is the only item vocabulary in this
   file. The merged build's dots were still matching "Running" and "Waiting for
   action" — names nothing produces — so every item drew a blank dot. */
function dotClass(s){
 if(s===ITEM_STATE.INPROGRESS||s===ITEM_STATE.ROLLINGBACK) return "half";
 if(s===ITEM_STATE.SUCCEEDED||s===ITEM_STATE.ROLLEDBACK)   return "fill";
 if(s===ITEM_STATE.ACTION||s===ITEM_STATE.FAILED||s===ITEM_STATE.ROLLBACKFAILED) return "fail";
 return "";
}

function stateHTML(s){
 return `<span class="state"><i class="dot ${dotClass(s)}"></i>${esc(s)}</span>`;
}

function announce(msg){
  const el=document.getElementById("srStatus"); if(!el) return;
  /* re-setting identical text does not re-announce, so clear first */
  el.textContent=""; setTimeout(()=>{ el.textContent=msg; },50);
}

      {key:"tenant", label:d=>d.deviceType==="rseries"?"Tenant on that device":"Tenant",
       placeholder:"Select a tenant",
       when:d=>d.deviceType==="virtual"||(d.deviceType==="rseries"&&!!d.device),
       options:d=>(d.deviceType==="rseries"?(TENANTS_BY_DEVICE[d.device]||[]):VIRTUAL_TENANTS)
                   .map(t=>({v:t.id,t:t.id+" — "+t.v}))},
      {key:"version", label:"Target version", placeholder:"Select a version",
       when:d=>!!d.tenant, kind:"version",
       options:()=>TMOS_VERSIONS.filter(isTarget).map(x=>({v:x.v,
         t:x.v+(x.approved&&x.latest?"  ·  recommended (approved, latest)":x.approved?"  ·  approved":"  ·  not approved")}))}
    ]
  },
  /* Rollback is a property of the operation type, not the device. Types that
     cannot be rolled back declare rollback:false and the action is never
     offered for them — adding such a type is a data entry, nothing more. */
  F5OS:{
    label:"F5OS", rollback:true,
    fields:[
      {key:"peer1", label:"Peer 1", placeholder:"Select a host",
       options:()=>RSERIES_DEVICES.map(x=>({v:x.id,t:x.label}))},
      {key:"peer2", label:"Peer 2", placeholder:"Select a host",
       when:d=>!!d.peer1,
       options:d=>RSERIES_DEVICES.filter(x=>x.id!==d.peer1).map(x=>({v:x.id,t:x.label}))},
      {key:"version", label:"Target version", placeholder:"Select a version",
       when:d=>!!d.peer2, kind:"version",
       options:()=>F5OS_VERSIONS.filter(isTarget).map(x=>({v:x.v,
         t:x.v+(x.approved?"":"  ·  not approved")+(x.latest?"  ·  latest":"")}))}
    ]
  }
};
const opFields=op=>(OPERATIONS[op]||{}).fields||[];
const recommendedVersion=(op)=>((op==="F5OS"?F5OS_VERSIONS:TMOS_VERSIONS).find(v=>v.approved&&v.latest)||{}).v||"";

/* which fields are visible for the answers so far */
function visibleFields(draft){
  return opFields(draft.op).filter(f=>!f.when||f.when(draft));
}
/* an upstream change clears everything downstream, and any impact result */
function setField(draft,key,value){
  const fs=opFields(draft.op), i=fs.findIndex(f=>f.key===key);
  draft[key]=value;
  fs.slice(i+1).forEach(f=>{ draft[f.key]=""; });
  draft.impact=null; draft.impactAck=false;
}
function setOperation(draft,op){
  draft.op=op;
  opFields(op).forEach(f=>{ draft[f.key]=""; });
  Object.keys(draft).forEach(k=>{ if(!["op","impact","impactAck","change","crno","winStart","winEnd"].includes(k)
     && !opFields(op).some(f=>f.key===k)) delete draft[k]; });
  draft.impact=null; draft.impactAck=false;
}

/* impact includes the pair and the tenants it carries, with reasons */
function computeImpact(draft){
  if(draft.op==="F5OS"){
    const rows=[];
    [draft.peer1,draft.peer2].filter(Boolean).forEach((h,n)=>{
      rows.push({device:h, tenant:"—", why:"Host selected as Peer "+(n+1)+" — reboots"});
      (TENANTS_BY_DEVICE[h]||[]).forEach(t=>
        rows.push({device:h, tenant:t.id, why:"Runs on this host — downtime during reboot"}));
    });
    return rows;
  }
  const rows=[], t=tenantById(draft.tenant);
  if(!t) return rows;
  if(draft.deviceType==="rseries"){
    const dev=deviceById(draft.device), pairDev=dev?deviceById(dev.pair):null;
    rows.push({device:dev?dev.id:"—", tenant:t.id, why:"Selected"});
    const pt=tenantById(t.pair);
    if(pairDev&&pt) rows.push({device:pairDev.id, tenant:pt.id, why:"Impacted through the paired device"});
  }else{
    rows.push({device:"—", tenant:t.id, why:"Selected"});
    const pt=tenantById(t.pair);
    if(pt) rows.push({device:"—", tenant:pt.id, why:"Impacted through the HA partner"});
  }
  return rows;
}

/* submit only when everything required is satisfied */
function validateItem(draft,needsChange){
  const opDef=OPERATIONS[draft.op];
  if(!draft.op)            return "Select an operation type.";
  if(opDef&&opDef.unspecified) return draft.op+" is not specified yet.";
  const missing=visibleFields(draft).find(f=>!draft[f.key]);
  if(missing)              return "Select "+(typeof missing.label==="function"?missing.label(draft):missing.label).toLowerCase()+".";
  /* The impacted-CI check is a gate, not a note. The requirement is that the
     operator sees the impact and says they understand it before anything is
     submitted — so both the check and the acknowledgement are required.
     Ledger 2026-09-07: "mandatory before submit ... they should see it and say
     that they understand the impact". */
  if(!draft.impact)        return "Check the impacted CIs before submitting.";
  if(!draft.impactAck)     return "Confirm you understand the impact.";
  if(needsChange){
    if(draft.change==="byoc" && !(draft.crno||"").trim()) return "Enter the change number.";
    if(draft.change!=="byoc" && !(draft.winStart||"").trim()) return "Set the requested window.";
  }
  return null;
}

/* ---- rendering ---- */
function fieldHTML(f,draft,handler){
  const label=typeof f.label==="function"?f.label(draft):f.label;
  const opts=f.options(draft)||[];
  const val=draft[f.key]||"";
  const hint=(f.kind==="version"&&!val)
    ? `<span class="help" style="display:block">Recommended: <b>${esc(recommendedVersion(draft.op))}</b> — approved and latest.</span>`
    : (f.kind==="version"&&val&&val!==recommendedVersion(draft.op))
      ? `<span class="help" style="display:block">Not the recommended version (${esc(recommendedVersion(draft.op))}).</span>` : "";
  return `<div class="field"><label>${esc(label)}</label>
    <select onchange="${handler}('${f.key}',this.value)">
      <option value="">${esc(f.placeholder||"Select one")}</option>
      ${opts.map(o=>`<option value="${esc(o.v)}" ${val===o.v?"selected":""}>${esc(o.t)}</option>`).join("")}
    </select>${hint}</div>`;
}

/* the OS-specific configuration block, shared by both entry points  */
function opTypeHTML(draft,opHandler){
  return `<div class="field"><label>Operation type</label>
      <select onchange="${opHandler}(this.value)">
        <option value="">Select one</option>
        ${Object.keys(OPERATIONS).map(k=>`<option value="${k}" ${draft.op===k?"selected":""}>${esc(OPERATIONS[k].label)}</option>`).join("")}
      </select></div>`;
}

function targetFieldsHTML(draft,handler){
  if(!draft.op) return `<div class="notice">Select an operation type first.</div>`;
  if(OPERATIONS[draft.op].unspecified)
    return `<div class="notice">The ${esc(draft.op)} workflow has not been specified yet.</div>`;
  return visibleFields(draft).map(f=>fieldHTML(f,draft,handler)).join("");
}

function itemConfigHTML(draft,handler,opHandler,showOpType){
  return (showOpType?opTypeHTML(draft,opHandler):"")+targetFieldsHTML(draft,handler);
}

function impactReady(d){ return d.op==="F5OS" ? !!(d.peer1&&d.peer2) : !!d.tenant; }
/* The acknowledgement is the second half of the requirement. It is offered
   only once there is a result to acknowledge, and it is cleared by any change
   to the selections the result was calculated from. */
function impactAckHTML(draft,handler){
  if(!draft.impact) return "";
  return `<label class="ack"><input type="checkbox" ${draft.impactAck?"checked":""}
    onchange="${handler}(this.checked)"><span>I understand the impact on ${
      plural(draft.impact.length,"CI")} listed above.</span></label>`;
}
function impactHTML(draft){
  const ready = draft.op==="F5OS" ? !!(draft.peer1&&draft.peer2) : !!draft.tenant;
  if(!ready) return `<div class="notice">Select a target first.</div>`;
  if(!draft.impact) return `<div class="notice">Not checked yet.</div>`;
  return `<table class="impact"><thead><tr><th scope="col">Device</th><th scope="col">Tenant</th><th scope="col">Why</th></tr></thead><tbody>
    ${draft.impact.map(r=>`<tr><td class="mono">${esc(r.device)}</td><td class="mono">${esc(r.tenant)}</td><td>${esc(r.why)}</td></tr>`).join("")}
  </tbody></table>`;
}

/* ============================ QUICK SUBMIT  ======================
   No user-created plan exists, so this entry point carries its own change
   window. On submit the item is filed under a system-generated virtual plan
    that the operator never has to configure. */
let quickDraft={op:"",impact:null,change:"byoc",crno:"CR-7412",winStart:"10 Oct 2026 · 22:00",winEnd:"11 Oct 2026 · 02:00"};

function qsOp(v){ setOperation(quickDraft,v); renderQuickBody(); }
function qsSet(k,v){ setField(quickDraft,k,v); renderQuickBody(); }
function qsCheck(){ quickDraft.impact=computeImpact(quickDraft); quickDraft.impactAck=false; renderQuickBody(); }
function qsAck(v){ quickDraft.impactAck=v; renderQuickBody(); }
function qsChange(m){ quickDraft.change=m; renderQuickBody(); }

function quickSummary(){

function openQuickModal(){

function quickReset(){
  quickDraft={op:"",impact:null,change:"byoc",crno:"CR-7412",winStart:"10 Oct 2026 · 22:00",winEnd:"11 Oct 2026 · 02:00"};
}
/* Quick submit is a second entry point, not a second lifecycle. It builds the
   virtual plan the operator never configures and then hands it to submitV2 —
   the same validation, the same states, the same outcomes as a plan the user
   built by hand. Nothing here is allowed to set an execution state directly. */
function submitQuick(){
  const d=quickDraft;
  if(validateItem(d,true)) return;
  const id="PL-"+Math.floor(1000+Math.random()*8999);
  const f5=d.op==="F5OS";
  const item=itemFromDraft(d,"IT-"+Math.floor(1000+Math.random()*8999));
  const plan={id,
    name:(f5?d.peer1+" / "+d.peer2:d.tenant)+" → "+d.version, desc:"Quick submit",
    operation:d.op,
    change: d.change==="byoc" ? d.crno : "requested",
    mode:   d.change==="byoc" ? "byoc" : "create",
    windowStart:d.winStart, windowEnd:d.winEnd,
    state:PLAN_STATE.DRAFT, virtual:true, items:[item]};
  DB().unshift(plan);
  normalisePlan(DB()[0]);
  quickReset(); closeQuickModal();
  /* land on the plan so validation is watched, not guessed at from a list */
  go({v:"plan",p:id});
  submitV2(getPlan(id));
  showToast("Submitted for validation. Filed under "+id+", a plan the system created.");
}
function startQuick(){
  quickReset();
  openQuickModal();
}

/* ======================= ADD ITEM TO AN EXISTING PLAN =====================
    — the operation type and the change window come from the plan and
   are never asked for again. Everything else is the same engine. */
let addDraft={op:"",impact:null};
/* Null while adding, the item id while correcting one. One drawer, one
   renderer, one save — an item is edited by the same engine that created it. */
let editingItem=null;
function aiSet(k,v){ setField(addDraft,k,v); renderAddItem(); }
function aiCheck(){ addDraft.impact=computeImpact(addDraft); addDraft.impactAck=false; renderAddItem(); }
function aiAck(v){ addDraft.impactAck=v; renderAddItem(); }

/* Items are editable exactly where the plan is: Draft and Validation failed.
   Every entry point asks this, so the rule cannot be bypassed by one button. */
function canEditItems(p){ return canEdit(p); }

function openAddItem(){
  const p=getPlan(selectedPlan);
  if(!canEditItems(p)) return showToast("This plan has been submitted. Its items are locked.");
  editingItem=null;
  addDraft={op:p.operation&&OPERATIONS[p.operation]?p.operation:"TMOS",impact:null};
  setOperation(addDraft,addDraft.op);
  resetDrawerChrome();
  document.getElementById("drawerTitle").textContent="Add an item";
  document.getElementById("drawerSub").textContent=
    `${p.id} · ${addDraft.op} · ${p.change||"—"} · ${p.window}`;
  renderAddItem(); showDrawer();
}

/* Correcting an item. The draft is rebuilt from the item so every dependent
   field re-derives its options from the same schema that produced it. */
function openEditItem(iid){
  const p=getPlan(selectedPlan), i=getItem(selectedPlan,iid);
  if(!p||!i) return;
  if(!canEditItems(p)) return showToast("This plan has been submitted. Its items are locked.");
  editingItem=iid;
  const op=OPERATIONS[i.operation]?i.operation:(OPERATIONS[p.operation]?p.operation:"TMOS");
  addDraft={op,impact:null};
  setOperation(addDraft,op);
  if(op==="F5OS"){ addDraft.peer1=i.peer1||""; addDraft.peer2=i.peer2||""; }
  else { addDraft.deviceType = i.journey==="rseries"?"rseries":"virtual";
         addDraft.device = i.journey==="rseries"?(i.device||""):"";
         addDraft.tenant = i.tenant&&i.tenant!=="—"?i.tenant:""; }
  addDraft.version=i.to||"";
  resetDrawerChrome();
  document.getElementById("drawerTitle").textContent="Edit item";
  document.getElementById("drawerSub").textContent=`${p.id} · ${esc(i.id)} · ${addDraft.op}`;
  renderAddItem(); showDrawer();
}

function renderAddItem(){
  const blocked=validateItem(addDraft,false), editingNow=!!editingItem;
  document.getElementById("drawerBody").innerHTML=
    `<div class="dw-g"><span class="lab">Target</span>${itemConfigHTML(addDraft,"aiSet","aiSet",false)}</div>
     <div class="dw-g"><span class="lab">Impacted CIs</span>
       <button class="btn" ${impactReady(addDraft)?"":"disabled"} onclick="aiCheck()">${addDraft.impact?"Check again":"Check impacted CIs"}</button>
       <div style="margin-top:12px">${impactHTML(addDraft)}</div>
       ${impactAckHTML(addDraft,"aiAck")}</div>`;
  document.getElementById("drawerFoot").innerHTML=
    `<span class="msg">${blocked?esc(blocked):(editingNow?"Ready to save.":"Ready to add.")}</span>
     <button class="btn" onclick="closeDrawer()">Cancel</button>
     <button class="btn primary" ${blocked?"disabled":""} onclick="saveItem()">${editingNow?"Save changes":"Save item"}</button>`;
}

/* One shape for an item, whether it is being created or corrected. */
function itemFromDraft(d,id){
  const f5=d.op==="F5OS";
  return {id,
    name: f5 ? d.peer1+" / "+d.peer2 : d.tenant,
    peer1:d.peer1||null, peer2:d.peer2||null,
    impactCount:(d.impact||[]).length, impactAcked:!!d.impactAck,
    kind: f5 ? "Host pair" : (d.deviceType==="rseries"?"R-series device":"Virtual tenant"),
    journey: f5 ? "hostpair" : d.deviceType,
    device: f5 ? d.peer1+" / "+d.peer2 : (d.device||"—"),
    tenant: f5 ? "—" : d.tenant,
    operation:d.op,
    from: f5 ? ((deviceById(d.peer1)||{}).label||"").split("— ")[1]||"—" : ((tenantById(d.tenant)||{}).v||"—"),
    to:d.version, stage:"Not started", state:ITEM_STATE.DRAFT, taskIdx:0};
}

function saveItem(){
  const d=addDraft, p=getPlan(selectedPlan);
  if(!p||!canEditItems(p)) return;
  if(validateItem(d,false)) return;
  if(editingItem){
    const n=p.items.findIndex(x=>x.id===editingItem);
    if(n>=0){
      p.items[n]=itemFromDraft(d,editingItem);
      /* The correction is the answer to a validation failure, so the stale
         error for this item goes with it. */
      if(p.errors) p.errors=p.errors.filter(e=>e.item!==editingItem);
    }
    editingItem=null;
    closeDrawer(); render(); showToast("Item updated.");
    return;
  }
  p.items.push(itemFromDraft(d,"IT-"+Math.floor(1000+Math.random()*8999)));
  closeDrawer(); render(); showToast("Item added to the plan.");
}







/* Breadcrumbs navigate. Each entry is a label, or [label, destination, arg];
   the last entry is where you are, so it is never a link. */
/* ============================================================================
   NAVIGATION

   Two jobs, kept apart. The breadcrumb answers "where am I" and is the only
   way up. The URL is the only history, so the browser's own Back, swipe-back,
   refresh and a pasted link all work on the same mechanism.

   Everything routes through go(). Nothing else writes history, which is what
   keeps Back meaning "the previous screen" rather than "undo my last
   keystroke" — filtering, searching and sorting re-render freely.
   ============================================================================ */

const NAV_FRAME={home:{v:"home"},plans:{v:"list"},devices:{v:"devices"},activity:{v:"activity"}};

function frameToHash(f){
  switch(f.v){
    case "list":     return "#/plans";
    case "newplan":  return "#/plans/new";
    case "plan":     return "#/plans/"+encodeURIComponent(f.p);
    case "item":     return "#/plans/"+encodeURIComponent(f.p)+"/items/"+encodeURIComponent(f.i);
    case "devices":  return "#/devices";
    case "device":   return "#/devices/"+encodeURIComponent(f.d);
    case "activity": return "#/activity";
    default:         return "#/";
  }
}

function hashToFrame(h){
  const g=(h||"").replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);
  if(!g.length) return {v:"home"};
  if(g[0]==="plans"){
    if(!g[1])        return {v:"list"};
    if(g[1]==="new") return {v:"newplan"};
    if(g[2]==="items" && g[3]) return {v:"item",p:g[1],i:g[3]};
    return {v:"plan",p:g[1]};
  }
  if(g[0]==="devices")  return g[1] ? {v:"device",d:g[1]} : {v:"devices"};
  if(g[0]==="activity") return {v:"activity"};
  return {v:"home"};
}

/* A pasted or bookmarked link can name something that no longer exists.
   Fall back to its parent rather than rendering an empty page. */
function resolveFrame(f){
  if(f.v==="plan" && !getPlan(f.p))   return {v:"list"};
  if(f.v==="item"){
    if(!getPlan(f.p))                 return {v:"list"};
    if(!getItem(f.p,f.i))             return {v:"plan",p:f.p};
  }
  if(f.v==="device" && !deviceRecord(f.d)) return {v:"devices"};
  return f;
}

/* The only place view state is set. */
function applyFrame(f){
  stopEditing();
  /* A change of screen closes any open overlay. Browser Back left the add-item
     drawer sitting over Home, still editing an item on a plan no longer on
     screen. Back is a first-class way to move here, so it has to leave the
     same state a breadcrumb would. */
  ["modalBg","drawerBg"].forEach(id=>{
    const bg=document.getElementById(id);
    if(bg&&bg.classList.contains("open")){ bg.classList.remove("open"); bg.setAttribute("aria-hidden","true"); }
  });
  dialogReturn=null; editingItem=null;
  devSelected=null; 
  if(f.v==="device" || f.v==="devices"){ view="devices"; devSelected=f.v==="device"?f.d:null; }
  else if(f.v==="item"){ selectedPlan=f.p; selectedItem=f.i; view="item"; }
  else if(f.v==="plan"){ selectedPlan=f.p; selectedItem=null; view="plan"; }
  else { view=f.v==="list"?"list":f.v; }
  render();
}

/* pushState throws inside a sandboxed frame. The breadcrumb does not depend on
   it, so degrade to in-memory navigation rather than failing the click. */
function histWrite(f,h,replace){
  try{ replace ? history.replaceState({f},"",h) : history.pushState({f},"",h); }
  catch(e){}
}

function go(f,replace){
  f=resolveFrame(f);
  const h=frameToHash(f);
  if(!replace && location.hash===h){ applyFrame(f); return; }   /* already here */
  histWrite(f,h,replace);
  applyFrame(f);
}

window.addEventListener("popstate",e=>{
  const f=resolveFrame((e.state&&e.state.f) || hashToFrame(location.hash));
  /* A frame that resolved down to its parent must correct the URL too, or the
     address bar goes on naming something that is not on screen. */
  if(frameToHash(f)!==location.hash) histWrite(f,frameToHash(f),true);
  applyFrame(f);
});

const CRUMB_TO={
  home:   ()=>go({v:"home"}),
  plans:  ()=>go({v:"list"}),
  devices:()=>go({v:"devices"}),
  device: name=>go({v:"device",d:name}),
  plan:   id=>go({v:"plan",p:id})
};
function setCrumb(a){
