<html lang="en">
<head>

<style>

:root{
  --ink:#000;--ink2:#333;--ink3:#5d5d5d;--ink4:#737373;
  --line:#d3d3d3;--line2:#e8e8e8;--surface:#fff;--surface2:#fafafa;--surface3:#f3f3f3;

  --ui:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --data:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--ui);font-size:14px;line-height:20px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #000;outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:214px minmax(0,1fr)}
.side{border-right:1px solid var(--line);background:#fafafa;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}
.brand{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px}
.mark{width:16px;height:16px;border:1.5px solid #000;border-radius:2px;position:relative}.mark:after{content:"";position:absolute;inset:3px;background:#000}
.brand b{font-size:16px}.nav{padding:12px 8px;display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{border:1px solid transparent;background:none;text-align:left;padding:8px 12px;border-radius:3px;font-size:14px}.nav button:hover{background:#f1f1f1}.nav button.active{background:#000;color:#fff}
.nav-count{float:right;border:1px solid currentColor;border-radius:12px;padding:0 8px;font:12px var(--data);opacity:.85}
.sep{border-top:1px solid var(--line2);margin:12px 12px 8px}.label{padding:0 12px 8px;color:var(--ink4);font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.foot{border-top:1px solid var(--line);padding:12px 16px;color:var(--ink4);font-size:12px}
.main{min-width:0}.top{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;background:#fff;z-index:10}
.crumb{font-size:12px;color:var(--ink3)}.crumb b{color:#000}.crumb span{color:var(--ink4);padding:0 8px}
.crumb-link{background:none;border:0;padding:0;font:inherit;color:var(--ink3);cursor:pointer;text-decoration:none}
.crumb-link:hover{color:#000;text-decoration:underline}
.crumb-link:focus-visible{outline:2px solid #000;outline-offset:2px}
.wrap{padding:28px 32px 72px;max-width:1420px}
.page-head{display:flex;align-items:flex-start;gap:20px;margin-bottom:20px}.page-head .right{margin-left:auto;display:flex;gap:8px}
h1{font-size:26px;letter-spacing:-.035em;line-height:1.2;margin:0;font-weight:700}.sub{font-size:12px;color:var(--ink3)}
.btn{height:32px;border:1px solid var(--control-line);background:#fff;border-radius:3px;padding:0 12px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{background:#f7f7f7;border-color:#999}.btn.primary{background:#000;color:#fff;border-color:#000}.btn.small{height:28px;padding:0 12px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:0}.tabs button{border:0;background:none;padding:12px 16px 8px;font-size:12px;border-bottom:2px solid transparent}.tabs button.active{border-bottom-color:#000;font-weight:700}
.attention{border:2px solid #000;padding:12px 12px;margin:0 0 12px;font-size:12px}.attention b{font-weight:700}
.list-shell{border:1px solid var(--line);background:#fff}
.table-head,.plan-row,.item-row{display:grid;grid-template-columns:minmax(360px,2.2fr) 130px 135px 160px 155px 120px;align-items:center}
.table-head{min-height:38px;background:#fafafa;border-bottom:1px solid var(--line);padding:0 16px;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:650}
.plan-row{min-height:66px;padding:0 16px;border-bottom:1px solid var(--line2);gap:12px}
.plan-row:last-child{border-bottom:0}
.plan-main{display:flex;align-items:flex-start;gap:8px;min-width:0}.expand{width:19px;height:19px;min-width:19px;padding:0;border:1px solid var(--control-line);background:#fff;border-radius:2px;line-height:15px;font-family:var(--data);font-size:12px}.expand:hover{border-color:#000}
.plan-name{font-weight:700;font-size:13px}.plan-id{font:12px var(--data);color:var(--ink3);margin-top:4px}.desc{font-size:12px;color:var(--ink3);font-weight:400}
.cell{min-width:0;font-size:12px}.mono{font-family:var(--data)}.state{display:inline-flex;align-items:center;gap:8px;font-size:12px}.dot{width:8px;height:8px;border:1px solid #000;border-radius:50%;display:inline-block}.dot.fill{background:#000}.dot.wait{background:transparent;border-color:var(--ink3)}
.dot.half{background:linear-gradient(90deg,#000 50%,#fff 50%)}.dot.fail{border-radius:2px;transform:rotate(45deg)}
.open-link{font-size:12px;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
.plan-expanded{display:none;border-bottom:1px solid var(--line);background:#fcfcfc;padding:0 16px 8px 44px}.plan-expanded.open{display:block}
.item-row{grid-template-columns:minmax(300px,2.2fr) 130px 175px 150px 120px;padding:0 0;min-height:58px;border-top:1px solid var(--line2)}
.item-target{font-size:12px}.item-kind{font-size:12px;color:var(--ink3);margin-top:4px}.item-stage{font-size:12px;color:var(--ink2)}.item-state{font-size:12px}
.plan-summary{display:flex;gap:20px;align-items:center;padding:8px 0 4px;color:var(--ink3);font-size:12px}.plan-summary strong{color:#000}
.progress{height:4px;background:#e9e9e9;margin-top:4px;max-width:210px}.progress span{display:block;height:100%;background:#000}
.detail-header{border:1px solid #000;padding:16px 16px;margin-bottom:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px}
@media(max-width:1000px){.detail-header{grid-template-columns:minmax(0,1fr)}}
.detail-title-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.detail-title-row h1{font-size:23px}.chip{border:1px solid var(--line);padding:4px 8px;border-radius:12px;font-size:12px}
.version{font:12px var(--data);margin-top:4px}.detail-status{padding-top:0px}.pill{border:1px solid var(--line);border-radius:18px;padding:4px 8px;font:12px var(--data)}.pill.dark{background:#000;color:#fff;border-color:#000}
.context{grid-column:1/-1;border-top:1px solid var(--line2);padding-top:12px;display:block}
.meta{display:flex;gap:36px;flex-wrap:wrap;align-items:baseline}
.meta>div{min-width:0}.meta label,.window-head label{display:block;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}.meta b{font:12px var(--data);font-weight:500}.window{margin-left:auto;min-width:330px}.window-head{display:flex;justify-content:space-between;gap:12px}.window-head b{font:12px var(--data);font-weight:500}.track{height:5px;border:1px solid #000;background:#fff;margin-top:8px}.track span{display:block;height:100%;background:#000}
.item-nav{border:1px solid var(--line);background:#fff;position:sticky;top:66px;max-height:calc(100vh - 90px);overflow:auto}.item-nav-head{padding:12px 12px;border-bottom:1px solid var(--line2);display:flex;align-items:center}.item-nav-head b{font-size:12px}.item-nav-head span{margin-left:auto;font:12px var(--data);color:var(--ink3)}.item-nav-section{padding:8px 8px 4px;color:var(--ink4);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.item-nav-btn{display:block;width:100%;border:0;border-left:3px solid transparent;background:#fff;text-align:left;padding:8px 12px 8px 8px}.item-nav-btn:hover{background:#fafafa}.item-nav-btn.selected{background:#f3f3f3;border-left-color:#000}.item-nav-name{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650}.item-nav-meta{padding-left:16px;margin-top:4px;color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-nav-state{padding-left:16px;margin-top:4px;font:12px var(--data);color:var(--ink3)}.item-nav-state.attn{color:#000;font-weight:700}.item-main{min-width:0}.item-switch{display:flex;align-items:center;gap:8px;margin-bottom:8px}.item-switch .position{font:12px var(--data);color:var(--ink3);margin-left:auto}.item-switch .btn[disabled]{opacity:.35;cursor:default}.item-plan-context{border:1px solid var(--line);background:#fafafa;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:16px;font-size:12px}.item-plan-context b{font-weight:650}.item-plan-context .mono{font-size:12px}.item-plan-context .context-spacer{margin-left:auto;color:var(--ink3)}
.plan-detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}.panel{border:1px solid var(--line);background:#fff}.panel-head{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:12px}.section-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:700}.muted{margin-left:auto;color:var(--ink3);font-size:12px}
.plan-stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line2)}.stat{padding:12px 12px;border-right:1px solid var(--line2)}.stat:last-child{border-right:0}.stat label{display:block;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.stat b{display:block;font:16px var(--data);margin-top:4px;font-weight:500}
.exec-table{width:100%;border-collapse:collapse}.exec-table th{text-align:left;padding:8px 12px;border-bottom:1px solid #000;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.exec-table td{padding:12px 12px;border-bottom:1px solid var(--line2);font-size:12px;vertical-align:middle}.exec-table tr:last-child td{border-bottom:0}.exec-table tr:hover td{background:#fafafa}
.stagebar{display:flex;gap:4px;min-width:150px}.stage-seg{height:5px;flex:1;background:#e8e8e8}.stage-seg.done{background:#000}.stage-seg.active{border:1px solid #000;background:#fff}.stage-seg.fail{background:#fff;border:1px solid #000;position:relative}.stage-seg.fail:after{content:"";position:absolute;left:1px;right:1px;top:1px;bottom:1px;background:#000;clip-path:polygon(0 0,100% 100%,0 100%,100% 0)}
.attention-tag{border:1px solid #000;padding:4px 8px;font:12px var(--data);display:inline-block}.item-link{background:none;border:0;padding:0;text-align:left;text-decoration:underline;font-weight:650;font-size:12px}
.side-summary{padding:16px}.side-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12px}.side-row:last-child{border-bottom:0}.side-row span:first-child{color:var(--ink3)}
.side-note{margin:12px 0 0;padding:12px;border-left:2px solid #000;background:#fafafa;font-size:12px}
.flow-card{border:1px solid var(--line);background:#fff}.flow-head{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center}.flow-summary{padding:12px 16px;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--line2)}
.flow{padding:12px 16px 16px}.stage{border:1px solid var(--line);margin-bottom:8px}.stage:last-child{margin-bottom:0}.stage.current,.stage.failed{border-color:#000}.stage-head{min-height:62px;padding:12px 12px;display:grid;grid-template-columns:34px minmax(0,1fr) auto 20px;gap:12px;align-items:center;background:#fff;border:0;width:100%;text-align:left}.stage.current .stage-head,.stage.failed .stage-head{background:#fafafa}.stage-icon{width:27px;height:27px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font:12px var(--data)}.stage.done .stage-icon{background:#000;color:#fff;border-color:#000}.stage.current .stage-icon,.stage.failed .stage-icon{border:2px solid #000}.stage-title{font-size:13px;font-weight:700}.stage-meta{font-size:12px;color:var(--ink3);margin-top:4px}.stage-state{font:12px var(--data);border:1px solid var(--line);padding:4px 8px;border-radius:12px}.stage-state.dark{background:#000;color:#fff;border-color:#000}.chev{font-size:13px;color:var(--ink3);transition:.15s transform}.stage.open .chev{transform:rotate(180deg)}.stage-body{display:none;border-top:1px solid var(--line2);padding:8px 12px 12px}.stage.open .stage-body{display:block}
.milestone{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:44px;padding:8px 4px;border-bottom:1px solid var(--line2);font-size:12px;cursor:pointer}.milestone:last-child{border-bottom:0}.milestone:hover{background:#fafafa}.mini{width:9px;height:9px;border:1px solid #000;border-radius:50%}.mini.done{background:#000}.mini.fail{border-radius:2px;transform:rotate(45deg)}.mini.active{border:2px solid #000}.milestone-name{font-weight:550}.milestone-desc{font-size:12px;color:var(--ink3);margin-top:0px}.milestone-time{font:12px var(--data);color:var(--ink3)}
/* the recovery bar inside a stopped stage — not the same thing as a button
   group in a panel header, which is what .actions means everywhere else */
.stage-actions{margin:8px 0 4px 28px;padding:12px 0 4px;border-top:1px solid #000;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.action-copy{margin-right:auto}.action-title{font-size:12px;font-weight:700}.action-copy .sub{font-size:12px}
.activity{width:100%;border-collapse:collapse;font-size:12px}.activity th{text-align:left;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:1px solid #000}.activity td{padding:8px 12px;border-bottom:1px solid var(--line2)}.activity tr:last-child td{border-bottom:0}
.drawer-kv{display:grid;grid-template-columns:110px 1fr;border-top:1px solid var(--line2)}.drawer-kv div{padding:8px 0;border-bottom:1px solid var(--line2);font-size:12px}.drawer-kv div:nth-child(odd){color:var(--ink3)}

@media(max-width:1050px){.table-head,.plan-row{grid-template-columns:minmax(300px,2fr) 100px 110px 130px 120px 95px}.plan-detail-grid{grid-template-columns:1fr}.side-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:0 20px}.window{margin-left:0;width:100%}}
@media(max-width:780px){.app{grid-template-columns:64px 1fr}.brand b,.nav button:not(.active) span,.label,.foot{display:none}.nav button{padding:8px 8px}.wrap{padding:20px 16px}.top{padding:0 16px}.page-head{display:block}.page-head .right{margin-top:12px}.table-head{display:none}.plan-row{grid-template-columns:1fr auto;gap:8px;padding:12px}.plan-row>.cell:not(:first-of-type){display:none}.plan-expanded{padding:0 12px 8px}.item-row{grid-template-columns:1fr auto;gap:4px;padding:8px 0}.item-row>.cell:nth-child(n+3){display:none}.detail-header{grid-template-columns:1fr}.detail-status{grid-column:1}.context{display:block}.window{margin-top:12px;min-width:0}.plan-stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line2)}}

.lifecycle-note{border-top:1px solid var(--line2);padding:12px 16px;font-size:12px;color:var(--ink3)}
.lifecycle-note b{color:#000}
.attention-inline{display:inline-flex;align-items:center;gap:8px;font:12px var(--data);border:1px solid #000;padding:4px 8px}
@media(max-width:1050px){.item-workspace{grid-template-columns:220px minmax(0,1fr)}.item-plan-context .context-spacer{display:none}}
@media(max-width:780px){.app{grid-template-columns:1fr}.side{display:none}.wrap{padding:20px 16px 52px}.item-workspace{grid-template-columns:1fr}.item-nav{max-height:none}.item-nav-section{display:none}.item-nav-btn{display:none}.item-nav-btn.selected{display:block}.item-nav-head{border-bottom:0}.item-nav:has(.selected){min-height:44px}.item-nav:has(.selected) .item-nav-head{display:flex}.item-main{min-width:0}.item-plan-context{flex-wrap:wrap}.detail-header{grid-template-columns:1fr}.window{margin-left:0;min-width:0;width:100%}}

.impact-tbl{table-layout:fixed}
.impact-tbl th,.impact-tbl td{text-align:left;padding:10px 14px}
.impact-tbl th:first-child,.impact-tbl td:first-child{width:26%}
.impact-tbl th:nth-child(2),.impact-tbl td:nth-child(2){width:24%}
.tbl.vcheck th,.tbl.vcheck td{text-align:left;vertical-align:top}
.tbl.vcheck td:first-child{font-family:var(--data);white-space:nowrap;padding-right:18px}
.tbl.vcheck td:nth-child(2){width:150px}

.v2controls{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin:0 0 10px}
/* flex:0 0 auto made this a 706px block that would neither shrink nor wrap,
   so the four filters — not the table — pushed Devices past the viewport
   below 1000px. It already wraps; it just was not allowed to. */
.v2facets{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0;flex:1 1 auto;min-width:0}
.v2facet{display:flex;align-items:center;gap:6px;font:11px var(--data);
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink4)}
.v2facet select{font:12px var(--data);padding:5px 8px;border:1px solid var(--control-line);
  background:#fff;color:var(--ink);text-transform:none;letter-spacing:0}
.v2facet select:focus-visible{outline:2px solid #000;outline-offset:1px}

.exec-table tr.row-fail td{background:#fcfafa}
.attn-row{display:flex;gap:6px;align-items:baseline;color:var(--ink);margin-top:3px}
.attn-mark{font-size:12px;line-height:1;color:var(--ink)}

.attn{margin-top:16px;border:1px solid var(--line);border-left:3px solid #111;
  background:#f4f4f4;padding:14px 16px}
.attn-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.attn-h b{font-size:14px}
.attn-sum{font:12px var(--data);color:var(--ink);letter-spacing:.02em}
.attn-note{font-size:13px;color:var(--ink3);margin-top:4px}
.attn-plan{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.attn-lab{display:block;font:11px var(--data);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:6px}
.attn-plan .btn{margin-top:10px}
ul.checks{margin:0;padding:0;list-style:none}
ul.checks li{font-size:12px;line-height:1.6;color:var(--ink3);padding-left:18px;position:relative}
ul.checks li.bad{color:var(--ink)}
ul.checks li.bad b{font-weight:600}
ul.checks li.bad:before{content:"\2715";position:absolute;left:0}
.attn ul.checks li.bad:before{content:"\26A0";font-size:11px}
ul.checks li.good:before{content:"\2713";position:absolute;left:0;color:var(--ink4)}

.dev-row[role="button"]{cursor:pointer}
.dev-row:focus-visible{outline:2px solid #000;outline-offset:-2px}
.tbl.devprops td{vertical-align:top;padding:10px 14px}
.tenants-tbl{table-layout:fixed}
.tenants-tbl th,.tenants-tbl td{text-align:left;padding:10px 14px}
.tenants-tbl th:first-child,.tenants-tbl td:first-child{width:34%}
.tenants-tbl th:nth-child(2),.tenants-tbl td:nth-child(2){width:26%}
.tbl.devprops td.pk{width:220px;font:12px var(--data);color:var(--ink3);white-space:nowrap}
.tbl.devprops td.pv b{font-size:13px}
.unheld{font-size:13px;color:var(--ink4)}
.pd{display:block;font-size:11px;color:var(--ink4);margin-top:2px}
.home-needs{margin-bottom:16px}
.home-list{display:flex;flex-direction:column}
.home-row{display:grid;grid-template-columns:26px minmax(160px,1fr) minmax(180px,1fr);
  gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line2);padding:12px 16px;cursor:pointer;font:inherit}
.home-row:last-child{border-bottom:0}
.home-row:hover{background:#fafafa}
.home-row:focus-visible{outline:2px solid #000;outline-offset:-2px}
.home-row b{display:block;font-size:13px;font-weight:600}
.home-main,.home-state{min-width:0;display:flex;flex-direction:column}
.home-act{grid-template-columns:110px minmax(200px,1fr) 90px}
.home-clear{padding:16px;font-size:13px;color:var(--ink3)}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.home-facts{display:flex;gap:32px;padding:16px;flex-wrap:wrap}
.home-facts label{display:block;font:11px var(--data);letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink4);margin-bottom:4px}
.home-facts b{font-size:20px;font-weight:600}
.home-next{padding:0 16px 16px;border-top:1px solid var(--line2);padding-top:14px;margin-top:2px}
.home-next label{display:block;font:11px var(--data);letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink4);margin-bottom:4px}
@media(max-width:900px){.home-grid{grid-template-columns:1fr}
  .home-row{grid-template-columns:22px 1fr}
  /* 22px is the status dot on a plan row. An activity row puts a timestamp
     there instead, which needs its content width or it spills into the
     column beside it. `.act-when` is shared with the Activity page's own
     grid, so the fix belongs to this row type, not to that class. */
  .home-act{grid-template-columns:auto minmax(0,1fr)}
  .home-row>span:nth-child(3){display:none}}

.act-head,.act-row{display:grid;
  grid-template-columns:110px minmax(140px,1fr) 130px minmax(200px,1.6fr) 150px 70px;
  gap:14px;align-items:center;padding:10px 14px}
.act-head{font:11px var(--data);letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);
  border-bottom:1px solid var(--line);background:#fafafa}
.act-row{border-bottom:1px solid var(--line2);font-size:13px}
.act-row:last-child{border-bottom:0}
.act-row:hover{background:#fafafa}
.act-row>span{display:flex;flex-direction:column;justify-content:center;min-width:0}
.act-when{color:var(--ink3);font-size:12px}
.act-row b{font-size:13px;font-weight:600}
@media(max-width:900px){.act-head{display:none}
  .act-row{grid-template-columns:1fr auto;gap:6px}
  .act-row>span:nth-child(n+3):nth-child(-n+5){display:none}}

/* Sized so the full seven columns fit a 1130px viewport beside the 214px nav
   without the HA-partner column being clipped. Below that the container's own
   horizontal scroll takes over rather than the page's. */
.dev-head,.dev-row{display:grid;
  grid-template-columns:minmax(142px,1.1fr) 108px 64px 70px minmax(136px,1fr) 58px minmax(140px,1fr);
  gap:12px;align-items:start;padding:13px 14px}
/* every cell starts at the top, so the first line of each column sits on one
   line whether or not the cell has a second line beneath it */
.dev-row>span{display:flex;flex-direction:column;justify-content:flex-start;min-width:0}
.dev-row{min-height:58px;line-height:1.35}
.dev-v{display:block;line-height:18px;font-size:13px}
.dev-row .mono .dev-v{font-size:12.5px}
.dev-name{font-weight:600}
.dev-head span,.dev-sort{white-space:nowrap}
.dev-head{padding:0}
.dev-sort{display:flex;align-items:center;gap:4px;width:100%;background:none;border:0;
  padding:11px 0;font:11px var(--data);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink4);cursor:pointer;text-align:left}
.dev-sort:hover{color:var(--ink)}
.dev-sort.on{color:#000;font-weight:600}
.dev-sort:focus-visible{outline:2px solid #000;outline-offset:-2px}
.dev-arrow{font-size:10px}
.comp{display:block;font-size:12.5px;font-weight:600}
.comp.bad{color:#000}
.comp.ok{color:var(--ink2);font-weight:500}
.dev-head{font:11px var(--data);letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);
  border-bottom:1px solid var(--line);background:#fafafa}
.dev-row{border-bottom:1px solid var(--line2);font-size:13px}
.dev-row:last-child{border-bottom:0}
.dev-row:hover{background:#fafafa}
.dev-name{font-weight:600}
.dev-row .v2sub{margin-top:2px;line-height:15px}
@media(max-width:900px){.dev-head{display:none}
  .dev-row{grid-template-columns:1fr auto;gap:6px}
  .dev-row>span:nth-child(n+3){display:none}}

/* ---- item workspace: every item in the plan stays visible ---- */
.item-workspace{display:grid;grid-template-columns:264px minmax(0,1fr);gap:16px;align-items:start}
.rail-main{min-width:0}
.rail{border:1px solid var(--line);background:#fff;position:sticky;top:66px;
  max-height:calc(100vh - 90px);overflow:auto}
.rail-head{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line2);padding:12px;cursor:pointer;font:inherit}
.rail-head b{display:block;font-size:12.5px}
.rail-head span{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.rail-head:hover{background:#fafafa}
.rail-group{padding:10px 12px 4px;color:var(--ink4);font:11px var(--data);
  letter-spacing:.08em;text-transform:uppercase}
.rail-item{display:flex;gap:8px;width:100%;text-align:left;background:none;
  border:0;border-left:3px solid transparent;padding:8px 12px 8px 9px;cursor:pointer;font:inherit}
.rail-item:hover{background:#fafafa}
.rail-item.on{background:#f3f3f3;border-left-color:#000}
.rail-item:focus-visible{outline:2px solid #000;outline-offset:-2px}
.rail-dot{width:7px;height:7px;border:1px solid var(--ink3);border-radius:50%;margin-top:5px;flex:0 0 auto}
.rail-dot.ran{background:var(--ink3)}
.rail-body{min-width:0}
.rail-body b{display:block;font-size:12.5px}
.rail-meta,.rail-state{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.rail-item.on .rail-state{color:var(--ink2)}
@media(max-width:900px){
  .item-workspace{grid-template-columns:1fr}
  .rail{position:static;max-height:220px}
}

/* ---- workflow execution ---- */
.wf{padding:14px 16px 16px}
.wf-phase{margin-bottom:18px}
.wf-phase:last-child{margin-bottom:0}
.wf-phase-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:0 0 8px;border-bottom:1px solid var(--line2);margin-bottom:8px}
.wf-phase-head b{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.wf-phase-head span{font-size:11px;color:var(--ink4)}
.wf-task{border:1px solid var(--line);margin-bottom:6px}
.wf-task:last-child{margin-bottom:0}
.wf-task.current{border-color:#000}
.wf-task.failed{border-color:#000;border-width:2px}
.wf-task.halted .wf-state{color:var(--ink2)}.wf-task.halted .wf-name{color:var(--ink2)}
.wf-task.failed .wf-state{color:#000;font-weight:600}
.wf-fail{margin-top:0;font-size:12.5px;line-height:19px;color:var(--ink)}
/* Indented to the milestone TEXT column — 16px mark + 10px gap — so the
   connector running down the mark column stays unbroken and there are not two
   vertical rules 7px apart fighting each other. The block's own rule then
   aligns with the step it belongs to. */
.ms-fail{list-style:none;margin:4px 0 10px 26px;padding:12px 14px 12px 14px;
  border-left:2px solid var(--ink);background:var(--surface2)}
.ms-fail .wf-actions{margin-top:12px}
.wf-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.wf-head{display:grid;grid-template-columns:44px 1fr auto 18px;gap:12px;align-items:center;
  width:100%;padding:10px 12px;background:none;border:0;text-align:left;cursor:pointer;font:inherit}
.wf-head:focus-visible{outline:2px solid #000;outline-offset:-2px}
.wf-n{font-size:11px;color:var(--ink4)}
.wf-name{font-size:13px;font-weight:600}
.wf-task.todo .wf-name{font-weight:400;color:var(--ink3)}
/* Skipped: never ran and never will. Lighter than pending, because pending is
   still ahead of you and this is not. */
.wf-task.skipped .wf-name{font-weight:400;color:var(--ink4)}
.wf-task.skipped .wf-n{color:var(--ink4)}
.wf-task.skipped .wf-dur{color:var(--ink4)}
.wf-state{font-size:10px;letter-spacing:.08em;color:var(--ink4)}
.wf-task.done .wf-state{color:var(--ink2)}
.wf-task.current .wf-state{color:#000}
.wf-task .chev{font-size:12px;color:var(--ink4);transition:transform .12s}
.wf-task.open .chev{transform:rotate(180deg)}
.wf-body{display:none;padding:0 12px 12px 68px;border-top:1px solid var(--line2)}
.wf-task.open .wf-body{display:block}
.ms-list{margin:10px 0 0;padding:0;list-style:none;position:relative}
.ms-list:before{content:"";position:absolute;left:7px;top:12px;bottom:12px;
  width:1px;background:var(--line)}
.ms{display:grid;grid-template-columns:22px 16px 1fr auto;gap:10px;align-items:baseline;
  padding:5px 0;position:relative}
.ms-mark{width:15px;height:15px;border:1px solid var(--line2);border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:9px;line-height:1;color:var(--ink3);position:relative;z-index:1;align-self:center}
.ms.succeeded .ms-mark{border-color:var(--ink3);color:var(--ink2)}
.ms.running .ms-mark{border-color:#000;color:#000;border-width:2px}
.ms.failed .ms-mark{border-color:#000;background:#000;color:#fff;border-width:1px}
.ms-n{min-width:22px;text-align:right;font-size:12px;color:var(--ink4);font-variant-numeric:tabular-nums}
.ms.running .ms-n,.ms.failed .ms-n{color:var(--ink2)}
.ms-name{font-size:12.5px;line-height:1.5;color:var(--ink2)}
.ms.running .ms-name,.ms.failed .ms-name{color:var(--ink);font-weight:600}
.ms.not-started .ms-name{color:var(--ink4)}
.ms.cancelled .ms-mark{border-color:var(--ink3);color:var(--ink3)}
.ms-dur{font-size:12px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.ms.running .ms-dur,.ms.failed .ms-dur{color:#000;font-weight:600}
.ms.not-started .ms-dur{color:var(--ink4)}
/* A chip marks the exception only: stopped, running, or cancelled. */
.wf-chip{font-size:12px;line-height:18px;padding:1px 9px;border:1px solid var(--ink);
  border-radius:11px;white-space:nowrap;font-weight:600}
.wf-chip.failed{background:var(--ink);color:#fff}
.wf-chip.current{background:#fff;color:var(--ink)}
.wf-chip.halted{background:#fff;color:var(--ink2);border-color:var(--ink3);font-weight:500}
.wf-dur{font-size:12px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.wf-none{margin-top:10px;font-size:12px;color:var(--ink4)}
.wf-list{list-style:none;margin:0;padding:0}
.tk-top{display:flex;align-items:center;gap:16px;min-height:28px;margin-top:10px}
.tk-times{font-size:12px;color:var(--ink3)}
.tk-top:empty{display:none}
.tk-sep{padding:0 8px;color:var(--ink4)}
.wf-ring{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;flex:0 0 auto}
.wf-ring svg{transform:rotate(-90deg)}
.wf-ring circle{fill:none;stroke-width:2.5}
.wf-ring-t{stroke:var(--line)}
.wf-ring-f{stroke:var(--ink);stroke-linecap:round}
.tk-ext{display:flex;align-items:center;margin-left:auto}
.tk-more{position:relative}
.tk-kebab{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;
  border:0;background:none;color:var(--ink3);cursor:pointer;font-size:16px;line-height:1;border-radius:3px}
.tk-kebab:hover{color:var(--ink);background:#f2f2f2}
.tk-kebab:focus-visible{outline:2px solid #000;outline-offset:2px}
.tk-menu{position:absolute;right:0;top:30px;z-index:5;background:#fff;border:1px solid var(--control-line);
  box-shadow:0 6px 18px rgba(0,0,0,.10);min-width:200px;padding:4px}
.tk-mi{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;
  font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
.tk-mi{text-decoration:none}
.tk-mi-ext{margin-left:6px;color:var(--ink4)}
.tk-mi:hover{background:var(--surface3)}
.tk-mi:focus-visible{outline:2px solid #000;outline-offset:-2px}
.item-dl{display:inline-flex;align-items:center;gap:8px}
.tk-dl{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;padding:0;border:1px solid var(--control-line);border-radius:3px;
  background:#fff;color:var(--ink);cursor:pointer}
.tk-dl:hover{background:#f7f7f7;border-color:#999}
.tk-dl:focus-visible{outline:2px solid #000;outline-offset:2px}
.ext{font-size:12px;color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.ext span{margin-left:5px;text-decoration:none;display:inline-block}
.ext:hover{text-decoration-thickness:2px}
.ext:focus-visible{outline:2px solid #000;outline-offset:2px}
/* Impacted CIs as a closed line. 32px shut, and the tenant names are visible
   on it, so opening it is a choice rather than the only way to know. */
.ci{border:1px solid var(--line);background:var(--surface2);margin-top:12px}
.ci-sum{display:grid;grid-template-columns:auto auto minmax(0,1fr) 18px;gap:10px;align-items:center;
  padding:7px 14px;cursor:pointer;list-style:none;min-height:32px}
.ci-sum::-webkit-details-marker{display:none}
.ci-sum:hover{background:#f3f3f3}
.ci-sum:focus-visible{outline:2px solid #000;outline-offset:-2px}
.ci-lab{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em}
.ci-n{font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;
  border-radius:10px;padding:0 7px;line-height:17px}
.ci-id{display:inline-block;margin-left:10px;font-size:11px;color:var(--ink3)}
.ci-host{margin-top:8px}
.ci-host:first-child{margin-top:0}
.ci-kid{padding-left:16px}
.ci-peek{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci[open] .ci-peek{visibility:hidden}
.ci[open] .chev{transform:rotate(180deg)}
.ci .chev{font-size:12px;color:var(--ink3);transition:transform .12s;justify-self:end}
.ci-list{list-style:none;margin:0;padding:2px 14px 10px;border-top:1px solid var(--line2);background:#fff}
.ci-list li{font-size:12px;line-height:22px;color:var(--ink2)}
.ci-on{color:var(--ink4)}
@media(prefers-reduced-motion:reduce){.ci .chev{transition:none}}
/* Ruled off from the failure it follows, so the two sequences never read as
   one continuous list of steps. */
.rb{margin-top:14px;border-top:2px solid var(--ink);padding-top:12px}
.rb-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.rb-head b{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.rb-head span{font-size:12px;color:var(--ink3)}
.rb-list{margin-top:4px}
.rb-list:before{background:var(--line)}
.wf-pb{margin-top:10px;font-size:11px;color:var(--ink4)}
@media(prefers-reduced-motion:reduce){.wf-task .chev{transition:none}}

/* ---- listing ---- */
.v2search{display:flex;gap:8px;margin:0;flex:1 1 300px;min-width:220px}
.v2search input{flex:1;font:12px var(--data);padding:9px 12px;border:1px solid var(--control-line);background:#fff;color:var(--ink)}
.v2search input:focus{outline:2px solid #000;outline-offset:-1px}
.v2segs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.v2seg-btn{font:12px var(--data);padding:7px 12px;border:1px solid var(--line);background:#fff;color:var(--ink3);cursor:pointer}
.v2seg-btn .mono{color:var(--ink4);margin-left:4px}
.v2seg-btn.on{background:#000;color:#fff;border-color:#000}
.v2seg-btn.on .mono{color:#fff}
.v2seg-btn:focus-visible{outline:2px solid #000;outline-offset:2px}
.v2live{font:11px var(--data);color:var(--ink3);min-height:16px;margin-bottom:6px}
/* A wide operations table scrolls inside its own box. The page body never
   scrolls sideways — at 880-1130px the device table used to push the whole
   document 33-72px wide and clip the HA-partner column against the viewport. */
.v2table{border:1px solid var(--line);overflow-x:auto;
  /* a shadow on the right edge only while there is more table to reach */
  background:linear-gradient(90deg,#fff 30%,rgba(255,255,255,0)) left/40px 100% no-repeat,
             linear-gradient(90deg,rgba(255,255,255,0),#fff 70%) right/40px 100% no-repeat,
             radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.14),transparent) left/12px 100% no-repeat,
             radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.14),transparent) right/12px 100% no-repeat;
  background-attachment:local,local,scroll,scroll}
/* Only while the full column set is being drawn. Below 900px the rows collapse
   to two columns by design, and a floor there would reintroduce the very
   overflow this removes. */
@media(min-width:901px){
  .v2table > .v2head,.v2table > .v2row{min-width:902px}
  .v2table > .dev-head,.v2table > .dev-row{min-width:790px}
  .v2table > .act-head,.v2table > .act-row{min-width:860px}
}
.v2head,.v2row{display:grid;grid-template-columns:26px minmax(180px,2fr) 178px 104px 150px 104px minmax(150px,1.3fr);
  gap:14px;align-items:center;padding:11px 14px}
.v2head{font:11px var(--data);letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);
  border-bottom:1px solid var(--line);background:#fafafa}
.v2row{border-bottom:1px solid var(--line2);text-decoration:none;color:var(--ink)}
.v2row:last-child{border-bottom:0}
.v2row:hover{background:#fafafa}
.v2row:focus-visible{outline:2px solid #000;outline-offset:-2px}
.v2dispo{font-size:13px;line-height:1;text-align:center}
.v2dispo.needs{color:#000}.v2dispo.running{color:#5d5d5d}.v2dispo.waiting{color:#737373}.v2dispo.done{color:#737373}
.v2dispo.good{color:var(--ink3)}
.v2dispo.partial{color:#000}
.v2dispo.bad{color:#000;font-weight:700}
.v2dispo.none{color:var(--ink4)}
.v2name b,.v2state b{display:block;font-size:13px;font-weight:600}
.v2row.is-qs .v2name b{font-family:var(--data);font-weight:500;font-size:12.5px}
.qs-tag{display:inline-block;font:9px var(--data);letter-spacing:.09em;line-height:14px;
  text-transform:uppercase;border:1px solid var(--line2);color:var(--ink3);
  padding:0 4px;margin-right:6px;vertical-align:1px}
.v2sub{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.v2sub.demand{color:var(--ink);font-weight:600}
.v2op,.v2chg,.v2win{font-size:12px;color:var(--ink2)}
/* One track, one fill. Not four buckets — the ratio is continuous. */
.item-actions-cell{white-space:nowrap}
/* The chevron says "there is another level", so it is an icon sitting in the
   row rather than a control drawn on top of it. No border, no background — but
   a 32px target and a real focus ring, because it is still a button. */
.iw-open{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
  padding:0;margin-left:6px;border:0;background:none;color:var(--ink3);cursor:pointer;vertical-align:middle}
.iw-open:hover{color:var(--ink)}
.iw-open:focus-visible{outline:2px solid #000;outline-offset:2px;border-radius:3px}
.plan-sum{margin-top:14px;padding-top:14px;border-top:1px solid var(--line2);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-size:12px;color:var(--ink2)}
.plan-sum.started{flex-direction:column;align-items:stretch;gap:10px}
.ps-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.ps-items{font-weight:650;color:var(--ink)}
.ps-status{color:var(--ink)}
.ps-sep{color:var(--ink4)}
.ps-dist{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.ps-b b{font-weight:650;color:var(--ink)}
.ps-comp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ps-lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.ps-comp .pbar{max-width:260px;flex:1 1 160px}
.ps-num{font-size:12px;color:var(--ink2)}
.pbar{display:block;height:4px;width:100%;max-width:120px;background:var(--line);overflow:hidden}
.pbar>span{display:block;height:100%;background:var(--ink);transition:width .2s linear}
@media(max-width:900px){.v2head{display:none}
  .v2row{grid-template-columns:22px 1fr auto;gap:8px}
  .v2row>.v2op,.v2row>.v2chg,.v2row>.v2win,.v2row>.v2prog{display:none}}

/* ---- authoring, on this file's tokens ---- */
.notice{border-left:3px solid #111;background:#fafafa;padding:12px 16px;font-size:12px;line-height:18px;margin-bottom:16px}
.item-table{width:100%;border-collapse:collapse}
.item-table th,.item-table td{padding:12px 16px;border-bottom:1px solid var(--line2);text-align:left;font-size:12px;line-height:16px}
.item-table th{color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.item-table tr:last-child td{border-bottom:0}
.choice{display:flex;gap:12px;border:1px solid var(--line);padding:16px;margin-bottom:8px;border-radius:3px}
/* The change-record options lost their descriptions, so the padding that was
   sized for two lines now wraps one. This tightens that card only — the same
   boxes elsewhere still carry subtext and still need the room. */
.section.tight .section-head{padding:12px 16px}
.section.tight .section-body{padding:14px 16px 16px}
.section.tight .choice{padding:9px 14px;margin-bottom:6px;align-items:center}
.section.tight .choice strong{line-height:20px}
.section.tight .field{margin-top:14px}
/* Two short, mutually exclusive options sit better beside each other than
   stacked — the labels are the subject of the heading above them, so they do
   not need to repeat it. Falls back to stacking when there is no room. */
.choice-row{display:flex;gap:8px;flex-wrap:wrap}
.choice-row .choice{flex:1 1 200px;margin-bottom:0}
.impact{border:1px solid var(--line);border-collapse:collapse;width:100%;margin-top:0;table-layout:fixed}
.impact th,.impact td{text-align:left;padding:7px 12px;font-size:12px;vertical-align:top;
  overflow:hidden;text-overflow:ellipsis}
.impact th{font-weight:650;color:var(--ink2);border-bottom:1px solid var(--line2)}
.impact td{border-top:1px solid var(--line2)}
.impact th:first-child,.impact td:first-child{width:38%}
.impact th:last-child:nth-child(3),.impact td:last-child:nth-child(3){width:18%}
.imp-sum{display:flex;align-items:center;gap:10px;margin:16px 0 8px;font-size:12px}
.imp-parts{font-size:12px;color:var(--ink2)}
.imp-n{border:1px solid var(--line);border-radius:10px;padding:1px 9px;font-size:11px;color:var(--ink2);white-space:nowrap}
.imp-grp{border:1px solid var(--line);margin-bottom:10px}
.imp-grp-h{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 12px;background:var(--surface3);border-bottom:1px solid var(--line);font-size:12px}
.imp-grp-h b{font-weight:650}
.imp-id{display:block;color:var(--ink3);font-size:11px;margin-top:2px}
.imp-grp .impact{border:0}
.imp-none{padding:10px 12px;font-size:12px;color:var(--ink3)}
.imp-nf{color:var(--ink3);font-style:italic}
/* ---- version switch ---- */
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary:disabled{background:var(--ink);border-color:var(--ink)}

/* ---- dialogs and confirmations ---- */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:60;padding:40px 20px;overflow:auto}
.modal-bg.open{display:flex;align-items:flex-start;justify-content:center}
.modal{background:#fff;border:1px solid var(--ink);border-radius:4px;width:min(680px,100%);
  max-height:calc(100vh - 80px);display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.modal-head{display:flex;gap:12px;align-items:flex-start;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:19px;letter-spacing:-.02em}
.modal-head .sub{margin-top:3px}
.modal-head .btn{margin-left:auto}
.modal-body{padding:20px 22px;overflow:auto;flex:1}
.modal-body .section{margin-bottom:12px}
.modal-body .section:last-child{margin-bottom:0}
.modal-foot{display:flex;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface2)}
.modal-foot .msg{margin-right:auto;font-size:12px;color:var(--ink3)}
/* A confirmation is narrower than a form and its first button is the way out. */
.modal-sm{width:min(470px,100%)}
.modal-sm .modal-head{padding:18px 22px 12px}
.modal-sm .modal-head h2{font-size:17px}
.modal-sm .modal-body{padding:0 22px 4px}
.modal-sm .modal-foot{justify-content:flex-end}
.cf-lead{margin:0 0 12px;font-size:13px;line-height:20px}
.cf-list{margin:0;padding:0;list-style:none}
.cf-list li{position:relative;padding:0 0 8px 16px;font-size:12px;line-height:18px;color:var(--ink2)}
.cf-list li:before{content:"—";position:absolute;left:0;color:var(--ink4)}
.cf-list li:last-child{padding-bottom:0}
/* Destructive is carried by weight and a rule, not by colour — the palette is
   monochrome and state is never colour alone. */
.btn.danger{border-color:var(--ink);font-weight:650;box-shadow:inset 0 -2px 0 var(--ink)}
.btn.danger:hover{background:var(--ink);color:#fff}
@media(max-width:760px){.modal-bg{padding:16px 10px}}

/* ---- authoring screens ---- */
.head{display:flex;align-items:flex-start;gap:20px;margin-bottom:20px}
.head h1{font-size:28px;line-height:32px;letter-spacing:-.035em;margin:0 0 4px}
.head .actions{margin-left:auto;display:flex;gap:8px}
.link{border:0;background:transparent;text-decoration:underline;padding:0;font-size:12px;text-align:left}
.panel-body{padding:16px}
.plan-head{border:1px solid var(--line);padding:20px;margin-bottom:16px}
.plan-head.facts-only .plan-facts{margin-top:0;border-top:0;padding-top:0}
.plan-title-line{display:flex;align-items:center;gap:12px}
.plan-title-line h1{font-size:26px;line-height:32px;margin:0}
.tag{border:1px solid var(--control-line);border-radius:12px;padding:3px 8px;font:12px/16px var(--data)}
.meta-line{margin-top:4px;font-size:12px;color:var(--ink3)}
.plan-facts{display:grid;grid-template-columns:1fr 1fr 1.5fr 80px;margin-top:20px;border-top:1px solid var(--line2);padding-top:16px}
/* a requested-window plan has no change number yet: three facts, and the window takes the room */
.plan-facts.no-change{grid-template-columns:1fr 2.5fr 80px}
.fact label{display:block;color:var(--ink3);font-size:12px;line-height:16px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.fact b{display:block;font:12px/16px var(--data);margin-top:4px}
.items-panel .panel-head{display:flex;align-items:center}
.items-panel .panel-head .actions{margin-left:auto}
.empty{margin:16px;border:1px dashed var(--control-line);min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center}
.empty h3{font-size:16px;margin:0 0 8px}
.empty .btn{margin-top:16px}
.ready-note{padding:0 16px 16px;font-size:12px;color:var(--ink3)}
.ready-note b{color:#111}
.item-actions{white-space:nowrap}
.section{border:1px solid var(--line);margin-bottom:16px}
.section-head{padding:16px;border-bottom:1px solid var(--line2)}
.section-head h3{font-size:16px;line-height:20px;margin:0 0 4px}
.section-body{padding:16px}
.field{margin-bottom:20px}
.field:last-child{margin-bottom:0}
.field label{display:block;color:var(--ink3);font-size:12px;line-height:16px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;height:40px;border:1px solid var(--control-line);border-radius:3px;background:#fff;padding:0 12px;font-size:14px}
.dist-total{font-size:12px;font-weight:650;margin-bottom:6px}
.dist-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-size:12px;color:var(--ink2)}
.dist-b b{font-weight:650;color:var(--ink)}
.dist-sep{color:var(--ink4)}
.dist-bar{display:flex;gap:2px;height:6px;margin:10px 0 6px;max-width:520px}
.dist-bar span{display:block;background:var(--ink4);min-width:3px}
.dist-bar .db-completed{background:var(--ink)}
.dist-bar .db-running{background:var(--ink2)}
.dist-bar .db-queued{background:var(--line)}
.dist-bar .db-needs-action{background:var(--ink);box-shadow:inset 0 0 0 1px #fff}
.dist-ratio{font-size:12px;color:var(--ink3)}
.win-cond{display:inline-block;margin-left:10px;font-size:11px;line-height:16px;padding:1px 8px;border:1px solid var(--control-line);border-radius:10px;color:var(--ink2);white-space:nowrap;vertical-align:middle}
.win-cond.granted,.win-cond.approved{border-color:var(--ink);color:var(--ink);font-weight:650}
.field-err{display:block;font-size:12px;line-height:18px;color:var(--ink);font-weight:650;margin-top:4px}
.field input[aria-invalid="true"]{border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.help{font-size:12px;line-height:18px;color:var(--ink3);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.op-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.op-fields .field{margin-bottom:0}
.op-fields select:disabled{background:var(--surface2);color:var(--ink4)}
.callout{border-left:2px solid #111;background:#fafafa;padding:12px 16px;font-size:12px;line-height:18px}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}
.summary .row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.summary .row:last-child{border-bottom:0}
.summary dt{font-size:12px;color:var(--ink3)}
.summary dd{font:12px/16px var(--data);margin:0;text-align:right}
.form-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:16px;border-top:1px solid var(--line2)}






/* ---- authoring: forms, drawer, plan workspace ---- */
.page{max-width:1420px}
.form-sec{border:1px solid var(--line);border-radius:3px;margin-bottom:14px;background:#fff}
.form-sec-h{padding:14px 16px 0}
.form-sec-h h3{margin:0;font-size:14px}
.form-sec-d{padding:4px 16px 12px;font-size:12px;color:var(--ink3);border-bottom:1px solid var(--line2)}
.form-sec-b{padding:16px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > span{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.fld input,.fld select{height:36px;border:1px solid var(--control-line);border-radius:3px;padding:0 10px;background:#fff;font-size:13px;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--ink);outline:none}
.frow{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.grow{flex:1;min-width:180px}
.resolved{border-left:3px solid var(--ink);background:var(--surface2);padding:12px 14px}
.resolved .big{font:600 19px/1.1 var(--data)}
/* The authoring summary panel. It was called .rail, which is also the item
   navigator on the execution screen — so it was silently inheriting that
   component's max-height and overflow, and sat 2px from clipping its own
   content at a 700px viewport. Separate names, separate rules. */
.sumrail{border:1px solid var(--line);border-radius:3px;background:#fff;position:sticky;top:70px}
.sumrail-h{padding:12px 16px;border-bottom:1px solid var(--line2);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.sumrail-b{padding:14px 16px}
.sumrail-kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:12px}
.sumrail-kv:last-of-type{border-bottom:0}
.sumrail-kv b{font-family:var(--data);font-weight:500}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:1080px){.cols{grid-template-columns:minmax(0,1fr)}}
.drawer-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.30);z-index:50}
.drawer-bg.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,96vw);background:#fff;border-left:1px solid var(--ink);z-index:51;display:flex;flex-direction:column}
.drawer-head{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:0;font-size:18px}
.drawer-head .sub{margin-top:3px}
.drawer-body{flex:1;overflow:auto;padding:20px}
.drawer-foot{display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface2)}
.drawer-foot .msg{margin-right:auto;font-size:12px;color:var(--ink3)}
.dw-g{border:1px solid var(--line);border-radius:3px;padding:14px 16px}
.dw-g + .dw-g{margin-top:12px}
.dw-g > .lab{display:block;margin-bottom:10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.emptybox{border:1px dashed var(--line);border-radius:3px;padding:34px 20px;text-align:center;margin:16px}
.emptybox h3{margin:0 0 6px;font-size:14px}
.emptybox p{margin:0 auto 16px;font-size:12px;color:var(--ink3);max-width:56ch}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.toast{display:none;position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:3px;font-size:12px;z-index:80}
.saved{font:10px var(--data);border:1px solid var(--line);border-radius:2px;padding:1px 6px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em}
.backl{width:28px;height:28px;border:1px solid var(--line);border-radius:3px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font:14px var(--data);flex:0 0 auto}
.backl:hover{border-color:var(--ink)}


/* Restored: these came out of the creation build's media queries and had been
   flattened into unconditional rules by the merge — which is why the page head
   stacked, the plan facts sat 2x2 and the paired fields never went side by
   side at full width. */
@media(max-width:1050px){
  .form-grid,.item-exec-layout{grid-template-columns:1fr}
  .item-nav{position:static}
  .plan-facts{grid-template-columns:1fr 1fr}
}

/* ---- plan-level execution: the change-record track ---- */
/* Drawn as one column so the reading order is the running order, and visibly
   interrupted where item execution sits — the two levels must not read as one
   continuous list of steps. */
.plan-track .pt-list{list-style:none;margin:0;padding:6px 0}
.pt{display:flex;align-items:center;gap:12px;padding:6px 16px;min-height:32px}
.pt.failed{align-items:flex-start}
.pt-mark{width:16px;text-align:center;font-size:12px;line-height:18px;color:var(--ink3)}
.pt.succeeded .pt-mark{color:#111}
.pt.failed .pt-mark{color:#111;font-weight:700}
.pt.running .pt-mark,.pt.waiting .pt-mark{color:#111}
.pt-body{flex:1;min-width:0}
.pt-body b{display:block;font-size:12.5px;font-weight:650;line-height:20px}
.pt-note{display:block;color:var(--ink);font-size:12px;line-height:18px;margin-top:2px}
.pt-state{white-space:nowrap}
.pt.not-started{opacity:.55}
/* The recovery control for a plan-level task, placed at the task it acts on. */
.pt-act{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.pt-act-n{font-size:12px;line-height:18px;color:var(--ink3)}
.pt.failed .pt-body>b{font-weight:700}
.notice.bad{border-left-color:#111;background:#f4f4f4}
.optional{font-weight:400;color:var(--ink3);text-transform:none;letter-spacing:0}


/* ---- maintenance window ---- */
/* The countdown is the only number on the screen that moves on its own, so it
   is the only one drawn in the data face at full weight. */
.win-box{min-width:330px}
.win-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.win-row label{display:block;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.win-left{font:12px var(--data);font-weight:600}
.win-left.low{font-weight:700}
.win-left.gone{font-weight:700}
.win-note{display:block;color:var(--ink3);font-size:12px;line-height:18px;margin-top:6px}
.win-note.low,.win-note.gone{color:#111}
.track{height:5px;border:1px solid #000;background:#fff;margin-top:8px}
.track span{display:block;height:100%;background:#000}
.track.gone span{background:repeating-linear-gradient(90deg,#000 0 3px,#fff 3px 6px)}

/* ---- action required: the consequence of waiting ---- */
.wf-wait{border:1px solid var(--line);background:#fafafa;padding:10px 12px;margin-top:10px;font-size:12px;line-height:18px}
.wf-wait b{font-weight:650}
.wf-wait .mono{font-weight:600}
.esc{border-left:3px solid #111;background:#f4f4f4;padding:12px 16px;font-size:12px;line-height:18px;margin-top:10px}

@media(max-width:760px){
  .page{padding:20px 16px 48px}
  .head{display:block}
  .head .actions{margin-top:12px}
  .plan-facts{grid-template-columns:1fr 1fr;gap:16px}
  .two,.op-fields{grid-template-columns:1fr}
}
/* ---- V5 · Plans list: search, tabs, three visible filters ---- */
.v5find{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin:0 0 10px}
.v5search{position:relative;flex:1 1 360px;max-width:560px}
.v5search input{padding-right:34px}
.v5x{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;background:none;
  color:var(--ink3);font-size:16px;line-height:1;cursor:pointer}
.v5x:hover{color:var(--ink)}
.v5x:focus-visible{outline:2px solid #000;outline-offset:0}
.v5fbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-2px 0 8px}
.v5f{position:relative}
.v5fbtn{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border:1px solid var(--line);background:#fff;
  font:11.5px var(--data);color:var(--ink3);cursor:pointer;white-space:nowrap}
.v5fbtn b{font-weight:500;color:var(--ink2)}
.v5fbtn.on{border-color:var(--control-line)}
.v5fbtn.on b{color:var(--ink);font-weight:600}
.v5fbtn:hover{border-color:var(--control-line)}
.v5fbtn:focus-visible{outline:2px solid #000;outline-offset:1px}
.v5caret{font-size:9px;color:var(--ink4);margin-left:2px}
.v5menu{position:absolute;z-index:20;top:calc(100% + 4px);left:0;min-width:200px;background:#fff;border:1px solid var(--control-line);
  box-shadow:0 4px 14px rgba(0,0,0,.08);padding:6px 0;display:flex;flex-direction:column}
.v5opt{display:flex;align-items:center;gap:8px;padding:6px 12px;font:12px var(--data);color:var(--ink2);cursor:pointer;white-space:nowrap}
.v5opt:hover{background:var(--surface2)}
.v5opt input{margin:0;accent-color:#000}
.v5opt input:focus-visible{outline:2px solid #000;outline-offset:2px}
.v5range{display:flex;flex-direction:column;gap:6px;padding:6px 12px 4px 32px;border-top:1px solid var(--line2);margin-top:4px}
.v5range label{display:flex;align-items:center;justify-content:space-between;gap:8px;font:11px var(--data);color:var(--ink3)}
.v5range input{font:12px var(--data);padding:3px 6px;border:1px solid var(--control-line);background:#fff;color:var(--ink)}
.v5range input:focus-visible{outline:2px solid #000;outline-offset:1px}
.v5link{border:0;background:none;padding:0 4px;font:11.5px var(--data);color:var(--ink2);text-decoration:underline;cursor:pointer}
.v5link:focus-visible,.v5also button:focus-visible{outline:2px solid #000;outline-offset:1px}
.v5bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:30px;margin:0 0 8px}
.v5summary{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font:12px var(--data);color:var(--ink3)}
.v5sep{color:var(--ink4)}
.v5also{color:var(--ink3)}
.v5also button{border:0;background:none;padding:0;font:inherit;color:var(--ink2);text-decoration:underline;cursor:pointer}
.v5sort{margin-left:auto}
.v5results[aria-busy="true"] .v2table{opacity:.55;transition:opacity .12s;pointer-events:none}
.v5results[aria-busy="true"] .v5pager,.v5results[aria-busy="true"] .v5also{pointer-events:none}
.v5count{display:inline-block;min-width:3ch;text-align:left}
.v5err{margin:2px 0 0;font:11px var(--data);color:#b3261e}
.v5emptyacts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.v5pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:10px;font:12px var(--data);color:var(--ink3)}
.v5pager .btn[disabled]{opacity:.45;cursor:default}
button.ext-pending{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;display:inline-flex;gap:2px;align-items:baseline}
button.ext-pending:focus-visible{outline:2px solid #000;outline-offset:2px}

/* ===================== PATCHING V6 — vulnerability remediation layer =====================
   Same tokens as V5 (monochrome, --ink/--line/--control-line). Nothing above is changed. */
.nav .label{padding:12px 12px 4px;margin:0}
.nav .label:first-of-type{padding-top:4px}
.side .v6-role{border-top:1px solid var(--line);padding:10px 12px;font-size:12px;color:var(--ink3)}
.side .v6-role label{display:block;font:11px var(--data);letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);margin-bottom:4px}
.side .v6-role select{width:100%;height:30px;border:1px solid var(--control-line);background:#fff;border-radius:3px;font-size:12px;padding:0 6px}
.side .v6-role button{margin-top:8px;background:none;border:0;padding:0;font-size:12px;text-decoration:underline;color:var(--ink3)}
.side{overflow:auto}

.v6-sub{font-size:12px;color:var(--ink3);margin-top:2px}
.v6-sim{font:11px var(--data);letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--control-line);border-radius:3px;padding:2px 6px;color:var(--ink3);white-space:nowrap}
.v6-integ{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink3);margin:0 0 16px}
.v6-integ b{color:var(--ink);font-weight:600}
.v6-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.v6-cards.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.v6-card{border:1px solid var(--line);background:#fff;padding:14px 16px;min-height:118px;display:flex;flex-direction:column}
.v6-card label{display:block;font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.v6-card .v{font:600 28px/32px var(--data);margin:8px 0 4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.v6-card .s{font-size:12px;color:var(--ink3)}
.v6-card .bar{height:4px;background:#e9e9e9;margin-top:auto}.v6-card .bar span{display:block;height:100%;background:#000}
.v6-alert{border:1px solid #000;border-left:4px solid #000;background:#fafafa;padding:10px 14px;display:flex;align-items:center;gap:16px;margin-bottom:16px;font-size:13px}
.v6-alert b{font-weight:700}.v6-alert .btn{margin-left:auto}
.v6-banner{border:1px solid var(--line);border-left:3px solid #000;background:#fafafa;padding:8px 12px;margin:0 0 16px;display:flex;gap:12px;align-items:center;font-size:12px;flex-wrap:wrap}
.v6-banner .sp{margin-left:auto}
.v6-banner button.link{font-size:12px}
.v6-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line2)}

/* ============================================================================
   MERGED BUILD — authoring and execution in one file.

   Two prototypes were merged here. The authoring flow (list → new plan →
   workspace → add item → submit, plus quick submit) came from one; the
   execution surface (plan execution with per-item stage bars, and the item
   view with its persistent navigator) came from the other. They had separate
   plans lists, separate data and separate CSS tokens; there is now one of
   each.

   The join is the plans list. A Plan opens to whichever view its state calls
   for — the workspace while it is a Draft, the execution view once it is not.
   ============================================================================ */

/* every plan carries a window as a pair, so the execution view can show a
   range and the authoring form can edit both ends */
/* What the change management system said about the request. Model-X records
   this answer; it never produces it. */
const APPROVAL={NONE:"none", REQUESTED:"requested", APPROVED:"approved", REJECTED:"rejected"};
/* Sample data carries no approval field, so it is derived once at seed time
   and is authoritative from then on. Runtime transitions set it explicitly. */
function seedApproval(p){
  if(p.changeApproval) return;
  if(p.mode!=="create")                     p.changeApproval=APPROVAL.APPROVED;
  else if(p.state===PLAN_STATE.DRAFT||p.state===PLAN_STATE.VALIDATING
       ||p.state===PLAN_STATE.VFAILED)
                                            p.changeApproval=APPROVAL.NONE;
  else                                      p.changeApproval=APPROVAL.APPROVED;
}

function normalisePlan(p){
  seedApproval(p);
  if(!p.windowStart){ p.windowStart = p.window || ""; }
  /* the execution views read p.window; the authoring form writes the pair.
     Keep the single field in step with the pair rather than having two. */
  Object.defineProperty(p, "window", {
    get(){ return this.windowStart || ""; },
    set(v){ this.windowStart = v; },
    configurable:true
  });
  if(!p.windowEnd){
    const m = /^(\d+)\s+(\w+),\s*(\d+):(\d+)$/.exec(p.windowStart||"");
    p.windowEnd = m ? (Number(m[1])+1)+" "+m[2]+", 02:00" : "";
  }
  if(!p.mode) p.mode = p.change && p.change!=="—" ? "byoc" : "create";
  p.items.forEach(i=>{
    if(!i.journey) i.journey = i.kind==="Virtual tenant" ? "virtual" : "rseries";
  });
}

/* The merged build's tab model (TABS/tabPlans/listTab) is gone. The listing is
   segmented by disposition — SEGMENTS — which is exhaustive and disjoint; the
   old tabs matched on state names half of which nothing produces. */

/* The sidebar carries an .active style that nothing ever set. Every view here
   lives under Plans, so it is the current section throughout. */
function setNav(){
  const section = v6Section(view);
  document.querySelectorAll("[data-nav]").forEach(b=>{
    const on = b.dataset.nav===section;
    b.classList.toggle("active",on);
    if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  const c=document.querySelector('[data-nav="plans"] .nav-count');
  if(c) c.textContent=DB().length;
  const d=document.querySelector('[data-nav="devices"] .nav-count');
  if(d) d.textContent=inventory().length;
  const a=document.querySelector('[data-nav="activity"] .nav-count');
  if(a && typeof activityLog==="function") a.textContent=activityLog().length;
}

function render(){
  setNav();
  if(typeof v6Render==="function" && v6Render()) return;
  if(view==="home") return renderHome();
  if(view==="activity") return renderActivity();
  if(view==="devices") return devSelected?renderDeviceDetail():renderDevices();
  if(view==="list") return renderListV2();
  if(view==="newplan") return renderNewPlan();
  if(view==="quick") return renderQuick();
  if(view==="item") return renderItemV2();
  const p=getPlan(selectedPlan);
  if(editing===selectedPlan && p && canEdit(p)) return renderWorkspace();
  return (p && p.state===PLAN_STATE.DRAFT) ? renderWorkspace() : renderPlanV2();
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

/* The marks read against ITEM_STATE, which is the only item vocabulary in this
   file. The merged build's dots were still matching "Running" and "Waiting for
   action" — names nothing produces — so every item drew a blank dot. */
function dotClass(s){
 if(s===ITEM_STATE.INPROGRESS||s===ITEM_STATE.ROLLINGBACK) return "half";
 if(s===ITEM_STATE.SCHEDULED) return "wait";
 if(s===ITEM_STATE.SUCCEEDED||s===ITEM_STATE.ROLLEDBACK)   return "fill";
 if(s===ITEM_STATE.ACTION||s===ITEM_STATE.FAILED||s===ITEM_STATE.ROLLBACKFAILED
   ||s===PLAN_STATE.VFAILED) return "fail";
 return "";
}

function stateHTML(s){
 return `<span class="state"><i class="dot ${dotClass(s)}"></i>${esc(s)}</span>`;
}

/* A deleted Draft is soft-deleted: kept here, as the backend would keep it,
   and out of every user-facing view. Nothing in the prototype reads it back. */
const DELETED_PLANS=[];
function deleteDraft(p){
  if(!p || p.state!==PLAN_STATE.DRAFT) return;
  const n=plansV2.indexOf(p); if(n<0) return;
  plansV2.splice(n,1);
  DELETED_PLANS.push(Object.assign(p,{deleted:true, deletedAt:clockLabel()}));
}

function announce(msg){
  const el=document.getElementById("srStatus"); if(!el) return;
  /* re-setting identical text does not re-announce, so clear first */
  el.textContent=""; setTimeout(()=>{ el.textContent=msg; },50);
}
/* ============================================================================
   CONFIRMATION

   Used only where the consequence cannot be undone from the interface. It
   states what the action does and, as importantly, what it does NOT do — the
   completed work stays completed, which is the reading the client was explicit
   about not wanting operators to get wrong (2026-09-17).

   Focus lands on the dismissive button, never the destructive one.
   ============================================================================ */
let confirmFn=null;
function askConfirm({title,body,confirmLabel,onConfirm}){
  const bg=document.getElementById("confirmBg");
  document.getElementById("confirmTitle").textContent=title;
  document.getElementById("confirmBody").innerHTML=body;
  document.getElementById("confirmFoot").innerHTML=
    `<button class="btn" type="button" id="cfNo">Go back</button>
     <button class="btn danger" type="button" id="cfYes">${esc(confirmLabel)}</button>`;
  confirmFn=onConfirm;
  openDialogBg(bg);
  /* the safe option takes focus, so Enter on open can never destroy anything */
  const no=document.getElementById("cfNo");
  if(no) no.focus();
  no.onclick=()=>closeDialogBg(bg);
  document.getElementById("cfYes").onclick=()=>{
    const fn=confirmFn; confirmFn=null; closeDialogBg(bg); if(fn) fn();
  };
}

function showToast(msg){announce(msg);const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.style.display="none",2400);}

/* ============================================================================
   ITEM CREATION ENGINE

   The form is defined by data, not by hard-coded OS layouts. Adding an
   operation type means adding an entry to OPERATIONS, not editing a renderer.

   Fields declare what they depend on. Changing an upstream answer clears
   everything downstream rather than leaving a stale value silently selected.

   One engine serves Quick Submit and Add Item. The only difference is plan
   context: an item added to a plan inherits the operation type and the change
   window and is never asked for them again.

   The impact check is mandatory and is invalidated by any change to the
   selections it was calculated from.
   ============================================================================ */
