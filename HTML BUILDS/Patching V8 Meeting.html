          {k:"close",   name:"Close change record",    note:"Closed once every item is terminal", post:true,
           ms:["Confirm every item has reached a terminal state","Attach the outcome to the change record","Close the record"]}],
  /* The user owns a ticket they brought themselves, so Model-X never closes it. */
  byoc:  [{k:"validate",name:"Validate change record", note:"Exists, holds these devices, and is valid for this window",
           ms:["Confirm the record exists","Confirm it covers these devices","Confirm approval before the window opens"]}]
};
/* The task that runs the plan's items. It is one step of the plan's workflow —
   the bridge between the plan and the work it was built to do — not a second
   workflow and not a lifecycle state. `items:true` marks it so its state is
   read from the items rather than from the plan's task record. */
const PT_EXECUTE={k:"execute", name:"Execute items", items:true};
/* The tasks a plan runs, in order, with the item execution sitting between the
   tasks that precede it and the tasks that follow. The names come from the
   data; nothing here tests a workflow type. */
/* What the Execute items task says beneath its name. Before execution it is
   the plan's own waiting state; afterwards it is the distribution the header
   already shows, from the same calculation. Nothing is invented. */
function executeSummary(p){
  if(!p.items.length) return "No items";
  if(!executionStarted(p))
    return plural(p.items.length,"item")+STATUS_SEP+(p.state===PLAN_STATE.SCHEDULED?"Scheduled":p.state);
  return executionComposition(p);
}
function planWorkflowTasks(p){
  const defs=planTaskDefs(p);
  return [...defs.filter(d=>!d.post), PT_EXECUTE, ...defs.filter(d=>d.post)];
}
const PT_PRE="Not started", PT_RUN="Running", PT_OK="Succeeded",
      PT_FAIL="Failed", PT_WAIT="Waiting";

function planTaskDefs(p){ return PT_DEF[p.mode==="create"?"create":"byoc"]; }

/* Task state is derived from plan state — there is no second source of truth
   that could disagree with the pill at the top of the screen. */
function planTasks(p){
  const defs=planWorkflowTasks(p), S=p.state;
  let failedAt=defs.findIndex(d=>d.k===p.planTaskKey);
  /* A recorded failure must always land on a row. If the named task is not in
     this mode's lifecycle the data is wrong, and the last pre-task carries it
     rather than the failure disappearing off the screen. */
  if(S===PLAN_STATE.ACTION && failedAt<0 && p.planTaskFailed)
    failedAt=Math.max(0,defs.findIndex(d=>d.post)-1<0?defs.length-1:defs.findIndex(d=>d.post)-1);
  return defs.map((d,n)=>{
    let st=PT_PRE, why="";
    if(S===PLAN_STATE.ACTION && failedAt>=0){
      st = n<failedAt ? PT_OK : n===failedAt ? PT_FAIL : PT_PRE;
      if(n===failedAt) why=p.planTaskFailed||"The task did not complete.";
    }
    else if(S===PLAN_STATE.DRAFT||S===PLAN_STATE.VALIDATING||S===PLAN_STATE.VFAILED) st=PT_PRE;
    else if(false){
      st = d.k==="create" ? PT_OK : d.k==="validate" ? PT_WAIT : PT_PRE;
      if(d.k==="validate") why="Approval is checked when the window opens. Getting it approved in time sits with the requester.";
    }
    else if(false){
      st = d.k==="create" ? PT_OK : d.k==="validate" ? PT_FAIL : PT_PRE;
      if(d.k==="validate") why=(p.change||"The change record")+" was not approved before the window opened.";
    }
    /* Waiting is not validated-for-execution: while Scheduled the plan is
       waiting, and the pre-execution check has not run yet. */
    else if(S===PLAN_STATE.SCHEDULED){
      st = d.post ? PT_PRE : d.k==="wait" ? PT_WAIT : (d.k==="validate"&&p.mode==="create") ? PT_PRE : PT_OK;
      if(d.k==="wait") why="Opens "+windowLabel(p)+".";
    }
    else if(S===PLAN_STATE.EXECUTING){
      /* the window has opened: the pre-execution check runs until an item
         has actually begun its work */
      const begun=p.items.some(itemHasRun);
      st = d.post ? PT_PRE : (d.k==="validate"&&p.mode==="create"&&!begun) ? PT_RUN : PT_OK;
    }
    else if(S===PLAN_STATE.COMPLETING){ st = d.post ? PT_RUN : PT_OK; }
    else if(TERMINAL.has(S)){
      if(p.windowExpired||S===PLAN_STATE.CANCELLED) st = d.post ? PT_PRE : PT_OK;
      else st = PT_OK;
    }
    /* The item execution reports what the items are actually doing. It is
       never "done" while an item is still running, and never counts a failed
       or skipped item as completed. */
    if(d.items){
      /* Running until every item has settled. An item needing a decision is
         reported in the line beneath — it does not fail the plan's task, which
         is still dispatching and tracking the rest. */
      if(!executionStarted(p) || (p.mode==="create" && !p.items.some(itemHasRun))) st=PT_PRE;
      else if(p.items.every(isTerminalItem)) st=PT_OK;
      else                                   st=PT_RUN;
      why="";
    }
    return {k:d.k,name:d.name,note:d.note,post:!!d.post,items:!!d.items,state:st,why};
  });
}

/* A plan-level failure before the items run is a different event from an item
   failing, and from a close that failed after every item already finished. */
function planFailurePhase(p){
  if(p.state!==PLAN_STATE.ACTION) return null;
  const d=planTaskDefs(p).find(x=>x.k===p.planTaskKey);
  return d && d.post ? "post" : "pre";
}

/* ---- execution reference ---- */
function execRef(p){ return p.execRef || null; }

/* ---- the dataset. Every item's operation type matches its plan, and
   every device/tenant pair exists in the reference data. ---- */
let plansV2=[];
/* Every valid target the authoring form could produce, in one pool. */
function targetPool(){
  const out=[];
  Object.keys(TENANTS_BY_DEVICE).forEach(h=>TENANTS_BY_DEVICE[h].forEach(t=>
    out.push({name:t.id, kind:"R-series device", journey:"rseries",
              device:h, tenant:t.id, from:t.v, impact:2})));
  VIRTUAL_TENANTS.forEach(t=>out.push({name:t.id, kind:"Virtual tenant", journey:"virtual",
              device:"—", tenant:t.id, from:t.v, impact:2}));
  /* a tenant already on the newest approved version has nothing to upgrade to,
     and validation would reject it — so it is not a candidate for a plan */
  return out.filter(t=>TMOS_VERSIONS.some(v=>isTarget(v)&&v.approved&&newer(v.v,t.from)));
}
const verNum=v=>v.split(".").map(Number);
function newer(a,b){                      /* is a strictly newer than b? */
  const x=verNum(a), y=verNum(b);
  for(let i=0;i<Math.max(x.length,y.length);i++){
    if((x[i]||0)!==(y[i]||0)) return (x[i]||0)>(y[i]||0);
  }
  return false;
}
function pickTarget(pool){
  /* cycle rather than clamp: clamping made every item past the pool size
     collapse onto the same target, so a plan could upgrade one tenant twice */
  if(!pool.length) targetPool().forEach(x=>pool.push(x));
  const t=pool.shift();
  /* an upgrade goes forwards. Picking the first approved version that merely
     differed produced downgrades for tenants already on the latest. */
  const up=TMOS_VERSIONS.filter(v=>isTarget(v)&&v.approved&&newer(v.v,t.from));
  const to=(up[0]||TMOS_VERSIONS.find(v=>v.approved)||TMOS_VERSIONS[0]).v;
  return Object.assign({},t,{to});
}

function buildV2Data(){
  const pool=targetPool();
  const V2_STATE={ "PL-0033":PLAN_STATE.ACTION, "PL-0012":PLAN_STATE.EXECUTING,
    "PL-0040":PLAN_STATE.VALIDATING, "PL-0035":PLAN_STATE.SCHEDULED,
    "PL-0034":PLAN_STATE.SCHEDULED,  "PL-0031":PLAN_STATE.DRAFT,
    "PL-0024":PLAN_STATE.SCHEDULED, "PL-0018":PLAN_STATE.COMPLETED, "PL-0051":PLAN_STATE.DRAFT };
  const IMAP={ "Waiting for action":ITEM_STATE.ACTION, "Running":ITEM_STATE.INPROGRESS,
    "Completed":ITEM_STATE.SUCCEEDED, "Validating":ITEM_STATE.VALIDATING,
    "Queued":ITEM_STATE.QUEUED, "Draft":ITEM_STATE.DRAFT };
  plansV2=plans.map(p=>{
    const q=Object.assign({},p);
    Object.defineProperty(q,"window",{get(){return this.windowStart||"";},
      set(v){this.windowStart=v;},configurable:true});
    q.windowStart=p.windowStart; q.windowEnd=p.windowEnd;
    q.state=V2_STATE[p.id]||PLAN_STATE.DRAFT;
    q.mode=p.mode;
    /* Items are generated from the same reference data the authoring form
       selects from, so the list can never assert a combination the form
       could not produce. */
    q.items=p.items.map((i,n)=>{
      const t=pickTarget(pool);
      return {id:i.id, name:t.name, kind:t.kind, journey:t.journey,
        device:t.device, tenant:t.tenant, operation:p.operation,
        impactCount:t.impact, from:t.from, to:t.to,
        stage:"Not started", state:IMAP[i.state]||ITEM_STATE.QUEUED};
    });
    if(p.id==="PL-0031"){
      /* the failure has to be real, or the state is an assertion with no evidence */
      q.items.forEach(i=>{ i.to=i.from;              /* version already running */
        i.state=ITEM_STATE.DRAFT; });                  /* nothing is queued on a failed plan */
      q.errors=runValidation(q);
      /* This plan was submitted and answered, so it is no longer a Draft. */
      q.validationFailed=true; q.state=PLAN_STATE.VFAILED;
    }
    if(q.state===PLAN_STATE.ACTION){
      /* The only plan-level task that can fail before items run is one of the
         change-record pre-tasks, and creating a record is something only a
         system-created plan does. The mode follows the failure, not the seed. */
      q.mode="create"; q.change="";   /* the change was never created */
      q.planTaskFailed="Creating the change record on the change management system timed out.";
      q.planTaskKey="create"; q.planTaskPhase="pre";
    }
    /* Awaiting approval and Not approved both describe a record Model-X raised
       — a ticket the user brought is checked for approval at submit time. */
    if(q.state===PLAN_STATE.SCHEDULED){ q.mode="create"; }
    q.items.forEach(it=>{ const n=flatTasks(workflowFor(it).wf||[[]]).length||1;
      it.taskIdx = it.state===ITEM_STATE.SUCCEEDED ? n-1
                 : it.state===ITEM_STATE.INPROGRESS ? Math.floor(n*0.55)
                 : it.state===ITEM_STATE.ACTION ? Math.floor(n*0.7) : 0;
      /* where inside the current task the run has reached */
      const wf=workflowFor(it).wf;
      const cur=wf?flatTasks(wf)[it.taskIdx]:null;
      const msN=cur?cur.ms.length:0;
      it.msIdx = it.state===ITEM_STATE.INPROGRESS ? Math.floor(msN/2) : 0; });
    /* No execution reference: the plan id is the one identifier (2026-09-17). */
    if(q.state===PLAN_STATE.EXECUTING){ q.startedAt="22:04"; }
    if(q.state===PLAN_STATE.COMPLETED){ q.endedAt="03:12";
      q.items.forEach(i=>i.state=ITEM_STATE.SUCCEEDED); }
    return q;
  });
  /* a device/tenant pair the authoring flow forbids must never be seeded */
  plansV2.forEach(p=>p.items.forEach(i=>{
    if(i.tenant==="tnt-payments-01") i.device="rseries-ard-01";
    if(i.device==="rseries-cin-03"){ i.device="rseries-cin-01"; i.tenant="tnt-clearing-01"; }
  }));
  /* One plan whose window opened and closed with nothing dispatched — the
     Expired case, and the only place Skipped items come from. It gets a plan of
     its own: this and the outright-failure case below both used to claim
     PL-0024, so the second silently overwrote the first. */
  /* The only coherent way every item is still Queued when a window closes:
     the workflow was never started, because the change was never approved. The
     plan sat in Awaiting approval until the window passed.

     It was previously built as a bring-your-own-change plan, which contradicted
     its own description — a change you supply is already approved, so that plan
     would have been Scheduled and would have dispatched at 22:00, and three
     items untouched across four hours would be an orchestrator incident rather
     than a state to draw. */
  /* Two endings that both leave work undone, and which the build previously
     conflated. They are not the same event and they are not the same person's
     problem (S-11, and the requirement that a refusal must not read as an
     abandonment).

     A requested window that did not pass validation. There is no approved or
     declined outcome (2026-09-25): the window is one of the things validation
     checks, and a failure is answered by requesting a different window and
     submitting again. No change record exists yet, so there is no number. */
  const refused={id:"PL-0021", name:"Bramble tenants, September window",
    desc:"Requested window failed validation", operation:"TMOS",
    /* a requested-window plan that failed validation never had its change created */
    change:"", raisedOn:"28 Aug",
    windowStart:"2 Sep, 22:00", windowEnd:"3 Sep, 02:00",
    mode:"create", state:PLAN_STATE.VFAILED, validationFailed:true,
    changeApproval:APPROVAL.NONE,
    /* A message that did arrive with the failure — the interchangeable half of
       the model, shown in place of the fallback. */
    errors:[{item:"—", name:"Change window",
             fails:[failure("The requested window did not pass validation. Request a different window and submit again.",
                            "Change window")],
             passes:[]}],
    items:[]};
  Object.defineProperty(refused,"window",{get(){return this.windowStart||"";},
    set(v){this.windowStart=v;},configurable:true});
  {
    const pool3=targetPool();
    ["IT-2101","IT-2102","IT-2103"].forEach(id=>{
      const t=pickTarget(pool3);
      refused.items.push({id,name:t.name,kind:t.kind,journey:t.journey,device:t.device,
        tenant:t.tenant,operation:"TMOS",impactCount:t.impact,from:t.from,to:t.to,
        stage:"Not started",state:ITEM_STATE.DRAFT,taskIdx:0});
    });
    /* Attention routing has two scopes and they are independent, so at least
       one seeded plan has to carry both at once. The item failures are real —
       two items are pointed at the version they already run, which the version
       check rejects — and are merged with the plan's own error rather than
       replacing it. The third item stays clean so the list is a mix. */
    refused.items[0].to = refused.items[0].from;
    /* Two failures on one item, so the summary is visibly counting items and
       not messages: three messages across two items still reads "2 items". */
    refused.items[0].operation = "IOS-XE";
    refused.items[1].to = refused.items[1].from;
    refused.errors = refused.errors.concat(
      runValidation(refused).filter(e=>e.item&&e.item!=="—"));
  }
  plansV2.push(refused);

  /* The window closed on a plan that was part way through. The closure is a
     fact about the window; the plan's outcome is what happened to the items —
     two of four completed, so it completed with failures. `windowExpired`
     carries the window fact alongside it, and the per-item status still says
     which ones were never attempted rather than failed. */
  const expired={id:"PL-0022", name:"Cinder tenants, August window",
    desc:"Window closed with two items unstarted", operation:"TMOS",
    change:"CHG0010007512",
    windowStart:"26 Aug, 22:00", windowEnd:"27 Aug, 02:00",
    mode:"byoc", state:PLAN_STATE.PARTIAL, windowExpired:true,
    expiredAt:"27 Aug, 02:00", endedAt:"27 Aug, 02:00", items:[]};
  Object.defineProperty(expired,"window",{get(){return this.windowStart||"";},
    set(v){this.windowStart=v;},configurable:true});
  {
    const pool4=targetPool();
    [["IT-2201",ITEM_STATE.SUCCEEDED],["IT-2202",ITEM_STATE.SUCCEEDED],
     ["IT-2203",ITEM_STATE.SKIPPED],["IT-2204",ITEM_STATE.SKIPPED]].forEach(([id,st])=>{
      const t=pickTarget(pool4);
      expired.items.push({id,name:t.name,kind:t.kind,journey:t.journey,device:t.device,
        tenant:t.tenant,operation:"TMOS",impactCount:t.impact,from:t.from,to:t.to,
        stage:st===ITEM_STATE.SUCCEEDED?"Complete":"Not started", state:st,
        taskIdx:st===ITEM_STATE.SUCCEEDED?18:0,
        expiryNote:st===ITEM_STATE.SKIPPED?"The window closed before this item started.":undefined});
    });
  }
  plansV2.push(expired);


  /* F5OS host-pair upgrades — the peer journey, built exactly as the form
     produces it: two peers chosen by hand, no tenant, host OS versions. */
  const f5osItem=(id,a,b,from,to,state)=>({id, name:a+" / "+b, kind:"Host pair",
    journey:"hostpair", device:a+" / "+b, peer1:a, peer2:b, tenant:"—",
    /* tenants only — the hosts are the containers they were found in, which is
       the count convention the impact table itself uses */
    operation:"F5OS", impactCount:(TENANTS_BY_DEVICE[a]||[]).length+(TENANTS_BY_DEVICE[b]||[]).length,
    from, to, stage:"Not started", state, taskIdx:0});
  const f5osPlan=(id,name,desc,change,ws,we,state,items)=>{
    const q={id,name,desc,operation:"F5OS",change,windowStart:ws,windowEnd:we,
             mode:"byoc",state,items};
    Object.defineProperty(q,"window",{get(){return this.windowStart||"";},
      set(v){this.windowStart=v;},configurable:true});
    return q;
  };
  plansV2.splice(2,0,
    f5osPlan("PL-0060","Ardent host platform, F5OS uplift","Both Ardent hosts, rolling",
      "CHG0010007990","14 Oct, 22:00","15 Oct, 02:00", PLAN_STATE.EXECUTING,
      [f5osItem("IT-6001","rseries-ard-01","rseries-ard-02","1.6.2","1.8.0",ITEM_STATE.INPROGRESS)]),
    f5osPlan("PL-0061","Bramble host platform, F5OS uplift","Both Bramble hosts",
      "CHG0010007990","24 Oct, 22:00","25 Oct, 02:00", PLAN_STATE.SCHEDULED,
      [f5osItem("IT-6002","rseries-bra-01","rseries-bra-02","1.7.0","1.8.0",ITEM_STATE.QUEUED)]));
  plansV2.find(p=>p.id==="PL-0060").mode="byoc";
  plansV2.find(p=>p.id==="PL-0061").mode="create";
  plansV2.find(p=>p.id==="PL-0060").startedAt="22:06";
  plansV2.find(p=>p.id==="PL-0061").raisedOn="8 Sep";

  /* one quick submit already in flight, so the two kinds sit side by side */
  const qs={id:"PL-7042", name:"vtn-settle-01 → 17.1.1", desc:"Add an item",
    operation:"TMOS", change:"CHG0010007455", windowStart:"12 Oct, 22:00", windowEnd:"13 Oct, 02:00",
    mode:"byoc", virtual:true, state:PLAN_STATE.SCHEDULED,
    items:[{id:"IT-7043", name:"vtn-settle-01", kind:"Virtual tenant", journey:"virtual",
      device:"—", tenant:"vtn-settle-01", operation:"TMOS", impactCount:2,
      from:"16.1.4", to:"17.1.1", stage:"Not started", state:ITEM_STATE.QUEUED, taskIdx:0}]};
  Object.defineProperty(qs,"window",{get(){return this.windowStart||"";},
    set(v){this.windowStart=v;},configurable:true});
  plansV2.splice(3,0,qs);

  /* One partial and one outright failure, so the outcome markers the design
     distinguishes are actually reachable. */
  const part=plansV2.find(p=>p.id==="PL-0018");
  if(part){ part.state=PLAN_STATE.PARTIAL; part.endedAt="03:12"; part.closeDone=true;
    part.items.forEach((i,n)=>i.state = n===0 ? ITEM_STATE.FAILED : ITEM_STATE.SUCCEEDED);
    if(part.items[0]){ part.items[0].failedTask=13; part.items[0].taskIdx=13;
      part.items[0].failureReason="Upgrade image did not install on the standby node."; }
    /* Rolled back and Cancelled are terminal outcomes the item table has to be
       able to draw, so at least one of each exists in the data. */
    /* Distinct targets: these were copies of the last item and so repeated its
       tenant, which put the same tenant on the same host three times in one
       plan — something the authoring flow could never produce. */
    const rolled={...part.items[part.items.length-1], id:"IT-1890",
      name:"tnt-cards-02", tenant:"tnt-cards-02", device:"rseries-ard-02",
      state:ITEM_STATE.ROLLEDBACK, failedTask:13, taskIdx:13};
    const abandoned={...part.items[part.items.length-1], id:"IT-1891",
      name:"tnt-web-02", tenant:"tnt-web-02", device:"rseries-ard-02",
      state:ITEM_STATE.CANCELLED, taskIdx:11, failedTask:11,
      failureReason:"Device stopped responding during the image upload."};
    part.items.push(rolled,abandoned);
  }
  const failp=plansV2.find(p=>p.id==="PL-0024"); if(failp) failp.closeDone=true;
  const fail=plansV2.find(p=>p.id==="PL-0024");
  if(fail){ fail.state=PLAN_STATE.FAILED; fail.endedAt="01:48";
    fail.items.forEach(i=>i.state=ITEM_STATE.FAILED); }


  /* One item stopped at a real task in the captured workflow, so the recovery
     actions have something concrete to act on. Task 13 is Standby Node Upgrade. */
  plansV2.filter(q=>q.state===PLAN_STATE.EXECUTING).forEach(q=>{
    const a=q.items.find(i=>i.state===ITEM_STATE.ACTION);
    if(a){ a.failedTask=13;                 /* step 13 · Standby Node Upgrade */
           a.msIdx=3;                       /* stopped installing to the boot volume */
           a.failureReason="Upgrade image did not install on the standby node. The device is unchanged and the pair is still serving traffic from the active node.";
           a.taskIdx=13; }
  });

  /* A system-created plan whose items all finished but whose change record
     would not close. Distinct from an item failure: the work is done, the
     paperwork is not. */
  const closeFail={id:"PL-0072", name:"Settlement tenants, October drop",
    desc:"Four tenants, one window", operation:"TMOS", change:"CR-8031",
    windowStart:"6 Sep, 22:00", windowEnd:"7 Sep, 02:00", mode:"create",
    state:PLAN_STATE.ACTION, closeDone:false,
    planTaskKey:"close", planTaskPhase:"post",
    planTaskFailed:"Closing the change record on the change management system returned an error.",
    startedAt:"22:03", endedAt:"01:39", execRef:"EX-0072-01",
    items:[]};
  Object.defineProperty(closeFail,"window",{get(){return this.windowStart||"";},
    set(v){this.windowStart=v;},configurable:true});
  {
    const pool2=targetPool();
    ["IT-7201","IT-7202","IT-7203","IT-7204"].forEach((id,n)=>{
      const t=pickTarget(pool2);
      closeFail.items.push({id,name:t.name,kind:t.kind,journey:t.journey,device:t.device,
        tenant:t.tenant,operation:"TMOS",impactCount:t.impact,from:t.from,to:t.to,
        stage:"Not started",state:ITEM_STATE.SUCCEEDED,taskIdx:0});
    });
    /* one of them was rolled back, and the rollback itself failed — the
       escalation case the requirements single out */
    const rb=closeFail.items[3];
    rb.state=ITEM_STATE.ROLLBACKFAILED; rb.failedTask=13; rb.taskIdx=13;
    rb.failureReason="Upgrade image did not install on the standby node.";
    rb.rollbackReason="The rollback could not restore the previous image — the device did not come back after the reboot.";
  }
  plansV2.splice(4,0,closeFail);

  /* Nothing may claim to have run on a plan that never reached execution. */
  plansV2.forEach(q=>{
    if(planHasRun(q) || q.windowExpired) return;
    const resting = q.state===PLAN_STATE.VALIDATING ? ITEM_STATE.VALIDATING
      : q.state===PLAN_STATE.SCHEDULED ? ITEM_STATE.SCHEDULED
      : ITEM_STATE.DRAFT;                                          /* draft or failed */
    q.items.forEach(i=>{ i.state=resting; i.taskIdx=0; i.stage="Not started"; });
    delete q.execRef;
  });

  /* Anchor a live window onto every plan that has actually reached execution.
     A plan holding an item in Action required gets a short one, because the
     pressure that state is under is the whole point of the countdown. */
  /* Seed ids are readable while sample data is assembled. They are converted
     to internal UUID keys after lookup; assignPlanRefs() separately gives each
     Plan its operator-facing PL### reference before the first render. */
  plansV2.forEach((q,n)=>{
    const seed=[...String(q.id)].reduce((a,c)=>a*31+c.charCodeAt(0),n+7);
    q.seedId=q.id;
    q.id=uuid(seed);
  });

  const MIN=60000;

  /* A second plan mid-run, so the Running tab holds more than one. Three items,
     all executing — with capacity unlimited every eligible item starts when the
     window opens, so none of them is Queued.

     The estate has twenty upgradeable tenants and the other plans already claim
     eighteen of them, so these three are moved out of the largest running plan
     rather than invented. A tenant cannot be upgraded by two plans at once, and
     adding devices to make room would change the Devices module, which is out
     of scope. Nothing new is fabricated; the work is redistributed. */
  const running3={id:"PL-0023", name:"Ardent tenants, evening window",
    desc:"Three tenants in one window", operation:"TMOS",
    change:"CHG0010007688",
    windowStart:"19 Sep, 22:00", windowEnd:"20 Sep, 02:00",
    mode:"byoc", state:PLAN_STATE.EXECUTING, startedAt:"22:07", items:[]};
  Object.defineProperty(running3,"window",{get(){return this.windowStart||"";},
    set(v){this.windowStart=v;},configurable:true});
  {
    const donor=plansV2
      .filter(q=>q.state===PLAN_STATE.EXECUTING)
      .sort((a,b)=>b.items.length-a.items.length)[0];
    const movable=donor?donor.items.filter(i=>i.state===ITEM_STATE.INPROGRESS):[];
    movable.slice(0,3).forEach((it,n)=>{
      donor.items.splice(donor.items.indexOf(it),1);
      /* each one a different distance through the same workflow, which is what
         parallel execution actually looks like */
      running3.items.push(Object.assign(it,{
        id:["IT-2301","IT-2302","IT-2303"][n],
        stage:"In flight", state:ITEM_STATE.INPROGRESS,
        taskIdx:[2,5,9][n], msIdx:[1,0,2][n]}));
    });
  }
  if(running3.items.length) plansV2.push(running3);

  /* The Closed tab had Failed, Completed with failures and Completed with
     exceptions but no plain Completed — the one outcome where every item
     succeeded. Same estate constraint as above: every upgradeable tenant is
     already committed, so these items are moved out of the largest running
     plan and finished, rather than invented. Their window is in the past and
     every task ran, which is what a completed plan is. */
  const completed={id:"PL-0024", name:"Cinder tenants, September window",
    desc:"Every item completed", operation:"TMOS",
    change:"CHG0010007531",
    windowStart:"12 Sep, 22:00", windowEnd:"13 Sep, 02:00",
    mode:"byoc", state:PLAN_STATE.COMPLETED,
    startedAt:"22:02", endedAt:"01:48", items:[]};
  Object.defineProperty(completed,"window",{get(){return this.windowStart||"";},
    set(v){this.windowStart=v;},configurable:true});
  {
    const donor=plansV2
      .filter(q=>q.state===PLAN_STATE.EXECUTING&&q!==running3)
      .sort((a,b)=>b.items.length-a.items.length)[0];
    const movable=donor?donor.items.filter(i=>i.state===ITEM_STATE.INPROGRESS):[];
    const all=(workflowFor(movable[0]||{}).wf||[]);
    const lastTask=Math.max(0,flatTasks(all).length-1);
    movable.slice(0,2).forEach((it,n)=>{
      donor.items.splice(donor.items.indexOf(it),1);
      completed.items.push(Object.assign(it,{
        id:["IT-2401","IT-2402"][n],
        stage:"Complete", state:ITEM_STATE.SUCCEEDED,
        /* every task ran; the item's current version is the one it reached */
        from:it.from, taskIdx:lastTask, msIdx:0}));
    });
  }
  if(completed.items.length) plansV2.push(completed);

  /* every seeded plan carries the approval fact explicitly from here on */
  plansV2.forEach(seedApproval);
  /* Draft is a pre-submission item status. A plan that has been submitted and
     has not yet run holds Scheduled items — including one stopped on a
     plan-level task, where the items are waiting on that, not on the author.
     A failed validation is Draft with errors, so its items remain editable. */
  const SUBMITTED_NOT_RUN=new Set([PLAN_STATE.VALIDATING, PLAN_STATE.SCHEDULED]);
  plansV2.forEach(q=>{
    const pending = SUBMITTED_NOT_RUN.has(q.state)
      || (q.state===PLAN_STATE.ACTION && q.planTaskPhase!=="post" && !q.items.some(itemHasRun));
    if(!pending) return;
    q.items.forEach(i=>{ if(i.state===ITEM_STATE.DRAFT) i.state=ITEM_STATE.SCHEDULED; });
  });
  /* and its running/queued split follows the engine's capacity, not the seed */
  plansV2.forEach(applyExecutionCapacity);
  plansV2.forEach(q=>{
    if(!LIVE_STATES.has(q.state)) return;
    const waiting=q.items.some(i=>i.state===ITEM_STATE.ACTION);
    const left=(waiting?6:47)*MIN, total=4*60*MIN;
    q.winEndsAt=Date.now()+left;
    q.winOpensAt=q.winEndsAt-total;
  });

  migrateOperationTypes();
  seedListVolume();
}

/* The seed was written when operation type meant OS. Each plan's workflow is
   read from its items' journey (no seeded plan mixes journeys), and an item's
   own operation follows it. An item carrying something else entirely — PL014's
   seeded IOS-XE item — is left as it is, so submit validation still catches it. */
function migrateOperationTypes(){
  const legacy=new Set(["TMOS","F5OS"]);
  plansV2.forEach(p=>{
    const j=(p.items[0]&&p.items[0].journey) || (p.operation==="F5OS"?"hostpair":"rseries");
    const op=opOfJourney(j);
    if(legacy.has(p.operation)) p.operation=op;
    if(String(p.change||"").trim()==="requested") p.change="";
    if(p.mode==="create" && [PLAN_STATE.DRAFT,PLAN_STATE.VALIDATING,PLAN_STATE.VFAILED].includes(p.state)) p.change="";
    if(p.state===PLAN_STATE.DRAFT && p.mode!=="create"){ p.windowStart=""; p.windowEnd=""; }
    p.items.forEach(i=>{ if(legacy.has(i.operation)) i.operation=opOfJourney(i.journey||j)||op; });
  });
}

/* ============================================================================
   V5 LIST VOLUME — demonstration data for the paginated Plans list.
   The list is specified against a backend holding far more plans than a page
   shows: Needs You 6 · Running 14 · Waiting 8 · Closed 126. These records are
   copied from seeded plans in the same status, so every one opens to a
   coherent Plan Detail. The estate has only twenty upgradeable tenants, so
   they reuse seeded targets: they are volume for the listing, not a claim
   about device concurrency. Running volume is held at Validating and Waiting
   volume at Scheduled — the two states in which nothing reaches a device.
   CHG0087312 is the scenario change: one Running plan, two Closed (one tenant
   upgrade, one host upgrade), so search, tab and filter each narrow something.
   ============================================================================ */
const LIST_VOLUME={running:14, waiting:8, done:126};
function seedListVolume(){
  const count=k=>plansV2.filter(p=>disposition(p)===k).length;
  const validating=plansV2.find(p=>p.state===PLAN_STATE.VALIDATING);
  const scheduled=plansV2.filter(p=>p.state===PLAN_STATE.SCHEDULED);
  const closedBy=st=>plansV2.filter(p=>p.state===st);
  const f5osLive=plansV2.find(p=>p.operation===OP.HOST && p.state===PLAN_STATE.EXECUTING);
  let x=0x5eed5; const rnd=n=>{ x^=x<<13; x>>>=0; x^=x>>17; x^=x<<5; x>>>=0; return x%n; };
  const SITES=["Ardent","Bramble","Cinder","Dunmore","Everly","Fenwick","Galloway","Harrow"];
  const SCOPES=["perimeter tenants","edge tenants","virtual tenant wave","access tenants",
                "platform refresh","load-balancer tenants","DMZ tenants","core tenants"];
  const MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const used=new Set(plansV2.map(p=>p.name));
  /* Windows are placed relative to today, so Today / This week / Next 7 days
     always have something to find, whichever day the prototype is opened. */
  const DAY=864e5, today=new Date(); today.setHours(0,0,0,0);
  const pad=n=>String(n).padStart(2,"0");
  const fmt=d=>`${d.getDate()} ${MON[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  let seq=0, chg=10008100;
  function nameFor(mo){
    for(let k=0;k<40;k++){
      const n=`${SITES[rnd(SITES.length)]} ${SCOPES[rnd(SCOPES.length)]}, ${MONL[mo]}`;
      if(!used.has(n)){ used.add(n); return n; }
    }
    const n=`Tenant wave ${seq}, ${MONL[mo]}`; used.add(n); return n;
  }
  function clone(t, o){
    seq++;
    const c=JSON.parse(JSON.stringify(t));
    c.id=uuid(0x51000+seq); c.seedId=c.id; delete c.displayRef;
    c.items.forEach((it,n)=>{ it.id="IT-"+(8000+seq*10+n); });
    const s=new Date(today.getTime()+o.offset*DAY);
    const [h,m]=(o.time||"22:00").split(":").map(Number); s.setHours(h,m,0,0);
    const e=new Date(s.getTime()+4*3600e3);
    Object.assign(c,{name:o.name||nameFor(s.getMonth()), change:o.change||("CHG00"+(++chg)),
      windowStart:fmt(s), windowEnd:fmt(e)});
    Object.defineProperty(c,"window",{get(){return this.windowStart||"";},
      set(v){this.windowStart=v;},configurable:true,enumerable:true});
    if(o.operation) c.operation=o.operation;
    /* a copied plan that closed with its window ends when its own window ends */
    ["endedAt","expiredAt"].forEach(k=>{ if(/\d{1,2} [A-Z][a-z]{2}/.test(c[k]||"")) c[k]=fmt(e); });
    plansV2.push(c); return c;
  }
  /* an F5OS plan that finished: the live F5OS host-pair plan, every task run */
  let f5osDone=null;
  if(f5osLive){
    f5osDone=JSON.parse(JSON.stringify(f5osLive));
    f5osDone.state=PLAN_STATE.COMPLETED; f5osDone.startedAt="22:03"; f5osDone.endedAt="01:36";
    delete f5osDone.winOpensAt; delete f5osDone.winEndsAt; delete f5osDone.windowExpired;
    f5osDone.items.forEach(it=>{
      const last=Math.max(0,flatTasks(workflowFor(it).wf||[[]]).length-1);
      Object.assign(it,{stage:"Complete", state:ITEM_STATE.SUCCEEDED, taskIdx:last, msIdx:0});
    });
  }
  const done=closedBy(PLAN_STATE.COMPLETED)[0], partial=closedBy(PLAN_STATE.PARTIAL), failed=closedBy(PLAN_STATE.FAILED)[0];
  /* how closed plans usually end: mostly completed, some with failures, a few failed */
  const closedMix=i=>{ const k=i%10;
    if(k===6 && f5osDone) return f5osDone;
    if(k===7) return partial[0]||done; if(k===9) return partial[1]||partial[0]||done;
    if(k===8) return failed||done; return done; };

  /* the scenario change: one Running plan, two Closed (a tenant and a host upgrade) */
  if(validating) clone(validating,{name:"Cinder edge tenants, October", change:"CHG0087312", offset:27});
  if(partial[0]) clone(partial[0],{name:"Cinder edge tenants, July", change:"CHG0087312", offset:-70});
  if(f5osDone)   clone(f5osDone,{name:"Cinder host platform, July", change:"CHG0087312", offset:-70});

  /* This week, in Closed: eight plans that ended in failure and four that did
     not — so Outcome narrows something visible inside the Window filter. */
  const mondayOffset=-((today.getDay()+6)%7);
  const weekDays=[]; for(let d=mondayOffset; d<=0; d++) weekDays.push(d);
  const failing=[partial[0],failed,partial[1]||partial[0]].filter(Boolean);
  const clean=[done,f5osDone||done].filter(Boolean);
  const weekPlan=[...Array(8)].map((_,i)=>failing[i%failing.length])
    .concat([...Array(4)].map((_,i)=>clean[i%clean.length]));
  weekPlan.forEach((t,i)=>{ const off=weekDays[i%weekDays.length];
    clone(t,{offset:off, time:off===0?"00:30":"22:00"}); });

  for(let i=0; validating && count("running")<LIST_VOLUME.running; i++)
    clone(validating,{offset:5+rnd(26)});
  for(let i=0; scheduled.length && count("waiting")<LIST_VOLUME.waiting; i++){
    const t=scheduled[i%scheduled.length]; clone(t,{offset:5+rnd(36), operation:t.operation});
  }
  for(let i=0; done && count("done")<LIST_VOLUME.done; i++){
    const t=closedMix(i); clone(t,{offset:-(8+rnd(170))});
  }
}

/* A plan is editable only until execution begins.
   Executing, Completing, Cancelling and every terminal state are closed.
   Validating is excluded too: the system is mid-check, so there is nothing
   stable to edit. */
/* Full editing belongs to the two states where the plan is the user's to
   correct: never submitted, or handed back to be fixed. Once a change ticket
   has been raised or approved, editing what the run depends on would leave the
   approval describing something else — so those states get the name only. */
const EDITABLE=new Set([PLAN_STATE.DRAFT, PLAN_STATE.VFAILED]);
function canEdit(p){ return EDITABLE.has(p.state); }

/* Renaming stays open while the plan is live, because the name is a human
   label rather than an input to the run. Terminal plans are records and keep
   the name they completed under. */
/* The plan name is not a label. The workflow engine names each run with it
   plus a timestamp, and it appears in logging identity, so a rename after
   submit would break the trail back to the run (2026-09-17). Editable only
   while the plan is still editable at all. */
/* Name and description are editable in Draft only (2026-09-25). A plan
   returned from validation can still have its change record corrected, but
   its name and description are fixed once it has been submitted. */
function canRename(p){ return p.state===PLAN_STATE.DRAFT && !p.virtual; }

/* A virtual plan's name is derived from its item, not chosen by anyone, so it
   is never editable — renaming it would let the label drift from the operation
   it describes. Derive it on read so it cannot go stale either. */
/* A display name falls back to a neutral word, never to an identifier. The
   plan's user-facing reference is a separate thing and is shown beside the
   title, not in place of it. */
function planTitle(p){
  if(!p) return "Plan";
  if(!p.virtual) return p.name || "Plan";
  const i=p.items[0];
  return (i&&i.name) ? i.name+" → "+i.to : (p.name || "Plan");
}
const itemLabel=i=>(i&&i.name) || (i&&i.tenant&&i.tenant!=="—"?i.tenant:"") || "Item";

/* A plan export is already scoped to the plan you are on: one operation type,
   one lifecycle. A period and filters could only subtract evidence from the
   change record, so this is confirm-and-attach, like exporting a single event
   from Activity. The shared filter state is left alone — a plan export must
   not disturb what Activity is showing. */
function openPlanExport(id){

function planEditScope(p){
  /* A plan returned for correction can have its change record fixed too — the
     failure may be the ticket or the window, not an item. Once it is live the
     name is all that is left, because everything else is what the run depends on.
     A virtual plan has no editable name, so in a live state it has nothing to edit. */
  if(p.virtual) return canEdit(p) ? "change" : "none";
  return canEdit(p) ? "details" : "name";
}

function searchV2(query){

    const m=/^(\w+):(.*)$/.exec(t);
    if(m){
      const [,k,v]=m;
      if(k==="change") return (p.change||"").toLowerCase().includes(v);
      if(k==="op")     return (p.operation||"").toLowerCase().includes(v);
      if(k==="state")  return (p.state||"").toLowerCase().includes(v);
      if(k==="device") return p.items.some(i=>(i.device||"").toLowerCase().includes(v));
      if(k==="tenant") return p.items.some(i=>(i.tenant||"").toLowerCase().includes(v));
      if(k==="source") return v==="quick" ? !!p.virtual : !p.virtual;

      ...p.items.map(i=>i.device+" "+i.tenant+" "+i.name)].join(" ").toLowerCase();
    return hay.includes(t);
  }));
}

const DISPO_MARK={needs:"▲",running:"◐",waiting:"◷",done:"✓"};

/* How a closed plan ended. A single ✓ across every terminal state was putting a
   success marker beside failed, expired and rejected plans. */
const OUTCOME={
  [PLAN_STATE.COMPLETED]:   {rank:4, mark:"✓", tone:"good",    label:"Completed"},
  [PLAN_STATE.PARTIAL]:     {rank:2, mark:"◑", tone:"partial", label:"Completed with failures"},

};
const outcomeOf=p=>OUTCOME[p.state]||null;
function dispoMark(p){

}

/* Labels follow the column headings; the keys stay as the internal terms. */
const SORTS=[["window","Window"],["outcome","Outcome"],["state","Status"],["name","Plan name"],["items","Items"]];
/* A sort is valid only where its key exists — Outcome only in Closed. A stored
   choice is kept for the tabs where it is valid and replaced by the tab's
   default elsewhere, so the Sort control always names the order applied. */
const SORT_VALID={outcome:tab=>tab==="done"};
function sortValid(key,tab){ return !SORT_VALID[key] || SORT_VALID[key](tab); }
function effectiveSort(){
  const def = seg==="done" ? "outcome" : "window";
  return sortTouched && sortValid(sortBy,seg) ? sortBy : def;
}
function sortRows(rows,key=effectiveSort()){
  if(key==="outcome") return rows.slice().sort((a,b)=>
    ((outcomeOf(a)||{rank:9}).rank)-((outcomeOf(b)||{rank:9}).rank));
  return rows.slice().sort((a,b)=>{
    if(key==="name")  return a.name.localeCompare(b.name);
    if(key==="items") return b.items.length-a.items.length;
    if(key==="state") return a.state.localeCompare(b.state);
    const da=windowDate(a), db=windowDate(b);   /* the displayed window (V5) */
    if(!da&&!db) return 0; if(!da) return 1; if(!db) return -1;
    return da-db;
  });
}
/* ============================================================================
   V5 · PLANS LIST — Search = WHAT, Tabs = STATE, Filters = ATTRIBUTES.

   Search → lifecycle tabs → three visible filters → results. No drawer, no
   chips, no column filters: each filter control shows its own state.
   Within a filter, choices are OR'd; across filters, AND'd. Nobody configures
   that — it is simply how the controls behave.

   The list never reads the dataset. Every change becomes one request to
   PlanService, which stands in for the paginated backend:

     GET /plans?state=done&search=CHG0087312&operation=R-Series%20tenant%20upgrade&window=this_week&page=1&pageSize=10

   It answers with one page, the match count in the requested state, and two
   facet counts: the unfiltered total per state (the tab counts, which never
   move) and the matches per state (for "additional matches in …").
   ============================================================================ */
const PAGE_SIZE=10;
/* Filters persist across tabs. Outcome only means something in Closed, so it
   is shown and applied there and kept, untouched, everywhere else. */
let opSel=[], outSel=[], winPreset="", winFrom="", winTo="", listPage=1, openMenu=null;
let listResp=null, listSeq=0, searchTimer=null, listFocus=null;

const WINDOW_PRESETS=[["","Any time"],["today","Today"],["this_week","This week"],
  ["next_7","Next 7 days"],["next_30","Next 30 days"],["custom","Custom range"]];
const OUTCOME_ORDER=()=>Object.keys(OUTCOME).sort((a,b)=>OUTCOME[a].rank-OUTCOME[b].rank);

/* One canonical window per plan — the live clock for a running plan, the
   scheduled start/end strings for everything else. Display, filter and sort
   all read this, so the row, the Window filter and Sort by Window can never
   disagree about the same plan. */
function windowSpan(p){
  if(hasClock(p)) return {start:new Date(p.winOpensAt), end:new Date(p.winEndsAt)};
  const at=s=>{ const d=parseWindow(s); if(!d) return null;
    const m=/(\d{1,2}):(\d{2})/.exec(String(s).split(",")[1]||""); if(m) d.setHours(+m[1],+m[2],0,0); return d; };
  const start=at(p.window); if(!start) return null;
  return {start, end:at(p.windowEnd||"")};
}
function windowDate(p){ const s=windowSpan(p); return s?s.start:null; }
/* the Window cell: one format for every plan — "2 Oct 22:00–02:00" for a
   window inside a day, both dates only when it runs longer */
function windowCell(p){
  if(windowPending(p)) return "—";
  const s=windowSpan(p); if(!s) return windowLabel(p);
  const d=x=>x.getDate()+" "+MON[x.getMonth()];
  if(!s.end) return d(s.start)+" "+hhmm(s.start);
  return (s.end>=s.start && s.end-s.start<864e5)
    ? `${d(s.start)} ${hhmm(s.start)}–${hhmm(s.end)}`
    : `${d(s.start)} ${hhmm(s.start)} – ${d(s.end)} ${hhmm(s.end)}`;
}
function windowRange(preset, from, to, now=new Date()){
  const d0=new Date(now); d0.setHours(0,0,0,0);
  const day=864e5, end=d=>new Date(d.getTime()+day-1);
  if(preset==="today") return [d0, end(d0)];
  if(preset==="this_week"){ const mon=new Date(d0.getTime()-((d0.getDay()+6)%7)*day);
    return [mon, end(new Date(mon.getTime()+6*day))]; }
  if(preset==="next_7")  return [d0, end(new Date(d0.getTime()+7*day))];
  if(preset==="next_30") return [d0, end(new Date(d0.getTime()+30*day))];
  if(preset==="custom")  return [from?new Date(from+"T00:00:00"):null, to?new Date(to+"T23:59:59"):null];
  return [null,null];
}

const PlanService=(()=>{
  const LATENCY=160;
  const norm=v=>String(v||"").toLowerCase().replace(/\s+/g," ").trim();
  function matchesSearch(p,q){
    if(!q) return true;
    const t=norm(q);
    const isRef=hasChangeNumber(p) && /^[a-z]{2,5}-?\d{3,}$/i.test(String(p.change||"").trim());
    return norm(planTitle(p)).includes(t)
        || (isRef && norm(p.change).replace(/\s/g,"").includes(t.replace(/\s/g,"")));
  }
  function matchesFilters(p,f){
    if(f.operation.length && !f.operation.includes(p.operation)) return false;
    if(f.outcome.length && disposition(p)==="done" && !f.outcome.includes(p.state)) return false;   /* sent only from Closed */
    if(f.window){
      const [a,b]=windowRange(f.window,f.windowFrom,f.windowTo);
      if(a||b){ const d=windowDate(p); if(!d) return false;
        if(a && d<a) return false; if(b && d>b) return false; }
    }
    return true;
  }
  function toQueryString(r){
    const f=r.filters;
    const q=[["state",r.state],["search",r.search],["operation",f.operation.join(",")],
      ["window",f.window],["windowFrom",f.window==="custom"?f.windowFrom:""],["windowTo",f.window==="custom"?f.windowTo:""],
      ["outcome",f.outcome.join(",")],["sort",r.sort],["page",r.page],["pageSize",r.pageSize]]
      .filter(([,v])=>v!==""&&v!=null).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
    return "/plans?"+q;
  }
  function query(r){
    const stateTotals={}, matchesByState={};
    SEGMENTS.forEach(([k])=>{ stateTotals[k]=0; matchesByState[k]=0; });
    const hits=[];
    DB().forEach(p=>{
      const d=disposition(p); stateTotals[d]++;
      if(matchesSearch(p,r.search) && matchesFilters(p,r.filters)){
        matchesByState[d]++; if(d===r.state) hits.push(p);
      }
    });
    const sorted=sortRows(hits,r.sort);
    const pages=Math.max(1,Math.ceil(sorted.length/r.pageSize));
    const page=Math.min(Math.max(1,r.page),pages);
    const res={request:toQueryString(Object.assign({},r,{page})),
      rows:sorted.slice((page-1)*r.pageSize, page*r.pageSize),
      total:sorted.length, page, pages, pageSize:r.pageSize, stateTotals, matchesByState,
      state:r.state, search:r.search, filters:r.filters};
    return new Promise(done=>setTimeout(()=>done(res),LATENCY));
  }
  /* reference data: the operation types a filter can offer */
  function operations(){ return [...new Set(DB().map(p=>p.operation))].sort(); }
  return {query, toQueryString, operations};
})();

const segLabel=k=>(SEGMENTS.find(([x])=>x===k)||[k,k])[1];
const pl=(n,one,many)=>n+" "+(n===1?one:(many||one+"s"));
const fmtDay=iso=>{ const d=new Date(iso+"T00:00:00"); return isNaN(d)?iso:d.getDate()+" "+MON[d.getMonth()]; };
const windowActive=()=>!!winPreset && (winPreset!=="custom" || !!(winFrom||winTo));
/* the filters that apply to the tab on screen */
function applicableFilters(){ return {op:opSel.length>0, win:windowActive(), out:seg==="done" && outSel.length>0}; }
const anyFilter=()=>Object.values(applicableFilters()).some(Boolean);
function clearFilters(){ opSel=[]; outSel=[]; winPreset=""; winFrom=""; winTo=""; winError=""; }
function multiLabel(sel, order, label=v=>v){
  if(!sel.length) return "All";
  /* named after what was chosen first, so the label doesn't reshuffle as more are added */
  return label(sel[0])+(sel.length>1?" +"+(sel.length-1):"");
}
let winError="";
function windowLabel5(){
  if(winPreset==="custom" && !winFrom && !winTo) return "Custom";
  if(!windowActive()) return "Any";
  if(winPreset==="custom") return (winFrom?fmtDay(winFrom):"Any")+" – "+(winTo?fmtDay(winTo):"Any");
  return (WINDOW_PRESETS.find(([k])=>k===winPreset)||["",""])[1];
}
function listRequest(){
  return {state:seg, search:q2.trim(), sort:effectiveSort(), page:listPage, pageSize:PAGE_SIZE,
    /* Outcome is remembered for Closed but never sent from another tab, so it
       cannot narrow any count the user sees there — including other-tab counts */
    filters:{operation:opSel.slice(), window:windowActive()?winPreset:"", windowFrom:winFrom, windowTo:winTo,
      outcome:seg==="done"?outSel.slice():[]}};
}
function fetchList(){
  const seq=++listSeq, req=listRequest();
  const box=document.getElementById("v5results"); if(box) lockResults(box);
  PlanService.query(req).then(res=>{
    if(seq!==listSeq || view!=="list") return;       /* a newer request replaced this one */
    listResp=res; listPage=res.page;
    renderListResults();
  });
}
/* While a request is in flight the rows on screen belong to the previous
   query: dimmed, and neither clickable nor focusable until the answer lands. */
function lockResults(box){
  box.setAttribute("aria-busy","true");
  box.querySelectorAll(".v2table,.v5pager,.v5also").forEach(el=>el.setAttribute("inert",""));
}
function refilter(focusId){
  listPage=1; renderFilterBar(focusId); fetchList();
}

function renderListV2(){
  setCrumb(TRAIL.concat(["Plans"]));
  const tot=listResp?listResp.stateTotals:null;
  document.getElementById("app").innerHTML=`
  <div class="page-head">
   <div><h1>Plans</h1><div class="sub">Create, monitor, and manage execution plans.</div></div>
   <div class="right"><button class="btn" id="quickBtn">Quick Submit</button><button class="btn primary" id="newPlan">New plan</button></div>
  </div>
  <div class="v5find" role="search">
   <div class="v2search v5search">
     <input id="v2q" type="text" value="${esc(q2)}" placeholder="Search by plan name or change number"
       aria-label="Search plans by plan name or change number" autocomplete="off">
     <button class="v5x" id="v2clear" type="button" aria-label="Clear search" ${q2?"":"hidden"}>×</button>
   </div>
  </div>
  <div class="v2segs" role="group" aria-label="Plans by status">
   ${SEGMENTS.map(([k,label])=>`<button class="v2seg-btn ${seg===k?"on":""}" data-seg="${k}" aria-pressed="${seg===k}">${label} <span class="mono v5count" data-segcount="${k}">${tot?tot[k]:"—"}</span></button>`).join("")}
  </div>
  <div class="v5fbar" id="v5fbar" role="group" aria-label="Filters"></div>
  <div class="sr-only" id="v5status" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="v5results" class="v5results" aria-busy="true"></div>`;

  document.querySelectorAll("[data-seg]").forEach(b=>b.addEventListener("click",()=>{
    if(seg===b.dataset.seg) return;
    seg=b.dataset.seg; listPage=1; openMenu=null;     /* filters stay as they are */
    renderListV2();
    const f=document.querySelector(`[data-seg="${seg}"]`); if(f) f.focus();
  }));
  const qi=document.getElementById("v2q");
  const runSearch=()=>{ clearTimeout(searchTimer); listPage=1; fetchList(); };
  qi.addEventListener("input",()=>{
    q2=qi.value; document.getElementById("v2clear").hidden=!q2;
    clearTimeout(searchTimer); searchTimer=setTimeout(runSearch,250);
  });
  qi.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault(); runSearch(); }
    if(e.key==="Escape" && q2){ q2=""; qi.value=""; document.getElementById("v2clear").hidden=true; runSearch(); }
  });
  document.getElementById("v2clear").addEventListener("click",()=>{
    q2=""; qi.value=""; document.getElementById("v2clear").hidden=true; runSearch(); qi.focus();
  });
  document.getElementById("newPlan").addEventListener("click",openNewPlan);
  document.getElementById("quickBtn").addEventListener("click",startQuick);

  /* One guard for every row, stale or not: while a request is in flight no row
     can be activated — by mouse, keyboard, script or assistive technology.
     inert and pointer-events cover the first two; this covers the rest. */
  document.getElementById("v5results").addEventListener("click",e=>{
    if(e.currentTarget.getAttribute("aria-busy")!=="true") return;
    if(e.target.closest("a,button")){ e.preventDefault(); e.stopPropagation(); }
  },true);

  renderFilterBar();
  if(listResp) renderListResults(true);     /* keep the last page on screen while the next loads */
  fetchList();
}

/* ---- the filter bar: three compact controls, each showing its own state ---- */
function renderFilterBar(focusId){
  const bar=document.getElementById("v5fbar"); if(!bar) return;
  const ops=PlanService.operations(), outs=OUTCOME_ORDER(), act=applicableFilters();
  const control=(key,label,value,on,menu)=>`<div class="v5f" data-f="${key}">
    <button type="button" class="v5fbtn ${on?"on":""}" id="v5f-${key}"
      aria-expanded="${openMenu===key}" aria-controls="v5m-${key}">${label}: <b>${esc(value)}</b><span class="v5caret" aria-hidden="true">▾</span></button>
    ${openMenu===key?`<div class="v5menu" id="v5m-${key}" role="group" aria-label="${label}">${menu}</div>`:""}
  </div>`;
  const checks=(key,opts,sel,label=v=>v)=>opts.map((v,i)=>`<label class="v5opt"><input type="checkbox" id="v5o-${key}-${i}" data-opt="${key}" value="${esc(v)}" ${sel.includes(v)?"checked":""}> ${esc(label(v))}</label>`).join("");
  const winMenu=WINDOW_PRESETS.map(([k,l],i)=>`<label class="v5opt"><input type="radio" name="v5win" id="v5o-win-${i}" data-win="${k}" ${(windowActive()?winPreset:"")===k||(k==="custom"&&winPreset==="custom")?"checked":""}> ${l}</label>`).join("")
    + (winPreset==="custom"?`<div class="v5range"><label>From <input type="date" id="v5from" value="${esc(winFrom)}" ${winTo?`max="${esc(winTo)}"`:""} ${winError==="from"?'aria-invalid="true" aria-describedby="v5rangeerr"':""}></label><label>To <input type="date" id="v5to" value="${esc(winTo)}" ${winFrom?`min="${esc(winFrom)}"`:""} ${winError==="to"?'aria-invalid="true" aria-describedby="v5rangeerr"':""}></label>${winError?`<p class="v5err" id="v5rangeerr" role="alert">From must be on or before To.</p>`:""}</div>`:"");
  bar.innerHTML=
    control("op","Operation",multiLabel(opSel,ops),act.op,checks("op",ops,opSel))
   +control("win","Window",windowLabel5(),act.win,winMenu)
   +(seg==="done"?control("out","Outcome",multiLabel(outSel,outs,v=>OUTCOME[v].label),act.out,checks("out",outs,outSel,v=>OUTCOME[v].label)):"")
   +(anyFilter()?`<button type="button" class="v5link" id="v5clearf">Clear filters</button>`:"");

  bar.querySelectorAll(".v5fbtn").forEach(b=>b.addEventListener("click",()=>{
    const key=b.closest("[data-f]").dataset.f;
    openMenu = openMenu===key ? null : key;
    renderFilterBar(openMenu ? null : b.id);
    if(openMenu){ const first=document.querySelector(`#v5m-${key} input`); if(first) first.focus(); }
  }));
  bar.querySelectorAll("[data-opt]").forEach(c=>c.addEventListener("change",()=>{
    const list=c.dataset.opt==="op"?opSel:outSel;
    const i=list.indexOf(c.value); if(c.checked&&i<0) list.push(c.value); if(!c.checked&&i>=0) list.splice(i,1);
    refilter(c.id);
  }));
  bar.querySelectorAll("[data-win]").forEach(r=>r.addEventListener("change",()=>{
    winPreset=r.dataset.win; winError="";
    if(winPreset!=="custom"){ winFrom=""; winTo=""; openMenu=null; refilter("v5f-win"); }
    else refilter("v5from");
  }));
  ["v5from","v5to"].forEach(id=>{ const el=document.getElementById(id);
    if(el) el.addEventListener("change",()=>{
      const from=id==="v5from"?el.value:winFrom, to=id==="v5to"?el.value:winTo;
      /* an inverted range is refused here: state and query stay as they were */
      if(from && to && from>to){ winError=id==="v5from"?"from":"to"; renderFilterBar(id);
        const again=document.getElementById(id); if(again) again.value=el.value; return; }
      winError=""; winFrom=from; winTo=to; refilter(id); }); });
  const cf=document.getElementById("v5clearf");
  if(cf) cf.addEventListener("click",()=>{ clearFilters(); openMenu=null; refilter("v5f-op"); });
  /* Escape closes the open menu and returns to its button */
  bar.querySelectorAll(".v5menu").forEach(m=>m.addEventListener("keydown",e=>{
    if(e.key!=="Escape") return; e.stopPropagation();
    const key=m.closest("[data-f]").dataset.f; openMenu=null; renderFilterBar("v5f-"+key);
  }));
  if(focusId){ const el=document.getElementById(focusId); if(el) el.focus(); }
}
/* A click or focus outside the open popover closes it. It is closed in place —
   the menu removed, its button told — rather than by re-rendering the bar, so
   the control receiving the click or focus is never replaced under it. */
function closeMenuInPlace(){
  if(!openMenu) return;
  const box=document.querySelector(`.v5f[data-f="${openMenu}"]`);
  if(box){ const m=box.querySelector(".v5menu"); if(m) m.remove();
    const b=box.querySelector(".v5fbtn"); if(b) b.setAttribute("aria-expanded","false"); }
  openMenu=null;
}
["mousedown","focusin"].forEach(ev=>document.addEventListener(ev,e=>{
  if(!openMenu || view!=="list") return;
  const box=document.querySelector(`.v5f[data-f="${openMenu}"]`);
  if(box && box.contains(e.target)) return;
  closeMenuInPlace();
}));

function renderListResults(stale){
  const box=document.getElementById("v5results"), r=listResp;
  if(!box || !r) return;
  SEGMENTS.forEach(([k])=>{ const el=document.querySelector(`[data-segcount="${k}"]`); if(el) el.textContent=r.stateTotals[k]; });

  const tab=segLabel(r.state), T=r.stateTotals[r.state], n=r.total, f=r.filters;
  const filtering=!!(f.operation.length || f.window || (r.state==="done" && f.outcome.length));
  const narrowing=!!r.search || filtering;
  const across=Object.values(r.matchesByState).reduce((a,b)=>a+b,0);
  const elsewhere=SEGMENTS.filter(([k])=>k!==r.state && r.matchesByState[k]>0);

  /* Three numbers, three phrasings: the tab holds T (the tab count), n of them
     match (this line), and the pager says which n are on screen. */
  const acrossClause = r.search
    ? (filtering ? `${pl(across,"plan")} ${across===1?"matches":"match"} your search and filters`
                 : `${pl(across,"plan")} ${across===1?"matches":"match"} “${esc(r.search)}” across Plans`) : "";
  const localClause = !T ? "" : r.search ? `${n} of ${T} in ${esc(tab)}` : `${n} of ${pl(T,"plan")} match`;
  const alsoLinks = r.search && elsewhere.length ? `<span class="v5also">${elsewhere.length===1
        ?`<button type="button" data-goseg="${elsewhere[0][0]}">${pl(r.matchesByState[elsewhere[0][0]],"additional match","additional matches")} in ${esc(elsewhere[0][1])}</button>`
        :`Additional matches: ${elsewhere.map(([k,l])=>`<button type="button" data-goseg="${k}">${r.matchesByState[k]} in ${esc(l)}</button>`).join(" · ")}`}</span>` : "";
  const summary = narrowing ? `<div class="v5summary">
      ${acrossClause?`<span>${acrossClause}</span>`:""}${acrossClause&&localClause?`<span class="v5sep" aria-hidden="true">·</span>`:""}
      ${localClause?`<span>${localClause}</span>`:""}${alsoLinks}
    </div>` : "";
  const statusText = !T ? `No plans currently in ${tab}.`+(r.search&&across?` ${pl(across,"plan")} ${across===1?"matches":"match"} in other tabs.`:"")
    : narrowing ? `${n} of ${pl(T,"plan")} in ${tab} match.`+(n>r.pageSize?` Showing ${(r.page-1)*r.pageSize+1} to ${Math.min(r.page*r.pageSize,n)}.`:"")
    : `${pl(T,"plan")} in ${tab}.`+(r.pages>1?` Page ${r.page} of ${r.pages}.`:"");

  const sort=`<label class="v2facet v5sort"><span>Sort</span>
      <select id="v2sort" aria-label="Sort plans">
        ${SORTS.filter(([k])=>sortValid(k,r.state)).map(([k,l])=>`<option value="${k}" ${effectiveSort()===k?"selected":""}>${l}</option>`).join("")}
      </select></label>`;

  let body;
  if(!T) body=`<div class="panel"><div class="emptybox"><h3>No plans currently in ${esc(tab)}.</h3>${r.state==="needs"&&!narrowing?'<button class="btn primary" id="newPlan2">New plan</button>':""}</div></div>`;
  else if(!n) body=`<div class="panel"><div class="emptybox"><h3>No plans match your current search and filters.</h3>
      <div class="v5emptyacts">${filtering?'<button class="btn" id="v5emptyf">Clear filters</button>':""}${r.search?'<button class="btn" id="v5emptyq">Clear search</button>':""}</div></div></div>`;
  else body=`<div class="v2table">
    <div class="v2head"><span></span><span>Plan</span><span>Operation</span><span>Change</span><span>Window</span><span>Completion</span><span>Status</span></div>
    ${r.rows.map(planRowV2).join("")}
  </div>
  <nav class="v5pager" aria-label="Pagination">
    <span>${(r.page-1)*r.pageSize+1}–${Math.min(r.page*r.pageSize,n)} of ${n}</span>
    ${r.pages>1?`<button class="btn small" id="v5prev" ${r.page<=1?"disabled":""}>Previous</button>
    <span>Page ${r.page} of ${r.pages}</span>
    <button class="btn small" id="v5next" ${r.page>=r.pages?"disabled":""}>Next</button>`:""}
  </nav>`;

  box.innerHTML=`${summary||n?`<div class="v5bar">${summary}${n?sort:""}</div>`:""}${body}`;
  box.dataset.request=r.request;
  if(stale){ lockResults(box); return; }
  box.setAttribute("aria-busy","false");
  announce(statusText);

  box.querySelectorAll("[data-openv2]").forEach(a=>a.addEventListener("click",e=>{
    if(box.getAttribute("aria-busy")==="true"){ e.preventDefault(); return; }   /* belt and braces with inert */
    if(e.metaKey||e.ctrlKey||e.button===1) return;
    e.preventDefault();
    const p=getPlan(a.dataset.openv2), at=p&&attentionItem(p);
    if(at) openItem(p.id,at.id); else openPlan(a.dataset.openv2);
  }));
  box.querySelectorAll("[data-goseg]").forEach(b=>b.addEventListener("click",()=>{
    seg=b.dataset.goseg; listPage=1; openMenu=null;
    renderListV2(); const t=document.querySelector(`[data-seg="${seg}"]`); if(t) t.focus();
  }));
  const so=document.getElementById("v2sort");
  if(so) so.addEventListener("change",()=>{ sortBy=so.value; sortTouched=true; listPage=1; listFocus="v2sort"; fetchList(); });
  const page=d=>()=>{ listPage=r.page+d; listFocus=d<0?"v5prev":"v5next"; fetchList(); };
  const pv=document.getElementById("v5prev"), nx=document.getElementById("v5next");
  if(pv) pv.addEventListener("click",page(-1));
  if(nx) nx.addEventListener("click",page(1));
  const ef=document.getElementById("v5emptyf");
  if(ef) ef.addEventListener("click",()=>{ clearFilters(); openMenu=null; refilter("v5f-op"); });
  const eq=document.getElementById("v5emptyq");
  if(eq) eq.addEventListener("click",()=>{ q2=""; const qi=document.getElementById("v2q"); qi.value="";
    document.getElementById("v2clear").hidden=true; listPage=1; fetchList(); qi.focus(); });
  const n2=document.getElementById("newPlan2"); if(n2) n2.addEventListener("click",openNewPlan);
  /* focus survives the re-render: back to the control that asked for it */
  if(listFocus && !stale){
    let el=document.getElementById(listFocus);
    if(el && el.disabled) el=document.getElementById(listFocus==="v5next"?"v5prev":"v5next");
    if(el) el.focus(); listFocus=null;
  }
}

/* Polite, and re-announced even when the text repeats: cleared, then set on
   the next frame, so "3 plans match" twice in a row is still read twice. */
function announce(msg){
  const el=document.getElementById("v5status"); if(!el) return;
  el.textContent=""; setTimeout(()=>{ el.textContent=msg; },60);
}

/* ---- plan detail: the state is the state; counts sit beside it ---- */
function renderPlanV2(){
  const p=getPlan(selectedPlan); if(!p) return goList();
  const c=countsV2(p), acts=planActions(p), ref=execRef(p);
  setCrumb(PLANS_TRAIL.concat([planRef(p)]));
  document.getElementById("app").innerHTML=`
  <div class="detail-header">
   <div><div class="detail-title-row"><h1>${esc(planTitle(p))}</h1></div>
     <div class="sub"><span class="mono">${esc(planRef(p))}</span>${p.virtual?" · quick submit":""}</div></div>
   <div class="detail-status">
     <span class="pill ${disposition(p)==="needs"?"dark":""}">${esc(p.state.toUpperCase())}</span>
     ${acts.map(([k,label,cls])=>`<button class="btn ${cls}" data-planact="${k}">${label}</button>`).join("")}
   </div>
   <div class="context">
    <div class="meta">
     <div><label>Created by</label><b>${esc(planOwner(p))}</b></div>
     <div><label>Operation</label><b>${esc(p.operation)}</b></div>
     ${hasChangeNumber(p)?`<div><label>Change</label><b>${changeRefHTML(p,{link:true})}</b></div>`:""}
     <div><label>${esc(windowFieldLabel(p))}</label><b>${esc(windowLabel(p))}${
       (()=>{const w=windowState(p);return w&&w.closed?" · closed":"";})()}</b>${windowConditionHTML(p)}</div>
     <div><label>Items</label><b>${c.total}</b></div>
    </div>
   ${planSummaryHTML(p)}
   </div>
  </div>
  ${hasValidationErrors(p)?(()=>{
    /* Orientation first: which scopes need attention. Detail for the plan's
       own errors follows, because this page is where they are corrected.
       Item detail stays with the item. */
    const v=validationScope(p);
    return `<div class="attn" role="region" aria-label="Attention required">
      <div class="attn-h"><span class="attn-mark" aria-hidden="true">⚠</span>
        <b>Attention required</b><span class="attn-sum">${esc(validationSummary(p))}</span></div>
      <div class="attn-note">Validation ran and returned errors. Correct them, then use Submit again.</div>
      ${v.planEntries.length?`<div class="attn-plan">
        <span class="attn-lab">Plan</span>
        <ul class="checks">${v.planEntries.flatMap(e=>e.fails).map(f=>
          `<li class="bad">${f.field?`<b>${esc(f.field)}</b> `:""}${esc(validationText(f))}</li>`).join("")}</ul>
        ${planEditScope(p)!=="none"?`<button class="btn small" data-planact="details">Edit plan</button>`:""}
      </div>`:""}
    </div>`;})():""}
  ${(()=>{
    /* A plan that expired before this session has no live clock to read, so
       gating this on windowState() meant an Expired plan explained nothing at
       all — three items read "Skipped" with no reason anywhere on the page. */
    const w=windowState(p);
    const closed = (w&&w.closed) || !!p.windowExpired;
    if(!closed) return "";
    /* What the reader needs is the count, not a recital of the rules: how much
       got done before the window shut, and what it takes to finish the rest. */
    const cc=countsV2(p), left=p.items.length-cc.done;
    return `<div class="notice" style="margin-top:16px">
     <b>The change window closed at ${esc(p.windowEnd||windowLabel(p))} with ${plural(left,"item")} unfinished.</b>
     ${cc.succeeded} of ${p.items.length} completed. The window governs when work may start, so anything
     already running was left to finish; the ${left} that had not started ${left===1?"was":"were"} not
     begun — running ${left===1?"it":"them"} means a new plan.</div>`;})()}
  ${(()=>{
    /* BYOC has no close step: Model-X closes only the records it raised itself
       (UXFR §6). Left unsaid, a supplied record sits open after the work is
       done and nobody knows it is waiting on them.

       The earlier wording explained the mechanism and then said "closing it is
       yours to do", which names no system, no place, and a "you" that is not
       necessarily the person reading — the plan says who created it, and that
       is often somebody else. It leads with the action instead. */
    const ended=TERMINAL.has(p.state)&&p.state!==PLAN_STATE.CANCELLED;
    if(!ended||p.mode==="create"||!hasChangeNumber(p)) return "";
    return `<div class="notice" style="margin-top:16px">
      <b>${esc(p.change)} still needs closing in the change management system.</b>
      It was supplied with the plan, and Model-X closes only the records it raises itself.</div>`;})()}
  ${(()=>{const ph=planFailurePhase(p); if(!ph) return "";
    return `<div class="notice bad" style="margin-top:16px"><b>A plan-level task failed.</b> ${esc(p.planTaskFailed||"")} ${
      ph==="pre"
        ? "No items were dispatched — this failed before item execution began."
        : "Every item had already finished. The item outcomes below are unaffected; it is the change record that did not close."}</div>`;})()}
  ${!workflowStarted(p)?"":`
  <section class="panel plan-track" style="margin-top:16px">
   <div class="panel-head"><span class="section-label">Plan workflow</span>
     <span class="muted mono">${plural(planTasks(p).length,"task")}</span></div>
   <ol class="pt-list">
   ${(()=>{const ts=planTasks(p), rows=[];
     ts.forEach(t=>{
       const stopped = t.state===PT_FAIL && p.state===PLAN_STATE.ACTION;
       /* Same rules as the item workflow: no description under every task —
          the name says what it is — and a chip only where something is not
          simply done or pending. The failure reason is not a description and
          stays. */
       const chip = t.state===PT_FAIL ? "Failed" : t.state===PT_RUN ? "Running"
                  : t.state===PT_WAIT ? "Waiting" : null;
       rows.push(`<li class="pt ${t.state.toLowerCase().replace(" ","-")}">
         <span class="pt-mark" aria-hidden="true">${t.state===PT_OK?"✓":t.state===PT_FAIL?"✕":t.state===PT_RUN?"●":t.state===PT_WAIT?"◷":"○"}</span>
         <span class="pt-body"><b>${esc(t.name)}</b>${
           t.items?`<span class="pt-note">${esc(executeSummary(p))}</span>`:""}${
           t.state===PT_FAIL&&t.why?`<span class="pt-note">${esc(t.why)}</span>`:""}
           ${stopped?`<span class="pt-act">
             <button class="btn primary small" data-planact="retry">Retry</button>
             ${canRollback(p)?`<button class="btn small" data-planact="rollback">Roll back</button>`:""}
             <button class="btn small" data-planact="cancelTask">Cancel</button>
             <span class="pt-act-n">This task only — the items below are not re-run.</span></span>`:""}</span>
         ${chip?`<span class="wf-chip ${t.state===PT_FAIL?"failed":t.state===PT_RUN?"current":"halted"}">${chip}</span>`
                :`<span class="pt-state"></span>`}
         <span class="sr-only">${esc(t.state)}</span></li>`);
     });
     return rows.join("");})()}
   </ol>
  </section>
  `}
  ${p.state===PLAN_STATE.DRAFT?"":`
  <section class="panel" style="margin-top:16px">
   <div class="panel-head"><span class="section-label">Items</span>
     ${canEdit(p)?`<button class="btn small" onclick="openAddItem()">+ Add item</button>`:""}
     <span class="muted mono">${
       hasValidationErrors(p)
         ? (()=>{const n=validationScope(p).affectedItems;
                 return n?n+" need"+(n===1?"s":"")+" attention":plural(c.total,"item");})()
         : [[c.scheduled,"scheduled"],[c.succeeded,"completed"],[c.running,"running"],
            [c.queued,"queued"],[c.action,"need you"],
            [c.failed,"failed"],[c.rolledback,"rolled back"],
            [c.rollbackfailed,"rollback failed"],[c.skipped,"skipped"],
            [c.cancelled,"cancelled"],[c.draft,"draft"]]
           .filter(x=>x[0]).map(x=>x[0]+" "+x[1]).join(" · ") || plural(c.total,"item")
     }</span></div>
   <table class="exec-table"><thead><tr>${
     itemColumns(p).map(([h])=>`<th scope="col">${esc(h)}</th>`).join("")
   }<th scope="col">Status</th><th scope="col"></th></tr></thead><tbody>
   ${p.items.map(i=>{
     const f=itemFailure(p,i);
     return `<tr class="${f?"row-fail":""}">
     ${itemColumns(p).map(([,get,role])=>{
        const v=get(i);
        return role==="link"
          ? `<td><button class="item-link" data-open-item="${p.id}|${i.id}">${esc(v||itemLabel(i))}</button></td>`
          : `<td class="mono">${esc(v&&v!=="—"?v:"—")}</td>`;}).join("")}
     <td>${f
        /* The item's status is still Draft — validation is a result, not a
           state. The marker and the first message say it needs attention;
           shape as well as colour, and the full list lives on Item Detail. */
        ? `${stateHTML(i.state)}<div class="sub attn-row"><span class="attn-mark" aria-hidden="true">⚠</span>${
             esc(validationText(f.fails[0]))}${f.fails.length>1?` · +${f.fails.length-1} more`:""}</div>`
        : `${stateHTML(i.state)}${(()=>{
            /* A terminal state the operator did not choose has to say why it
               happened — once. Where the plan ended for a single reason, the
               notice above states it and repeating it on every row is noise. */
            const saidAtPlanLevel = !!p.windowExpired;
            if(saidAtPlanLevel) return "";
            const why = i.expiryNote
              || (i.state===ITEM_STATE.SKIPPED ? "Never started."
                : i.state===ITEM_STATE.CANCELLED ? (i.cancelNote||"Cancelled part-way; completed steps were left in place.")
                : "");
            return why?`<div class="sub">${esc(why)}</div>`:"";})()}`}</td>
     <td class="item-actions-cell">${
        canEdit(p)
          ? `<button class="open-link" data-edititem="${esc(i.id)}">Edit</button> <button class="open-link" data-removeitem="${esc(i.id)}">Remove</button>`
          : ""}${showItemChevron(p)
          ? `<button class="iw-open" type="button" data-open-item="${p.id}|${i.id}"
               aria-label="Open item details for ${esc(itemLabel(i))}">${ICON_CHEV_RIGHT}</button>`
          : ""}</td>
   </tr>`;}).join("")}
   </tbody></table>
  </section>`}`;
  document.querySelectorAll("[data-planact]").forEach(b=>
    b.addEventListener("click",()=>runPlanAction(p.id,b.dataset.planact)));
  const pe=document.querySelector("[data-planexport]");
  if(pe) pe.addEventListener("click",()=>openPlanExport(pe.dataset.planexport));
  bindOpenItem();
  document.querySelectorAll("[data-edititem]").forEach(b=>
    b.addEventListener("click",()=>openEditItem(b.dataset.edititem)));
  document.querySelectorAll("[data-removeitem]").forEach(b=>
    b.addEventListener("click",()=>removeItem(b.dataset.removeitem)));
}

function itemFailure(p,i){
  if(!hasValidationErrors(p)) return null;
  return (p.errors||[]).find(e=>e.item===i.id) || null;
}


/* one binder, called by every view that emits data-open-item */

/* ===================================================================

   Task = the numbered step, Milestone = the steps beneath it. Phase is a

   of the sequence rather than a settled level.
   =================================================================== */
