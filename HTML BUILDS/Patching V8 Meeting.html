/* The impact is a fact about the item, so the execution record always shows it.
   Recomputed from the item's own target so it cannot drift from what the item
   actually is. */
/* An item's region comes from the thing being operated on — the host for a
   pair or an R-series tenant, the tenant itself for a virtual one. */
function itemRegion(i){
  const j=journeyOf(i);
  if(j==="hostpair") return (deviceById(i.peer1)||{}).region||"—";
  if(j==="rseries")  return (deviceById(i.device)||{}).region||"—";
  const t=VIRTUAL_TENANTS.find(x=>x.id===i.tenant);
  return (t||{}).region||"—";
}

function itemImpact(i){
  return computeImpact({
    /* the item's workflow, read from its journey so a legacy label cannot
       send a tenant through the host branch */
    op: opOfJourney(journeyOf(i)) || i.operation,
    device: i.device, tenant: i.tenant,
    peer1: i.peer1, peer2: i.peer2
  });
}

/* Recovery actions belong to an item sitting in Action required and nowhere
   else — a terminal item has no further moves, and a running one is not the
   user's to touch. Every path ends by asking the plan to re-derive its own
   status from its items. */
function runItemAction(pid,iid,a){
  const p=getPlan(pid), i=getItem(pid,iid); if(!p||!i) return;
  if(i.state!==ITEM_STATE.ACTION) return;
  const w=windowState(p);
  if(w&&w.closed) return showToast("The maintenance window has closed. No further action can be taken on this item.");

  if(a==="wait"){
    /* Wait is the absence of an action: the item stays exactly where it is and
       the window keeps running down. Nothing is sent anywhere. */
    showToast("Left in Action required. The window keeps running down.");
    return;
  }
  if(a==="retry"){
    i.state=ITEM_STATE.INPROGRESS; i.taskIdx=i.failedTask;
    i.failedTask=undefined; i.failureReason=null;
    showToast("Retrying from the failed task. Steps that already succeeded are not re-run.");
  }
  if(a==="rollback"){
    if(!canRollback(p)) return showToast(p.operation+" operations cannot be rolled back.");
    i.state=ITEM_STATE.ROLLINGBACK; showToast("Rollback started. Completed steps are undone in reverse order.");
    setTimeout(()=>{
      /* Whether a rollback succeeds is a property of the run, carried on the
         item. Rollback failure is terminal — the requirements are explicit
         that there is no retry out of it. */
      if(i.rollbackOutcome==="failed"){
        i.state=ITEM_STATE.ROLLBACKFAILED;
        i.rollbackReason=i.rollbackReason||"The device could not be restored to its previous image.";
      }else{
        i.state=ITEM_STATE.ROLLEDBACK;   /* failedTask kept: the forward chain still shows where it stopped */
      }
      settlePlan(p); render();
    },1400);
    return render();
  }
  if(a==="cancel"){
    const taskName=failedTaskName(i)||"this task";
    askConfirm({
      title:"Cancel this task?",
      body:`<p class="cf-lead">Cancelling <b>${esc(taskName)}</b> skips every task after it on
              <b>${esc(i.name)}</b>, and the item is marked cancelled part-way through.</p>
            <ul class="cf-list">
              <li><b>The steps already completed stay completed.</b> They are not undone, and
                  nothing is rolled back.</li>
              <li>The device is left between two states. Putting it back is a manual job.</li>
              <li>Other items in this plan are not affected.</li>
            </ul>`,
      confirmLabel:"Cancel the task",
      onConfirm:()=>{
        i.state=ITEM_STATE.CANCELLED; i.failedTask=undefined;
        settlePlan(p); render();
        showToast("Task cancelled. Completed steps were left in place — nothing was rolled back.");
      }});
    return;
  }
  settlePlan(p);
  render();
}

/* A milestone is a step with a state, not a bullet. Its state follows the task
   that contains it — task and milestone share one vocabulary: Succeeded / Running / Failed / Not started. */
/* Only an item that is actually running can have a running task. Every other
   item either never started, stopped at a failure, was halted, or finished —
   so the workflow can never claim work is in flight on a closed plan. */
const RUNNING_STATES=new Set([ITEM_STATE.INPROGRESS,ITEM_STATE.ROLLINGBACK]);
const FAILED_STATES =new Set([ITEM_STATE.ACTION,ITEM_STATE.FAILED,
                              ITEM_STATE.ROLLEDBACK,ITEM_STATE.ROLLBACKFAILED]);

/* Where the item stopped. failedTask is authoritative when the data carries
   it; otherwise the task index is the stopping point, because that is what it
   means for an item that is no longer moving. */
/* A rollback does not erase the forward run. The task that stopped keeps its
   position and its milestones, and the rollback is drawn from that point —
   it is a second sequence, not a rewrite of the first (2026-09-17). */
const ROLLBACK_STATES=new Set([ITEM_STATE.ROLLINGBACK,ITEM_STATE.ROLLEDBACK,ITEM_STATE.ROLLBACKFAILED]);
function itemStop(i,total){
  const cur=Math.max(0,Math.min(i.taskIdx===undefined?0:i.taskIdx,total-1));
  if(i.state===ITEM_STATE.SUCCEEDED)  return {at:total,kind:"done"};
  if(ROLLBACK_STATES.has(i.state))    return {at:i.failedTask===undefined?cur:i.failedTask,kind:"failed"};
  if(FAILED_STATES.has(i.state))      return {at:i.failedTask===undefined?cur:i.failedTask,kind:"failed"};
  if(RUNNING_STATES.has(i.state))     return {at:cur,kind:"current"};
  if(i.state===ITEM_STATE.CANCELLED)  return {at:cur,kind:"halted"};
  return {at:0,kind:"todo"};          /* Draft, Queued, Skipped, Not approved */
}

function milestoneState(i,taskState,msIdx){
  if(taskState==="done") return "Succeeded";
  if(taskState==="todo") return "Not started";
  const at=i.msIdx===undefined?0:i.msIdx;
  if(msIdx<at) return "Succeeded";
  if(msIdx>at) return "Not started";
  return taskState==="failed" ? "Failed"
       : taskState==="halted" ? "Cancelled" : "Running";
}
const MS_MARK={Succeeded:"✓", Running:"●", Failed:"✕", Cancelled:"○", "Not started":""};

/* ---- a running task draws its progress, it does not spell it out ----
   Task progress is milestones completed ÷ total milestones, which is the
   formula the client specified on 2026-08-20. The figure itself is deliberately
   not on screen — "we will not show it as any text, we just need to use that to
   increase our progress bar" — so it lives in the accessible name instead,
   where assistive technology still reads it out.

   It moves in milestone-sized steps. The finer number, counted from playbook
   steps, is not built on the backend and is not invented here. */
const RING_R=8, RING_C=2*Math.PI*RING_R;
function taskProgress(i,t){
  const total=t.ms.length; if(!total) return null;
  const done=Math.min(i.msIdx===undefined?0:i.msIdx, total);
  return {done, total, frac:done/total};
}
function ringHTML(pr){
  /* A task that is running but has finished no milestone would otherwise draw
     an empty circle, which reads as "not started" — the one thing it is not. */
  const shown=Math.max(pr.frac,0.08);
  return `<span class="wf-ring" role="progressbar" aria-valuemin="0" aria-valuemax="${pr.total}"
      aria-valuenow="${pr.done}" aria-valuetext="Running — ${pr.done} of ${pr.total} milestones complete">
    <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false">
      <circle cx="10" cy="10" r="${RING_R}" class="wf-ring-t"/>
      <circle cx="10" cy="10" r="${RING_R}" class="wf-ring-f"
        stroke-dasharray="${RING_C.toFixed(2)}"
        stroke-dashoffset="${(RING_C*(1-shown)).toFixed(2)}"/>
    </svg></span>`;
}


function failedTaskName(i){
  const {wf}=workflowFor(i); if(!wf || i.failedTask===undefined) return null;
  const t=flatTasks(wf)[i.failedTask]; return t?t.name:null;
}

/* ============================================================================
   WHICH WORKFLOW AN ITEM RUNS

   Only the R-series sequence is specified. The client will give the real step
   count and task names for the other journeys, so until then they run the same
   list, labelled so nobody reads a placeholder as a specification.

   When the real sequences arrive this becomes one more entry each, not a new
   renderer — the execution surface does not care how many steps there are.
   ============================================================================ */
function workflowFor(item){
  const j=journeyOf(item);
  if(j==="rseries")  return {wf:WORKFLOW_RSERIES, src:"rSeries tenant estate"};
  if(j==="hostpair") return {wf:WORKFLOW_RSERIES, src:"F5OS host estate · steps to be confirmed"};
  if(j==="virtual")  return {wf:WORKFLOW_RSERIES, src:"Virtual tenant estate · steps to be confirmed"};
  return {wf:null, src:null};
}
const flatTasks=wf=>wf.reduce((a,p)=>a.concat(p.tasks),[]);

/* ============================================================================
   ITEM COLUMNS ARE PER JOURNEY  (2026-09-17)

   An item is not one shape. A host upgrade names two hosts; an R-series tenant
   upgrade names two hosts AND two tenants; a virtual tenant upgrade has no host
   at all. Firewall, when it arrives, is a multi-select list. One table for all
   of them was upgrade-centric and could only ever fit one.

   Adding a journey is a row in this table, not a change to a renderer. The
   firewall entry is declared and deliberately carries no sample data — nothing
   in the record describes a firewall item yet.

   ============================================================================ */
/* ============================================================================
   ITEM COLUMNS — one set per journey, and nothing but what was entered

   The table shows the answers the operator actually gave when they authored
   the item, in the order the form asked for them. Nothing derived, nothing
   inferred: a derived value cannot be checked against what was intended, and
   the backend does not supply the current version today in any case
   (2026-09-17).

   `head` names the first column, which carries the item link — the item is a
   tenant on one journey and a host pair on another, so the heading cannot be
   one word for all of them. `id` says what that cell reads when it is not
   simply the item's name.

   Adding a journey is a row here. Firewall is declared and deliberately empty:
   nothing in the record yet describes what a firewall item asks for.
   ============================================================================ */
/* The columns are the authoring form, laid flat: same fields, same order. On
   R-series the host is picked first because it scopes which tenants can be
   offered, so the host is the first column — the table reads in the order the
   answers were given.

   `link` marks the column carrying the item's own identity, which is not
   always the first: on R-series the host is the scope and the tenant is the
   thing being upgraded. */
const ITEM_COLUMNS={
  rseries:{ label:"R-Series tenant upgrade", cols:[
    ["Host",           i=>i.device],
    ["Tenant",         i=>i.tenant, "link"],
    ["Target version", i=>i.to]]},
  virtual:{ label:"Virtual tenant upgrade", cols:[
    ["Tenant",         i=>i.tenant, "link"],
    ["Target version", i=>i.to]]},
  hostpair:{ label:"R-Series host upgrade", cols:[
    ["Peer 1",         i=>i.peer1||i.name, "link"],
    ["Peer 2",         i=>i.peer2],
    ["Target version", i=>i.to]]},
  firewall:{ label:"Firewall upgrade", cols:[], unspecified:true }
};
const journeyOf=i=>ITEM_COLUMNS[i.journey]?i.journey:(i.kind==="Host pair"?"hostpair":"virtual");
/* A plan holds one operation type, so its items are homogeneous and one column
   set serves the table. A mixed plan is out of scope today. */
function planJourney(p){ return p.items.length?journeyOf(p.items[0]):"virtual"; }
function itemColumns(p){ return ITEM_COLUMNS[planJourney(p)].cols; }

/* ============================================================================
   WHAT A TASK CARRIES  (2026-09-17)

   A task shows when it started and when it finished. Some tasks also publish
   an external log and an external artifact link, and some produce files the
   operations team downloads — device state captured before and after the
   change. Not every task has them, so the space is drawn only when it does.

   Artifacts sit on the task, never on the plan: a plan would present fifteen
   or twenty files with nothing to say which belonged to what.
   ============================================================================ */

/* Deterministic per item and task, so the same task always reads the same.
   A task that finished — succeeded or failed — has both ends; one still
   running has only a start. */
function taskTimes(i,state,at){
  if(state==="todo"||state==="skipped") return null;
  const base=22*60+4, step=7;
  const mins=t=>String(Math.floor(t/60)%24).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
  const st=base+at*step;
  const ended=(state==="done"||state==="failed"||state==="halted");
  return {start:mins(st), end:ended?mins(st+step-2):null};
}

/* ---- external references ----
   Every item-level task that has run carries its log and its artefacts, both
   held outside Model-X. Offered on every such task so the task body has one
   shape wherever you open it.

   A task that has not started has neither yet, so nothing is drawn for it —
   a link to a log that does not exist is worse than no link. */
/* ---- artifact availability ----
   A task publishes its artefacts when it has finished running. A task still
   running, or one that never started, has nothing to hand over yet. That is
   the whole rule — no filenames, no counts, no per-task artefact list, because
   none of that is supplied. The item's package is the aggregate of its tasks'.
   Availability only; nothing about contents. */
const TASK_RAN_STATES=new Set(["done","failed","halted"]);
const taskHasArtifacts=state=>TASK_RAN_STATES.has(state);
function itemArtifactTaskCount(i){
  const {wf}=workflowFor(i);
  const all=wf?flatTasks(wf):[];
  if(!all.length||!itemHasRun(i)) return 0;
  const stop=itemStop(i,all.length);
  let n=0;
  all.forEach((t,at)=>{
    const st = at<stop.at ? "done"
             : at===stop.at ? stop.kind
             : (isTerminalItem(i) ? "skipped" : "todo");
    if(taskHasArtifacts(st)) n++;
  });
  return n;
}
const itemHasArtifacts=i=>itemArtifactTaskCount(i)>0;

/* Everything a task offers sits behind one overflow. The task row is a name, a
   state and a duration; its references and its files are secondary to that and
   to the item's own artefact action, so none of them is drawn as a control in
   the row. The menu is built from what the task actually has — if that is
   nothing, there is no kebab. */
function taskExternalsHTML(t,state,i,at){
  if(state==="todo"||state==="skipped") return "";
  const items=[
    `<a class="tk-mi" role="menuitem" href="#" data-ext="log">External log<span class="tk-mi-ext" aria-hidden="true">↗</span></a>`,
    `<a class="tk-mi" role="menuitem" href="#" data-ext="artifact">External artifact<span class="tk-mi-ext" aria-hidden="true">↗</span></a>`
  ];
  if(taskHasArtifacts(state))
    items.push(`<button class="tk-mi" role="menuitem" type="button" data-taskdl="${esc(String(at))}">Download task artifacts</button>`);
  if(!items.length) return "";
  return `<div class="tk-ext">
    <div class="tk-more">
      <button class="tk-kebab" type="button" data-kebab="${esc(String(at))}" aria-haspopup="true" aria-expanded="false"
        aria-label="More actions for ${esc(t.name||"this task")}">⋯</button>
      <div class="tk-menu" role="menu" hidden>${items.join("")}</div>
    </div>
  </div>`;
}
const ICON_CHEV_RIGHT=`<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
  <path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6"
    stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON_DL=`<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
  <path d="M8 1.75v8.1m0 0L5.1 6.95M8 9.85l2.9-2.9" fill="none" stroke="currentColor"
    stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M2.4 11.2v1.55c0 .83.67 1.5 1.5 1.5h8.2c.83 0 1.5-.67 1.5-1.5V11.2"
    fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
</svg>`;

/* How long each milestone took, in seconds. A step is the unit of work that
   actually consumed time, so the duration belongs on the step — the task's own
   figure is the sum of them, not a separate fact (2026-09-17). */
function msSeconds(at,mi,n){
  /* stable pseudo-random spread, weighted so one step in a task dominates —
     which is what a real upgrade looks like */
  let x=((at+1)*2654435761 ^ (mi+1)*40503)>>>0;
  x^=x<<13; x>>>=0; x^=x>>17; x^=x<<5; x>>>=0;
  const heavy = mi===Math.floor(n/2);
  return 8 + (x%37) + (heavy?90:0);
}
function fmtDur(sec){
  if(sec<60) return sec+"s";
  const m=Math.floor(sec/60), r=sec%60;
  return r?m+"m "+String(r).padStart(2,"0")+"s":m+"m";
}
function taskDuration(t,at){
  if(!t.ms||!t.ms.length) return null;
  return fmtDur(t.ms.reduce((a,_,mi)=>a+msSeconds(at,mi,t.ms.length),0));
}

/* Only some tasks publish artefacts. Keyed off the task, not the item, so the
   same task is consistent across every item that runs it. */
/* The failure, and what can be done about it, rendered at the milestone that
   stopped. Indented to that step so the actions read as belonging to it. */
function failureBlockHTML(p,i,state){
  if(state!=="failed") return "";
  return `<li class="ms-fail">
    <div class="wf-fail">${esc(i.failureReason||"The task did not complete.")}</div>
    ${i.state===ITEM_STATE.ROLLBACKFAILED?`
      <div class="esc"><b>The rollback failed.</b> ${esc(i.rollbackReason||"The device could not be restored.")}
        This device may be in an inconsistent state and needs to be looked at by hand. There is no further
        action Model-X can take on this item.</div>`:""}
    ${i.state===ITEM_STATE.ACTION?`
      <div class="wf-actions">
        <button class="btn primary" data-itemact="retry">Retry</button>
        ${canRollback(p)?`<button class="btn" data-itemact="rollback">Roll back</button>`:""}
        <button class="btn" data-itemact="cancel">Cancel</button>
      </div>`:""}
    ${rollbackChainHTML(i)}
  </li>`;
}


/* ---- rollback is a second chain, not the forward one reversed ----
   It runs its own milestones, in its own order, and is drawn only on an item
   that actually rolled back (2026-09-17). */
const ROLLBACK_MS=[
  "Halt the in-flight change and quiesce traffic",
  "Restore the previous software volume",
  "Reboot onto the restored volume",
  "Re-establish the HA relationship",
  "Verify virtual server and pool counts against the pre-change capture"
];
function rollbackChainHTML(i){
  if(!ROLLBACK_STATES.has(i.state)) return "";
  const failedAt = i.state===ITEM_STATE.ROLLBACKFAILED ? ROLLBACK_MS.length-1 : -1;
  const running  = i.state===ITEM_STATE.ROLLINGBACK ? 2 : -1;
  const done     = i.state===ITEM_STATE.ROLLEDBACK;
  return `<section class="rb">
    <div class="rb-head"><b>Rollback</b><span>${
      done ? "Undone. A separate sequence — not the steps above run backwards."
      : failedAt>=0 ? "Stopped part-way."
      : "Running. A separate sequence — not the steps above run backwards."}</span></div>
    <ol class="ms-list rb-list">${ROLLBACK_MS.map((m,n)=>{
      const st = n===failedAt ? "failed" : n===running ? "running"
               : (failedAt>=0&&n>failedAt)||(running>=0&&n>running) ? "not-started" : "succeeded";
      const label={succeeded:"Succeeded",failed:"Failed",running:"Running","not-started":"Not started"}[st];
      const dur = st==="succeeded" ? fmtDur(msSeconds(900,n,ROLLBACK_MS.length))
                : st==="running" ? "running" : st==="failed" ? "stopped here" : "";
      return `<li class="ms ${st}">
        <!-- .ms is a four-column grid (number, mark, name, duration). The
             rollback steps are deliberately unnumbered, but the column still
             has to be filled or every child shifts left and the name lands in
             the 16px mark column. -->
        <span class="ms-n" aria-hidden="true"></span>
        <span class="ms-mark" aria-hidden="true">${MS_MARK[label]||""}</span>
        <span class="ms-name">${esc(m)}</span>
        <span class="ms-dur mono">${esc(dur)}</span>
        <span class="sr-only">${esc(label)}</span></li>`;}).join("")}</ol>
    ${i.state===ITEM_STATE.ROLLBACKFAILED
      ? `<div class="esc"><b>The rollback did not complete.</b> The device is part-way between two states
           and needs to be looked at by hand. There is no further action Model-X can take on this item.</div>`
      : ""}
  </section>`;
}

  ${(()=>{

       attention; this is where the item's own errors are read in full and

    const f=itemFailure(p,i); if(!f) return "";
    return `<div class="attn" role="region" aria-label="Attention required">

    /* Closed it is a headline; open it has to be usable as a record, which

    const grouped=rows.some(r=>r.isHost);

    const t=b.closest(".wf-task"); t.classList.toggle("open");
    b.setAttribute("aria-expanded",t.classList.contains("open")); }));

  /* If this item stopped, the stopped task is why you are here — put it in

  const failedEl=document.querySelector(".wf-task.failed");
  if(failedEl){

}


/* ===================================================================
   DEVICES — read-only inventory. Built from the same reference data the
   authoring flow selects from, so the two can never disagree. No
   selection, no plan creation: this view exists to be looked at.
   =================================================================== */
function inventory(){
  const rows=[];
  RSERIES_DEVICES.forEach(d=>{
    const ver=(d.label.split("— ")[1]||"—").trim();
    rows.push({name:d.id, type:"rSeries host", os:"F5OS", version:ver, region:d.region||"—",
               host:"—", partner:d.pair||"—", carries:(TENANTS_BY_DEVICE[d.id]||[]).length});
  });
  Object.keys(TENANTS_BY_DEVICE).forEach(h=>{
    TENANTS_BY_DEVICE[h].forEach(t=>{
      rows.push({name:t.id, type:"Tenant", os:"TMOS", version:t.v,
                 region:(deviceById(h)||{}).region||"—",      /* a tenant is where its host is */
                 host:h, partner:t.pair||"—", carries:null});
    });
  });
  VIRTUAL_TENANTS.concat(VIRTUAL_PARTNERS).forEach(t=>{
    rows.push({name:t.id, type:"Virtual tenant", os:"TMOS", version:t.v, region:t.region||"—",
               host:"—", partner:t.pair||"—", carries:null});
  });
  return rows;
}


/* Compliance is derived from the approved-version baseline the product already
   holds, not stored separately — so it cannot disagree with what the version
   dropdown offers when you build a plan. */
function versionsFor(os){ return os==="F5OS"?F5OS_VERSIONS:TMOS_VERSIONS; }

function compliance(r){
  const list=versionsFor(r.os);
  const rec=list.find(v=>v.v===r.version);
  const latest=(list.find(v=>v.latest)||{}).v;
  if(!rec)          return {state:"Drifted", why:"unrecognised build", bad:true};
  if(!rec.approved) return {state:"Drifted", why:"unapproved build",  bad:true};
  if(r.version===latest) return {state:"Compliant", why:"latest approved build"};
  const behind=list.filter(v=>v.approved&&newer(v.v,r.version)).length;
  return {state:"Compliant", why:plural(behind,"build")+" behind"};
}

/* device type in the client's vocabulary, derived from the shape we hold */
function deviceClass(r){
  if(r.type==="rSeries host")  return r.partner&&r.partner!=="—" ? "Host · HA pair" : "Host · standalone";
  if(r.type==="Tenant")        return "Hosted tenant";
  if(r.type==="Virtual tenant")return "Virtual tenant";
  return r.type;
}
/* the workflow that acts on this device — kept separate from OS, because the
   two are not 1:1 (a hosted and a virtual tenant both run TMOS) */
function opFor(r){
  if(r.type==="rSeries host") return OP.HOST;
  if(r.type==="Virtual tenant") return OP.VIRTUAL;
  return OP.TENANT;
}

let devQ="", devType="", devOp="", devRegion="", devComp="", devSort="name", devDir=1;
/* Columns are the sort control — clicking a header sorts by it. */
const DEV_COLS=[["name","Name"],["cls","Type"],["os","OS type"],["version","Version"],
  ["comp","Compliance"],["region","Region"],["host","Host"]];
function devValue(r,k){
  if(k==="cls")  return deviceClass(r);
  if(k==="comp") return compliance(r).state;
  return r[k]===undefined?"":String(r[k]);
}

function devRows(){
  const q=devQ.toLowerCase().trim();
  let rows=inventory();
  if(devType)   rows=rows.filter(r=>deviceClass(r)===devType);
  if(devOp)     rows=rows.filter(r=>opFor(r)===devOp);
  if(devRegion) rows=rows.filter(r=>r.region===devRegion);
  if(devComp)   rows=rows.filter(r=>compliance(r).state===devComp);
  if(q) rows=rows.filter(r=>[r.name,deviceClass(r),r.os,r.version,compliance(r).state,
    r.region,r.host,r.partner].join(" ").toLowerCase().includes(q));
  return rows.sort((a,b)=>devDir*devValue(a,devSort)
    .localeCompare(devValue(b,devSort),undefined,{numeric:true}));
}


/* Device and tenant detail — the property sets are the functional
   requirements' own tables, in their order. Properties the inventory does
   not carry are shown and marked, not omitted and not invented: the shape
   the client asked for is itself the useful thing to review. */
const DEVICE_PROPS=[
  ["Name","Device hostname"],
  ["Management IP","IP address used to manage the device"],
  ["Management Interface","Network interface used for management traffic"],
  ["Device Type","Category"],
  ["Vendor","Manufacturer"],
  ["Model","Hardware model"],
  ["Software Version","Currently running software version"]
];
const TENANT_PROPS=[
  ["Name","Tenant name"],
  ["Software Version","Currently running software version"],
  ["Status","Running state"],
  ["HA Role","Active, standby or none"],
  ["HA Partner","The paired device or tenant for failover"],
  ["Traffic Groups","Network traffic groups assigned to this tenant"],
  ["Virtual Servers","Number of virtual servers running"],
  ["Slots","Resource allocation on the host"]
];

let devSelected=null;

function deviceRecord(name){
  const inv=inventory().find(r=>r.name===name);
  if(!inv) return null;
  const host = inv.type==="rSeries host";
  const known = host
    ? { "Name":inv.name, "Device Type":"Physical host (rSeries)", "Vendor":"F5",
        "Software Version":inv.version+"  ·  F5OS" }
    : { "Name":inv.name, "Software Version":inv.version+"  ·  TMOS",
        "HA Partner":inv.partner };
  return {inv, host, known, props: host?DEVICE_PROPS:TENANT_PROPS};
}

function renderDeviceDetail(){
  const rec=deviceRecord(devSelected);
  if(!rec){ devSelected=null; return renderDevices(); }
  const {inv,host,known,props}=rec;
  /* A hosted tenant sits under its host, so the trail says so however you
     arrived — a breadcrumb reports position, not the route taken. Hosts and
     virtual tenants have no parent device and stay one level down. */
  const parent = inv.host && inv.host!=="—" ? [[inv.host,"device",inv.host]] : [];
  setCrumb([C_HOME,C_DEVICES].concat(parent,[inv.name]));

/* ===================================================================
   ACTIVITY — the audit trail and completion status. Events are derived
   from the plans themselves, so the log can never disagree with the state
   it describes.

   Export carries the defined evidence payload: backup files, pre/post-check
   results, execution logs, validation reports.
   =================================================================== */

/* Change-request closure names the payload exactly. One vocabulary. */
const EVIDENCE={backup:"Backup files", checks:"Pre/post-check results",
  logs:"Execution logs", reports:"Validation reports"};

const OPERATORS=["Priya Raghavan","Tom Whitfield","Ana Duarte","Samuel Okonjo",
  "Mei-Ling Chen","Daniel Brannigan","Freya Lindqvist"];
function planOwner(p){
  if(p.createdBy) return p.createdBy;
  let h=0; for(const ch of p.id) h=(h*31+ch.charCodeAt(0))>>>0;
  return OPERATORS[h%OPERATORS.length];
}

const ACTORS={
  op:"Operator", orch:"Model-X orchestrator",
  aap:"The client's platform, via AAP", partner:"The automation partner",
  change:"Change management"
};

const MONTH_N={Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",
  Jul:"07",Aug:"08",Sep:"09",Sept:"09",Oct:"10",Nov:"11",Dec:"12"};
function evDate(r){
  /* "8 Sep" -> 2026-09-08 so a range comparison is a string compare */
  const m=/^(\d{1,2})\s+([A-Za-z]{3,4})/.exec(r.d||"");
  if(!m) return "2026-09-09";                       /* undated events sit at "now" */
  return "2026-"+(MONTH_N[m[2]]||"09")+"-"+m[1].padStart(2,"0");
}

function activityLog(){
  const ev=[], push=(p,o)=>ev.push(Object.assign({plan:p.id,planRef:planRef(p),planName:planTitle(p),
    operation:p.operation, by:planOwner(p)},o));
  plansV2.forEach(p=>{
    const c=countsV2(p);
    push(p,{t:"04:12",d:"8 Sep",type:"Plan created",actor:"op",
      detail:plural(p.items.length,"item")+" · "+p.operation});
    if(p.state===PLAN_STATE.DRAFT) return;

    push(p,{t:"09:20",d:"8 Sep",type:"Submitted for validation",actor:"op",detail:p.change||"—"});
    if(p.state===PLAN_STATE.VALIDATING) return;

    if(hasValidationErrors(p)){
      push(p,{t:"09:21",d:"8 Sep",type:"Validation failed",actor:"orch",
        detail:(p.errors||[]).map(e=>e.name+" · "+plural(e.fails.length,"check")).join(" · ")||"checks failed",
        evidence:[EVIDENCE.reports]});
      return;
    }
    push(p,{t:"09:21",d:"8 Sep",type:"Validation passed",actor:"orch",
      detail:plural(CHECKS.length*p.items.length,"check")+" · all clear",evidence:[EVIDENCE.reports]});

    /* A requested window gets its change record once validation passes. There
       is no approved/declined event to report (2026-09-25). */
    if(p.mode==="create" && hasChangeNumber(p)) push(p,{t:"09:25",d:"8 Sep",type:"Change record created",actor:"change",detail:p.change});
    push(p,{t:"11:41",d:"9 Sep",type:"Scheduled",actor:"orch",detail:"window "+p.window});
    if(p.state===PLAN_STATE.SCHEDULED) return;

    if(p.windowExpired && !planHasRun(p)){
      push(p,{t:"02:00",d:p.window.split(",")[0],type:"Change window closed",actor:"orch",
        detail:plural(c.skipped,"item")+" skipped · window ended before they started"});
      return;
    }
    if(p.state===PLAN_STATE.ACTION){
      push(p,{t:"22:00",d:"—",type:"Execution started",actor:"orch",
        detail:"window opened · plan-level tasks running"});
      push(p,{t:"22:01",d:"—",type:"Plan task failed",actor:"orch",
        detail:p.planTaskFailed||"a plan-level task failed",evidence:[EVIDENCE.logs]});
      return;
    }

    push(p,{t:p.startedAt||"22:04",d:"—",type:"Execution started",actor:"partner",
      detail:p.execRef?"reference "+p.execRef:plural(p.items.length,"item")+" dispatched"});
    p.items.filter(i=>i.state===ITEM_STATE.SUCCEEDED).slice(0,3).forEach(i=>
      push(p,{t:"23:"+(10+p.items.indexOf(i)%40),d:"—",type:"Item succeeded",actor:"partner",
        item:i.name,detail:i.from+" → "+i.to,
        evidence:[EVIDENCE.backup,EVIDENCE.checks,EVIDENCE.logs]}));
    const a=attentionItem(p);
    if(a) push(p,{t:"23:47",d:"—",type:"Task failed",actor:"partner",item:a.name,
      detail:(failedTaskName(a)||"a task")+" · awaiting your decision",
      evidence:[EVIDENCE.backup,EVIDENCE.checks,EVIDENCE.logs]});
    if(p.state===PLAN_STATE.COMPLETED)
      push(p,{t:p.endedAt||"03:12",d:"—",type:"Change closed",actor:"orch",
        detail:p.change+" · artefacts attached",
        evidence:Object.values(EVIDENCE)});
  });
  /* newest first — an audit trail is read from the most recent event back */
  return ev.sort((a,b)=>(evDate(b)+" "+b.t).localeCompare(evDate(a)+" "+a.t));
}

let actQ="", actType="", actPlan="";
function actRows(){
  let rows=activityLog();
  if(actType) rows=rows.filter(r=>r.type===actType);
  if(actPlan) rows=rows.filter(r=>r.plan===actPlan);
  const q=actQ.toLowerCase().trim();
  if(q) rows=rows.filter(r=>[r.planRef,r.planName,r.item||"",r.type,r.detail,ACTORS[r.actor]]
    .join(" ").toLowerCase().includes(q));
  return rows;
}

/* defines exactly what an export contains, so the drawer names the payload
   rather than pretending a file has been produced. */
let expFrom="", expTo="", expOp="", expType="";
function openExport(items,scoped){
  resetDrawerChrome();
  if(scoped){ /* the scope is already fixed: no range to choose */ }
  else { const ds=activityLog().map(evDate).sort();
         if(!expFrom) expFrom=ds[0]; if(!expTo) expTo=ds[ds.length-1]; }
  document.getElementById("drawerTitle").textContent="Export";
  drawExport(items,scoped);
  showDrawer();
}

function exportSelection(base){
  let rows=base.filter(r=>r.evidence);
  if(expFrom) rows=rows.filter(r=>evDate(r)>=expFrom);
  if(expTo)   rows=rows.filter(r=>evDate(r)<=expTo);
  if(expOp)   rows=rows.filter(r=>r.operation===expOp);
  if(expType) rows=rows.filter(r=>r.type===expType);
  return rows;
}

function drawExport(base,scoped){
  const items=scoped?base:exportSelection(base);
  const files=[...new Set(items.flatMap(i=>i.evidence||[]))];
  const plans=[...new Set(items.map(i=>i.planRef))];
  const OPS=[...new Set(activityLog().map(r=>r.operation))].sort();
  const TYPES=[...new Set(activityLog().filter(r=>r.evidence).map(r=>r.type))];
  const onePlan=plans.length===1;
  document.getElementById("drawerSub").textContent=
    plural(items.length,"event")+" · "+(onePlan?plans[0]:plural(plans.length,"plan"));
  document.getElementById("drawerBody").innerHTML=
    `${scoped?"":`
    <div class="dw-g"><span class="lab">Period</span>
      <div class="two">
        <div class="field"><label>From</label><input type="date" id="expFrom" value="${esc(expFrom)}"></div>
        <div class="field"><label>To</label><input type="date" id="expTo" value="${esc(expTo)}"></div>
      </div></div>
    <div class="dw-g"><span class="lab">Filters</span>
      <div class="two">
        <div class="field"><label>Operation type</label>
          <select id="expOp"><option value="">All</option>
            ${OPS.map(o=>`<option value="${esc(o)}" ${expOp===o?"selected":""}>${esc(o)}</option>`).join("")}
          </select></div>
        <div class="field"><label>Event</label>
          <select id="expType"><option value="">All</option>
            ${TYPES.map(t=>`<option value="${esc(t)}" ${expType===t?"selected":""}>${esc(t)}</option>`).join("")}
          </select></div>
      </div></div>`}
     <div class="dw-g"><span class="lab">Contents</span>
       ${files.length?`<ul class="checks">${files.map(f=>`<li class="good">${esc(f)}</li>`).join("")}</ul>`
         :`<div class="wf-none">${scoped?"No evidence has been produced yet.":"Nothing in this range carries evidence."}</div>`}</div>
     <div class="dw-g"><span class="lab">Events</span>
       ${items.length?`<table class="tbl"><tbody>
         ${items.slice(0,12).map(i=>`<tr><td class="mono">${esc(i.d==="—"?"":i.d+" ")}${esc(i.t)}</td>
           ${onePlan?"":`<td class="mono">${esc(i.planRef)}</td>`}<td>${esc(i.type)}</td></tr>`).join("")}
         ${items.length>12?`<tr><td colspan="${onePlan?2:3}" class="muted">and ${items.length-12} more</td></tr>`:""}
       </tbody></table>`:`<div class="wf-none">No events selected.</div>`}</div>`;
  document.getElementById("drawerFoot").innerHTML=
    `<span class="msg">${items.length?"Attaches to "+(plans.length===1?"the change record":plural(plans.length,"change record")):""}</span>
     <button class="btn" onclick="closeDrawer()">Cancel</button>
     <button class="btn primary" id="expGo" ${items.length?"":"disabled"}>Export</button>`;
  if(!scoped){
    const bind=(id,set)=>{const el=document.getElementById(id);
      if(el) el.addEventListener("change",()=>{set(el.value);drawExport(base,scoped);});};
    bind("expFrom",v=>expFrom=v); bind("expTo",v=>expTo=v);
    bind("expOp",v=>expOp=v);     bind("expType",v=>expType=v);
  }
  const go=document.getElementById("expGo");
  if(go&&!go.disabled) go.addEventListener("click",()=>{
    closeDrawer(); showToast(plural(files.length,"artefact")+" exported from "+plural(items.length,"event")+".");
  });
}

/* ============================================================================
   DIALOG BEHAVIOUR

   Both overlays declare role="dialog" aria-modal="true". That declaration is a
   promise to assistive technology: focus starts inside, stays inside, and
   comes back where it was on close. It was being made and not kept — focus
   stayed on <body> and Tab walked straight into the navigation behind the
   overlay. One controller now keeps it for both.
   ============================================================================ */
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),'
  +'textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
let dialogReturn=null;

function dialogPanel(bg){ return bg.querySelector('[role="dialog"]'); }
function focusablesIn(el){
  return [...el.querySelectorAll(FOCUSABLE)].filter(n=>n.offsetParent!==null||n===document.activeElement);
}
function openDialogBg(bg){
  dialogReturn=document.activeElement;
  bg.classList.add("open"); bg.setAttribute("aria-hidden","false");
  const panel=dialogPanel(bg)||bg;
  const f=focusablesIn(panel);
  /* the close button is first in the markup; prefer the first thing the
     operator is here to do over the thing that abandons it */
  const target=f.find(n=>!n.hasAttribute("aria-label"))||f[0]||panel;
  if(target===panel && !panel.hasAttribute("tabindex")) panel.setAttribute("tabindex","-1");
  target.focus();
}
function closeDialogBg(bg){
  if(!bg.classList.contains("open")) return false;
  bg.classList.remove("open"); bg.setAttribute("aria-hidden","true");
  if(dialogReturn&&document.contains(dialogReturn)) dialogReturn.focus();
  dialogReturn=null;
  return true;
}
function openDialogs(){
  return ["modalBg","drawerBg","confirmBg"].map(id=>document.getElementById(id))
    .filter(b=>b&&b.classList.contains("open"));
}
document.addEventListener("keydown",e=>{
  const open=openDialogs(); if(!open.length) return;
  const bg=open[open.length-1];
  if(e.key==="Escape"){ e.preventDefault(); closeDialogBg(bg); return; }
  if(e.key!=="Tab") return;
  const panel=dialogPanel(bg)||bg, f=focusablesIn(panel);
  if(!f.length){ e.preventDefault(); return; }
  const first=f[0], last=f[f.length-1];
  if(!panel.contains(document.activeElement)){ e.preventDefault(); (e.shiftKey?last:first).focus(); return; }
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});
/* Clicking the backdrop dismisses, the same as Escape. */
["modalBg","drawerBg","confirmBg"].forEach(id=>{
  const bg=document.getElementById(id);
  if(bg) bg.addEventListener("mousedown",e=>{ if(e.target===bg) closeDialogBg(bg); });
});

document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("[data-chgpending]"); if(!b) return;

const v6VulnsOf=dev=>V6_VULNS.filter(v=>v6Affects(v,dev));
const v6GroupsOfDevice=id=>V6.groups.filter(g=>g.devices.includes(id));
const v6Ctxs=()=>V6S.ctx.filter(c=>getPlan(c.planId));
const v6CtxOf=planId=>v6Ctxs().find(c=>c.planId===planId)||null;
const v6CtxsOfGroup=gid=>v6Ctxs().filter(c=>c.groupId===gid);
const v6CtxsOfDevice=id=>v6Ctxs().filter(c=>c.deviceIds.includes(id));
const v6ImageOfGroup=g=>g&&g.imageId?v6Img(g.imageId):null;
const v6GroupVersion=g=>{ const i=v6ImageOfGroup(g); return i?i.version:""; };
const v6Certified=img=>!!img&&img.state==="Certified";
/* the certified image for an OS + version, if there is one */
const v6CertImage=(os,ver)=>V6.images.find(i=>i.os===os&&i.version===ver&&i.state==="Certified")||null;
const v6SeverityOf=ids=>ids.map(id=>(v6Vuln(id)||{}).sev).filter(Boolean).sort((a,b)=>V6_SEV_RANK[b]-V6_SEV_RANK[a])[0]||"Medium";

/* Versions a group may target: certified in the Nexus Images catalogue, valid under
   V5's approved-version rule, same OS, and newer than at least one member's current version
   (no downgrade, no same-version "upgrade"). */
function v6EligibleVersions(os,deviceIds){
  const cur=deviceIds.map(id=>v6Dev(id)).filter(Boolean).map(v6Ver).sort(v6VerCmp)[0];   /* the oldest member */
  return v6VersionList(os).filter(x=>isEligibleTarget(x))
    .map(x=>({x,img:v6CertImage(os,x.v)}))
    .filter(o=>o.img && (!cur || v6VerCmp(o.x.v,cur)>0))
    .map(o=>({version:o.x.v,image:o.img,recommended:!!o.x.latest}))
    .sort((a,b)=>v6VerCmp(b.version,a.version));
}
function v6GroupTargetState(g){
  const img=v6ImageOfGroup(g);
  if(!g.imageId) return {k:"none"};
  if(!img||!v6Certified(img)) return {k:"stale",img};
  return {k:"ok",img,version:img.version};
}
/* what each remediation record says about a device, in one place */
function v6DeviceStatus(dev){
  const cx=v6CtxsOfDevice(dev.id);
  if(cx.length){
    const c=cx[cx.length-1], p=getPlan(c.planId), vr=V6S.verif[c.planId];
    if(vr&&vr.latest&&vr.outcome==="resolved") return {k:"verified",t:"Verified resolved",plan:p,ctx:c};
    if(p&&TERMINAL.has(p.state)&&p.state!==PLAN_STATE.CANCELLED) return {k:"await",t:"Awaiting verification",plan:p,ctx:c};
    return {k:"plan",t:"In "+planRef(p),plan:p,ctx:c};
  }
  if(v6GroupsOfDevice(dev.id).length) return {k:"group",t:"In group"};
  return {k:"none",t:"Not started"};
}
/* one status per vulnerability, derived from its devices — never stored */
function v6VulnStatus(vuln){
  const aff=v6AffectedDevices(vuln);
  const verifs=Object.values(V6S.verif).filter(v=>v.vulnIds.includes(vuln.id)&&v.latest);
  const last=verifs[verifs.length-1];
  if(!aff.length){
    return last||v6Ctxs().some(c=>c.vulnIds.includes(vuln.id)) ? {k:"verified",t:"Verified resolved"} : {k:"clear",t:"No affected devices"};
  }
  if(last&&last.outcome==="detected") return {k:"still",t:"Still detected"};
  if(last&&last.outcome==="unavailable") return {k:"unavail",t:"Verification unavailable"};
  const st=aff.map(v6DeviceStatus);
  if(st.some(s=>s.k==="await")) return {k:"await",t:"Awaiting verification"};
  if(st.some(s=>s.k==="plan")) return {k:"plan",t:"In remediation plan"};
  if(st.some(s=>s.k==="group")) return {k:"group",t:"Group prepared"};
  return {k:"none",t:"Not started"};
}

/* A scan report is a snapshot of the findings at the moment it is generated. */
function v6Snapshot(id,at,ref,verOf){
  const findings=[], devices={};
  V6_VULNS.forEach(v=>{
    const ids=V6_DEVICES.filter(d=>v6VulnAt(v,d.os,verOf(d))).map(d=>d.id);
    if(ids.length){ findings.push({cve:v.id,deviceIds:ids}); ids.forEach(i=>{ devices[i]=verOf(V6_DEV_BY_ID[i]); }); }
  });
  return {id,at,scanRef:ref,scanned:V6_DEVICES.length,findings,devices,status:"Complete"};
}
/* Per device, against one target version: older can upgrade, equal has nothing to do, newer would be a downgrade. */
function v6Elig(g,version){
  const out={eligible:[],already:[],not:[]}; if(!version) return out;
  g.devices.map(v6Dev).filter(Boolean).forEach(d=>{ const c=v6VerCmp(version,v6Ver(d)); (c>0?out.eligible:c===0?out.already:out.not).push(d); });
  return out;
}

const _v6frameToHash=frameToHash;
frameToHash=function(f){
  switch(f.v){
    case "vuln":        return "#/vulnerabilities";
    case "vulndetail":  return "#/vulnerabilities/"+encodeURIComponent(f.c);
    case "report":      return "#/vulnerabilities/reports/"+encodeURIComponent(f.r)+(f.p?"/results/"+encodeURIComponent(f.p):"");
    case "groups":      return "#/remediation-groups";
    case "groupdetail": return "#/remediation-groups/"+encodeURIComponent(f.g);
    case "images":      return "#/software-images";
  }
  return _v6frameToHash(f);
};
const _v6hashToFrame=hashToFrame;
hashToFrame=function(h){
  const g=(h||"").replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);
  if(g[0]==="vulnerabilities"&&g[1]==="reports"&&g[2]) return g[3]==="results"&&g[4]?{v:"report",r:g[2],p:g[4]}:{v:"report",r:g[2]};
  if(g[0]==="vulnerabilities") return g[1]?{v:"vulndetail",c:g[1]}:{v:"vuln"};
  if(g[0]==="remediation-groups") return g[1]?{v:"groupdetail",g:g[1]}:{v:"groups"};
  if(g[0]==="software-images") return {v:"images"};
  return _v6hashToFrame(h);
};
const _v6resolveFrame=resolveFrame;
resolveFrame=function(f){
  if(f.v==="vulndetail" && !v6Vuln(f.c)) return {v:"vuln"};
  if(f.v==="groupdetail" && !v6Group(f.g)) return {v:"groups"};
  if(f.v==="report" && !v6Report(f.r)) return {v:"vuln"};
  if(f.v==="report" && f.p && !v6CtxOf(f.p)) return {v:"report",r:f.r};
  return _v6resolveFrame(f);
};
const _v6applyFrame=applyFrame;
applyFrame=function(f){
  /* Arriving at Create Plan fresh: no operation type is chosen for the user. */
  if(f.v==="newplan"){ newOp=""; V6S.npOpError=""; V6S.np=null; v6InitNewPlan(); }
  else if(f.v!=="plan"){ V6S.handoff=null; }
  if(!V6_VIEWS.has(f.v)){ V6S.drawer=null; V6S.gd=null; return _v6applyFrame(f); }
  stopEditing();
  const section=SECTION_OF[f.v];
  lastSection=section;
  ["modalBg","drawerBg","confirmBg"].forEach(id=>{
    const bg=document.getElementById(id);
    if(bg&&bg.classList.contains("open")){ bg.classList.remove("open"); bg.setAttribute("aria-hidden","true"); }
  });
  dialogReturn=null; editingItem=null; devSelected=null; V6S.drawer=null; V6S.gd=null; V6S.menu="";
  view=f.v; V6S.f=f;
  try{ window.scrollTo(0,0); }catch(e){}
  if(f.v==="report"&&f.p&&!V6S.scrollTo) V6S.scrollTo="rep-results";
  render();
};

function v6Render(){

function v6Stats(){
  const active=V6_VULNS.filter(v=>v6AffectedDevices(v).length);
  const affDev=new Set(), critDev=new Set();
  active.forEach(v=>v6AffectedDevices(v).forEach(d=>{ affDev.add(d.id); if(v.sev==="Critical") critDev.add(d.id); }));
  const grouped=[...affDev].filter(id=>v6GroupsOfDevice(id).length).length;
  return {scanned:V6_DEVICES.length,active,crit:active.filter(v=>v.sev==="Critical"),critDev:critDev.size,requiring:affDev.size,grouped};
}
function v6VulnRows(){
  const q=V6S.vq.trim().toLowerCase();
  return V6_VULNS.filter(v=>v6AffectedDevices(v).length&&(!q||v.id.toLowerCase().includes(q))&&(!V6S.vsev||v.sev===V6S.vsev)&&(!V6S.vos||v.os.includes(V6S.vos))&&(!V6S.vfix||V6_FIX[v6FixState(v)]===V6S.vfix))
    .sort((a,b)=>(!v6AffectedDevices(a).length)-(!v6AffectedDevices(b).length)||V6_SEV_RANK[b.sev]-V6_SEV_RANK[a.sev]||b.cvss-a.cvss);

function v6RepDevPass(r,s,id){
  const d=v6Dev(id); if(!d) return false;
  if(s.tab&&d.os!==s.tab) return false;
  if(s.region&&d.region!==s.region) return false;
  if(s.zone&&d.zone!==s.zone) return false;
  if(s.ver&&r.devices[id]!==s.ver) return false;
  const cs=v6RepCves(r,id);
  if(s.cve&&!cs.includes(s.cve)) return false;
  if(s.sev&&!cs.some(c=>(v6Vuln(c)||{}).sev===s.sev)) return false;
  const q=s.q.trim().toLowerCase();
  return !q||d.name.toLowerCase().includes(q)||cs.some(c=>c.toLowerCase().includes(q));
}

  .sort((a,b)=>V6_SEV_RANK[v6RepTop(r,b)]-V6_SEV_RANK[v6RepTop(r,a)]||a.localeCompare(b));

   <colgroup><col style="width:44px"><col style="width:250px"><col style="width:84px"><col style="width:96px"><col style="width:76px"><col style="width:112px"><col><col style="width:116px"></colgroup>
   <thead><tr><th scope="col" class="cb"><input type="checkbox" aria-label="Select all ${rows.length} devices shown" data-v6ch="repDAll" ${all?"checked":""} ${!all&&some?'data-indet="1"':""}></th>
   <th scope="col">Device name</th><th scope="col">OS type</th><th scope="col">Current version</th><th scope="col">Region</th><th scope="col">Network zone</th><th scope="col">Vulnerabilities</th><th scope="col">Highest severity</th></tr></thead><tbody>
   ${rows.map(id=>{ const d=v6Dev(id), cs=v6RepCves(r,id).sort((x,y)=>V6_SEV_RANK[v6Vuln(y).sev]-V6_SEV_RANK[v6Vuln(x).sev]||(x===s.cve?-1:0)), ctx=v6RepContext(d);

      <td><span class="trunc" title="${h6(d.name)}"><b>${h6(d.name)}</b></span><span class="sub2 trunc" title="${h6(ctx)}">${h6(ctx)}</span></td>
      <td>${h6(d.os)}</td><td class="mono">${h6(r.devices[id])}</td><td>${h6(d.region)}</td><td><span class="trunc">${h6(d.zone)}</span></td>
      <td><span class="v6-chips sc" title="${h6(cs.join(", "))}">${shown.map(c=>`<span class="v6c soft">${h6(c)}</span>`).join("")}${cs.length>2?`<span class="v6c dash" aria-label="${cs.length-2} more: ${h6(cs.slice(2).join(", "))}">+${cs.length-2}</span>`:""}</span></td>

/* ============================ V6.1 — REMEDIATION GROUPS ============================

/* ============================ CREATE / EDIT GROUP — side panel with conditional criteria ============================

/* ---- version details ---- */
V6A.openImage=(id)=>v6RenderImageDrawer(id);
function v6RenderImageDrawer(id){
  const i=v6Img(id); if(!i) return;
  const eng=v6IsEng(), cert=i.state==="Certified", lg=v6LinkedGroups(i), m=v6ImgMeta(i), fx=v6ImgFixes(i), files=v6ImgFiles(i);
  const kv=(k,v)=>`<div>${k}</div><div>${v}</div>`;
  const body=`<div class="dw-g"><div class="drawer-kv">
     ${kv("Status",v6CertChip(i.state))}
     ${i.by?kv(cert?"Certified by":"Reviewed by",`${h6(v6Reviewer(i))} · ${h6(i.at)}`):""}
     ${i.state==="Not Certified"&&i.reason?kv("Reason",h6(i.reason)):""}
     ${kv("Build",`<span class="mono">${h6(v6ImgBuild(i))}</span>`)}
     ${kv("Released",`${h6(m.rel)} · ${h6(m.type)}`)}
     ${kv("Vendor support",h6(m.support))}
     ${kv("Upgrade path",`From ${h6(m.from)}`)}
     ${kv("Platforms",h6(V6_PLATFORMS[i.os]||"—"))}
     ${kv("Eligible devices",String(v6ImgEligible(i).length))}
     ${kv("In use",lg.length?lg.map(g=>h6(g.name)).join(", "):`<span style="color:var(--ink4)">Not used by any group</span>`)}</div></div>
   <div class="dw-g"><span class="lab">CVEs fixed</span>${fx.length?`<div class="v6-chips sc">${fx.map(v=>`<span class="v6c ${v.sev==="Critical"?"solid":"soft"}">${h6(v.id)}</span>`).join("")}</div>`:`<div class="v6-sub">None in the current findings</div>`}</div>
   <div class="dw-g"><span class="lab">Files</span>${files.map(x=>`<div class="v6-devrow"><span class="n trunc mono" title="${h6(x.f)}">${h6(x.f)}</span><span class="m">${x.s.toFixed(2)} GB</span></div>`).join("")}
    <div class="drawer-kv" style="margin-top:10px">
     ${kv("SHA256",`<span class="mono" style="word-break:break-all;font-size:11px">${h6(i.sha)}</span>`)}
     ${kv("Checksum","✓ Matches vendor")}
     ${kv("Synced",`${h6(i.available)} · <span class="mono" style="font-size:11px">nexus/${h6(i.os.toLowerCase())}/${h6(i.version)}/</span>`)}
     ${kv("Release notes",`<button class="link" type="button" data-v6="notes">Open</button>`)}</div></div>`;
  const inUse=cert&&lg.length, why=!eng?V6_ENG_ONLY:inUse?`Used by ${v6Plural(lg.length,"group")}. Change their target version first.`:"";
  const foot=`<span class="msg"></span><button class="btn" type="button" data-v6="imgClose">Close</button>
   ${eng&&i.state!=="Not Certified"?`<button class="btn" type="button" data-v6="markNot" data-a="${h6(i.id)}" ${inUse?`aria-disabled="true" data-why="${h6(why)}"`:""}>Mark Not Certified</button>`:""}
   ${eng&&!cert?`<button class="btn primary" type="button" data-v6="certify" data-a="${h6(i.id)}">Certify</button>`:""}`;
  v6OpenDrawer("image",i.os+" "+i.version,"",body,foot);
}
V6A.notes=()=>showToast("Release notes are not available in this prototype.");
V6A.imgClose=()=>closeDialogBg(document.getElementById("drawerBg"));
function v6AfterImageChange(i){
  if(view==="images") renderImages(); else render();
  if(V6S.drawer==="image") v6RenderImageDrawer(i.id);
}
/* the details drawer is the review: certifying from it needs no second confirmation */
V6A.certify=(id)=>{
  const i=v6Img(id); if(!i) return; if(!v6IsEng()) return showToast(V6_ENG_ONLY);
  i.state="Certified"; i.by="Automation Engineering · reviewer 01 (demo)"; i.at=v6Now(); i.reason=""; v6Save();
  showToast(i.os+" "+i.version+" certified");
  v6AfterImageChange(i);
};
V6A.markNot=(id,el)=>{
  const i=v6Img(id); if(!i||!v6IsEng()) return;
  if(i.state==="Certified"&&v6LinkedGroups(i).length) return v6Why(el);
  v6Modal(`Mark ${i.os} ${i.version} Not Certified?`,
    `<p class="cf-lead">It will not be offered as a target version.</p>
     <div class="v6-fld"><label class="l" for="v6-reason">Reason (optional)</label><input type="text" id="v6-reason" maxlength="120" placeholder="e.g. Failed compatibility review"></div>`,
    [{label:"Go back"},{label:"Mark Not Certified",primary:true,onClick:()=>{
      const r=(V6$("#v6-reason")||{}).value||"";
      i.state="Not Certified"; i.by="Automation Engineering · reviewer 01 (demo)"; i.at=v6Now(); i.reason=r.trim(); v6Save();
      showToast(i.os+" "+i.version+" marked Not Certified");
      v6AfterImageChange(i);
    }}]);
};

/* ---- Add a version to one OS (simulated upload; lands as Pending Certification) ---- */
const v6FileFor=(os,ver,build)=>os==="FortiOS"?`FGT_600F-v${ver}-build${build||"0000"}-FORTINET.out`:os==="TMOS"?`BIGIP-${ver}-${build||"0.0.1"}.iso`:`F5OS-A-${ver}-${build||"00000"}.R5R10.iso`;
V6A.addVer=os=>{ if(!v6IsEng()) return showToast(V6_ENG_ONLY);
  V6S.av={os,version:"",build:"",rel:"",type:"Maintenance",file:"",fileTouched:false,err:{}}; v6RenderAddVer(); v6FocusAfter("#av-ver"); };

  const a=V6S.av, e=a.err, fe=k=>e[k]?`<span class="field-err" id="av-e-${k}">${h6(e[k])}</span>`:"";

     <div class="v6-fld"><label class="l" for="av-file">File name</label><input type="text" id="av-file" value="${h6(file)}" data-v6in="avFile" placeholder="Filled from version and build" autocomplete="off" ${inv("file")}>${fe("file")}</div>
     <div class="v6-fld"><label class="l" for="av-rel">Release date</label><input type="date" id="av-rel" value="${h6(a.rel)}" data-v6in="avRel"></div>
     <div class="v6-fld"><label class="l" for="av-type">Release type</label><select id="av-type" data-v6ch="avType">${["Maintenance","Feature","Hotfix"].map(t=>`<option ${a.type===t?"selected":""}>${t}</option>`).join("")}</select></div></div>`,

const v6AvFile=()=>{ const a=V6S.av, el=V6$("#av-file"); if(el&&!a.fileTouched) el.value=a.version?v6FileFor(a.os,a.version,a.build):""; };
V6A.avVer=v=>{ V6S.av.version=v.trim(); v6AvFile(); };
V6A.avBuild=v=>{ V6S.av.build=v.trim(); v6AvFile(); };
V6A.avFile=v=>{ V6S.av.file=v.trim(); V6S.av.fileTouched=!!v.trim(); };
V6A.avRel=v=>{ V6S.av.rel=v; };
V6A.avType=v=>{ V6S.av.type=v; };
V6A.avCancel=()=>closeDialogBg(document.getElementById("drawerBg"));
V6A.avSave=()=>{
  const a=V6S.av, e={};
  if(!/^\d+(\.\d+){1,3}$/.test(a.version)) e.version="Enter a version such as "+(a.os==="FortiOS"?"7.4.6":a.os==="TMOS"?"17.1.2":"1.8.1")+".";
  else if(V6.images.some(i=>i.os===a.os&&i.version===a.version)) e.version=a.os+" "+a.version+" is already listed.";
  const file=a.fileTouched?a.file:(a.version?v6FileFor(a.os,a.version,a.build):"");
  if(!e.version&&!file) e.file="Enter a file name.";
  a.err=e; if(Object.keys(e).length){ v6RenderAddVer(); v6FocusAfter(e.version?"#av-ver":"#av-file"); return; }
  const rel=a.rel?new Date(a.rel+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):v6Now().split(" · ")[0];
  V6.seq.img+=1;
  const id="IMG-"+String(V6.seq.img).padStart(3,"0");
  V6.images.push({id,file,os:a.os,version:a.version,size:+(1+Math.random()*2.4).toFixed(2),sha:v6Sha(file),state:"Pending Certification",
    source:"Uploaded",available:v6Now().split(" · ")[0],by:"",at:"",reason:"",validatedAt:"",meta:{rel,type:a.type,support:"Supported",from:"—"}});
  v6Save(); V6S.av=null; V6S.iexp=V6S.iexp||{}; V6S.iexp[a.os]=true; v6ForceCloseDrawer(); renderImages();
  const r=document.getElementById("img-"+id); if(r){ r.scrollIntoView({block:"center"}); r.classList.add("flash"); }
  showToast(a.os+" "+a.version+" added · Pending certification");
};

V6A.toGroups=()=>go({v:"groups"});


/* ============================ FIREWALL UPGRADE — declared in V5, specified here ============================
   V5 declares the type but gives it no fields. The vault's product rules define a firewall item as one
   FortiManager selection: FortiManager, ADOM, platform, target version and a list of HA clusters, with no
   rollback. This adds that operation as data, the way V5's schema expects. FortiManager/ADOM data is sample. */
OP.FIREWALL="Firewall upgrade";
const V6_FMGS=v6Uniq(V6_CLUSTERS.map(c=>c.fmg));
const v6Opts=a=>a.map(x=>({v:x,t:x}));
OPERATIONS[OP.FIREWALL]={label:OP.FIREWALL,journey:"firewall",os:"FortiOS",rollback:false,
  fields:[
   {key:"fmg",label:"FortiManager",placeholder:"Select a FortiManager",options:()=>v6Opts(V6_FMGS)},
   {key:"adom",label:"ADOM",placeholder:"Select an ADOM",when:d=>!!d.fmg,options:d=>v6Opts(v6Uniq(V6_CLUSTERS.filter(c=>c.fmg===d.fmg).map(c=>c.adom)))},
   {key:"platform",label:"Platform",placeholder:"Select a platform",when:d=>!!d.adom,options:d=>v6Opts(v6Uniq(V6_CLUSTERS.filter(c=>c.fmg===d.fmg&&c.adom===d.adom).map(c=>c.platform)))},
   {key:"version",label:"Target version",placeholder:"Select a version",when:d=>!!d.platform,kind:"version",options:d=>v6VersionOptions(OP.FIREWALL,FORTIOS_VERSIONS,d)},
   {key:"clusters",label:"Firewalls / HA clusters",kind:"multi",when:d=>!!d.version,
    options:d=>V6_CLUSTERS.filter(c=>c.fmg===d.fmg&&c.adom===d.adom&&c.platform===d.platform).map(c=>({v:c.id,t:c.id}))}
  ]};
ITEM_COLUMNS.firewall={label:"Firewall upgrade",cols:[
  ["FortiManager",i=>i.fmg,"link"],["ADOM",i=>i.adom],["Platform",i=>i.platform],["Target version",i=>i.to],["HA clusters",i=>(i.clusters||[]).join(", ")]]};
/* Only the R-series sequence is specified; V5 already runs it, labelled, for host and virtual. Firewall follows
   the same convention so Item Detail has a workflow to show. It is a placeholder, not a firewall specification. */
const _v6workflowFor=workflowFor;
workflowFor=function(item){
  if(journeyOf(item)==="firewall") return {wf:WORKFLOW_RSERIES,src:"Firewall estate · steps to be confirmed"};
  return _v6workflowFor(item);
};
const _v6versionsForOp=versionsForOp;
versionsForOp=function(op){ return opOS(op)==="FortiOS"?FORTIOS_VERSIONS:_v6versionsForOp(op); };
const _v6recommendedVersion=recommendedVersion;
recommendedVersion=function(op){
  const os=opOS(op), ctx=v6PlanCtx();
  if(os!=="FortiOS" && !ctx) return _v6recommendedVersion(op);
  const list=v6VersionList(os);
  const pick=list.find(v=>isEligibleTarget(v)&&v.latest&&(!ctx||v6CertImage(os,v.v)))
    ||(ctx?list.filter(v=>isEligibleTarget(v)&&v6CertImage(os,v.v)).sort((a,b)=>v6VerCmp(b.v,a.v))[0]:null);
  return pick?pick.v:"";
};

/* ============================ PLAN CONTEXT + TARGET VERSION RULES ============================ */
const v6PlanCtx=()=>(view==="plan"&&selectedPlan)?v6CtxOf(selectedPlan):null;
function v6DraftCurrent(op,d){
  if(op===OP.TENANT||op===OP.VIRTUAL){ const t=tenantById(d.tenant); return t?t.v:null; }
  if(op===OP.HOST){ const vs=[d.peer1,d.peer2].map(x=>deviceById(x)).filter(Boolean).map(x=>x.label.split("— ")[1]).sort(v6VerCmp); return vs.length?vs[vs.length-1]:null; }
  return null;
}
/* V5's list, plus — only for a plan prepared from a group — certification and "newer than current". */
function v6VersionOptions(op,list,d){
  const base=versionOptions(list), ctx=(d===addDraft)?v6PlanCtx():null;
  if(!ctx) return base;
  const os=opOS(op), cur=v6DraftCurrent(op,d);
  return base.map((o,i)=>{
    if(o.disabled) return o;
    const x=list[i];
    if(!v6CertImage(os,x.v)) return Object.assign({},o,{disabled:true,t:x.v+"  ·  not certified"});
    if(cur&&v6VerCmp(x.v,cur)<=0) return Object.assign({},o,{disabled:true,t:x.v+(v6VerCmp(x.v,cur)===0?"  ·  same as current":"  ·  older than current")});
    return o;
  });
}
[[OP.TENANT,TMOS_VERSIONS],[OP.VIRTUAL,TMOS_VERSIONS],[OP.HOST,F5OS_VERSIONS]].forEach(([op,list])=>{
  const f=OPERATIONS[op].fields.find(x=>x.key==="version"); f.options=d=>v6VersionOptions(op,list,d);
});
const _v6validateItem=validateItem;
validateItem=function(draft,needsChange){
  let r=_v6validateItem(draft,needsChange);
  if(r) return r.replace("ha clusters","HA clusters");
  if(draft===addDraft){
    const ctx=v6PlanCtx();
    if(ctx&&draft.version){
      if(!v6CertImage(opOS(draft.op),draft.version)) return "Choose a certified target version.";
      const cur=v6DraftCurrent(draft.op,draft);
      if(cur&&v6VerCmp(draft.version,cur)<=0) return "The target version must be newer than the current version.";
    }
  }
  return null;
};

/* ---- firewall: multi-select, impact, item shape, duplicates ---- */
const v6IsFw=d=>d&&d.op===OP.FIREWALL;
const v6Clusters=d=>Array.isArray(d.clusters)?d.clusters:[];
const _v6fieldHTML=fieldHTML;
fieldHTML=function(f,draft,handler,enabled,blockedBy){
  if(f.kind==="multi") return v6MultiFieldHTML(f,draft,handler,enabled,blockedBy);
  const ctx=(draft===addDraft)?v6PlanCtx():null;
  if(ctx&&enabled&&["device","tenant","peer1","peer2"].includes(f.key)){
    const inGroup=v=>f.key==="tenant"?ctx.deviceIds.includes(v):f.key==="device"?ctx.deviceIds.some(id=>(v6Dev(id)||{}).host===v):ctx.deviceIds.includes(v);
    const f2=Object.assign({},f,{options:d=>f.options(d).map(o=>Object.assign({},o,{t:o.t+(inGroup(o.v)?"  ·  in "+ctx.groupName:"")}))});
    return _v6fieldHTML(f2,draft,handler,enabled,blockedBy);
  }
  return _v6fieldHTML(f,draft,handler,enabled,blockedBy);
};
function v6MultiFieldHTML(f,draft,handler,enabled,blockedBy){
  if(!enabled) return `<div class="field"><label>${h6(f.label)}</label><span class="help" style="display:block">Choose ${h6(blockedBy.toLowerCase())} first.</span></div>`;
  const ctx=(draft===addDraft)?v6PlanCtx():null, sel=v6Clusters(draft), which=draft===addDraft?"a":"q";
  const p=draft===addDraft?getPlan(selectedPlan):null;
  const used=new Set(p?p.items.filter(i=>i.id!==editingItem).flatMap(i=>i.clusters||[]):[]);
  const rows=f.options(draft).map(o=>{
    const c=v6Cluster(o.v), stale=draft.version&&v6VerCmp(draft.version,c.version)<=0, inUse=used.has(c.id);
    const inGroup=ctx&&c.members.some(m=>ctx.deviceIds.includes(m));
    return {c,dis:stale||inUse,why:inUse?"already in another item":stale?"already on "+c.version+" or newer":"",inGroup};
  });
  const elig=rows.filter(r=>!r.dis).length;
  return `<div class="field"><label>${h6(f.label)}</label>
   <div class="v6-dh"><span class="v6-sub">${sel.length} selected · ${elig} eligible for ${h6(draft.version)}</span><span class="sp"></span><button type="button" class="link" data-v6="fwAll" data-d="${which}" ${elig?"":"disabled"}>Select all eligible</button></div>
   <div class="v6-multi" role="group" aria-label="${h6(f.label)}">${rows.map(r=>`<label class="v6-opt ${r.dis?"dis":""} ${sel.includes(r.c.id)?"on":""}">
     <input type="checkbox" data-v6ch="fwToggle" data-a="${h6(r.c.id)}" data-d="${which}" ${sel.includes(r.c.id)?"checked":""} ${r.dis?"disabled":""}>
     <span class="n">${h6(r.c.id)}<small>${h6(r.c.members.join(" / "))} · running ${h6(r.c.version)}${r.inGroup?" · in "+h6(ctx.groupName):""}${r.why?" · "+h6(r.why):""}</small></span></label>`).join("")}</div>
   ${ctx&&rows.some(r=>!r.inGroup)?`<span class="help" style="display:block">Clusters marked “in ${h6(ctx.groupName)}” come from the group. Others can be added, but they are not part of the group.</span>`:""}</div>`;
}
const v6DraftOf=el=>el.dataset.d==="q"?quickDraft:addDraft;
const v6RerenderDraft=d=>d===quickDraft?renderQuick():renderAddItem();
V6A.fwToggle=(on,el)=>{ const d=v6DraftOf(el), id=el.dataset.a; let a=v6Clusters(d).slice();
  a=on?v6Uniq(a.concat(id)):a.filter(x=>x!==id); d.clusters=a.length?a:""; d.impact=null; v6RerenderDraft(d);
  v6FocusAfter('[data-v6ch="fwToggle"][data-a="'+id+'"]'); };
V6A.fwAll=(a,el)=>{ const d=v6DraftOf(el), f=OPERATIONS[OP.FIREWALL].fields.find(x=>x.key==="clusters");
  const p=d===addDraft?getPlan(selectedPlan):null, used=new Set(p?p.items.filter(i=>i.id!==editingItem).flatMap(i=>i.clusters||[]):[]);
  const ids=f.options(d).map(o=>o.v).filter(id=>{ const c=v6Cluster(id); return !(d.version&&v6VerCmp(d.version,c.version)<=0)&&!used.has(id); });
  d.clusters=ids.length?ids:""; d.impact=null; v6RerenderDraft(d); };
const _v6computeImpact=computeImpact;
computeImpact=function(draft){
  if(!v6IsFw(draft)) return _v6computeImpact(draft);
  const rows=[]; v6Clusters(draft).forEach(cid=>{ const c=v6Cluster(cid); if(!c) return;
    c.members.forEach(m=>rows.push({device:c.id,tenant:m,region:c.region,why:"Member of HA cluster "+c.id,isHost:false,fw:true,cluster:c.id})); });
  return rows;
};
const _v6impactReady=impactReady;
impactReady=function(d){ return v6IsFw(d)?v6Clusters(d).length>0:_v6impactReady(d); };
const _v6impactParts=impactParts;
impactParts=function(rows){
  if(rows.length&&rows[0].fw){ const n=v6Uniq(rows.map(r=>r.cluster)).length; return rows.length+" Firewalls · "+n+" HA "+(n===1?"cluster":"clusters"); }
  return _v6impactParts(rows);
};
const _v6impactHTML=impactHTML;
impactHTML=function(draft){
  if(!v6IsFw(draft)) return _v6impactHTML(draft);
  if(!impactReady(draft)) return `<div class="notice">Select a target first.</div>`;
  if(!draft.impact) return `<div class="notice">Not checked yet.</div>`;
  const rows=draft.impact;
  return `<div class="imp-sum"><b>Impacted CIs</b><span class="imp-n">${h6(impactTotal(rows))}</span><span class="imp-parts">${h6(impactParts(rows))}</span></div>`+
   v6Uniq(rows.map(r=>r.cluster)).map(cid=>{ const kids=rows.filter(r=>r.cluster===cid);
     return `<div class="imp-grp"><div class="imp-grp-h"><div><b>HA cluster: ${h6(cid)}</b></div><span class="imp-n">${h6(plural(kids.length,"firewall"))}</span></div>
       <table class="impact"><thead><tr><th scope="col">Firewall</th></tr></thead><tbody>${kids.map(r=>`<tr><td class="mono">${h6(r.tenant)}</td></tr>`).join("")}</tbody></table></div>`; }).join("");
};
const _v6itemImpact=itemImpact;
itemImpact=function(i){ return journeyOf(i)==="firewall"?computeImpact({op:OP.FIREWALL,clusters:i.clusters||[]}):_v6itemImpact(i); };
const _v6itemFromDraft=itemFromDraft;
itemFromDraft=function(d,id){
  if(!v6IsFw(d)) return _v6itemFromDraft(d,id);
  const cl=v6Clusters(d), cs=cl.map(v6Cluster).filter(Boolean);
