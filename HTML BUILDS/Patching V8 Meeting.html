V6A.simStart=(pid)=>{
  const p=getPlan(pid); if(!p||p.state!==PLAN_STATE.SCHEDULED) return;
  const lim=v6Limit(p); p.state=PLAN_STATE.EXECUTING; p.startedAt=clockLabel();
  p.items.forEach((i,n)=>{ if(n<lim) v6StartItem(i); else { i.state=ITEM_STATE.QUEUED; i.taskIdx=0; i.msIdx=0; } });
  render(); showToast(lim<p.items.length?"Simulated: the window opened. "+lim+" items running, "+(p.items.length-lim)+" queued by the concurrency limit.":"Simulated: the window opened and every item is running.");
};
V6A.simFinish=(pid)=>{
  const p=getPlan(pid); if(!p||p.state!==PLAN_STATE.EXECUTING) return;
  p.items.filter(i=>i.state===ITEM_STATE.INPROGRESS).forEach(i=>{ i.state=ITEM_STATE.SUCCEEDED; i.taskIdx=v6TaskCount(i)-1; i.msIdx=0; });
  const q=p.items.filter(i=>i.state===ITEM_STATE.QUEUED);
  if(q.length){ const next=q.slice(0,v6Limit(p)); next.forEach(v6StartItem); render(); showToast("Simulated: running items completed. The next "+v6Plural(next.length,"item")+" started."); return; }
  settlePlan(p); render(); showToast("Simulated: every item completed.");
};



const TERMINAL_ITEM_OK=i=>i.state===ITEM_STATE.SUCCEEDED;
V6A.simFail=(pid)=>{
  const p=getPlan(pid); if(!p||p.state!==PLAN_STATE.EXECUTING) return;
  p.items.forEach(i=>{ if(TERMINAL_ITEM_OK(i)) return; i.state=ITEM_STATE.FAILED; i.failedTask=Math.floor(v6TaskCount(i)*0.5); i.taskIdx=i.failedTask; i.msIdx=0; });
  settlePlan(p); render(); showToast("Simulated: every item failed.");
};

/* A plan made from a group starts with an item for each eligible device, built the way Add item builds one,
   with the impact computed for each. Host upgrades pair each host with its peer; firewall items group HA
   clusters by FortiManager, ADOM and platform. */
let V6_ITN=0;
/* Builds items for the given devices the way Add item builds them, with the impact computed for each.
   Host upgrades pair each host with its peer. Firewall clusters join the item for their FortiManager,
   ADOM and platform when the plan already has one. */
function v6ItemsFor(p,ids,version){
  const op=p.operation, devs=ids.map(v6Dev).filter(Boolean);
  const add=d=>{ d.op=op; d.version=version; d.impact=computeImpact(d); p.items.push(itemFromDraft(d,"IT-G"+String(++V6_ITN).padStart(3,"0"))); };
  if(op===OP.TENANT) devs.forEach(d=>add({device:d.host,tenant:d.id}));
  else if(op===OP.VIRTUAL) devs.forEach(d=>add({tenant:d.id}));
  else if(op===OP.HOST){ const seen=new Set(p.items.map(i=>[i.peer1,i.peer2].sort().join("|"))); devs.forEach(d=>{ const pr=deviceById(d.id), k=[d.id,pr.pair].sort().join("|"); if(seen.has(k)) return; seen.add(k); add({peer1:d.id,peer2:pr.pair}); }); }
  else if(op===OP.FIREWALL){
    const g={}; devs.forEach(d=>{ const c=v6Cluster(d.cluster), k=[c.fmg,c.adom,c.platform].join("|"); (g[k]=g[k]||{c,ids:new Set()}).ids.add(c.id); });
    Object.values(g).forEach(o=>{
      const it=p.items.find(i=>i.fmg===o.c.fmg&&i.adom===o.c.adom&&i.platform===o.c.platform);
      if(it){ const merged=v6Uniq((it.clusters||[]).concat([...o.ids])); const d={op,fmg:it.fmg,adom:it.adom,platform:it.platform,clusters:merged,version};
        d.impact=computeImpact(d); const n=p.items.indexOf(it); p.items[n]=itemFromDraft(d,it.id); }
      else add({fmg:o.c.fmg,adom:o.c.adom,platform:o.c.platform,clusters:[...o.ids]});
    });
  }
}
function v6AutoItems(p,ctx){ v6ItemsFor(p,ctx.deviceIds,ctx.targetVersion); }
/* A plan made from a group adds devices with the group's criteria panel, not the target-field drawer. */
const _v6openAddItem2=openAddItem;
openAddItem=function(){
  const ctx=v6PlanCtx(), p=getPlan(selectedPlan);
  if(ctx&&p){ if(!canEditItems(p)) return showToast("This plan has been submitted. Its items are locked."); return v6OpenGroupDrawer({mode:"add",planId:p.id}); }
  return _v6openAddItem2();
};
/* devices a group-made plan can still take: right kind, older than the target, not in this plan, not held elsewhere */
function v6AddPool(p,ctx){
  const inPlan=new Set(p.items.flatMap(v6ItemDevices));
  return v6Affected().filter(d=>v6Fits(p.operation,d)&&v6VerCmp(ctx.targetVersion,v6Ver(d))>0&&!inPlan.has(d.id)&&!v6Blocked(d.id));
}


/* ============================================================================
   PATCHING V7 — the remediation loop (design proposal, sample data).

   Every device a scan reports is followed from that scan until a later scan
   confirms the fix. Group, target version and plan are steps it passes
   through. A failed upgrade, a device removed from a plan, or a patch the next
   scan still finds sends the device back to Not covered, with the reason.

   Nothing here is stored: each status is derived from the groups, plans,
   items and scans that already exist. Scans are SIMULATED.
   ============================================================================ */
const V7_STAGES=[
 {k:"not",t:"Not covered",d:"Affected and in no group, or back from a plan"},
 {k:"ver",t:"Waiting for version",d:"In a group with no certified target version",wait:"certified version"},
 {k:"ready",t:"Ready to plan",d:"In a group with a certified target version"},
 {k:"window",t:"Waiting for window",d:"In a plan that has not started",wait:"change window"},
 {k:"patching",t:"Patching",d:"The plan is running"},
 {k:"rescan",t:"Awaiting rescan",d:"Upgraded; the next scan confirms it"},
 {k:"fixed",t:"Fixed",d:"The latest scan no longer reports it"}
];
const V7_ST=Object.fromEntries(V7_STAGES.map((s,i)=>[s.k,Object.assign({n:i},s)]));
const V7_RET={failed:"Upgrade did not complete",removed:"Removed from a plan",still:"Still detected after patching",partial:"Needs a newer version"};
const V7_PRE_PLAN=new Set([PLAN_STATE.DRAFT,PLAN_STATE.VFAILED,PLAN_STATE.VALIDATING,PLAN_STATE.SCHEDULED]);
const V7_PRE_ITEM=new Set([ITEM_STATE.DRAFT,ITEM_STATE.VALIDATING,ITEM_STATE.SCHEDULED]);

/* the devices any scan has reported for a vulnerability: the first report, every scan since, and the findings now */
function v7Tracked(v){
  const s=new Set(v6AffectedDevices(v).map(d=>d.id)), r0=V6.reports[0], f=r0&&v6RepFind(r0,v.id);
  if(f) f.deviceIds.forEach(id=>s.add(id));
  (V6S.seen[v.id]||[]).forEach(id=>s.add(id));
  return s;
}
/* Where one device is in the loop — for one vulnerability, or for the device as a whole when cve is empty.
   The latest plan the device was put in decides, unless the device was grouped again after that plan
   came back without fixing it. */
function v7Stage(id,cve){
  const d=v6Dev(id); if(!d) return {k:"not"};
  const v=cve?v6Vuln(cve):null;
  if(!(v?v6Affects(v,d):v6VulnsOf(d).length)) return {k:"fixed"};
  const cx=V6S.ctx, rg=V6S.regroup[id]||0;
  for(let k=cx.length-1;k>=0;k--){
    const c=cx[k], p=getPlan(c.planId); if(!p||!c.deviceIds.includes(id)) continue;
    const it=v6ItemFor(p,id), ref=planRef(p);
    let why="", ret="";
    if(p.state===PLAN_STATE.CANCELLED){ why="Plan "+ref+" cancelled"; ret="failed"; }
    else if(!it){ why="Removed from "+ref; ret="removed"; }
    else if(it.state===ITEM_STATE.SUCCEEDED){
      const vr=V6S.verif[p.id];
      if(!(vr&&vr.latest&&vr.outcome!=="unavailable")) return {k:"rescan",plan:p};
      /* still open after a confirmed upgrade: either the scan still sees what the version should fix,
         or the version never fixed it (a later version, or no vendor fix yet) */
      const open=v?[v]:v6VulnsOf(d), tv=c.targetVersion;
      const should=open.filter(x=>{ const fx=x.fixed[d.os]; return fx&&!v6VerLt(tv,fx); });
      if(should.length){ why="Still detected after "+ref; ret="still"; }
      else { const x=open[0], fx=x.fixed[d.os];
        why=fx?(v?tv+" does not fix this · fixed in "+fx:x.id+" needs "+fx):(v?"No vendor fix yet":"No fix yet for "+x.id);
        if(!v&&open.length>1) why+=" · +"+(open.length-1)+" more";
        ret="partial"; }
    }
    else if(V6_ITEM_RETRY.has(it.state)){ why=(it.state===ITEM_STATE.FAILED?"Upgrade failed":it.state)+" in "+ref; ret="failed"; }
    else if(V7_PRE_PLAN.has(p.state)||V7_PRE_ITEM.has(it.state)) return {k:"window",plan:p};
    else return {k:"patching",plan:p};
    if(rg>k) break;
    return {k:"not",why,ret,plan:p};
  }
  const gs=v6GroupsOfDevice(id);
  if(gs.length){ const ok=gs.find(g=>v6GroupTargetState(g).k==="ok"); return ok?{k:"ready",group:ok}:{k:"ver",group:gs[0]}; }
  return {k:"not"};
}
function v7VulnProgress(v){
  const ids=[...v7Tracked(v)], out={total:ids.length,not:0,prog:0,fixed:0,ids:{}};
  ids.forEach(id=>{ const s=v7Stage(id,v.id); out.ids[id]=s;
    if(s.k==="fixed") out.fixed++; else if(s.k==="not") out.not++; else out.prog++; });
  return out;
}
/* every device any scan has reported, with its place in the loop */
function v7DeviceRows(){
  const s=new Set(); V6_VULNS.forEach(v=>v7Tracked(v).forEach(id=>s.add(id)));
  return [...s].map(id=>({d:v6Dev(id),st:v7Stage(id,"")})).filter(o=>o.d);
}
const v7LastScan=()=>{ const s=V6S.scans[V6S.scans.length-1]; return s?{ref:s.ref,at:s.at}:{ref:V6_SCAN.ref,at:V6_SCAN.at}; };

/* ---------- shared pieces ---------- */

function v7Bar(p,compact){
  const w=n=>p.total?(n/p.total*100).toFixed(2)+"%":"0";
  const lead=p.not?`<b>${p.not}</b> not covered`:p.prog?"All covered":"All fixed";
  return `<div class="v7-prog${compact?" c":""}" title="${p.fixed} fixed · ${p.prog} in progress · ${p.not} not covered">
    <span class="v7-bar" aria-hidden="true"><i class="f" style="width:${w(p.fixed)}"></i><i class="p" style="width:${w(p.prog)}"></i><i class="n" style="width:${w(p.not)}"></i></span>
    <span class="v7-pt">${lead}<span class="v6-mut"> · ${p.fixed} of ${p.total} fixed</span></span>
    <span class="sr-only">${p.fixed} fixed, ${p.prog} in progress, ${p.not} not covered</span></div>`;
}
function v7Chip(k){
  const t=V7_ST[k].t;
  return k==="fixed"?`<span class="v6c solid">✓ ${t}</span>`:k==="not"?`<span class="v6c warn">${t}</span>`
    :(k==="ver"||k==="window"||k==="rescan")?`<span class="v6c">◷ ${t}</span>`:`<span class="v6c soft">${t}</span>`;
}
function v7JourneyCell(st){
  let sub="";
  if(st.why) sub=`<span class="v7-why">${h6(st.why)}</span>`;
  else if(st.group) sub=`<button class="v6-link" data-v6="openGroup" data-a="${h6(st.group.id)}">${h6(st.group.name)}</button>`;
  else if(st.plan) sub=`<button class="v6-link" data-v6="openPlan" data-a="${h6(st.plan.id)}">${h6(planRef(st.plan))}</button>`;
  if(st.k==="ready") return sub?`<span class="trunc">${sub}</span>`:"";   /* no "Ready to plan" tag: the group link is enough */
  return v7Chip(st.k)+(sub?`<span class="sub2 trunc">${sub}</span>`:"");
}
const v7Cves=(ids,max)=>{ max=max||2; return ids.length?`<span class="v6-chips sc" title="${h6(ids.join(", "))}">${ids.slice(0,max).map(c=>`<span class="v6c soft">${h6(c)}</span>`).join("")}${ids.length>max?`<span class="v6c dash" aria-label="${ids.length-max} more">+${ids.length-max}</span>`:""}</span>`:`<span class="v6-mut">None open</span>`; };

/* ---------- a scan of the estate (simulated) ---------- */
const V7_NEW_VULN={id:"CVE-2026-41250",sev:"High",cvss:8.2,os:["FortiOS"],fixed:{FortiOS:"7.4.6"},last:"",
  desc:"Improper access control in the SSL-VPN web portal may let a remote attacker read session data."};
function v7Pairs(){ const m={}; V6_VULNS.forEach(v=>{ m[v.id]=new Set(v6AffectedDevices(v).map(d=>d.id)); }); return m; }
function v7ScanRun(mode,withNew){
  const before=v7Pairs(), r=v6LatestReport(), still=[];
  /* every finished plan with upgraded devices gets this scan's result */
  v6Ctxs().forEach(c=>{ const p=getPlan(c.planId);
    if(!p||p.state===PLAN_STATE.CANCELLED||!p.items.some(i=>i.state===ITEM_STATE.SUCCEEDED)) return;
    const vr=v6EnsureVerif(c,r); v6ApplyScan(vr,mode==="detected"?"detected":"natural");
    vr.rows.filter(x=>x.status==="Still Detected").forEach(x=>still.push({cve:x.cve,id:x.deviceId})); });
  const d0=new Date(), pad=n=>String(n).padStart(2,"0"), at=v6Now();
  const newVulns=[];
  if(withNew&&!v6Vuln(V7_NEW_VULN.id)){ V6_VULNS.push(Object.assign({},V7_NEW_VULN,{last:at})); newVulns.push(V7_NEW_VULN.id); }
  const after=v7Pairs(), fixed=[], fresh=[];
  Object.keys(before).forEach(c=>before[c].forEach(id=>{ if(!after[c].has(id)) fixed.push({cve:c,id}); }));
  Object.keys(after).forEach(c=>after[c].forEach(id=>{ if(!before[c]||!before[c].has(id)) fresh.push({cve:c,id}); }));
  Object.keys(after).forEach(c=>{ const s=V6S.seen[c]=V6S.seen[c]||new Set(); after[c].forEach(id=>s.add(id));
    if(after[c].size){ const v=v6Vuln(c); if(v) v.last=at; } });
  const ref="SCN-"+d0.getFullYear()+pad(d0.getMonth()+1)+pad(d0.getDate())+"-E"+pad(V6S.scans.length+1);
  const s={ref,at,fixed,still,fresh,newVulns};
  V6S.scans.push(s); V6S.lastSync=at;
  return s;
}
const v7Devs=a=>v6Uniq(a.map(x=>x.id)).length;
function v7ScanToast(s){
  const bits=[v6Plural(s.fixed.length,"fix","fixes")+" confirmed on "+v6Plural(v7Devs(s.fixed),"device")];
  if(s.still.length) bits.push(v7Devs(s.still)+" still detected after patching");
  if(s.newVulns.length) bits.push(v6Plural(s.newVulns.length,"new vulnerability","new vulnerabilities")+" on "+v6Plural(v7Devs(s.fresh),"device"));
  showToast("Scan received (simulated): "+bits.join(" · ")+".");
}
function v7ScanControls(){
  return `<div class="v7-scanctl"><label for="v7-smode">Next scan</label>
   <select id="v7-smode" class="v6-sel"><option value="natural">Confirms every completed upgrade</option><option value="detected">Some upgraded devices still detected</option></select>
   <label class="v7-chk"><input type="checkbox" id="v7-snew" ${v6Vuln(V7_NEW_VULN.id)?"disabled":""}> Includes a new vulnerability</label>
   <button class="btn small" type="button" data-v6="v7Scan">Receive scan</button></div>`;
}
V6A.v7Scan=()=>{ const m=(V6$("#v7-smode")||{}).value||"natural", nw=!!(V6$("#v7-snew")||{}).checked;
  const s=v7ScanRun(m,nw); render(); v7ScanToast(s); };
/* Refresh Findings now reads the latest scan; what it finds comes from the plans that have run */
V6A.sync=()=>{ if(V6S.syncing) return; V6S.syncing=true; render();
  setTimeout(()=>{ V6S.syncing=false; const s=v7ScanRun("natural",false); render(); v7ScanToast(s); },1200); };

/* ---------- since the last scan ---------- */
function v7SinceStrip(){
  const s=V6S.scans[V6S.scans.length-1]; if(!s) return "";
  const nv=s.newVulns.length;
  return `<div class="v7-since" role="status"><span class="t">Since last scan</span><span class="mono v6-sub">${h6(s.ref)} · ${h6(s.at)}</span>
    <span class="v7-sb"><b>${s.fixed.length}</b> ${s.fixed.length===1?"fix":"fixes"} confirmed on ${v6Plural(v7Devs(s.fixed),"device")}</span>
    <span class="v7-sb"><b>${v7Devs(s.still)}</b> still detected after patching</span>
    <span class="v7-sb"><b>${nv}</b> new ${nv===1?"vulnerability":"vulnerabilities"}${nv?` on ${v6Plural(v7Devs(s.fresh.filter(x=>s.newVulns.includes(x.cve))),"device")}`:""}</span>
    <span class="sp"></span><button class="btn small" type="button" data-v6="v7Since">View details</button></div>`;
}
function v7PairTable(pairs,cap,empty){
  if(!pairs.length) return `<div class="v6-sub" style="padding:8px 0 12px">${h6(empty)}</div>`;
  const by={}; pairs.forEach(x=>{ (by[x.id]=by[x.id]||[]).push(x.cve); });
  return `<div class="v6-tablewrap"><table class="v6-tbl v7-pairs"><caption class="sr-only">${h6(cap)}</caption>
   <colgroup><col><col style="width:84px"><col style="width:190px"></colgroup>
   <thead><tr><th scope="col">Device name</th><th scope="col">Version</th><th scope="col">Vulnerabilities</th></tr></thead><tbody>
   ${Object.keys(by).sort().map(id=>{ const d=v6Dev(id); return `<tr><td><span class="trunc" title="${h6(id)}"><b>${h6(id)}</b></span><span class="sub2">${h6(d.os)}</span></td><td class="mono">${h6(v6Ver(d))}</td><td>${v7Cves(by[id],1)}</td></tr>`; }).join("")}</tbody></table></div>`;
}
V6A.v7Since=()=>{
  const s=V6S.scans[V6S.scans.length-1]; if(!s) return;
  const fresh=s.fresh;
  v6OpenDrawer("since","Since last scan",s.ref+" · "+s.at+" (simulated)",
    `<div class="dw-g"><span class="lab">Fixes confirmed · ${v6Plural(v7Devs(s.fixed),"device")}</span>
      ${s.fixed.length?`<div class="v6-note soft" style="margin:0 0 8px">The scan no longer reports these vulnerabilities on these devices. A device is Fixed once none is left.</div>`:""}${v7PairTable(s.fixed,"Fixes confirmed by this scan","This scan confirmed no fixes.")}</div>
     <div class="dw-g"><span class="lab">Still detected after patching · ${v6Plural(v7Devs(s.still),"device")}</span>
      ${s.still.length?`<div class="v6-note soft" style="margin:0 0 8px">These go back to Not covered so they can be grouped again.</div>`:""}${v7PairTable(s.still,"Still detected after patching","Every upgraded device this scan checked is clear.")}</div>
     <div class="dw-g"><span class="lab">New findings · ${v6Plural(v7Devs(fresh),"device")}</span>
      ${s.newVulns.length?`<div class="v6-note soft" style="margin:0 0 8px">New vulnerability: ${s.newVulns.map(c=>`<button class="v6-link mono" data-v6="v7OpenVuln" data-a="${h6(c)}">${h6(c)}</button>`).join(", ")}. Its devices start at Not covered.</div>`:""}${v7PairTable(fresh,"New findings","No new findings in this scan.")}</div>`,
    `<span class="msg"></span><button class="btn" type="button" data-v6="v7Close">Close</button>`);
};
V6A.v7Close=()=>closeDialogBg(document.getElementById("drawerBg"));
V6A.v7OpenVuln=c=>{ v6ForceCloseDrawer(); go({v:"vulndetail",c}); };

/* ---------- grouping what is left ---------- */
/* opens Create Group with only the given devices ticked; scoped to one vulnerability when there is one */
function v7GroupThese(ids,os,cve){
  const v=cve?v6Vuln(cve):null;
  const base=v?()=>v6Affected().filter(d=>v6Affects(v,d)):()=>v6Affected();
  v6ForceCloseDrawer();
  v6OpenGroupDrawer({mode:"create",scope:v?[cve]:null,os,excl:[...v6ExclFor([],"all",base,ids,os)],from:v?{v:"vulndetail",c:cve}:{v:"loop"}});
}
function v7GroupButtons(ids,cve,cls){
  const devs=ids.map(v6Dev).filter(d=>d&&v6VulnsOf(d).length&&!v6GroupsOfDevice(d.id).length), oss=V6_OS.filter(o=>devs.some(d=>d.os===o));
  return oss.map(o=>{ const n=devs.filter(d=>d.os===o).length;
    return `<button class="btn small ${cls||""}" type="button" data-v6="v7Group" data-a="${h6([o,cve||"",devs.filter(d=>d.os===o).map(d=>d.id).join(",")].join("|"))}">Group ${oss.length>1?n+" "+h6(o):n+" not covered"}</button>`; }).join("");
}
V6A.v7Group=a=>{ const [os,cve,ids]=a.split("|"); v7GroupThese(ids.split(",").filter(Boolean),os,cve||""); };

/* ---------- the loop page ---------- */
function v7NodeHTML(s,n){
  return `<li class="v7-node ${s.wait?"wait":""} k-${s.k}"><button type="button" data-v6="v7Node" data-a="${s.k}" aria-label="${h6(s.t)}: ${v6Plural(n,"device")}. Show them.">
    ${s.wait?`<span class="v7-wp">◷ Waits for ${h6(s.wait)}</span>`:`<span class="v7-wp none" aria-hidden="true">&nbsp;</span>`}
    <span class="lb">${h6(s.t)}</span><span class="n">${n}</span><span class="d">${h6(s.d)}</span></button></li>`;
}
function renderLoop(){
  v6Crumb(["Remediation Loop"]);
  const rows=v7DeviceRows(), cnt={}, ret={failed:0,removed:0,still:0,partial:0};
  rows.forEach(o=>{ cnt[o.st.k]=(cnt[o.st.k]||0)+1; if(o.st.ret) ret[o.st.ret]++; });
  const ls=v7LastScan(), inProg=V7_STAGES.filter(s=>s.k!=="not"&&s.k!=="fixed").reduce((a,s)=>a+(cnt[s.k]||0),0);
  const retN=ret.failed+ret.removed+ret.still+ret.partial;
  v6SetApp(`<div class="page">
   <div class="head"><div><h1>Remediation Loop</h1><div class="sub">Every affected device, from the scan until a later scan confirms the fix.</div></div>
    <div class="actions"><button class="btn" data-v6="sync" ${V6S.syncing?"disabled":""}>${V6S.syncing?"Refreshing…":"Refresh Findings"}</button></div></div>
   ${v7SinceStrip()}
   <div class="v6-cards">
    <div class="v6-card"><label>Devices reported</label><div class="v">${rows.length}</div><div class="s">by scans so far</div></div>
    <div class="v6-card"><label>Not covered</label><div class="v">${cnt.not||0}</div><div class="s">${retN?v6Plural(retN,"device")+" came back from a plan":"no group or plan yet"}</div></div>
    <div class="v6-card"><label>In progress</label><div class="v">${inProg}</div><div class="s">grouped, planned or patching</div></div>
    <div class="v6-card"><label>Fixed</label><div class="v">${cnt.fixed||0}</div><div class="s">confirmed by a scan</div></div></div>
   <section class="v6-panel"><div class="ph"><span class="t">The loop</span><span class="r"><span class="v6-sub">Select a step to see its devices</span></span></div>

    const matches=order.filter(t=>sets.get(t.id).has(d.id)).map(t=>t.id);

    const gs=v6GroupsOfDevice(d.id); let state,reason;

    else if(gs.length){ const w=v6DeviceWork(d.id); state="existing"; reason="Already managed by "+gs[0].name+(w&&(w.k==="active"||w.k==="awaiting")?" · "+w.t:""); }

  v6Save(); render(); showToast(t.name+" paused. Existing groups and plans are unchanged."); };
V6A.v9Arch=id=>{ const t=v9T(id); if(!t||!v6IsEng()) return showToast(V6_ENG_ONLY);
  v6Modal("Archive "+t.name+"?",`<p class="cf-lead">It stops matching and leaves the priority order. Groups and plans it created keep its name and rules as they were.</p>`,
    [{label:"Go back"},{label:"Archive template",primary:true,onClick:()=>{ t.status="Archived"; t.updatedAt=v6Now(); v9Renumber();
      v8Log("template","Template "+t.name+" archived; its history is kept.",{}); v6Save(); render(); }}]); };
/* duplicate: opens Create template prefilled with a copy (OS can be changed); nothing is saved until Save */
V6A.v9Dup=id=>{ const t=v9T(id); if(!t||!v6IsEng()) return showToast(V6_ENG_ONLY); const s=v8St();
  let name="Copy of "+t.name, n=2; while(s.templates.some(x=>x.status!=="Archived"&&x.name.toLowerCase()===name.toLowerCase())) name="Copy of "+t.name+" "+(n++);
  V6S.tfPrefill=Object.assign(JSON.parse(JSON.stringify(t)),{name:name.slice(0,60),note:""});
  ["id","priority","status","createdAt","updatedAt","lastEvaluated","createdFromGroupId","createdFromGroupName"].forEach(k=>delete V6S.tfPrefill[k]);
  go({v:"tplform",t:"new"}); };

/* ---------- create / edit form: the Create Group condition builder, then grouping, version, automation and preview ---------- */
function v9FormInit(key){
  const t=key==="new"?null:v9T(key), pre=key==="new"?V6S.tfPrefill:null;
  const base=t||Object.assign({id:"",name:"",desc:"",priority:0,status:"New",os:"",sev:"all",conds:[],logic:"all",splitRegion:false,concurrency:null,maxPerGroup:15,mode:"review",window:"none"},pre||{});
  V6S.tf={key,id:t?t.id:"",name:base.name,desc:base.desc||"",priority:base.priority,status:base.status,splitRegion:!!base.splitRegion,conc:base.concurrency?String(base.concurrency):"",
    mode:base.mode,window:base.window,maxG:String(base.maxPerGroup||15),errors:{},note:pre?pre.note:"",fromGroup:pre?pre.fromGroupId:"",fromGroupName:pre?pre.fromGroupName:"",
    g:{mode:"template",pick:true,id:null,os:base.os||"",vsev:base.sev||"all",conds:(base.conds||[]).filter(c=>c.f!=="cve"&&c.f!=="ver").map(c=>({f:c.f,op:c.op||"any",vals:[...(c.vals||[])]})),logic:base.logic||"all",excl:new Set(),errors:{},renderFn:()=>v9RenderForm()}};
}
function v9Draft(){ const tf=V6S.tf, g=tf.g;
  return {id:tf.id||"__new",name:tf.name,desc:tf.desc,priority:tf.id?tf.priority:v9Order(g.os).length+1,status:tf.status,os:g.os,sev:g.vsev,conds:g.conds.filter(c=>c.vals.length).map(c=>({f:c.f,op:c.op,vals:[...c.vals]})),
    logic:g.logic,splitRegion:tf.splitRegion,concurrency:tf.conc?+tf.conc:null,maxPerGroup:+tf.maxG||15,mode:tf.mode,window:tf.window}; }
function v9RenderForm(){
  const tf=V6S.tf, g=tf.g, eng=v6IsEng(), t=tf.id?v9T(tf.id):null, ro=!eng||(t&&t.status==="Archived");
  V6S.gd=g; v7SyncScope(g);
  const tmp=v9Draft(), pv=tmp.os?v9Preview(tmp):null, e=tf.errors, fe=k=>e[k]?`<span class="field-err" id="tf-e-${k}">${h6(e[k])}</span>`:"";
  const dis=ro?"disabled":"", dcond=g.conds.filter(c=>c.f!=="cve");
  v6Crumb([["Automation Templates","templates"],t?t.name:"Create template"]);
  const stat=(l,list,cls)=>`<div class="v9-pc ${cls||""}"><b class="mono">${list.length}</b><span>${l}</span></div>`;
  v6SetApp(`<div class="page v9-form">
   <div class="head"><div><h1>${t?h6(t.name):"Create template"}</h1>${t?`<div class="sub">${v9StatusChip(t.status)} · ${h6(t.os)} priority ${t.priority||"—"}</div>`:""}</div>
    <div class="actions"><button class="btn" data-v6="v9Cancel">${ro?"Back":"Cancel"}</button>${!ro?`<button class="btn primary" data-v6="v9Save">Save template</button>`:""}
     ${t&&eng&&t.status!=="Archived"?(t.status==="Active"?`<button class="btn" data-v6="v9Pause" data-a="${h6(t.id)}">Pause</button>`:`<button class="btn" data-v6="v9Act" data-a="${h6(t.id)}">Resume</button>`):""}</div></div>
   ${tf.note?`<div class="v6-note">${tf.note}</div>`:""}
   <section class="v6-panel"><div class="ph"><span class="t">A · Template details</span></div><div class="pb v9-grid">
    <div class="v6-fld"><label class="l" for="tf-name">Template name</label><input class="v6-in" id="tf-name" value="${h6(tf.name)}" data-v6in="v9Name" maxlength="60" ${dis} ${e.name?'aria-invalid="true" aria-describedby="tf-e-name"':""}>${fe("name")}</div>
    <div class="v6-fld"><label class="l" for="tf-desc">Description (optional)</label><input class="v6-in" id="tf-desc" value="${h6(tf.desc)}" data-v6in="v9Desc" maxlength="120" ${dis}></div>
    <div class="v9-ro"><label>Priority</label><b>${g.os?(t&&t.status==="Archived"?"—":`${tmp.priority} of ${v9Order(g.os).length+(t?0:1)}`):"—"}</b></div>
    <div class="v9-ro"><label>Owner</label><b>${h6(t?t.owner:"Automation Engineering (demo role)")}</b></div>
    ${tf.fromGroupName?`<div class="v9-ro"><label>Created from group</label><b>${h6(tf.fromGroupName)}</b></div>`:""}</div></section>
   <section class="v6-panel"><div class="ph"><span class="t">B · Matching conditions</span></div><div class="pb">
    <div class="v6-osrow"><label class="l" for="tf-os">OS type</label><select id="tf-os" data-v6ch="v9Os" ${t?'title="Fixed after saving. Duplicate to use another OS."':""} ${dis||(t?"disabled":"")} ${e.os?'aria-invalid="true" aria-describedby="tf-e-os"':""}>${g.os?"":`<option value="">Select an OS type</option>`}${V6_OS.map(o=>`<option value="${o}" ${g.os===o?"selected":""}>${o}</option>`).join("")}</select>
     ${g.os?`<label class="l v7-sevl" for="tf-sev">Severity</label><select id="tf-sev" data-v6ch="v9Sev" ${dis}><option value="all" ${g.vsev==="all"?"selected":""}>All severities</option>${V7_SEVS.map(sv=>`<option value="${sv}" ${g.vsev===sv?"selected":""}>${sv}</option>`).join("")}</select>`:""}${fe("os")}</div>
    ${g.os?`${dcond.length>=2?`<div class="v6-dh"><span>Match</span><span class="v6-seg" role="radiogroup" aria-label="How Region and Exposure conditions combine">
      <button type="button" role="radio" aria-checked="${g.logic==="all"}" class="${g.logic==="all"?"on":""}" data-v6="gLogic" data-a="all" ${dis}>All conditions</button><button type="button" role="radio" aria-checked="${g.logic==="any"}" class="${g.logic==="any"?"on":""}" data-v6="gLogic" data-a="any" ${dis}>Any condition</button></span></div>`:""}
     <div class="${ro?"v9-ro-conds":""}">${g.conds.map(v6CondRowHTML).join("")}</div>${ro?"":`<button type="button" class="link" data-v6="gcAdd">+ Add condition</button>`}`:""}</div></section>
   <section class="v6-panel"><div class="ph"><span class="t">C · Grouping</span></div><div class="pb">
    <div class="v9-nums"><div class="v6-fld v6-inline"><label class="l" for="tf-max">Devices per group</label><input type="text" inputmode="numeric" id="tf-max" value="${h6(tf.maxG)}" data-v6in="v9Max" data-v6ch="v9Re" ${dis} ${e.maxG?'aria-invalid="true" aria-describedby="tf-e-maxG"':""}>${fe("maxG")}</div>
     <div class="v6-fld v6-inline"><label class="l" for="tf-conc">Devices at a time</label><input type="text" inputmode="numeric" id="tf-conc" value="${h6(tf.conc)}" data-v6in="v9Conc" placeholder="No limit" ${dis} ${e.conc?'aria-invalid="true"':""}>${fe("conc")}</div></div>
    <label class="v9-chk"><input type="checkbox" data-v6ch="v9Split" ${tf.splitRegion?"checked":""} ${dis}> Separate groups by region</label></div></section>
   <section class="v6-panel"><div class="ph"><span class="t">D · Target version</span></div><div class="pb">
    <div class="v9-ro"><label>Policy</label><b>Smallest certified version that fixes the most</b></div></div></section>
   <section class="v6-panel"><div class="ph"><span class="t">E · Automation</span></div><div class="pb">
    <div class="choice-row" role="radiogroup" aria-label="Automation mode">${[["review","Review before submission"],["auto","Submit automatically"]].map(([k,l])=>`<label class="choice ${tf.mode===k?"selected":""}"><input type="radio" name="tfMode" value="${k}" data-v6ch="v9Mode" ${tf.mode===k?"checked":""} ${dis}><div><strong>${l}</strong></div></label>`).join("")}</div>
    <div class="v6-osrow" style="margin-top:12px"><label class="l" for="tf-win">Requested window</label><select id="tf-win" data-v6ch="v9Win" ${dis}>${Object.entries(V9_WIN).map(([k,l])=>`<option value="${k}" ${tf.window===k?"selected":""}>${h6(l)}</option>`).join("")}</select>${tf.window!=="lead"?`<span class="v6-sub">No plans will be created</span>`:""}</div></div></section>
   <section class="v6-panel v9-preview"><div class="ph"><span class="t">Preview</span></div><div class="pb">
    ${pv?`<div class="v9-pv"><b class="mono">${pv.eligible.length}</b><span>${pv.eligible.length===1?"device":"devices"} will be added</span></div>
     ${(()=>{ const x=[pv.higher.length?pv.higher.length+" go to higher-priority templates":"",pv.existing.length?pv.existing.length+" already in a group":"",pv.excluded.length?pv.excluded.length+" excluded":""].filter(Boolean); return x.length?`<div class="v6-sub">${x.join(" · ")}</div>`:""; })()}
     <div class="v9-ovl">${v9OverlapHTML(tmp)}</div>
     ${pv.mine.length||pv.outside.length?`<details class="v6-det" ${V6S.tfOpen?"open":""} id="tf-dev"><summary>Devices <span class="v6-sub">${pv.mine.length+pv.outside.length}</span></summary>
      <div class="v6-tablewrap"><table class="v6-tbl"><caption class="sr-only">Preview devices</caption><thead><tr><th scope="col">Device</th><th scope="col" style="width:80px">Region</th><th scope="col" style="width:120px">Exposure</th><th scope="col" style="width:80px">Version</th><th scope="col">Result</th></tr></thead><tbody>
      ${pv.mine.concat(pv.outside).map(r=>`<tr><td><b>${h6(r.d.name)}</b></td><td>${h6(r.d.region)}</td><td>${h6(v6Exposure(r.d))}</td><td class="mono">${h6(v6Ver(r.d))}</td><td>${h6(r.matches.includes(tmp.id)?pv.why(r):"Outside conditions")}</td></tr>`).join("")}</tbody></table></div></details>`:""}`
     :`<div class="v6-sub">Select an OS type.</div>`}</div></section>
   ${t?`<section class="v6-panel"><div class="ph"><span class="t">Groups and plans</span></div><div class="pb">${(()=>{ const gs=V6.groups.filter(x=>x.templateId===t.id);
     return gs.length?`<ul class="v9-rel">${gs.map(x=>{ const c=v6CtxsOfGroup(x.id), p=c.length?getPlan(c[c.length-1].planId):null; return `<li><button class="v6-link" data-v6="openGroup" data-a="${h6(x.id)}">${h6(x.name)}</button> · ${v6Plural(x.devices.length,"device")} · ${h6(v8Stage(x).t)}${p?` · <button class="v6-link mono" data-v6="openPlan" data-a="${h6(p.id)}">${h6(planRef(p))}</button> ${h6(p.state)}`:""}</li>`; }).join("")}</ul>`:`<div class="v6-sub">None</div>`; })()}</div></section>`:""}
  </div>`);
}
document.addEventListener("toggle",e=>{ if(e.target&&e.target.id==="tf-dev") V6S.tfOpen=e.target.open; },true);
V6A.v9Name=v=>{ V6S.tf.name=v; };
V6A.v9Desc=v=>{ V6S.tf.desc=v; };
V6A.v9Conc=v=>{ V6S.tf.conc=v.trim(); };
V6A.v9Max=v=>{ V6S.tf.maxG=v.trim(); };
V6A.v9Re=(v,el)=>{ const id=el&&el.id; v9RenderForm(); if(id) v6FocusAfter('#'+id); };   /* refresh the preview when a number field is left */

V6A.v9Os=v=>{ const g=V6S.tf.g; if(!v||g.os===v) return; g.os=v; if(g.vsev!=="all"&&!v7OsVulns(g).some(x=>x.sev===g.vsev)) g.vsev="all"; g.conds=g.conds.filter(c=>c.f!=="cve"&&c.f!=="ver"); delete V6S.tf.errors.os; v9RenderForm(); v6FocusAfter("#tf-os"); };
V6A.v9Sev=v=>{ const g=V6S.tf.g; g.vsev=v||"all"; v9RenderForm(); v6FocusAfter("#tf-sev"); };
V6A.v9Split=on=>{ V6S.tf.splitRegion=!!on; v9RenderForm(); };
V6A.v9Mode=v=>{ V6S.tf.mode=v; v9RenderForm(); v6FocusAfter('input[name="tfMode"][value="'+v+'"]'); };
V6A.v9Win=v=>{ V6S.tf.window=v; v9RenderForm(); v6FocusAfter("#tf-win"); };
V6A.v9Cancel=()=>go({v:"templates"});
V6A.v9Save=()=>{
  if(!v6IsEng()) return showToast(V6_ENG_ONLY);
  const tf=V6S.tf, d=v9Draft(), e={}, s=v8St(), name=(tf.name||"").trim();
  if(!name) e.name="Enter a template name.";
  else if(s.templates.some(x=>x.id!==tf.id&&x.status!=="Archived"&&x.name.toLowerCase()===name.toLowerCase())) e.name="A template with this name already exists.";
  if(!d.os) e.os="Select an OS type.";
  if(tf.conc!==""&&!(/^\d+$/.test(tf.conc)&&+tf.conc>=1)) e.conc="Enter a whole number of 1 or more, or leave it empty.";
  const whole=(v,lo,hi)=>/^\d+$/.test(v)&&+v>=lo&&+v<=hi;
  if(!whole(tf.maxG,1,500)) e.maxG="Enter a whole number from 1 to 500.";

  const ident=d.os&&(!tf.id||tf.status==="Active")?v9Overlaps(d).filter(x=>x.identical):[];   /* a paused one is checked when it is resumed */
  if(ident.length&&!e.os) e.os="Active template \""+ident[0].u.name+"\" ("+d.os+" priority "+ident[0].u.priority+") has the same rules. Change the conditions, or pause or archive that template.";
  tf.errors=e; if(Object.keys(e).length){ v9RenderForm(); v6FocusAfter(e.name?"#tf-name":e.os?"#tf-os":e.maxG?"#tf-max":"#tf-conc"); return; }
  const commit=()=>{
    if(tf.id){ const t=v9T(tf.id); Object.assign(t,{name,desc:tf.desc.trim(),os:d.os,sev:d.sev,conds:d.conds,logic:d.logic,splitRegion:d.splitRegion,concurrency:d.concurrency,maxPerGroup:d.maxPerGroup,mode:d.mode,window:d.window,updatedAt:v6Now()});
      v8Log("template","Template "+t.name+" updated. It applies to future assignments; existing groups and plans are unchanged.",{}); }
    else { s.seq.tpl+=1; const t={id:"TPL-"+v8Pad(s.seq.tpl,3),name,desc:tf.desc.trim(),priority:v9Order(d.os).length+1,status:"Active",owner:"Automation Engineering (demo role)",createdAt:v6Now(),updatedAt:v6Now(),
        os:d.os,sev:d.sev,conds:d.conds,logic:d.logic,splitRegion:d.splitRegion,concurrency:d.concurrency,maxPerGroup:d.maxPerGroup,mode:d.mode,window:d.window,targetPolicy:"smallest-fixes-most",lastEvaluated:"",createdFromGroupId:tf.fromGroup||"",createdFromGroupName:tf.fromGroupName||""};
      s.templates.push(t); v9Renumber(); v8Log("template","Template "+t.name+" created and active ("+t.os+" priority "+t.priority+", "+(t.mode==="auto"?"submits automatically":"review before submission")+")"+(t.createdFromGroupName?" from the rules of group "+t.createdFromGroupName:"")+".",{}); }
    v6Save(); V6S.tfPrefill=null; V6S.tplOs=d.os; go({v:"templates"}); showToast(tf.id?"Template saved.":"Template saved and active.");
  };
  if(tf.id) return commit();
  /* a new template is active at once: confirm what it will take on the next evaluation */
  const pv=v9Preview(d);
  v6Modal("Save and activate?",
    `<p class="cf-lead">Adds ${v6Plural(pv.eligible.length,"device")} as ${h6(d.os)} priority ${d.priority}.${d.mode==="auto"?" Plans are submitted automatically.":""}</p>`,
    [{label:"Go back"},{label:"Save and activate",primary:true,onClick:commit}]);
};

/* ---------- Create Group: optionally save the panel's rules as a draft template ---------- */
V6A.gdTpl=on=>{ if(V6S.gd) V6S.gd.saveTpl=!!on; };
const _v9gdSave=V6A.gdSave;
V6A.gdSave=function(){
  const g=V6S.gd, save=g&&g.mode==="create"&&g.saveTpl;
  const snap=save?(()=>{ v7SyncScope(g);
    /* templates cover every vulnerability report: Vulnerability conditions and a fixed CVE scope are not carried over */
    const devConds=g.conds.filter(c=>c.vals.length&&c.f!=="cve"&&c.f!=="ver").map(c=>({f:c.f,op:c.op,vals:[...c.vals]}));
    const verConds=g.conds.filter(c=>c.vals.length&&c.f==="ver");
    const cves=!g.pick&&g.scope?[...g.scope]:g.conds.filter(c=>c.f==="cve"&&c.vals.length).map(c=>c.vals[0]);
    const sevs=v6Uniq((!g.pick&&g.scope?g.scope:[]).map(c=>(v6Vuln(c)||{}).sev).filter(Boolean));
    const sev=g.pick?(g.vsev||"all"):(sevs.length===1?sevs[0]:"all");
    const matched=v6Matching(g).length, chosen=v6Included(g).length;
    return {os:g.os,sev,conds:devConds,logic:g.logic||"all",matched,chosen,cves,vers:verConds.map(c=>V6_OPS[c.op]+" "+c.vals[0]),fromScope:!g.pick&&!!g.scope,name:(g.name||"").trim()}; })():null;
  const n0=V6.groups.length;
  _v9gdSave.apply(this,arguments);
  if(!save||V6S.gd===g||V6.groups.length===n0) return;
  const grp=V6.groups[V6.groups.length-1], left=snap.matched-snap.chosen;
  V6S.tfPrefill={name:("Rules from "+grp.name).slice(0,60),desc:"",os:snap.os,sev:snap.sev,conds:snap.conds,logic:snap.logic,mode:"review",window:"none",fromGroupId:grp.id,fromGroupName:grp.name,
    note:`Group <b>${h6(grp.name)}</b> created. Conditions are kept, not the device selection${left?` (${left} unticked ${left===1?"device":"devices"} will still match)`:""}.
      ${snap.cves.length?`<br>${snap.cves.map(h6).join(", ")} ${snap.cves.length===1?"is":"are"} not kept: templates cover every vulnerability${snap.fromScope&&snap.sev!=="all"?`; Severity set to <b>${h6(snap.sev)}</b>`:""}.`:""}
      ${snap.vers.length?`<br>Current version ${snap.vers.map(h6).join(", ")} is not kept.`:""}`};
  v6ForceCloseDrawer(); go({v:"tplform",t:"new"}); showToast("Group "+grp.name+" created. Review the template.");
};

/* ---------- routing and menu ---------- */
V6_VIEWS.add("templates"); V6_VIEWS.add("tplform");
Object.assign(SECTION_OF,{templates:"templates",tplform:"templates"});
Object.assign(NAV_FRAME,{templates:{v:"templates"}});
Object.assign(CRUMB_TO,{templates:()=>go({v:"templates"})});
const _v9Section=v6Section;
v6Section=function(v){ return v==="templates"||v==="tplform"?"templates":_v9Section(v); };
const _v9frameToHash=frameToHash;
frameToHash=function(f){ return f.v==="templates"?"#/automation-templates":f.v==="tplform"?"#/automation-templates/"+encodeURIComponent(f.t||"new"):_v9frameToHash(f); };
const _v9hashToFrame=hashToFrame;
hashToFrame=function(h){ const m=/^#\/?automation-templates(?:\/([^/]+))?\/?$/.exec(h||""); return m?(m[1]?{v:"tplform",t:decodeURIComponent(m[1])}:{v:"templates"}):_v9hashToFrame(h); };
const _v9resolveFrame=resolveFrame;
resolveFrame=function(f){ if(f.v==="tplform"&&f.t!=="new"&&!v9T(f.t)) return {v:"templates"}; return _v9resolveFrame(f); };
const _v9Render=v6Render;
v6Render=function(){
  if(v8St().seedRun5) v9SeedRun();
  if(view==="templates"){ renderTemplates(); return true; }
  if(view==="tplform"){ const k=(V6S.f||{}).t||"new"; if(!V6S.tf||V6S.tf.key!==k||V6S.tfFrame!==V6S.f){ v9FormInit(k); V6S.tfFrame=V6S.f; } v9RenderForm(); return true; }
  return _v9Render(); };
const _v9setNav=setNav;
setNav=function(){ _v9setNav(); const c=document.querySelector('[data-nav="templates"] .nav-count'); if(c) c.textContent=v9Order().length; };
v8St();

/* ---------- meeting copy: Vulnerability, Device Groups and Nexus Images only ----------
   No automation templates and no Remediation Overview: no templates exist, nothing runs
   automatically (Assisted only), and their routes open Vulnerability. */
const V8M_OFF=["overview","loop","templates","tplform"];
V8M_OFF.forEach(v=>V6_VIEWS.delete(v));
const _v8mSt=v8St;
v8St=function(){ const s=_v8mSt(); s.mode="assisted"; s.templates=[]; delete s.seedRun5; delete s.seedRun5Id; return s; };
const _v8mHash=hashToFrame;
hashToFrame=function(h){ return /^#\/?(remediation-(overview|loop)|automation-templates)(\/.*)?$/.test(h||"")?{v:"vuln"}:_v8mHash(h); };
const _v8mRender=v6Render;
v6Render=function(){ if(V8M_OFF.includes(view)){ go({v:"vuln"},true); return true; } return _v8mRender(); };
const _v8mGo=V6A.v7Go;
V6A.v7Go=where=>_v8mGo(V8M_OFF.includes(where)?"vuln":where);
V6A.gdTpl=()=>{}; V6A.gdKeep=()=>{}; V6A.v8Mode=()=>{}; V6A.v8Eval=()=>{};
v8St();

buildV2Data();
assignPlanRefs();
/* One interval for the application. Started once, after the first paint. */
setInterval(tickWindows,1000);

/* Land wherever the URL says, so refresh and a pasted link both work. */
(function boot(){
  const f=resolveFrame(hashToFrame(location.hash));
  histWrite(f,frameToHash(f),true);
  applyFrame(f);
})();
</script>
