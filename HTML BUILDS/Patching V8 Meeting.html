      {key:"peer2", label:"Peer 2", placeholder:"Select a host",
       when:d=>!!d.peer1,
       options:d=>RSERIES_DEVICES.filter(x=>x.id!==d.peer1).map(x=>({v:x.id,t:x.label}))},
      {key:"version", label:"Target version", placeholder:"Select a version",
       when:d=>!!d.peer2, kind:"version", options:()=>versionOptions(F5OS_VERSIONS)}
    ]
  }
};
/* Target version stays a choice even when only one version is certified.
   Only approved targets can be chosen; unapproved and non-target versions are
   shown and disabled (with the reason) rather than filtered out
   (Plan & Quick Submit §8). No version is invented to fill the list. */
function versionOptions(list){
  return list.map(x=>({v:x.v, disabled:!isEligibleTarget(x),
    t:x.v+(!isTarget(x)?"  ·  not a valid target"
         :!x.approved?"  ·  not approved"
         :x.latest?"  ·  Recommended":"  ·  approved")}));
}
const opOS=op=>(OPERATIONS[op]||{}).os||"";
const journeyOfOp=op=>(OPERATIONS[op]||{}).journey||"";
function opOfJourney(j){ return Object.keys(OPERATIONS).find(k=>OPERATIONS[k].journey===j)||""; }
const opFields=op=>(OPERATIONS[op]||{}).fields||[];
let recommendedVersion=(op)=>((opOS(op)==="F5OS"?F5OS_VERSIONS:TMOS_VERSIONS).find(v=>v.approved&&v.latest)||{}).v||"";

/* which fields are visible for the answers so far */
function visibleFields(draft){
  return opFields(draft.op).filter(f=>!f.when||f.when(draft));
}
/* an upstream change clears everything downstream, and any impact result */
function setField(draft,key,value){
  const fs=opFields(draft.op), i=fs.findIndex(f=>f.key===key);
  draft[key]=value;
  fs.slice(i+1).forEach(f=>{ draft[f.key]=""; });
  draft.impact=null;
}
function setOperation(draft,op){
  draft.op=op;
  opFields(op).forEach(f=>{ draft[f.key]=""; });
  Object.keys(draft).forEach(k=>{ if(!["op","impact","change","crno","winStart","winEnd"].includes(k)
     && !opFields(op).some(f=>f.key===k)) delete draft[k]; });
  draft.impact=null;
}

/* impact includes the pair and the tenants it carries, with reasons */
function computeImpact(draft){
  const tenantRow=(dev,tid,why)=>({device:dev, tenant:tid,                                    region:tenantRegion(tid), why, isHost:false});
  if(draft.op===OP.HOST){
    /* A host upgrade reboots the host, so the host is itself an impacted CI —
       but the count the operator reads is the tenants that go down with it. */
    const rows=[];
    [draft.peer1,draft.peer2].filter(Boolean).forEach((h,n)=>{
      rows.push({device:h, tenant:"—", region:(deviceById(h)||{}).region||"Not found",
                 why:"Host selected as Peer "+(n+1)+" — reboots", isHost:true});
      (TENANTS_BY_DEVICE[h]||[]).forEach(t=>
        rows.push(tenantRow(h,t.id,"Runs on this host — downtime during reboot")));
    });
    return rows;
  }
  const rows=[], t=tenantById(draft.tenant);
  if(!t) return rows;
  if(draft.op===OP.TENANT){
    /* Four CIs, not two: the selected tenant, its partner, and both hosts —
       the hosts are why the partner is affected at all, so they are impacted
       configuration items in their own right, not a column (2026-09-07). */
    const dev=deviceById(draft.device), pairDev=dev?deviceById(dev.pair):null;
    const hostRow=(h,why)=>({device:h.id, tenant:"—", region:h.region||"Not found",
                             why, isHost:true});
    if(dev)     rows.push(hostRow(dev,"Host of the selected tenant"));
    rows.push(tenantRow(dev?dev.id:"—", t.id, "Selected"));
    if(pairDev) rows.push(hostRow(pairDev,"Paired host"));
    const pt=tenantById(t.pair);
    if(pairDev&&pt) rows.push(tenantRow(pairDev.id, pt.id, "Impacted through the paired device"));
  }else{
    rows.push(tenantRow("—", t.id, "Selected"));
    const pt=tenantById(t.pair);
    if(pt) rows.push(tenantRow("—", pt.id, "Impacted through the HA partner"));
  }
  return rows;
}
/* "10 tenants across 2 hosts" where hosts are involved, "2 tenants" where they
   are not — the host is the container the tenants were found in, so it is
   named in the summary rather than added to the count. */
/* Hosts are impacted CIs, so they are counted. The breakdown is kept alongside,
   because "4 CIs" alone does not tell the reader what they are agreeing to. */
function impactTotal(rows){
  const hosts=new Set(rows.filter(r=>r.isHost).map(r=>r.device)).size;
  return String(rows.filter(r=>!r.isHost).length + hosts);
}
function impactParts(rows){
  const hosts=new Set(rows.filter(r=>r.isHost).map(r=>r.device)).size;
  const tenants=rows.filter(r=>!r.isHost).length;
  const bits=[];
  if(tenants) bits.push(tenants+" "+(tenants===1?"Tenant":"Tenants"));
  if(hosts)   bits.push(hosts+" "+(hosts===1?"Host":"Hosts"));
  return bits.join(" · ");
}
function impactCount(rows){ return plural(+impactTotal(rows),"CI"); }
function impactSummary(rows){
  const p=impactParts(rows); return impactTotal(rows)+(p?" · "+p:"");
}

/* submit only when everything required is satisfied */
function validateItem(draft,needsChange){
  const opDef=OPERATIONS[draft.op];
  if(!draft.op)            return "Select an operation type.";
  if(opDef&&opDef.unspecified) return draft.op+" is not specified yet.";
  const missing=visibleFields(draft).find(f=>!draft[f.key]);
  if(missing)              return "Select "+(typeof missing.label==="function"?missing.label(draft):missing.label).toLowerCase()+".";
  /* backstop for a stale or manipulated value — the dropdown alone is not the rule */
  if(draft.version && !versionEligible(draft.op,draft.version)) return "Choose an approved target version.";
  /* The impacted-CI check is a gate, not a note: the operator must see the
     impact before the item is saved. Saving it is the acknowledgement — there
     is no separate "I understand" step (2026-09-24). */
  if(!draft.impact)        return "Check the impacted CIs before submitting.";
  /* Lightweight, structural checks only. Whether the item can actually run is
     decided at plan submit and again when the item executes. */
  const dup=draftDuplicate(draft);
  if(dup)                  return dup;
  if(needsChange){
    if(draft.change==="byoc" && !(draft.crno||"").trim()) return "Enter the change number.";
    if(draft.change!=="byoc" && !((draft.winStart||"").trim() && (draft.winEnd||"").trim()))
      return "Set the change window.";
  }
  return null;
}

/* An obvious duplicate: the same target already in the plan being edited.
   Only the add/edit drawer has a plan; Quick Submit has nothing to collide with. */
function draftDuplicate(draft){
  if(draft!==addDraft) return null;
  const p=getPlan(selectedPlan); if(!p) return null;
  const key=d=>d.op===OP.HOST ? [d.peer1,d.peer2].sort().join("|") : (d.tenant||"");
  const k=key(draft); if(!k) return null;
  const clash=p.items.find(i=>i.id!==editingItem && key({op:draft.op,peer1:i.peer1,peer2:i.peer2,tenant:i.tenant})===k);
  return clash ? "This target is already in the plan." : null;
}

/* ---- rendering ---- */
function fieldHTML(f,draft,handler,enabled=true,blockedBy=""){
  const label=typeof f.label==="function"?f.label(draft):f.label;
  const opts=enabled?(f.options(draft)||[]):[];
  const val=draft[f.key]||"";
  const hint=!enabled
    ? `<span class="help" style="display:block">Choose ${esc(blockedBy.toLowerCase())} first.</span>`
    : (f.kind==="version"&&!val)
    ? `<span class="help" style="display:block">Select the target ${esc(opOS(draft.op))} version. Recommended: <b>${
        esc(recommendedVersion(draft.op))}</b> — approved and latest.</span>`
    : (f.kind==="version"&&val&&val!==recommendedVersion(draft.op))
      ? `<span class="help" style="display:block">Not the recommended version (${esc(recommendedVersion(draft.op))}).</span>` : "";
  return `<div class="field"><label>${esc(label)}</label>
    <select onchange="${handler}('${f.key}',this.value)" ${enabled?"":"disabled"}>
      <option value="">${esc(enabled?(f.placeholder||"Select one"):("Choose "+blockedBy.toLowerCase()+" first"))}</option>
      ${opts.map(o=>`<option value="${esc(o.v)}" ${val===o.v?"selected":""} ${o.disabled?"disabled":""}>${esc(o.t)}</option>`).join("")}
    </select>${hint}</div>`;
}

/* the OS-specific configuration block, shared by both entry points  */
function opTypeHTML(draft,opHandler){
  return `<div class="field"><label>Operation type</label>
      <select onchange="${opHandler}(this.value)">
        <option value="">Select one</option>
        ${Object.keys(OPERATIONS).map(k=>`<option value="${k}" ${draft.op===k?"selected":""}>${esc(OPERATIONS[k].label)}</option>`).join("")}
      </select></div>`;
}

function targetFieldsHTML(draft,handler){
  if(!draft.op) return `<div class="notice">Select an operation type first.</div>`;
  if(OPERATIONS[draft.op].unspecified)
    return `<div class="notice">The ${esc(draft.op)} workflow has not been specified yet.</div>`;
  const fields=opFields(draft.op).filter(f=>!f.relevant||f.relevant(draft));
  return `<div class="op-fields">${fields.map((f,n)=>{
    const enabled=!f.when||f.when(draft);
    const prior=fields[Math.max(0,n-1)];
    const blockedBy=typeof prior.label==="function"?prior.label(draft):prior.label;
    return fieldHTML(f,draft,handler,enabled,blockedBy||"the previous field");
  }).join("")}</div>`;
}

function itemConfigHTML(draft,handler,opHandler,showOpType){
  return (showOpType?opTypeHTML(draft,opHandler):"")+targetFieldsHTML(draft,handler);
}

function impactReady(d){ return d.op===OP.HOST ? !!(d.peer1&&d.peer2) : !!d.tenant; }
function impactHTML(draft){
  const ready = impactReady(draft);
  if(!ready) return `<div class="notice">Select a target first.</div>`;
  if(!draft.impact) return `<div class="notice">Not checked yet.</div>`;
  /* The relationship is kept; the sentence explaining each row is not. The
     impact is computed at submit and not stored, so the reason cannot be shown
     again afterwards — it is future scope (2026-09-17). */
  const rows=draft.impact;
  const head=`<div class="imp-sum"><b>Impacted CIs</b><span class="imp-n">${esc(impactTotal(rows))}</span>${
    impactParts(rows)?`<span class="imp-parts">${esc(impactParts(rows))}</span>`:""}</div>`;
  const tbl=(cols,body)=>`<table class="impact"><thead><tr>${
      cols.map(c=>`<th scope="col">${esc(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
  /* A host upgrade is read host by host: the tenants only mean anything under
     the host they sit on, and the operator is deciding about hosts. A tenant
     upgrade has no host to group by, and gains the region instead. */
  /* Names, not database keys — the identifier the backend joins on means
     nothing to the reader (2026-09-18). Region is established once at item
     level and is not repeated per impacted CI. */
  if(rows.some(r=>r.isHost)){
    const hosts=[...new Set(rows.filter(r=>r.isHost).map(r=>r.device))];
    return head+hosts.map(h=>{
      const kids=rows.filter(r=>!r.isHost&&r.device===h);
      const hr=rows.find(r=>r.isHost&&r.device===h);
      return `<div class="imp-grp">
        <div class="imp-grp-h">
          <div><b>Host: ${esc(h)}</b>${hr&&hr.why?`<span class="imp-id">${esc(hr.why)}</span>`:""}</div>
          <span class="imp-n">${esc(plural(kids.length,"tenant"))}</span>
        </div>
        ${kids.length?tbl(["Tenant"],kids.map(r=>
            `<tr><td class="mono">${esc(r.tenant)}</td></tr>`).join(""))
          :`<div class="imp-none">No tenants are running on this host.</div>`}
      </div>`;}).join("");
  }
  return head+tbl(["Tenant"],rows.map(r=>
    `<tr><td class="mono">${esc(r.tenant)}</td></tr>`).join(""));
}

/* ============================ QUICK SUBMIT  ======================
   No user-created plan exists, so this entry point carries its own change
   window. On submit the item is filed under a system-generated virtual plan
    that the operator never has to configure. */
/* Nothing is seeded that the user did not supply: no change number. The
   requested-window inputs start with a suggestion the user can see and edit. */
let quickDraft={op:"",impact:null,change:"byoc",crno:"",winStart:"10 Oct 2026 · 22:00",winEnd:"11 Oct 2026 · 02:00"};

function qsOp(v){ setOperation(quickDraft,v); renderQuick(); }
function qsSet(k,v){ setField(quickDraft,k,v); renderQuick(); }
function qsCheck(){ quickDraft.impact=computeImpact(quickDraft); renderQuick(); }
function qsChange(m){ quickDraft.change=m; renderQuick(); }

function quickForm(){
  const d=quickDraft;
  const blocked=validateItem(d,true);
  /* One flow, not four steps. The operator submits one of these many times a
     day; numbering them made a short form feel like a wizard. The sections and
     their order are unchanged, and so is every requirement behind them. */
  const step1=`<section class="section tight"><div class="section-head"><h3>Operation &amp; target</h3>
      </div>
    <div class="section-body">${opTypeHTML(d,"qsOp")}
      ${targetFieldsHTML(d,"qsSet")}</div></section>`;
  const step2="";
  const step3=`<section class="section tight"><div class="section-head"><h3>Impact</h3>
      </div>
    <div class="section-body">
      <button class="btn" ${impactReady(d)?"":"disabled"} onclick="qsCheck()">${d.impact?"Check again":"Check impacted CIs"}</button>
      <div style="margin-top:12px">${impactHTML(d)}</div>
    </div></section>`;
  const step4=`<section class="section tight"><div class="section-head"><h3>Change window</h3>
      </div>
    <div class="section-body">
      <div class="choice-row">
        <div class="choice ${d.change==="byoc"?"selected":""}" onclick="qsChange('byoc')">
          <input type="radio" ${d.change==="byoc"?"checked":""}><div><strong>I have one</strong></div></div>
        <div class="choice ${d.change==="create"?"selected":""}" onclick="qsChange('create')">
          <input type="radio" ${d.change==="create"?"checked":""}><div><strong>Request one</strong></div></div>
      </div>
      ${d.change==="byoc"
        ? `<div class="field" style="margin-top:14px"><label>Change number</label><input placeholder="e.g. CHG0012345678" value="${esc(d.crno)}" onchange="quickDraft.crno=this.value;renderQuick()"></div>`
        : `<div class="two" style="margin-top:14px"><div class="field"><label>Requested window start</label><input type="datetime-local" min="${minWindowAttr(d.op)}" value="${esc(toWindowInput(d.winStart))}" onchange="quickDraft.winStart=fmtWindowValue(this.value);renderQuick()"></div><div class="field"><label>Requested window end</label><input type="datetime-local" min="${minWindowAttr(d.op)}" value="${esc(toWindowInput(d.winEnd))}" onchange="quickDraft.winEnd=fmtWindowValue(this.value);renderQuick()"></div></div><span class="help">The earliest window you can request is ${esc(fmtWindowValue(minWindowAttr(d.op)))}. This workflow needs ${leadDaysFor(d.op)} calendar days' notice.</span>`}
    </div></section>`;
  return {html:step1+step2+step3+step4, blocked};
}

function quickSummary(){
  const d=quickDraft, blocked=validateItem(d,true);
  const row=(k,v)=>`<div class="sumrail-kv"><span>${k}</span><b>${esc(v||"—")}</b></div>`;
  return `<div class="sumrail-h">This operation</div><div class="sumrail-b">
    ${row("Operation",d.op)}
    ${row("Target type",d.op===OP.HOST?"Host pair":d.op===OP.TENANT?"R-Series tenant":d.op===OP.VIRTUAL?"Virtual tenant":"")}
    ${row("Target",d.op===OP.HOST?[d.peer1,d.peer2].filter(Boolean).join(" / "):d.tenant)}
    ${row("Version",d.version)}
    ${row("Impact",d.impact?impactCount(d.impact)+" affected":"")}
    ${d.change==="byoc" ? row("Change",d.crno) : row("Requested window",(d.winStart||"")+(d.winEnd?" → "+d.winEnd:""))}
    <p class="sub" style="margin-top:12px">${blocked?esc(blocked):"Ready to submit."}</p>
  </div>`;
}

function renderQuick(){
  setCrumb(PLANS_TRAIL.concat(["Quick Submit"]));
  const {html,blocked}=quickForm();
  document.getElementById("app").innerHTML=`<div class="page">
    <div class="head"><div><h1>Quick Submit</h1>
      <div class="sub">One operation. A plan is created for it automatically.</div></div>
      <div class="actions"><button class="btn" onclick="goList()">Cancel</button></div></div>
    <div class="form-grid"><div id="quickBody">${html}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button class="btn" onclick="goList()">Cancel</button>
        <button class="btn primary" ${blocked?"disabled":""} onclick="submitQuick()">Submit</button>
      </div></div>
      <aside class="sumrail">${quickSummary()}</aside></div></div>`;
}
function quickReset(){
  quickDraft={op:"",impact:null,change:"byoc",crno:"",winStart:"10 Oct 2026 · 22:00",winEnd:"11 Oct 2026 · 02:00"};
}
/* Quick submit is a second entry point, not a second lifecycle. It builds the
   virtual plan the operator never configures and then hands it to submitV2 —
   the same validation, the same states, the same outcomes as a plan the user
   built by hand. Nothing here is allowed to set an execution state directly. */
function submitQuick(){
  const d=quickDraft;
  if(validateItem(d,true)) return;
  const id=uuid(Date.now()^Math.floor(Math.random()*1e9));
  const f5=d.op===OP.HOST;
  const item=itemFromDraft(d,"IT-"+Math.floor(1000+Math.random()*8999));
  const plan={id,displayRef:nextPlanRef(),
    name:(f5?d.peer1+" / "+d.peer2:d.tenant)+" → "+d.version, desc:"Quick Submit",
    operation:d.op,
    change: d.change==="byoc" ? d.crno : "",
    mode:   d.change==="byoc" ? "byoc" : "create",
    /* an existing change's window is resolved at validation, not taken from the form */
    windowStart: d.change==="byoc" ? "" : d.winStart, windowEnd: d.change==="byoc" ? "" : d.winEnd,
    changeApproval: d.change==="byoc" ? APPROVAL.APPROVED : APPROVAL.NONE,
    state:PLAN_STATE.DRAFT, virtual:true, items:[item]};
  DB().unshift(plan);
  normalisePlan(DB()[0]);
  quickReset();
  /* land on the plan so validation is watched, not guessed at from a list */
  go({v:"plan",p:id});
  submitV2(getPlan(id));
  showToast("Submitted for validation. Filed under "+planRef(plan)+", a plan the system created.");
}
function startQuick(){
  quickReset();
  go({v:"quick"});
}

/* ======================= ADD ITEM TO AN EXISTING PLAN =====================
    — the operation type and the change window come from the plan and
   are never asked for again. Everything else is the same engine. */
let addDraft={op:"",impact:null};
/* Null while adding, the item id while correcting one. One drawer, one
   renderer, one save — an item is edited by the same engine that created it. */
let editingItem=null;
function aiSet(k,v){ setField(addDraft,k,v); renderAddItem(); }
function aiCheck(){ addDraft.impact=computeImpact(addDraft); renderAddItem(); }

/* Items are editable in Draft, including a Draft returned with validation
   errors. Every entry point asks this, so the rule cannot be bypassed. */
function canEditItems(p){ return canEdit(p); }

function openAddItem(){
  const p=getPlan(selectedPlan);
  if(!canEditItems(p)) return showToast("This plan has been submitted. Its items are locked.");
  editingItem=null;
  /* The plan established the workflow; the item inherits it and never asks. */
  if(!OPERATIONS[p.operation]) return showToast("This plan's operation type is not available for new items.");
  addDraft={op:p.operation,impact:null};
  setOperation(addDraft,addDraft.op);
  resetDrawerChrome();
  document.getElementById("drawerTitle").textContent="Add an item";
  document.getElementById("drawerSub").textContent=
    `${planRef(p)} · ${addDraft.op} · ${p.change||"—"} · ${p.window}`;
  renderAddItem(); showDrawer();
}

/* Correcting an item. The draft is rebuilt from the item so every dependent
   field re-derives its options from the same schema that produced it. */
function openEditItem(iid){
  const p=getPlan(selectedPlan), i=getItem(selectedPlan,iid);
  if(!p||!i) return;
  if(!canEditItems(p)) return showToast("This plan has been submitted. Its items are locked.");
  editingItem=iid;
  /* The item is corrected under the plan's workflow — an item carrying a
     different one is exactly what submit validation reports, and editing it
     brings it back into line. */
  const op=OPERATIONS[p.operation]?p.operation:opOfJourney(i.journey);
  addDraft={op,impact:null};
  setOperation(addDraft,op);
  if(op===OP.HOST){ addDraft.peer1=i.peer1||""; addDraft.peer2=i.peer2||""; }
  else { if(op===OP.TENANT) addDraft.device=(i.device&&i.device!=="—")?i.device:"";
         addDraft.tenant = i.tenant&&i.tenant!=="—"?i.tenant:""; }
  addDraft.version=i.to||"";
  resetDrawerChrome();
  document.getElementById("drawerTitle").textContent="Edit item";
  document.getElementById("drawerSub").textContent=`${planRef(p)} · ${addDraft.op}`;
  renderAddItem(); showDrawer();
}

function renderAddItem(){
  const blocked=validateItem(addDraft,false), editingNow=!!editingItem;
  document.getElementById("drawerBody").innerHTML=
    `<div class="dw-g"><span class="lab">Target</span>${itemConfigHTML(addDraft,"aiSet","aiSet",false)}</div>
     <div class="dw-g"><span class="lab">Impacted CIs</span>
       <button class="btn" ${impactReady(addDraft)?"":"disabled"} onclick="aiCheck()">${addDraft.impact?"Check again":"Check impacted CIs"}</button>
       <div style="margin-top:12px">${impactHTML(addDraft)}</div></div>`;
  document.getElementById("drawerFoot").innerHTML=
    `<span class="msg">${blocked?esc(blocked):(editingNow?"Ready to save.":"Ready to add.")}</span>
     <button class="btn" onclick="closeDrawer()">Cancel</button>
     <button class="btn primary" ${blocked?"disabled":""} onclick="saveItem()">${editingNow?"Save changes":"Add item"}</button>`;
}

/* One shape for an item, whether it is being created or corrected. */
function itemFromDraft(d,id){
  const f5=d.op===OP.HOST;
  return {id,
    name: f5 ? d.peer1+" / "+d.peer2 : d.tenant,
    peer1:d.peer1||null, peer2:d.peer2||null,
    impactCount:d.impact?+impactTotal(d.impact):0,
    /* Every device in the estate is one half of an HA pair, so "standalone vs
       pair" was never a real distinction to draw (2026-09-17). */
    kind: f5 ? "Host pair" : (d.op===OP.TENANT?"R-series tenant":"Virtual tenant"),
    journey: journeyOfOp(d.op),
    device: f5 ? d.peer1+" / "+d.peer2 : (d.device||"—"),
    tenant: f5 ? "—" : d.tenant,
    operation:d.op,
    from: f5 ? ((deviceById(d.peer1)||{}).label||"").split("— ")[1]||"—" : ((tenantById(d.tenant)||{}).v||"—"),
    to:d.version, stage:"Not started", state:ITEM_STATE.DRAFT, taskIdx:0};
}

/* One way to file an item: configure it, check the impact, add it. There is no
   item-level draft — the plan itself is the draft (2026-09-24). */
function saveItem(){
  const d=addDraft, p=getPlan(selectedPlan);
  if(!p||!canEditItems(p)) return;
  if(validateItem(d,false)) return;
  if(editingItem){
    const n=p.items.findIndex(x=>x.id===editingItem);
    if(n>=0){
      p.items[n]=itemFromDraft(d,editingItem);
      /* The correction is the answer to a validation failure, so the stale
         error for this item goes with it. */
      if(p.errors) p.errors=p.errors.filter(e=>e.item!==editingItem);
    }
    editingItem=null;
    reconcileValidation(p);
    closeDrawer(); render();
    showToast("Item updated.");
    return;
  }
  p.items.push(itemFromDraft(d,"IT-"+Math.floor(1000+Math.random()*8999)));
  reconcileValidation(p);
  closeDrawer(); render();
  showToast("Item added to the plan.");
}







/* Breadcrumbs navigate. Each entry is a label, or [label, destination, arg];
   the last entry is where you are, so it is never a link. */
/* ============================================================================
   NAVIGATION

   Two jobs, kept apart. The breadcrumb answers "where am I" and is the only
   way up. The URL is the only history, so the browser's own Back, swipe-back,
   refresh and a pasted link all work on the same mechanism.

   Everything routes through go(). Nothing else writes history, which is what
   keeps Back meaning "the previous screen" rather than "undo my last
   keystroke" — filtering, searching and sorting re-render freely.
   ============================================================================ */

const NAV_FRAME={home:{v:"home"},plans:{v:"list"},devices:{v:"devices"},activity:{v:"activity"}};

function frameToHash(f){
  switch(f.v){
    case "list":     return "#/plans";
    case "newplan":  return "#/plans/new";
    case "quick":    return "#/plans/quick-submit";
    case "plan":     return "#/plans/"+encodeURIComponent(f.p);
    case "item":     return "#/plans/"+encodeURIComponent(f.p)+"/items/"+encodeURIComponent(f.i);
    case "devices":  return "#/devices";
    case "device":   return "#/devices/"+encodeURIComponent(f.d);
    case "activity": return "#/activity";
    default:         return "#/";
  }
}

function hashToFrame(h){
  const g=(h||"").replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);
  if(!g.length) return {v:"home"};
  if(g[0]==="plans"){
    if(!g[1])        return {v:"list"};
    if(g[1]==="new") return {v:"newplan"};
    if(g[1]==="quick-submit") return {v:"quick"};
    if(g[2]==="items" && g[3]) return {v:"item",p:g[1],i:g[3]};
    return {v:"plan",p:g[1]};
  }
  if(g[0]==="devices")  return g[1] ? {v:"device",d:g[1]} : {v:"devices"};
  if(g[0]==="activity") return {v:"activity"};
  return {v:"home"};
}

/* A pasted or bookmarked link can name something that no longer exists.
   Fall back to its parent rather than rendering an empty page. */
function resolveFrame(f){
  if(f.v==="plan" && !getPlan(f.p))   return {v:"list"};
  if(f.v==="item"){
    if(!getPlan(f.p))                 return {v:"list"};
    if(!getItem(f.p,f.i))             return {v:"plan",p:f.p};
  }
  if(f.v==="device" && !deviceRecord(f.d)) return {v:"devices"};
  return f;
}

/* The only place view state is set. */
/* ============================================================================
   RETURNING TO A MODULE

   Moving between plans, a plan and one of its items is moving around inside
   one module, and the list state — which segment, any search, any filter —
   is the reader's place in it. It survives.

   Leaving for Devices, Activity or Home and coming back is arriving fresh, and
   arriving fresh means the module's default: Needs action, nothing filtered.
   Otherwise a search typed ten minutes ago is still narrowing the list and
   nothing on screen says why.
   ============================================================================ */
const SECTION_OF={home:"home", list:"plans", newplan:"plans", quick:"plans", plan:"plans", item:"plans",
                  devices:"devices", device:"devices", activity:"activity"};
let lastSection=null;
function resetPlansView(){
  seg="needs"; q2=""; opFilter=""; outFilter=""; sortTouched=false;
  opSel=[]; outSel=[]; winPreset=""; winFrom=""; winTo=""; listPage=1; openMenu=null; listResp=null;
}

function applyFrame(f){
  stopEditing();
  /* Only on re-entry, and only from outside the module. */
  const section=SECTION_OF[f.v]||"plans";
  if(section==="plans" && lastSection && lastSection!=="plans") resetPlansView();
  lastSection=section;
  /* A change of screen closes any open overlay. Browser Back left the add-item
     drawer sitting over Home, still editing an item on a plan no longer on
     screen. Back is a first-class way to move here, so it has to leave the
     same state a breadcrumb would. */
  ["modalBg","drawerBg","confirmBg"].forEach(id=>{
    const bg=document.getElementById(id);
    if(bg&&bg.classList.contains("open")){ bg.classList.remove("open"); bg.setAttribute("aria-hidden","true"); }
  });
  dialogReturn=null; editingItem=null;
  devSelected=null; 
  if(f.v==="device" || f.v==="devices"){ view="devices"; devSelected=f.v==="device"?f.d:null; }
  else if(f.v==="item"){ selectedPlan=f.p; selectedItem=f.i; view="item"; }
  else if(f.v==="plan"){ selectedPlan=f.p; selectedItem=null; view="plan"; }
  else { view=f.v==="list"?"list":f.v; }
  render();
}

/* pushState throws inside a sandboxed frame. The breadcrumb does not depend on
   it, so degrade to in-memory navigation rather than failing the click. */
function histWrite(f,h,replace){
  try{ replace ? history.replaceState({f},"",h) : history.pushState({f},"",h); }
  catch(e){}
}

function go(f,replace){
  f=resolveFrame(f);
  const h=frameToHash(f);
  if(!replace && location.hash===h){ applyFrame(f); return; }   /* already here */
  histWrite(f,h,replace);
  applyFrame(f);
}

window.addEventListener("popstate",e=>{
  const f=resolveFrame((e.state&&e.state.f) || hashToFrame(location.hash));
  /* A frame that resolved down to its parent must correct the URL too, or the
     address bar goes on naming something that is not on screen. */
  if(frameToHash(f)!==location.hash) histWrite(f,frameToHash(f),true);
  applyFrame(f);
});

/* Validation failure is a result attached to Draft, not a lifecycle state.
   Once every error has been answered, clear the result; the plan remains Draft
   and the user submits it the same way they did the first time. */
function hasValidationErrors(p){
  return !!(p && p.state===PLAN_STATE.VFAILED);
}
/* Validation attention has two independent scopes and either can be empty.
   Items are counted as *items*, never as messages: four errors on one item is
   one item needing attention. */
function validationScope(p){
  const errors=(p&&p.errors)||[];
  const plan=errors.filter(e=>!e.item||e.item==="—");
  const items=errors.filter(e=>e.item&&e.item!=="—");
  return {
    planErrors: plan.reduce((a,e)=>a+e.fails.length,0),
    planEntries: plan,
    affectedItems: new Set(items.map(e=>e.item)).size,
    itemEntries: items
  };
}
function reconcileValidation(p){
  if(!hasValidationErrors(p)) return;
  if((p.errors||[]).length) return;
  p.validationFailed=false;
  p.errors=null;
  p.checksDone=0; p.checksTotal=0;
  showToast("All validation errors fixed. Submit the draft when ready.");
}

function removeItem(iid){
  const p=getPlan(selectedPlan); if(!p) return;
  if(!canEditItems(p)) return showToast("This plan has been submitted. Its items are locked.");
  p.items=p.items.filter(i=>i.id!==iid);
  if(p.errors) p.errors=p.errors.filter(e=>e.item!==iid);
  reconcileValidation(p);
  render(); showToast("Item removed.");
}

/* submitPlan() was the merged build's second submission path: it set the plan
   straight to a "Running" state that is not in PLAN_STATE and never ran a
   check. Deleted — submitV2() is the only pipeline, reached through
   runPlanAction("submit"). */


/* ===================================================================
   THE APPLICATION — dataset, lifecycle, listing and submit pipeline.
   =================================================================== */

/* ---- change-request lead time. Calendar days. ---- */
const plural=(n,w)=>n+" "+w+(n===1?"":"s");

/* ============================================================================
   PLAN IDENTITY

   The UUID remains the internal key used by routing and relationships. The
   operator sees a separate, stable Plan reference; internal keys never leak
   into labels, metadata, Activity, or authoring chrome.
   ============================================================================ */
const HEX="0123456789abcdef";
function uuid(seed){
  /* Seeded so a given plan keeps its id across re-renders of the sample data. */
  let x=seed>>>0 || 1, out="";
  const r=()=>{ x^=x<<13; x>>>=0; x^=x>>17; x^=x<<5; x>>>=0; return x; };
  for(let i=0;i<32;i++){ out+=HEX[r()%16]; if(i===7||i===11||i===15||i===19) out+="-"; }
  return out;
}
function planRef(p){ return p&&p.displayRef ? p.displayRef : "Plan"; }
function assignPlanRefs(){
  DB().forEach((p,n)=>{ if(!p.displayRef) p.displayRef="PL"+String(n+1).padStart(3,"0"); });
}
function nextPlanRef(){
  const last=DB().reduce((m,p)=>Math.max(m,Number(String(p.displayRef||"").replace(/^PL/,""))||0),0);
  return "PL"+String(last+1).padStart(3,"0");
}
/* Confirmed: a requested change window must be at least five calendar days
   ahead. One constant, one minimum-date function, used by every surface that
   takes the date — the rule is enforced on the control, not reported after. */
const POLICY={ minChangeLeadDays:5 };
/* The lead time is a policy of the workflow, not a universal rule. Every
   workflow uses the default today; one that needs a different lead time
   declares minChangeLeadDays on its OPERATIONS entry. */
function leadDaysFor(op){
  const d=(OPERATIONS[op]||{}).minChangeLeadDays;
  return Number.isFinite(d) ? d : POLICY.minChangeLeadDays;
}

/* ---- the reconciled state model ---- */
const PLAN_STATE={
  /* Draft and Validation failed are different facts about the same plan, and
     the difference is whether it has ever been submitted. Draft was never put
     to authoritative validation; Validation failed was, and came back with
     errors. Collapsing the second into the first hid the one thing the
     operator needs to know — that the system has already answered. */
  DRAFT:"Draft", VALIDATING:"Validating", VFAILED:"Validation failed",
  /* Validation settles the change window and its approval, so there is no
     waiting-for-approval state. Scheduled means validated and waiting for the
     approved window to open. */
  SCHEDULED:"Scheduled", EXECUTING:"Executing",
  ACTION:"Action required", COMPLETING:"Completing",
  COMPLETED:"Completed", PARTIAL:"Completed with failures", FAILED:"Failed",
  CANCELLING:"Cancelling", CANCELLED:"Cancelled",
};
const ITEM_STATE={
  /* One pre-submission state. An item that has been configured but not yet
     submitted for validation is a Draft, whether it was filed complete or
     parked incomplete — the two actions differ in what they require, not in
     what they produce. */
  /* Draft belongs to an item that has not been submitted. Once its plan is
     submitted the item moves with it — Scheduled while the plan waits for its
     approved window, then the execution statuses. The words match the ones the
     plan summary already uses, so one item is never described two ways. */
  DRAFT:"Draft", VALIDATING:"Validating", SCHEDULED:"Scheduled", QUEUED:"Queued",
  INPROGRESS:"Running", ACTION:"Needs action",
  ROLLINGBACK:"Rolling back", SUCCEEDED:"Completed", FAILED:"Failed",
  ROLLEDBACK:"Rolled back", ROLLBACKFAILED:"Rollback failed",
  CANCELLED:"Cancelled", SKIPPED:"Skipped"
};

/* normalisePlan() reads PLAN_STATE, so seeded plans are normalised only after
   the state vocabulary has been initialised. */
plans.forEach(normalisePlan);

/* Disposition — who holds the baton. Closed set of four, exhaustive and
   disjoint, so the listing survives any future state being added. */
const DISPOSITION={
  [PLAN_STATE.DRAFT]:"needs", [PLAN_STATE.VFAILED]:"needs", [PLAN_STATE.ACTION]:"needs",
  [PLAN_STATE.VALIDATING]:"running", [PLAN_STATE.EXECUTING]:"running",
  [PLAN_STATE.COMPLETING]:"running", [PLAN_STATE.CANCELLING]:"running",
  [PLAN_STATE.SCHEDULED]:"waiting",
  [PLAN_STATE.COMPLETED]:"done", [PLAN_STATE.PARTIAL]:"done", [PLAN_STATE.FAILED]:"done",
  [PLAN_STATE.CANCELLED]:"done"
};
const SEGMENTS=[["needs","Needs You"],["running","Running"],["waiting","Waiting"],["done","Closed"]];
const TERMINAL=new Set([PLAN_STATE.COMPLETED,PLAN_STATE.PARTIAL,
  PLAN_STATE.FAILED,PLAN_STATE.CANCELLED]);

function disposition(p){
  if(!TERMINAL.has(p.state) && p.items.some(i=>i.state===ITEM_STATE.ACTION)) return "needs";
  return DISPOSITION[p.state] || "needs";
}
function attentionItem(p){ return p.items.find(i=>i.state===ITEM_STATE.ACTION) || null; }

/* An item can only hold an execution state if its plan actually reached
   execution. Everything before that — awaiting approval, scheduled, rejected,
   failed validation — means nothing was ever dispatched. */
const PLAN_RAN=new Set([PLAN_STATE.EXECUTING,PLAN_STATE.COMPLETING,PLAN_STATE.CANCELLING,
  PLAN_STATE.COMPLETED,PLAN_STATE.PARTIAL,PLAN_STATE.FAILED]);
const ITEM_RAN=new Set([ITEM_STATE.INPROGRESS,ITEM_STATE.ACTION,ITEM_STATE.ROLLINGBACK,
  ITEM_STATE.SUCCEEDED,ITEM_STATE.FAILED,ITEM_STATE.ROLLEDBACK,ITEM_STATE.ROLLBACKFAILED]);
/* Action required covers two cases. A pre-task failure means nothing was ever
   dispatched; a close that failed means every item already finished. Only the
   second counts as having run. */
function planHasRun(p){
  if(PLAN_RAN.has(p.state)) return true;
  return p.state===PLAN_STATE.ACTION && p.planTaskPhase==="post";
}

/* ============================================================================
   WHEN TASKS EXIST  (2026-09-18)

   They do not exist until the plan is executing. Validation is not a task and
   the workflow is not started until validation passes — "we don't even kick
   off the workflow until it's all valid". So a draft, a plan mid-validation,
   one that failed validation, one awaiting change approval and one merely
   scheduled have no tasks at all, rather than tasks that have not started.

   A plan-level task failure means the workflow did start, whichever phase it
   stopped in, so Action required counts.
   ============================================================================ */
const WORKFLOW_STARTED=new Set([PLAN_STATE.EXECUTING, PLAN_STATE.ACTION, PLAN_STATE.COMPLETING,
  PLAN_STATE.COMPLETED, PLAN_STATE.PARTIAL, PLAN_STATE.FAILED]);
function workflowStarted(p){
  if(WORKFLOW_STARTED.has(p.state)) return true;
  /* cancelled or expired counts only if items actually ran before it ended */
  return (p.state===PLAN_STATE.CANCELLING||p.state===PLAN_STATE.CANCELLED||!!p.windowExpired)
         && p.items.some(i=>itemHasRun(i));
}
/* Cancelled is two different histories wearing one name: an item cancelled
   mid-run got somewhere before it stopped, and an item cancelled with its plan
   before execution never started at all. The recorded stop point is what tells
   them apart — without this, a cancelled item drew all of its tasks as "not
   started" and lost the record of everything it had completed. */
function itemHasRun(i){
  if(ITEM_RAN.has(i.state)) return true;
  return i.state===ITEM_STATE.CANCELLED && (i.failedTask!==undefined || i.taskIdx>0);
}

/* ---- counts, with explicit buckets. No catch-all. ---- */
function countsV2(p){
  const c={total:p.items.length,draft:0,validating:0,scheduled:0,queued:0,running:0,action:0,
           succeeded:0,failed:0,skipped:0,cancelled:0,rolledback:0,rollbackfailed:0};
  p.items.forEach(i=>{
    if(i.state===ITEM_STATE.DRAFT)            c.draft++;
    else if(i.state===ITEM_STATE.VALIDATING)  c.validating++;
    else if(i.state===ITEM_STATE.SCHEDULED)   c.scheduled++;
    else if(i.state===ITEM_STATE.QUEUED)      c.queued++;
    else if(i.state===ITEM_STATE.INPROGRESS||i.state===ITEM_STATE.ROLLINGBACK) c.running++;
    else if(i.state===ITEM_STATE.ACTION)      c.action++;
    else if(i.state===ITEM_STATE.SUCCEEDED)   c.succeeded++;
    else if(i.state===ITEM_STATE.SKIPPED)     c.skipped++;
    else if(i.state===ITEM_STATE.CANCELLED)   c.cancelled++;
    else if(i.state===ITEM_STATE.ROLLEDBACK)  c.rolledback++;
    else if(i.state===ITEM_STATE.ROLLBACKFAILED) c.rollbackfailed++;
    else                                      c.failed++;
  });
  /* Progress is work that actually ran. Items that never started — skipped on
     an expired window, cancelled, or never approved — are terminal but are not
     progress, and counting them would show a plan as complete that never ran. */
  c.notapproved=0;
  c.done=c.succeeded+c.failed+c.rolledback+c.rollbackfailed;
  c.settled=c.done+c.skipped+c.cancelled+c.notapproved;
  return c;
}

/* Items run in parallel, and region concurrency limits mean some of them sit
   queued while others run. A single completed-over-total reads as a sequential
   queue and hides both facts, so the distribution is the primary statement and
   the ratio is secondary. Every bucket is derived from item states that already
   exist — "needs action" is ITEM_STATE.ACTION, not a new lifecycle state. */
function distribution(p){
  const c=countsV2(p);
  const buckets=[
    ["Scheduled",    c.scheduled],
    ["Completed",    c.succeeded],
    ["Running",      c.running],
    ["Queued",       c.queued],
    ["Needs action", c.action],
    ["Failed",       c.failed],
    ["Rolled back",  c.rolledback],
    ["Rollback failed", c.rollbackfailed],
    ["Cancelled",    c.cancelled],
    ["Skipped",      c.skipped],
    ["Not approved", c.notapproved],
    ["Draft",        c.draft]
  ].filter(x=>x[1]>0);
  /* Completion means completed. Running, queued, skipped and failed items are
     all real states and all visible in the buckets, but none of them is
     progress, so none of them is in the numerator. */
  return {total:c.total, succeeded:c.succeeded,
          ratio: c.total ? c.succeeded/c.total : 0, buckets};
}
/* The compact read used by the plans list: one continuous bar over the same
   ratio, with the count beneath it as the authoritative value. The bar is a
   scan aid; the number is the information. */
function progressBarHTML(p){
  const d=distribution(p);
  const pct=(d.ratio*100);
  return `<span class="v2prog">
    <span class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${d.total}"
      aria-valuenow="${d.succeeded}"
      aria-valuetext="${d.succeeded} of ${d.total} items completed"><span style="width:${pct.toFixed(2)}%"></span></span>
    <span class="v2sub mono">${d.succeeded}/${d.total}</span></span>`;
}
/* The spoken equivalent of the distribution bar, in the bar's own segment
   order. Not a Status-cell producer — that is planStatusPresentation(). */
const distributionText=p=>distribution(p).buckets.map(([n,v])=>v+" "+n).join(" · ");
/* The bar is a secondary read of the same numbers, in the same order. */
/* Whether an item row offers navigation into its detail page. Validation
   failed is a correction state — the answer is Edit, not inspection, and there
   is no execution context to open. A terminal plan only offers it if execution
   actually happened, so a plan cancelled before it ran has nothing to show.
   Everything else — draft, validating, scheduled, executing, and the live
   states in between — has a meaningful destination. */
function showItemChevron(p){
  if(TERMINAL.has(p.state))        return executionStarted(p);
  return true;
}

/* Execution history, not terminal status. A plan cancelled before it ran has
   no completion to show; one cancelled part-way does. */
function executionStarted(p){
  return planHasRun(p) || p.items.some(itemHasRun);
}
/* The plan's summary line inside the header. Before execution it states what
   the plan holds and what the plan is doing — the plan owns its lifecycle, so
   the items are not asked to describe it. Once execution has started it gains
   the distribution and the completion bar. */
function planSummaryHTML(p){
  if(!p.items.length) return "";
  const started=executionStarted(p);
  const d=distribution(p);
  if(!started){
    return `<div class="plan-sum">
      <span class="ps-items">${plural(d.total,"item")}</span>
      <span class="ps-sep">·</span>
      <span class="ps-status">${esc(p.state)}</span>
    </div>`;
  }
  /* Draft is a pre-execution item state and cannot describe a running plan. */
  const buckets=d.buckets.filter(([n])=>n!=="Draft"&&n!=="Scheduled");
  const pct=(d.ratio*100).toFixed(2);
  return `<div class="plan-sum started">
    <div class="ps-row">
      <span class="ps-items">${plural(d.total,"item")}</span>
      ${buckets.length?`<span class="ps-sep">·</span><span class="ps-dist">${buckets.map(([n,v])=>
        `<span class="ps-b"><b>${v}</b> ${esc(n)}</span>`).join('<span class="ps-sep">·</span>')}</span>`:""}
    </div>
    <div class="ps-comp">
      <span class="ps-lab">Completion</span>
      <span class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${d.total}"
        aria-valuenow="${d.succeeded}"
        aria-valuetext="${d.succeeded} of ${d.total} items completed"><span style="width:${pct}%"></span></span>
      <span class="ps-num mono">${d.succeeded} / ${d.total}</span>
    </div>
  </div>`;
}

function distributionHTML(p){
  const d=distribution(p);
  if(!d.total) return "";
  return `<div class="dist">
    <div class="dist-total">${plural(d.total,"item")}</div>
    <div class="dist-line">${d.buckets.map(([n,v])=>
      `<span class="dist-b"><b>${v}</b> ${esc(n)}</span>`).join('<span class="dist-sep">·</span>')}</div>
    <div class="dist-bar" role="img" aria-label="${esc(distributionText(p))}">${
      d.buckets.map(([n,v])=>`<span class="db-${n.toLowerCase().replace(/ /g,"-")}" style="flex:${v}"></span>`).join("")}</div>
    <div class="dist-ratio mono">${d.succeeded} / ${d.total} completed</div>
  </div>`;
}

/* a qualifier must carry a datum. No datum, no qualifier. */
/* What is actually outstanding on a plan that needs intervention: the
   plan-level task that stopped, and every item waiting on a decision. */
function attentionCount(p){
  const n=(p.planTaskFailed?1:0)+p.items.filter(i=>i.state===ITEM_STATE.ACTION).length;
  return n||1;
}
/* ============================================================================
   THE STATUS CELL — one grammar, one implementation

   Every Plans view reads planStatusPresentation() and nothing else, so the
   same plan cannot read two ways in two tabs. The formatter owns the
   terminology, the counting, the plurals, the order of the dimensions, the
   suppression of empty ones and the separator. Nothing downstream concatenates
   status text of its own.

   A cell has at most two levels. The primary says what state the plan is in.
   The secondary says the composition or the error scope — never a diagnostic
   sentence, which belongs to the detail view that can act on it.
   ============================================================================ */
const STATUS_SEP=" · ";

/* Execution composition, in fixed display order. The order is the
   specification, not an artefact of map iteration, so it is written out. The
   first five are the live dimensions; the rest are states only a closed plan
   still holds, kept so a terminal composition does not silently lose items. */
const EXEC_DIMENSIONS=[
  ["completed",       c=>c.succeeded],
  ["running",         c=>c.running],
  ["queued",          c=>c.queued],
  ["needs action",    c=>c.action],
  ["failed",          c=>c.failed],
  ["rolled back",     c=>c.rolledback],
  ["rollback failed", c=>c.rollbackfailed],
  ["cancelled",       c=>c.cancelled],
  ["skipped",         c=>c.skipped],
  ["scheduled",       c=>c.scheduled],
  ["draft",           c=>c.draft]
];
function executionComposition(p){
  const c=countsV2(p);
  return EXEC_DIMENSIONS
    .map(([label,get])=>[label,get(c)])
    .filter(([,n])=>n>0)
    .map(([label,n])=>n+" "+label)
    .join(STATUS_SEP);
}

/* The two validation scopes, plan before items, each omitted when empty. */
function validationSummary(p){
  const v=validationScope(p), parts=[];
  if(v.planErrors)    parts.push(plural(v.planErrors,"plan error"));
  if(v.affectedItems) parts.push(v.affectedItems+" "+
                                 (v.affectedItems===1?"item":"items")+" with errors");
  return parts.join(STATUS_SEP);
}

function planStatusPresentation(p){
  const primary=p.state;
  const cell=secondary=>({primary, secondary:secondary||null});
  const c=countsV2(p);
  switch(p.state){
    /* Created and saved, nothing asked of the system yet. There is no
       composition to report and no error to scope, and the item population is
       the Completion column's job — so the cell is one line. */
    case PLAN_STATE.DRAFT:
      return cell(null);
    /* Submitted, answered, and the answer was errors. The status already says
       correction is needed, so the secondary carries only the scope. */
    case PLAN_STATE.VFAILED:
      return cell(validationSummary(p));
    /* A triage row says how much is wrong, not what went wrong. The backend's
       own sentence stays on the detail view that can act on it. */
    case PLAN_STATE.ACTION:
      return cell(plural(attentionCount(p),"workflow error"));
    case PLAN_STATE.EXECUTING:
      return cell(executionComposition(p));
    case PLAN_STATE.VALIDATING:
      return cell((p.checksDone||0)+" of "+(p.checksTotal||11)+" checks");
    case PLAN_STATE.SCHEDULED:
      return cell("opens "+p.window);
    case PLAN_STATE.COMPLETING:
      return cell("closing "+p.change);
    case PLAN_STATE.PARTIAL:
      return cell([executionComposition(p), p.endedAt?"ended "+p.endedAt:""]
                  .filter(Boolean).join(STATUS_SEP));
    case PLAN_STATE.COMPLETED:
      return cell(p.endedAt?"ended "+p.endedAt:executionComposition(p));
    case PLAN_STATE.FAILED:
      return cell(executionComposition(p));
    case PLAN_STATE.CANCELLING:
      return cell(c.running+" settling");
    case PLAN_STATE.CANCELLED:
      return cell(p.cancelledBy?"by "+p.cancelledBy:null);
    default:
      return cell(null);
  }
}


/* ---- lead time ---- */
const MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Sept:8,Oct:9,Nov:10,Dec:11};
function parseWindow(s){
  const m=/(\d{1,2})\s+([A-Za-z]{3,4})\s*(\d{4})?/.exec(s||"");
  if(!m) return null;
  const mo=MONTHS[m[2]]; if(mo===undefined) return null;
  return new Date(m[3]?+m[3]:2026, mo, +m[1]);
}
/* The prototype runs against a fixed clock so the sample data stays coherent.
   Named for what it is: this is demo time, not production "now". */
const DEMO_NOW=new Date(2026,8,9);
/* the earliest date a requested window may start */
function minWindowDate(op){
  const d=new Date(DEMO_NOW); d.setDate(d.getDate()+leadDaysFor(op));
  d.setHours(0,0,0,0); return d;
}
const minWindowAttr=(op)=>{const d=minWindowDate(op);
  const pad=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T00:00`;};
/* the stored format the rest of the build reads */
function fmtWindowValue(v){
  if(!v) return "";
  const d=new Date(v); if(isNaN(d)) return v;
  const pad=n=>String(n).padStart(2,"0");
  return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toWindowInput(v){
  const d=parseWindow(v); if(!d) return "";
  const pad=n=>String(n).padStart(2,"0");
  const hm=(String(v).match(/(\d{1,2}):(\d{2})/)||[,"22","00"]);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(+hm[1])}:${hm[2]}`;
}
function leadDays(win){
  const d=parseWindow(win); if(!d) return null;
  return Math.round((d-DEMO_NOW)/86400000);
}
/* Returns null when fine, else the refusal sentence. */
function leadTimeError(win,op){
  const n=leadDays(win), need=leadDaysFor(op);
  if(n===null) return null;
  if(n<need)
    return "This workflow needs "+need+
           " calendar days' notice. That window is "+(n<0?"in the past":n+(n===1?" day":" days")+" away")+".";
  return null;
}

/* ===================================================================
   THE MAINTENANCE WINDOW

   Start, end, a remaining time that updates on its own, a warning when it runs
   low, and a clear statement once it has closed.

   The seed windows are calendar dates months out, so a countdown against them
   would never move. A plan that has actually reached execution gets its window
   anchored to the session instead, so the clock, the warning and expiry are
   all real rather than described.
   =================================================================== */
const LIVE_STATES=new Set([PLAN_STATE.EXECUTING,PLAN_STATE.COMPLETING,PLAN_STATE.CANCELLING]);

function hasClock(p){ return p.winOpensAt!==undefined && p.winEndsAt!==undefined; }

/* A plan that has reached execution gets its window anchored to the session so
   the countdown is real. The label has to follow it. Left on the seed string, a
   screen read "15 Oct, 22:00 · 5m 58s left" — a date five weeks out beside a
   five-minute clock, which is not a thing that can be true. */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const hhmm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
/* A window is a range between two date-times, not a date with two clock
   readings. A two-hour window starting at 23:00 ends on the following day, and
   the single-date form could not say so (2026-09-17). */
/* Before approval the dates on screen are the ones the requester asked for,
   not ones anybody has granted. Labelling them "Change window" — identical to
   an approved plan — is what made an unapproved plan read as impossible. */
const WINDOW_REQUESTED=new Set([PLAN_STATE.DRAFT, PLAN_STATE.VALIDATING,
  PLAN_STATE.VFAILED, PLAN_STATE.SCHEDULED]);
/* The change reference points at a record in the change management system.
   Model-X only holds the reference, so the destination has to come with the
   data — `p.changeUrl`. Nothing is constructed from the number: no base URL,
   no path pattern, no guess. Without a URL the reference is plain text, which
   is what every plan shows today because the backend does not supply one yet.
   Only an absolute http(s) URL is accepted, so a stray value cannot become a
   javascript: or relative destination. */
function changeUrlOf(p){
  const u=(p&&p.changeUrl||"").trim();
  if(!u) return null;
  try{ const parsed=new URL(u); return /^https?:$/.test(parsed.protocol)?parsed.href:null; }
  catch(e){ return null; }
}
/* The change field holds a real change number or nothing. Whether a plan
   brings a change or requests a window is `mode`, never this string. */
const NO_CHANGE=new Set(["","—"]);
const hasChangeNumber=p=>!!p && !NO_CHANGE.has(String(p.change||"").trim());
/* One helper, one URL rule, and the surface says explicitly whether it links.
   Only the two detail pages pass `{link:true}` — tables and lists render the
   reference as text, because a row that is itself a link cannot contain
   another one and a compact cell is the wrong place to leave the product. */
function changeRefHTML(p,opts){
  const link=!!(opts&&opts.link), cls=(opts&&opts.cls)||"";
  const ref=(p&&p.change||"").trim();
  const label=NO_CHANGE.has(ref)?(ref||"—"):ref;
  const url=(link&&!NO_CHANGE.has(ref))?changeUrlOf(p):null;
  /* A real change reference on a detail page always reads as a link out to
     the change record. The production URL pattern is not known, so without a
     supplied changeUrl the affordance says so instead of inventing one. */
  if(!url && link && !NO_CHANGE.has(ref))
    return `<button type="button" class="ext ext-pending ${cls}" data-chgpending="${esc(label)}"
      aria-label="${esc(label)} — open this change record in ServiceNow"
      >${esc(label)}<span aria-hidden="true">↗</span></button>`;
  if(!url) return `<span class="${cls}">${esc(label)}</span>`;
  return `<a class="ext ${cls}" href="${esc(url)}" target="_blank" rel="noopener noreferrer"
    aria-label="${esc(label)} — open this change record in the change management system, in a new tab"
    >${esc(label)}<span aria-hidden="true">↗</span></a>`;
}

/* An existing change's window is not known until the change is resolved at
   validation. Until then there is no window to show, and none is invented. */
const WINDOW_PENDING_TEXT="Resolved from the change during validation";
function windowPending(p){ return p.mode!=="create" && !hasClock(p) && !String(p.windowStart||"").trim(); }
function windowFieldLabel(p){
  return (p.mode==="create" && WINDOW_REQUESTED.has(p.state)) ? "Requested window" : "Change window";
}
/* Three separate facts, carried separately rather than inferred from each
   other: whether a window was requested, what the change management system
   said about it, and where the clock is relative to it. Approval is that
   system's answer — it is never derived from the plan happening to be in some
   later state. `p.changeApproval` is seeded on every plan by normalisePlan. */
function approvalOf(p){ return p.changeApproval || APPROVAL.NONE; }
/* How many items may be Running at once, once the plan is Executing. Today the
   engine imposes no limit, so every eligible item starts when the window opens.
   The model is written so a future capacity value changes how many items enter
   Running without any change to the states or the UI. No regional, host or
   tenant limit is assumed — none has been decided. */
const EXECUTION_CAPACITY=Infinity;
function executionCapacity(){ return EXECUTION_CAPACITY; }
/* Queued is a statement about capacity, never about the window. A plan waiting
   for its window is Scheduled and its items are not queued behind anything. */
function itemsAwaitingCapacity(p){
  if(p.state!==PLAN_STATE.EXECUTING) return 0;
  return p.items.filter(i=>i.state===ITEM_STATE.QUEUED).length;
}
/* Allocates capacity across an executing plan's items. With capacity unlimited
   every eligible item runs, which is what the engine does today; with a finite
   capacity the surplus sits Queued and moves up as running items finish. The
   states and the UI are identical either way — only this number changes. */
function applyExecutionCapacity(p){
  if(p.state!==PLAN_STATE.EXECUTING) return;
  const eligible=p.items.filter(i=>i.state===ITEM_STATE.INPROGRESS||i.state===ITEM_STATE.QUEUED);
  let slots=executionCapacity();
  eligible.forEach(i=>{
    if(slots>0){ i.state=ITEM_STATE.INPROGRESS; slots--; }
    else        { i.state=ITEM_STATE.QUEUED; }
  });
}

function windowCondition(p){
  const a=approvalOf(p);
  /* Validation has no approved/declined outcome to show (2026-09-25). A window
     that does not pass is a validation error on the plan, reported there. */
  /* Before submission the window is what the user has asked for; validation is
     what turns it into an approved one. There is no state in between. */
  /* validation ran and failed: the error panel says why; the window has no chip */
  if(p.state===PLAN_STATE.VFAILED) return {k:"requested", t:""};
  if(a!==APPROVAL.APPROVED) return {k:"requested", t:"Not yet validated"};
  /* The window's own condition, stated independently of the plan's outcome.
     A closed window is a fact about the window; what happened to the work is
     the plan's terminal state and is shown separately. */
  const w=windowState(p);
  /* Approval detail lives in ServiceNow. Here the window says only what the
     operator needs: whether it is open or closed (2026-09-24). */
  if(p.windowExpired||(w&&w.closed)) return {k:"closed", t:"Window closed"};
  if(w)                              return {k:"open",   t:"Window open"};
  return {k:"approved", t:""};
}
const windowConditionHTML=p=>{const c=windowCondition(p);
  return c.t ? `<span class="win-cond ${c.k}">${esc(c.t)}</span>` : "";};
function windowLabel(p){
  if(windowPending(p)) return WINDOW_PENDING_TEXT;
  if(!hasClock(p)){
    const a=(p.window||"").trim(), b=(p.windowEnd||"").trim();
    return b ? a+" → "+b : a;
  }
  const a=new Date(p.winOpensAt), b=new Date(p.winEndsAt);
  const d=x=>x.getDate()+" "+MON[x.getMonth()]+" "+hhmm(x);
  return d(a)+" → "+d(b);
}

function windowState(p){
  if(!hasClock(p)) return null;
  const now=Date.now(), total=Math.max(1,p.winEndsAt-p.winOpensAt), left=p.winEndsAt-now;
  const lowAt=Math.max(60000,Math.min(15*60000,total*0.2));
  return {left, total, pct:Math.max(0,Math.min(1,left/total)),
          low:left>0&&left<=lowAt, closed:left<=0};
}

function fmtLeft(ms){
  if(ms<=0) return "0s";
  const t=Math.floor(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), sec=t%60;
  if(h) return h+"h "+String(m).padStart(2,"0")+"m";
  if(m) return m+"m "+String(sec).padStart(2,"0")+"s";
  return sec+"s";
}
function clockLabel(){
  const d=new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

/* ---- what the window closing does to the items under it ---- */
const ITEM_TERMINAL=new Set([ITEM_STATE.SUCCEEDED,ITEM_STATE.FAILED,ITEM_STATE.ROLLEDBACK,
  ITEM_STATE.ROLLBACKFAILED,ITEM_STATE.CANCELLED,ITEM_STATE.SKIPPED]);
const isTerminalItem=i=>ITEM_TERMINAL.has(i.state);

function expireWindow(p){
  if(p.windowExpired) return;
  p.windowExpired=true; p.expiredAt=clockLabel();
  p.items.forEach(i=>{
    if(i.state===ITEM_STATE.QUEUED){
      /* never started, and now never will */
      i.state=ITEM_STATE.SKIPPED;
      i.expiryNote="The maintenance window closed before this item started.";
    }
    else if(i.state===ITEM_STATE.ACTION || RUNNING_STATES.has(i.state)){
      /* An item that has started runs its workflow out. The window governs
         when execution may begin, not whether work already under way is
         allowed to reach its own result — so nothing here is failed,
         cancelled or skipped by the clock. An item waiting on a decision has
         started too: the decision is still the operator's to make. */
      i.finishingAfterExpiry=true;
    }
    /* anything terminal is already finished — expiry does not touch it */
  });
  settlePlan(p);
}

/* ---- plan status is derived from its items, never set beside them ---- */
/* The plan's outcome is what happened to its items, never what happened to the
   clock. A window closing is a condition of the window; the plan is judged on
   the work.
   Three outcomes are confirmed: everything succeeded, some of it did not, or
   none of it did. An item that never completed lands in the middle one
   whatever stopped it — the per-item status still records whether it failed or
   was never attempted, and the plan detail carries that distribution. */
function derivePlanOutcome(p){
  const c=countsV2(p);
  if(c.total&&c.succeeded===c.total) return PLAN_STATE.COMPLETED;
  if(c.succeeded>0)                  return PLAN_STATE.PARTIAL;
  return PLAN_STATE.FAILED;
}

/* Called whenever an item changes. A plan only settles once every item is
   terminal, and a system-created plan closes its change record first. */
function settlePlan(p){
  if(!planHasRun(p) || !p.items.length) return;
  if(p.state===PLAN_STATE.COMPLETING || TERMINAL.has(p.state)) return;
  if(!p.items.every(isTerminalItem)) return;
  if(p.mode==="create" && !p.closeDone){
    p.state=PLAN_STATE.COMPLETING;
    clearTimeout(p._ctimer);
    p._ctimer=setTimeout(()=>{
      p.closeDone=true; p.state=derivePlanOutcome(p); p.endedAt=clockLabel(); render();
    },1800);
    return;
  }
  p.state=derivePlanOutcome(p); p.endedAt=clockLabel();
}

/* One interval for the whole application. It writes the countdown into the
   nodes that carry it rather than re-rendering, so an open drawer, a scroll
   position and a focused field all survive the tick. A window that crosses
   zero is a state change, and only then does the view redraw. */
function tickWindows(){
  let changed=false;
  DB().forEach(p=>{
    if(!hasClock(p)) return;
    const w=windowState(p);
    if(w.closed && !p.windowExpired && LIVE_STATES.has(p.state)){ expireWindow(p); changed=true; }
  });
  if(changed) return render();
  /* Nothing on screen counts down any more. The interval exists only so the
     window can actually expire and the expiry rules can fire. */
  document.querySelectorAll("[data-wintick]").forEach(el=>{
    const q=getPlan(el.dataset.wintick); if(!q) return;
    const w=windowState(q); if(!w) return;
    el.textContent = w.closed ? "Window closed" : fmtLeft(w.left);
    el.classList.toggle("low",!!w.low && !w.closed);
    el.classList.toggle("gone",!!w.closed);
    const bar=document.querySelector('[data-winbar="'+q.id+'"]');
    if(bar){ bar.style.width=(w.pct*100).toFixed(1)+"%";
             bar.parentElement.classList.toggle("gone",!!w.closed); }
  });
}

/* The window panel. One place builds it, so the plan screen and the item
   screen can never disagree about how much time is left. */
/* Superseded: the change window is one fact in the plan's fact row, not a
   panel of its own with a second set of labels on a second baseline. Kept
   only because the draft workspace still calls it. */
function windowHTML(p){
  const w=windowState(p);
  if(!w) return planFailurePhase(p) ? "" :
    `<div class="win-box"><div class="win-row"><div><label>Status</label>
      <span class="win-left">${esc(p.state)}</span></div></div></div>`;
  /* No countdown and no predicted duration. How long a run takes is not
     knowable, and a clock next to it reads as an estimate the platform cannot
     make (2026-09-17). Progress is the count of items that have finished. */
  const c=countsV2(p), doneN=c.done, totalN=p.items.length;
  const note = w.closed
    ? "The window has closed. Items that had not started were skipped; any item waiting for a decision was failed; anything still running was allowed to finish its current step."
    : "Items run only inside this window.";
  return `<div class="win-box">
    <div class="win-row">
      <div><label>${esc(windowFieldLabel(p))}</label><span class="win-left mono">${esc(windowLabel(p))}</span></div>
      <div style="text-align:right"><label>Items completed</label>
        <span class="win-left mono">${doneN} of ${totalN}</span></div>
    </div>
    <div class="track"><span style="width:${totalN?((doneN/totalN)*100).toFixed(1):0}%"></span></div>
    <span class="win-note ${w.closed?"gone":""}">${esc(note)}</span>
  </div>`;
}

/* ---- rollback is a property of the operation type ---- */
function canRollback(p){
  const op=OPERATIONS[p.operation];
  return !op || op.rollback!==false;
}

/* ---- validation. Extensible: one rule per check. ---- */
/* ---- validation: a stable state, an interchangeable explanation ----
   The validation system is not defined yet, so the UI must not depend on
   knowing why something failed. A failure is `{status, message, field}` where
   the status is the only guaranteed part; message and field arrive from
   whatever performed the check, or do not arrive at all. There is deliberately
   no code list and no category enum here — the set of things validation can
   object to is not ours to enumerate. */
const VALIDATION_FALLBACK=
  "Validation check failed. Review the item details and correct the issue before submitting again.";
const failure=(message,field)=>({status:"failed", message:message||null, field:field||null});
const validationText=f=>(f&&f.message)?f.message:VALIDATION_FALLBACK;

/* The prototype still has to decide *that* an item is invalid so the screens
   have something to show. It deliberately reports no reason: these are demo
   conditions, not product rules, and dressing them as rules would invent the
   taxonomy this model is built to avoid. */
const CHECKS=[
  {k:"device",  run:i=>i.journey==="virtual"?false:!(i.device&&i.device!=="—")},
  {k:"tenant",  run:i=>!i.tenant},
  {k:"version", run:i=>!(i.to&&i.to!==i.from)},
  {k:"op",      run:(i,p)=>i.operation!==p.operation},
  /* submit-time backstop: an item must still target an approved version */
  {k:"target",  run:(i,p)=>!!OPERATIONS[p.operation] && !!i.to && !versionEligible(p.operation,i.to)}
];
function runValidation(p){
  const errors=[];
  p.items.forEach(i=>{
    const fails=CHECKS.filter(c=>c.run(i,p)).map(()=>failure());
    if(fails.length) errors.push({item:i.id,name:i.name,fails,passes:[]});
  });
  return errors;
}

/* ---- the single submit pipeline both entry points use ---- */
function submitV2(p){
  p.validationFailed=false; p.errors=null;
  p.state=PLAN_STATE.VALIDATING; p.checksDone=0; p.checksTotal=CHECKS.length*p.items.length;
  p.items.forEach(i=>i.state=ITEM_STATE.VALIDATING);
  render();
  clearTimeout(p._vtimer);
  p._vtimer=setTimeout(()=>{
    /* The two scopes are independent and both are reported from one pass. A
       plan checked only until the first failure would send the operator back
       for a second submit to discover the rest, and would make a plan error
       invisible whenever any item also failed. */
    const lead=p.mode==="create" ? leadTimeError(p.window,p.operation) : null;
    const errors=(lead?[{item:"—",name:"Change window",
                         fails:[failure(lead,"Lead time")],passes:[]}]:[])
                 .concat(runValidation(p));
    if(errors.length){ p.errors=errors; p.validationFailed=true; p.state=PLAN_STATE.VFAILED;
                       p.items.forEach(i=>i.state=ITEM_STATE.DRAFT); }
    /* Validation has settled the window and its approval, so a plan that
       passes is Scheduled: validated, waiting for that window to open. Its
       items are not Queued — nothing competes for execution capacity until
       the plan is Executing. */
    else { p.errors=null;
           /* Requested journey: validation passed, so the change is created now
              and its number exists from this point — never before. The plan
              then waits for its window. The number is simulated, as a change
              management system would return it. */
           if(p.mode==="create" && !hasChangeNumber(p)){
             p.change="CHG00"+(10009000+Math.floor(Math.random()*900));
             p.changeCreatedAt=clockLabel();
             showToast("Validation passed. Change "+p.change+" created — waiting for the window.");
           }
           /* Existing change: validation is where the change is looked up, so
              this is the first moment its window is known. The prototype
              simulates that answer here — seven days out, 22:00–02:00 — and
              nowhere earlier. */
           if(p.mode!=="create" && windowPending(p)){
             const s0=new Date(); s0.setHours(22,0,0,0); s0.setDate(s0.getDate()+7);
             const e0=new Date(s0.getTime()+4*3600e3), pad=n=>String(n).padStart(2,"0");
             const f=d=>`${d.getDate()} ${MON[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
             p.windowStart=f(s0); p.windowEnd=f(e0); p.windowResolvedAt=clockLabel();
             showToast("Validation passed. "+p.change+" resolved — window "+p.windowStart+" → "+p.windowEnd+".");
           }
           p.state=PLAN_STATE.SCHEDULED;
           p.changeApproval=APPROVAL.APPROVED;
           p.items.forEach(i=>i.state=ITEM_STATE.SCHEDULED); }
    render();
  },2600);   /* long enough that Stop validating is actually reachable */
}

/* Lifecycle actions available from each state. Actions are explicit verbs —
   one "Cancel" whose blast radius ranges from a draft to a live estate is a
   safety problem, so each state names its own. */
/* Editing and deleting stop the moment the plan leaves the operator's hands.
   Once it has been validated and its change approved — and for the whole of
   execution and everything after — there is nothing to edit and nothing to
   delete, whatever the individual state returns. Enforced once here so a new
   state cannot reintroduce either by omission. */
/* Two different rules, deliberately not one.

   EDIT stops at submit — after that the plan is what the workflow engine is
   running and its name is that run's identifier.

   CANCEL stops at execution. A plan that has not yet run can be ended and the
   record kept; once it is scheduled or executing there is no plan-level action
   at all, because cancelling something mid-flight is not a capability the
   platform has (2026-09-17). */
const PLAN_EDITABLE=new Set([PLAN_STATE.DRAFT, PLAN_STATE.VFAILED]);
/* Cancel exists only before the plan is submitted. Once the change has been
   requested there is a record in another system with its own lifecycle, and
   Model-X does not reach into it — UXFR §5 lists exactly two cancel
   transitions, DRAFT → CANCELLED and EXECUTING → CANCELLING → CANCELLED (the
   second a future feature, deliberately not built). Awaiting approval is
   neither, and offering the control there implied Model-X could withdraw a
   change request it cannot withdraw. */
/* A Draft is deleted, not cancelled (2026-09-24): it was never submitted, so
   it leaves every view rather than becoming a Closed record. A plan handed
   back from validation has been submitted but has not run, so it is the one
   state that can still be cancelled. Task-level Cancel is a different control
   on a different object and is unaffected. */
const PLAN_CANCEL_ALLOWED=new Set([PLAN_STATE.VFAILED]);
function planActions(p){
  return planActionsFor(p)
    .filter(a=>a[0]!=="details" || planEditScope(p)!=="none")
    .filter(a=>!(a[0]==="details"||a[0]==="edit") || PLAN_EDITABLE.has(p.state))
    .filter(a=>a[0]!=="cancel" || PLAN_CANCEL_ALLOWED.has(p.state))
    .filter(a=>a[0]!=="delete" || p.state===PLAN_STATE.DRAFT);
}
/* Phase one carries no plan-level or item-level action. Editing stops at
   submit, and cancel does not exist at either level — the only cancel in the
   product acts on a task. Both settled 2026-09-17. */
function planActionsFor(p){
  switch(p.state){
    /* Correcting and sending it back is the same act as submitting it the
       first time, so it keeps the same name. There is no Resubmit. */
    /* A Draft has never been submitted, so its destructive action is Delete:
       it leaves every user-facing view and is not a Closed plan. Cancel stays
       for a plan returned from validation, which has been submitted. */
    case PLAN_STATE.DRAFT:    return [["submit","Submit plan","primary"],["details","Edit plan",""],["delete","Delete draft",""]];
    case PLAN_STATE.VFAILED:  return [["submit","Submit plan","primary"],["details","Edit change record",""],["cancel","Cancel plan",""]];
    case PLAN_STATE.SCHEDULED:return [];
    /* Validating is defined as read-only: the system is mid-check and there is
       nothing stable to act on. No action is offered, including editing. */
    case PLAN_STATE.VALIDATING:return [];
    /* Cancelling a plan mid-execution is named in the requirements as a future
       capability. The states exist in the model; the control is not offered,
       because offering it would promise something the system cannot do. */
    case PLAN_STATE.EXECUTING:return [];
    /* The plan task is what stopped, so the retry names the task. */
    /* The action sits under the failed change-record task, not in the plan
       header — it acts on that task, and the header cannot say which one
       (2026-09-17). */
    case PLAN_STATE.ACTION:   return [];
    default: return [];
  }
}
function runPlanAction(id,a){
  const p=getPlan(id); if(!p) return;
  if(a==="edit"){ editPlan(p.id); return; }
  if(a==="details"){ openPlanEdit(p.id); return; }
  if(a==="submit"){ stopEditing(); submitV2(p); return; }
  if(a==="rollback"){
    /* Whether rollback is offered at all is the backend's call; canRollback()
       stands in for it here (2026-09-18). */
    p.state=PLAN_STATE.CANCELLING;
    showToast("Rolling back the change record task.");
    setTimeout(()=>{ p.state=PLAN_STATE.FAILED; settlePlan(p); render(); },1200);
    return render();
  }
  if(a==="cancelTask"){
    askConfirm({
      title:"Cancel this task?",
      body:`<p class="cf-lead">Cancelling the change-record task stops the plan here.</p>
            <ul class="cf-list">
              <li><b>Anything already done stays done.</b> The items below are not re-run and not undone.</li>
              <li>The plan is marked cancelled and cannot be submitted again.</li>
            </ul>`,
      confirmLabel:"Cancel the task",
      onConfirm:()=>{ p.state=PLAN_STATE.CANCELLED; p.cancelledBy="you · plan task cancelled";
        settlePlan(p); render(); showToast("Task cancelled. Completed work was left in place."); }});
    return;
  }
  if(a==="delete"){
    askConfirm({
      title:"Delete this draft?",
      body:`<p class="cf-lead"><b>${esc(planTitle(p))}</b> has not been submitted. Deleting it removes it from every plan list.</p>
            <ul class="cf-list"><li>${plural(p.items.length,"item")} ${p.items.length===1?"is":"are"} removed with it. None of them have run.</li>
              <li>It does not move to Closed.</li></ul>`,
      confirmLabel:"Delete draft",
      onConfirm:()=>{ deleteDraft(p); go({v:"list"}); showToast("Draft deleted."); }});
    return;
  }
  if(a==="cancel"){
    askConfirm({
      title:"Cancel this plan?",
      body:`<p class="cf-lead">Cancelling <b>${esc(planTitle(p))}</b> ends it. The plan is not deleted —
              it stays in the record as cancelled.</p>
            <ul class="cf-list">
              <li><b>It cannot be submitted again.</b> Running this work later means creating a new plan.</li>
              <li>${plural(p.items.length,"item")} ${p.items.length===1?"is":"are"} cancelled with it. None of them have run.</li>
              ${hasChangeNumber(p)
                  ?`<li>The change record <b>${esc(p.change)}</b> stays open — Model-X does not close a record you supplied.</li>`:""}
            </ul>`,
      confirmLabel:"Cancel the plan",
      onConfirm:()=>{
        p.state=PLAN_STATE.CANCELLED;
        p.cancelledBy="you";
        p.items.forEach(i=>{ if(!isTerminalItem(i)) i.state=ITEM_STATE.CANCELLED; });
        settlePlan(p); render();
        showToast("Plan cancelled. It stays in the record and cannot be submitted again.");
      }});
    return;
  }
  /* Terminate was a plan-level cancel under another name. Phase one carries no
     cancel at plan or item level (2026-09-17); the only cancel acts on a task. */
  /* No "cancel" branch: cancelling a running plan is named in the requirements
     as a future capability, so there is no code path that can produce
     Executing → Cancelling → Cancelled today. */
  if(a==="retry"){
    /* Retrying a plan-level task returns the plan to where that task sits: a
       pre-task failure goes back to execution, a close that failed resumes
       closing. The item outcomes are untouched either way. */
    const post=planFailurePhase(p)==="post";
    p.planTaskFailed=null; p.planTaskKey=null; p.planTaskPhase=null;
    if(post){ p.state=PLAN_STATE.COMPLETING;
      clearTimeout(p._ctimer);
      p._ctimer=setTimeout(()=>{ p.closeDone=true; p.state=derivePlanOutcome(p);
        p.endedAt=clockLabel(); render(); },1800); }
    else { p.state=PLAN_STATE.EXECUTING;
      p.items.forEach(i=>{ if(i.state===ITEM_STATE.DRAFT) i.state=ITEM_STATE.QUEUED; }); }
  }
  render();
}

/* ===================================================================
   PLAN-LEVEL EXECUTION — the change-record lifecycle.

   Plan-level tasks and item-level tasks are different things produced by
   different parts of the system. They are kept apart here deliberately:
   planTasks(p) reads only plan fields, workflowFor(item) reads only item
   fields, and neither calls the other. Nothing in this file assumes one
   backend response carries both — the views join them, the data does not.

   Two ticket modes, two lifecycles:
     System-created   Create record → Validate → items execute → Close record
     BYOC             Validate → items execute            (never a close step)
   =================================================================== */
/* A plan-level task is a task. It carries milestones and reads the same as an
   item-level one — consistency was asked for explicitly (2026-09-17). */
const PT_DEF={
  /* Requested window: the change is created once validation passes, the plan
     then waits — possibly for days — and everything is checked again when the
     window opens, because the estate may have changed while it waited. */
  create:[{k:"create",  name:"Create change record",   note:"Raised on the change management system",
           ms:["Assemble the change record from the plan","Submit to the change management system","Receive the change number"]},
          {k:"wait",    name:"Wait for change window",  note:"Held until the requested window opens",
           ms:["Change record created for the requested window","Window opens"]},
          {k:"validate",name:"Validate before execution", note:"Change, plan and items re-checked when the window opens",
           ms:["Confirm the change record is valid for this window","Re-check each item against the current estate","Confirm nothing blocks execution"]},
