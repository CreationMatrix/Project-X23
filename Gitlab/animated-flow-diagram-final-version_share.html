<!DOCTYPE html>
<html lang="en"><head>
<!-- Self-contained copy: diagrams are pre-drawn, animation is CSS only, no JavaScript needed. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated Flow Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  /* White only: client preference for the story page (ledger 2026-11-04). */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --canvas: #ffffff;
    --canvas-dot: #e4e4ec;
    --ink: #1d2130;
    --ink-2: #4a5063;
    --ink-3: #8a90a2;
    --line: #e7e8ef;
    --badge: #eef0f5;
    --tag-bg: #ffffff;
    --tag-border: #e2e4ec;
    --focus: #5b4bff;

    --c-coral: #f0614f;
    --c-coral-2: #ff8a6e;
    --c-blue: #2f9bf0;
    --c-blue-2: #6cc2ff;
    --c-violet: #8a3ff0;
    --c-violet-2: #b06cff;
    --c-green: #7bc63a;
    --c-green-2: #a6e05a;
    --c-amber: #f0a13a;
    --c-amber-2: #ffc46b;
    --c-teal: #17b3a3;
    --c-teal-2: #4fd8c6;
    --c-slate: #5a6b8c;
    --c-slate-2: #8798ba;
    --c-rose: #e2487f;
    --c-rose-2: #ff7aa8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1180px; margin: 0 auto; padding: 48px 24px 80px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .eyebrow .pill {
    text-transform: none; letter-spacing: 0; font-weight: 600;
    background: #f1ecff; color: #6b3fd6; border-radius: 999px; padding: 2px 10px;
  }
  h1 { font-size: 32px; line-height: 1.2; font-weight: 700; margin: 12px 0 8px; letter-spacing: -.01em; }
  .lede { color: var(--ink-2); max-width: 70ch; margin: 0 0 40px; }

  section { margin-top: 56px; }
  section:first-child { margin-top: 0; }
  .sec-num { font-size: 13px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  h2 { font-size: 24px; line-height: 1.25; font-weight: 700; margin: 4px 0 20px; letter-spacing: -.01em; }
  .sec-lede { color: var(--ink-2); max-width: 72ch; margin: 0 0 20px; }

  .canvas {
    position: relative;
    background-color: var(--canvas);
    background-image: radial-gradient(var(--canvas-dot) 1.2px, transparent 1.2px);
    background-size: 22px 22px;
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .canvas svg { display: block; width: 100%; height: auto; min-width: 880px; }
  .caption { font-size: 13px; color: var(--ink-3); margin-top: 10px; }

  /* Nodes */
  .node { cursor: default; outline: none; }
  .node .body { transition: transform .25s cubic-bezier(.2,.8,.2,1); transform-box: fill-box; transform-origin: center; }
  .node:hover .body, .node:focus-visible .body { transform: translateY(-4px); }
  .node:focus-visible .ring { stroke: var(--focus); stroke-width: 3; stroke-dasharray: 5 5; }
  .node .ring { fill: none; stroke: transparent; }
  .lbl { font: 600 15px Inter, sans-serif; fill: var(--ink); }
  .sub { font: 400 12px Inter, sans-serif; fill: var(--ink-3); }
  .num-bg { fill: var(--badge); }
  .num { font: 600 10px Inter, sans-serif; fill: var(--ink-3); font-variant-numeric: tabular-nums; }

  /* Connectors: round-capped dashes read as dots */
  .flow {
    fill: none; stroke-width: 9; stroke-linecap: round;
    stroke-dasharray: 0.1 17;
    animation: flow 1.6s linear infinite;
  }
  @keyframes flow { to { stroke-dashoffset: -17.1; } }
  .tag rect { fill: var(--tag-bg); stroke: var(--tag-border); }
  .tag text { font: 500 11px Inter, sans-serif; fill: var(--ink-2); }
  .layer { font: 500 12px Inter, sans-serif; fill: var(--ink-3); }
  .sys-head { font: 600 22px Inter, sans-serif; fill: #000; }
  /* Return path (rollback): thinner dots, same motion */
  .flow.back { stroke-width: 6; stroke-dasharray: 0.1 12; opacity: .8; animation-name: flow-back; }
  @keyframes flow-back { to { stroke-dashoffset: -12.1; } }

  /* Motion stays on even when the viewer's system asks to reduce motion:
     the flowing dots are the point of this page (user request, 2026-11-09). */
  @media (max-width: 640px) {
    .page { padding: 32px 16px 56px; }
    h1 { font-size: 26px; }
    h2 { font-size: 20px; }
  }
</style>
</head>
